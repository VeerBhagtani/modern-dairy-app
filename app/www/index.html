<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob: https:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Modern Drivers</title>
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<script src="vendor/maplibre/maplibre-gl-csp.js" defer></script>
<style>
  :root{
    --navy:#1B2A6B; --navy-deep:#101B49; --accent:#D7262F;
    --ok:#1a7a4c; --ok-tint:#e4f4eb; --warn:#8a5f14; --warn-tint:#fdf3df;
    --bad:#b3261e; --bad-tint:#fceceb;
    --bg:#f4f5f9; --surface:#fff; --line:#e0e3ec; --ink:#141824; --ink-2:#5a6478;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
       -webkit-font-smoothing:antialiased;}

  /* ── name screen ──────────────────────────────────────────────────── */
  .intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
         padding:28px 24px calc(28px + env(safe-area-inset-bottom));
         background:linear-gradient(165deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff;}
  .intro img{width:88px;height:88px;object-fit:contain;border-radius:20px;margin:0 auto 22px;display:block;}
  .intro h1{font-size:1.9rem;margin:0 0 6px;text-align:center;letter-spacing:-.02em;}
  .intro p.sub{text-align:center;color:#b9c2e4;margin:0 0 32px;font-size:1rem;}
  .intro label{display:block;font-size:.85rem;font-weight:700;color:#b9c2e4;margin-bottom:10px;
               text-transform:uppercase;letter-spacing:.06em;}
  .intro input{width:100%;padding:18px 16px;border:2px solid rgba(255,255,255,.22);border-radius:14px;
               font-size:1.25rem;font-family:inherit;background:rgba(255,255,255,.1);color:#fff;}
  .intro input::placeholder{color:rgba(255,255,255,.45);}
  .intro input:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.16);}
  .intro button{width:100%;margin-top:20px;padding:19px;border:none;border-radius:14px;
                background:#fff;color:var(--navy);font-size:1.15rem;font-weight:800;font-family:inherit;cursor:pointer;}
  .intro button:disabled{opacity:.5;}
  .intro .err{color:#ffc9c5;font-size:.92rem;font-weight:600;margin:14px 0 0;text-align:center;}
  .intro .note{margin-top:26px;font-size:.82rem;color:#9aa6d0;line-height:1.6;text-align:center;}
  .intro .note a{color:#fff;}

  /* ── main screen ──────────────────────────────────────────────────── */
  .screen{display:flex;flex-direction:column;min-height:100vh;}
  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:11px;}
  header img{width:34px;height:34px;object-fit:contain;border-radius:8px;}
  header .who{flex:1;min-width:0;}
  header .who b{display:block;font-size:1rem;line-height:1.2;}
  header .who span{font-size:.75rem;color:#b9c2e4;}

  #map{flex:1;min-height:200px;background:#dfe3ee;}
  .map-empty{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;
             text-align:center;color:var(--ink-2);font-size:.9rem;line-height:1.6;background:#e6e9f2;}

  .panel{background:var(--surface);border-top:1px solid var(--line);
         padding:16px 16px calc(18px + env(safe-area-inset-bottom));
         box-shadow:0 -4px 20px rgba(20,24,36,.07);}

  .status{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
  .status .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;background:#9aa3bd;}
  .status.on .dot{background:var(--ok);animation:pulse 2s infinite;}
  .status.warn .dot{background:var(--warn);}
  .status.bad .dot{background:var(--bad);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .status .txt b{display:block;font-size:1.02rem;line-height:1.25;}
  .status .txt span{font-size:.82rem;color:var(--ink-2);line-height:1.4;}

  .start{width:100%;padding:30px 16px;border:none;border-radius:18px;background:var(--navy);color:#fff;
         font-size:1.5rem;font-weight:800;font-family:inherit;cursor:pointer;letter-spacing:.01em;}
  .start:active{background:var(--navy-deep);}
  .start:disabled{background:#98a2c0;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .stat{background:var(--bg);border-radius:12px;padding:11px 8px;text-align:center;}
  .stat b{display:block;font-size:1.3rem;font-weight:800;line-height:1.1;letter-spacing:-.02em;}
  .stat span{font-size:.7rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;}

  .rowbtns{display:flex;gap:10px;margin-top:12px;}
  .rowbtns button{flex:1;padding:14px;border-radius:12px;font-size:.92rem;font-weight:700;
                  font-family:inherit;cursor:pointer;border:1.5px solid var(--navy);background:#fff;color:var(--navy);}
  .rowbtns button.on{background:var(--warn-tint);border-color:#e3c98d;color:var(--warn);}

  .msg{border-radius:12px;padding:12px 14px;font-size:.86rem;line-height:1.55;margin-bottom:13px;}
  .msg.warn{background:var(--warn-tint);color:var(--warn);}
  .msg.bad{background:var(--bad-tint);color:var(--bad);}
  .msg.info{background:#e8ebf7;color:var(--navy);}
  .msg b{font-weight:800;}

  .foot{margin-top:13px;text-align:center;font-size:.76rem;color:var(--ink-2);line-height:1.5;}
  .link{background:none;border:none;color:var(--navy);font-size:.8rem;font-weight:700;
        text-decoration:underline;cursor:pointer;font-family:inherit;padding:4px;}

  .sheet-bg{position:fixed;inset:0;background:rgba(16,27,73,.55);display:none;align-items:flex-end;z-index:30;}
  .sheet-bg.on{display:flex;}
  .sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:86vh;overflow:auto;
         padding:22px 20px calc(22px + env(safe-area-inset-bottom));}
  .sheet h3{margin:0 0 12px;font-size:1.12rem;}
  .sheet ul{margin:10px 0 0;padding-left:20px;font-size:.88rem;line-height:1.7;color:var(--ink-2);}
  .sheet li{margin-bottom:8px;}
  .sheet button{width:100%;margin-top:18px;padding:14px;border-radius:12px;border:none;
                background:var(--navy);color:#fff;font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer;}
  [hidden]{display:none!important;}
</style>
</head>
<body>

<!-- ── 1. Name. Nothing else. ─────────────────────────────────────────── -->
<section id="screenName" class="intro" hidden>
  <img id="introLogo" src="logo.png" alt="">
  <h1 id="introTitle">Modern Drivers</h1>
  <p class="sub">What is your name?</p>
  <label for="inName">Your name</label>
  <input id="inName" type="text" autocomplete="name" autocapitalize="words" placeholder="Ramesh Patil">
  <p id="nameErr" class="err" hidden></p>
  <button id="btnName">Continue</button>
  <p class="note">
    That is all we need.<br>
    <button class="link" id="btnWhy" style="color:#fff">Why does this app use my location?</button>
  </p>
</section>

<!-- ── 2. Start Ride, live map ────────────────────────────────────────── -->
<section id="screenMain" class="screen" hidden>
  <header>
    <img src="logo.png" alt="">
    <div class="who">
      <b id="hName">—</b>
      <span id="hCode">Modern Drivers</span>
    </div>
    <button class="link" id="btnWhy2" style="color:#b9c2e4">Info</button>
  </header>

  <div id="map"></div>
  <div id="mapEmpty" class="map-empty">
    The map appears here once your ride starts.
  </div>

  <div class="panel">
    <div id="notice" class="msg info" hidden></div>

    <div class="status" id="status">
      <span class="dot"></span>
      <span class="txt"><b id="stTitle">Not tracking</b><span id="stSub">Press Start Ride when you leave.</span></span>
    </div>

    <div id="statsBox" hidden>
      <div class="stats">
        <div class="stat"><b id="stKm">0.0</b><span>km</span></div>
        <div class="stat"><b id="stTime">0m</b><span>running</span></div>
        <div class="stat"><b id="stPts">0</b><span>points</span></div>
      </div>
    </div>

    <button id="btnStart" class="start">Start Ride</button>
    <p id="startErr" class="err" style="color:var(--bad);text-align:center;font-size:.88rem;font-weight:600;margin:12px 0 0" hidden></p>

    <div id="rideBtns" class="rowbtns" hidden>
      <button id="btnPersonal">Personal trip</button>
      <button id="btnCentre">Centre map</button>
    </div>

    <p class="foot" id="footNote">Only the office can stop a ride.</p>
  </div>
</section>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h3 id="sheetTitle"></h3>
    <div id="sheetBody"></div>
    <button id="sheetClose">Close</button>
  </div>
</div>

<script src="branding.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
