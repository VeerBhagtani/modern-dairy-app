<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob: https:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Modern Drivers</title>
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<script src="vendor/maplibre/maplibre-gl-csp.js" defer></script>
<style>
  /* Shares the office dashboard's palette, so the two read as one product,
     with everything sized up for a thumb in a moving vehicle. */
  :root{
    --navy:#1e2a5a; --navy-deep:#141d42; --navy-soft:#eef1fa; --accent:#d7262f;
    --ok:#0f7a4a; --ok-tint:#e6f5ec; --warn:#8a5a0b; --warn-tint:#fdf3e0;
    --bad:#b3261e; --bad-tint:#fdeceb;
    --bg:#f5f6fa; --surface:#fff; --line:#e6e9f0; --ink:#151823; --ink-2:#5d667c;
    --shadow:0 -6px 24px rgba(21,24,35,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
       -webkit-font-smoothing:antialiased;}

  /* ── name screen ──────────────────────────────────────────────────── */
  .intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
         padding:24px calc(20px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
         background:var(--surface);}
  .intro img{width:180px;max-width:70%;height:auto;object-fit:contain;margin:0 auto 14px;display:block;}
  .intro h1{font-size:1.3rem;margin:0 0 4px;text-align:center;letter-spacing:-.01em;}
  .intro p.sub{text-align:center;color:var(--ink-2);margin:0 0 26px;font-size:.92rem;}
  .intro label{display:block;font-size:.78rem;font-weight:600;color:var(--ink-2);margin-bottom:7px;}
  .intro input{width:100%;padding:13px 13px;border:1px solid var(--line);border-radius:9px;
               font-size:1.02rem;font-family:inherit;background:#fff;color:var(--ink);}
  .intro input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,42,107,.1);}
  .intro button{width:100%;margin-top:16px;padding:13px;border:none;border-radius:9px;
                background:var(--navy);color:#fff;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;}
  .intro button:disabled{opacity:.5;}
  .intro .err{color:var(--bad);font-size:.87rem;font-weight:600;margin:12px 0 0;text-align:center;}
  .intro .note{margin-top:22px;font-size:.8rem;color:var(--ink-2);line-height:1.6;text-align:center;}

  /* ── main screen ──────────────────────────────────────────────────── */
  .screen{display:flex;flex-direction:column;min-height:100vh;}
  header{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;}
  header img{width:26px;height:26px;object-fit:contain;}
  header .who{flex:1;min-width:0;}
  header .who b{display:block;font-size:.92rem;line-height:1.25;font-weight:600;}
  header .who span{font-size:.72rem;color:#b9c2e4;}

  #map{flex:1;min-height:200px;background:#dfe3ee;}
  .map-empty{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;
             text-align:center;color:var(--ink-2);font-size:.9rem;line-height:1.6;background:#e6e9f2;}

  /* The panel sits over the map as a rounded sheet, so the map reads as the
     background it is and the controls as the thing on top of it. */
  .panel{background:var(--surface);border-radius:18px 18px 0 0;margin-top:-16px;
         position:relative;z-index:2;box-shadow:var(--shadow);
         padding:16px 16px calc(16px + env(safe-area-inset-bottom));}

  .status{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
  .status .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:#9aa3bd;}
  .status.on .dot{background:var(--ok);animation:pulse 2s infinite;}
  .status.warn .dot{background:var(--warn);}
  .status.bad .dot{background:var(--bad);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .status .txt b{display:block;font-size:.93rem;line-height:1.3;font-weight:600;}
  .status .txt span{font-size:.79rem;color:var(--ink-2);line-height:1.4;}

  /* Prominent, because it is the one thing this screen is for — but a button,
     not a billboard. */
  .start{width:100%;padding:17px;border:none;border-radius:13px;background:var(--navy);color:#fff;
         font-size:1.08rem;font-weight:650;font-family:inherit;cursor:pointer;letter-spacing:-.01em;
         box-shadow:0 4px 14px rgba(30,42,90,.22);transition:transform .06s ease;}
  .start:active{background:var(--navy-deep);transform:translateY(1px);}
  .start:disabled{background:#9aa3c0;box-shadow:none;}

  /* Planning a round. Secondary to Start Ride — a driver who is late should
     never have to look past the button that starts recording. */
  .plan{width:100%;margin-top:10px;padding:13px;border-radius:12px;background:var(--navy-soft);
        border:1px solid #d5ddf3;color:var(--navy);font-size:.95rem;font-weight:650;
        font-family:inherit;cursor:pointer;}
  .plan:active{background:#e3e8f7;}
  .plan:disabled{opacity:.55;}
  #planBox{margin-top:12px;}
  .route{list-style:none;margin:0;padding:0;counter-reset:leg;}
  .route li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);}
  .route li:last-child{border-bottom:none;}
  .route .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;
            font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .route .nm{font-weight:600;font-size:.92rem;line-height:1.3;}
  .route .sub{font-size:.74rem;color:var(--ink-2);margin-top:2px;}
  .planhead{background:var(--bg);border-radius:10px;padding:11px 12px;margin-bottom:10px;font-size:.86rem;line-height:1.5;}
  .planhead b{font-size:1.02rem;}
  .picklist{max-height:46vh;overflow:auto;margin:6px 0 0;}
  .picklist label{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);
                  font-size:.92rem;cursor:pointer;}
  .picklist input{width:20px;height:20px;flex:none;}
  .picklist .ar{display:block;font-size:.73rem;color:var(--ink-2);}
  #pickSearch{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;
              font-size:.95rem;font-family:inherit;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px;}
  .stat{background:var(--bg);border-radius:11px;padding:11px 6px;text-align:center;}
  .stat b{display:block;font-size:1.25rem;font-weight:750;line-height:1.1;letter-spacing:-.02em;
          font-variant-numeric:tabular-nums;}
  .stat span{font-size:.66rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;
             font-weight:600;display:block;margin-top:3px;}

  .rowbtns{display:flex;gap:8px;margin-top:10px;}
  .rowbtns button{flex:1;padding:11px;border-radius:10px;font-size:.85rem;font-weight:600;
                  font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);}
  .rowbtns button.on{background:var(--warn-tint);border-color:#e3c98d;color:var(--warn);}

  .msg{border-radius:8px;padding:10px 12px;font-size:.82rem;line-height:1.5;margin-bottom:11px;}
  .msg.warn{background:var(--warn-tint);color:var(--warn);}
  .msg.bad{background:var(--bad-tint);color:var(--bad);}
  .msg.info{background:#e8ebf7;color:var(--navy);}
  .msg b{font-weight:800;}

  .foot{margin-top:11px;text-align:center;font-size:.73rem;color:var(--ink-2);}
  .link{background:none;border:none;color:var(--navy);font-size:.8rem;font-weight:700;
        text-decoration:underline;cursor:pointer;font-family:inherit;padding:4px;}

  .sheet-bg{position:fixed;inset:0;background:rgba(16,27,73,.55);display:none;align-items:flex-end;z-index:30;}
  .sheet-bg.on{display:flex;}
  .sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:86vh;overflow:auto;
         padding:22px 20px calc(22px + env(safe-area-inset-bottom));}
  .sheet h3{margin:0 0 12px;font-size:1.12rem;}
  .sheet ul{margin:10px 0 0;padding-left:20px;font-size:.88rem;line-height:1.7;color:var(--ink-2);}
  .sheet li{margin-bottom:8px;}
  .sheet button{width:100%;margin-top:16px;padding:12px;border-radius:9px;border:none;
                background:var(--navy);color:#fff;font-weight:600;font-size:.95rem;font-family:inherit;cursor:pointer;}
  .md-pulse{animation:mdpulse 2.4s ease-out infinite;}
  @keyframes mdpulse{0%{transform:scale(.45);opacity:.85;}70%{transform:scale(1);opacity:0;}100%{opacity:0;}}
  [hidden]{display:none!important;}
</style>
</head>
<body>

<!-- ── 1. Name. Nothing else. ─────────────────────────────────────────── -->
<section id="screenName" class="intro" hidden>
  <img id="introLogo" src="logo.png" alt="">
  <h1 id="introTitle" hidden>Modern Drivers</h1>
  <p class="sub">What is your name?</p>
  <label for="inName">Your name</label>
  <input id="inName" type="text" autocomplete="name" autocapitalize="words" placeholder="Ramesh Patil">
  <p id="nameErr" class="err" hidden></p>
  <button id="btnName">Continue</button>
  <p class="note">
    That is all we need.<br>
    <button class="link" id="btnWhy">Why does this app use my location?</button>
  </p>
</section>

<!-- ── 2. Start Ride, live map ────────────────────────────────────────── -->
<section id="screenMain" class="screen" hidden>
  <header>
    <img src="mark.png" alt="">
    <div class="who">
      <b id="hName">—</b>
      <span id="hCode">Modern Drivers</span>
    </div>
    <button class="link" id="btnWhy2" style="color:#b9c2e4">Info</button>
  </header>

  <div id="map"></div>
  <div id="mapEmpty" class="map-empty">
    <span id="mapEmptyText">Finding your location…</span>
  </div>

  <div class="panel">
    <div id="notice" class="msg info" hidden></div>

    <div class="status" id="status">
      <span class="dot"></span>
      <span class="txt"><b id="stTitle">Not tracking</b><span id="stSub">Press Start Ride when you leave.</span></span>
    </div>

    <div id="statsBox" hidden>
      <div class="stats">
        <div class="stat"><b id="stKm">0.0</b><span>km</span></div>
        <div class="stat"><b id="stTime">0m</b><span>running</span></div>
        <div class="stat"><b id="stPts">0</b><span>points</span></div>
      </div>
    </div>

    <button id="btnStart" class="start">Start Ride</button>
    <p id="startErr" class="err" style="color:var(--bad);text-align:center;font-size:.88rem;font-weight:600;margin:12px 0 0" hidden></p>
    <!-- Android will not let an app grant itself background location; only the
         Settings screen can. Telling a driver to "go to Settings, Apps, Modern
         Drivers, Permissions" at the depot gate does not work, so this takes
         them straight there. -->
    <button id="btnFixPerm" class="plan" hidden>Fix permission</button>

    <div id="rideBtns" class="rowbtns" hidden>
      <button id="btnCentre">Centre map</button>
    </div>

    <button id="btnPlan" class="plan">Plan my round</button>
    <div id="planBox" hidden></div>

    <p class="foot" id="footNote">Only the office can stop a ride.</p>
  </div>
</section>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h3 id="sheetTitle"></h3>
    <div id="sheetBody"></div>
    <button id="sheetClose">Close</button>
  </div>
</div>

<!-- Capacitor's JavaScript runtime. Android injects only the low-level bridge;
     registerPlugin — which every plugin call in app.js goes through — lives
     here. Without it the app cannot reach GPS at all. Copied from
     node_modules at build time so it always matches the native side. -->
<script src="capacitor.js"></script>
<script src="branding.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
