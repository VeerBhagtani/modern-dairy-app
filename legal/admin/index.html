<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modern Dairy — Admin</title>
<style>
  :root{--brand:#0e2036;--brand-2:#153a63;--brand-tint:#e3edf7;--bg:#f1f2ee;--surface:#fff;--line:#dee1db;--ink:#161b22;--ink-2:#4b5768;--fresh:#1a7a4c;--warn:#8a5f14;--warn-tint:#faf1de;--bad:#b3261e;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);margin:0;min-height:100vh;}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
  .center-wrap{max-width:360px;margin:80px auto;padding:0 16px;}
  h1{font-size:1.4rem;margin:0 0 4px;}
  h3{font-size:1rem;margin:0 0 12px;}
  .muted{color:var(--ink-2);font-size:.9rem;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:1rem;margin-bottom:14px;font-family:inherit;}
  button{cursor:pointer;font-size:1rem;font-weight:600;border:none;border-radius:8px;padding:12px 16px;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .btn-quiet{background:transparent;color:var(--brand);}
  .btn-sm{font-size:.85rem;padding:8px 12px;}
  .err{color:var(--bad);font-size:.85rem;margin:-8px 0 12px;}
  .ok-msg{color:var(--fresh);font-size:.85rem;margin:-8px 0 12px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .signout{background:transparent;color:var(--ink-2);font-weight:500;font-size:.85rem;padding:6px 10px;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.9rem;}
  th{color:var(--ink-2);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;}
  tr:hover{background:var(--bg);cursor:pointer;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.75rem;font-weight:700;}
  .pill.placed,.pill.confirmed{background:var(--brand-tint);color:var(--brand-2);}
  .pill.pending_confirmation,.pill.packed,.pill.out_for_delivery{background:var(--warn-tint);color:var(--warn);}
  .pill.delivered{background:#e2f3e9;color:var(--fresh);}
  .pill.cancelled{background:#fbe4e2;color:var(--bad);}
  .pill.denied{background:#fbe4e2;color:var(--bad);}
  .pill.in{background:#e2f3e9;color:var(--fresh);} .pill.low{background:var(--warn-tint);color:var(--warn);} .pill.out{background:#fbe4e2;color:var(--bad);}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;}
  .modal-bg.on{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:480px;width:100%;max-height:85vh;overflow:auto;padding:20px;}
  .row{display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem;}
  .status-btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
  .status-btns button{flex:1;min-width:100px;font-size:.8rem;padding:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);}
  .status-btns button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-2);}
  .close-x{background:transparent;font-size:1.4rem;line-height:1;padding:4px 8px;color:var(--ink-2);}
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab{background:transparent;border-radius:0;padding:10px 4px;margin-right:20px;color:var(--ink-2);border-bottom:2px solid transparent;}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand);}
  .variant-row{display:grid;grid-template-columns:1fr 90px 90px 70px 110px;gap:8px;align-items:center;margin-bottom:8px;}
  .variant-row input,.variant-row select{margin-bottom:0;padding:8px;font-size:.85rem;}
  .variant-row .vlabel{font-size:.85rem;font-weight:600;}
  @media (max-width:640px){ .variant-row{grid-template-columns:1fr 1fr;} }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  @media (max-width:520px){ .grid2{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, updateDoc, setDoc, getDoc, addDoc, deleteDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyD-3RNHrI9ZPmdTioLiuCi2gjwdNXZH8HI",
  authDomain: "modern-dairy-pune.firebaseapp.com",
  projectId: "modern-dairy-pune",
  storageBucket: "modern-dairy-pune.firebasestorage.app",
  messagingSenderId: "711745048614",
  appId: "1:711745048614:web:29e8641911c62c1bb856e7",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const STATUS_LABEL = {
  placed: 'Placed', confirmed: 'Confirmed', pending_confirmation: 'Pending confirmation',
  packed: 'Packed', out_for_delivery: 'Out for delivery', delivered: 'Delivered', cancelled: 'Cancelled',
  denied: 'Denied',
};
const STATUS_FLOW = ['placed', 'confirmed', 'packed', 'out_for_delivery', 'delivered'];

const $app = document.getElementById('app');
let tab = 'orders';
let orders = [];
let products = [];
let broadcasts = [];
let unsubOrders = null, unsubProducts = null, unsubBroadcasts = null;
let openOrderId = null;

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '₹' + Math.round(Number(n)||0).toLocaleString('en-IN'); }
function fmtDate(ts){
  const d = ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
  if(!d) return '—';
  return d.toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

function renderLogin(err){
  $app.innerHTML = `
    <div class="center-wrap">
      <h1>Modern Dairy Admin</h1>
      <div class="muted" style="margin-bottom:20px;">Sign in to manage the store.</div>
      <div class="card">
        <label>Username</label>
        <input id="f-user" autocomplete="off" placeholder="Username">
        <label>Password</label>
        <input id="f-pass" type="password" placeholder="Password">
        ${err ? `<div class="err">${esc(err)}</div>` : ''}
        <button class="btn-primary" id="btn-login" style="width:100%;">Sign in</button>
      </div>
    </div>`;
  document.getElementById('btn-login').onclick = doLogin;
  document.getElementById('f-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  const user = document.getElementById('f-user').value.trim();
  const pass = document.getElementById('f-pass').value;
  const btn = document.getElementById('btn-login');
  if(!user || !pass){ renderLogin('Enter a username and password.'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try{
    await signInWithEmailAndPassword(auth, user.toLowerCase().replace(/\s+/g,'_') + '@admin.local', pass);
  }catch(e){
    renderLogin('Incorrect username or password.');
  }
}

function renderShell(bodyHtml){
  $app.innerHTML = `
    <div class="wrap">
      <header>
        <h1>Modern Dairy Admin</h1>
        <button class="signout" id="btn-signout">Sign out</button>
      </header>
      <div class="tabs">
        <button class="tab ${tab==='orders'?'on':''}" data-tab="orders">Orders</button>
        <button class="tab ${tab==='products'?'on':''}" data-tab="products">Products</button>
        <button class="tab ${tab==='broadcasts'?'on':''}" data-tab="broadcasts">Broadcasts</button>
        <button class="tab ${tab==='settings'?'on':''}" data-tab="settings">Settings</button>
      </div>
      <div id="tab-body">${bodyHtml}</div>
    </div>
    <div class="modal-bg" id="modal-bg"><div class="modal" id="modal-content"></div></div>`;
  document.getElementById('btn-signout').onclick = () => signOut(auth);
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.getElementById('modal-bg').onclick = (e) => { if(e.target.id==='modal-bg') closeModal(); };
}

function render(){
  if(tab==='orders'){ renderShell(ordersBody()); wireOrdersEvents(); }
  else if(tab==='products'){ renderShell(productsBody()); wireProductsEvents(); }
  else if(tab==='broadcasts'){ renderShell(broadcastsBody()); wireBroadcastsEvents(); }
  else { renderShell(settingsBody()); wireSettingsEvents(); }
}

/* ── Orders ───────────────────────────────────────────── */
let orderFilter = 'all';
let orderSearch = '';
const FILTER_SECTIONS = [
  { id: 'all', label: 'All' },
  { id: 'placed', label: 'Orders placed' },
  { id: 'confirmed', label: 'Order accepted' },
  { id: 'out_for_delivery', label: 'Out for delivery' },
  { id: 'delivered', label: 'Orders delivered' },
  { id: 'denied', label: 'Orders denied' },
  { id: 'cancelled', label: 'Cancelled' },
];
function filteredOrders(){
  return orders.filter(o => {
    if(orderFilter !== 'all' && (o.status||'placed') !== orderFilter) return false;
    if(orderSearch){
      const q = orderSearch.toLowerCase();
      const inOrderNo = String(o.orderNo||o.id||'').toLowerCase().includes(q);
      const inItems = (o.items||[]).some(i => String(i.name||'').toLowerCase().includes(q));
      if(!inOrderNo && !inItems) return false;
    }
    return true;
  });
}
function ordersBody(){
  // The search <input> lives outside #orders-list on purpose — only
  // #orders-list is replaced on every keystroke, so the input's own DOM
  // node (and cursor position) is never recreated while typing.
  return `
    <div class="card" style="padding:12px;margin-bottom:12px;">
      <input id="order-search" placeholder="Search by order ID or product name…" value="${esc(orderSearch)}" style="margin-bottom:12px;">
      <div id="filter-chips" style="display:flex;flex-wrap:wrap;gap:6px;">
        ${filterChipsHtml()}
      </div>
    </div>
    <div id="orders-list">${ordersListHtml()}</div>`;
}
function filterChipsHtml(){
  return FILTER_SECTIONS.map(s => {
    const count = s.id==='all' ? orders.length : orders.filter(o=>(o.status||'placed')===s.id).length;
    return `<button class="btn-quiet btn-sm" data-filter="${s.id}" style="background:${orderFilter===s.id?'var(--brand)':'var(--bg)'};color:${orderFilter===s.id?'#fff':'var(--ink)'};">${s.label} (${count})</button>`;
  }).join('');
}
function ordersListHtml(){
  const list = filteredOrders();
  return `
    <div class="muted" style="margin-bottom:10px;">${list.length} order${list.length===1?'':'s'}${orderFilter!=='all'||orderSearch?' matching':''}</div>
    <div class="card" style="padding:0;overflow:auto;">
      ${!list.length ? `<div class="empty">${orders.length?'No orders match this filter/search.':'No orders yet. New orders from the app will appear here in real time.'}</div>` : `
      <table>
        <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Placed</th></tr></thead>
        <tbody>
          ${list.map(o => `
            <tr data-id="${esc(o.id)}">
              <td><b>${esc(o.orderNo||o.id)}</b></td>
              <td>${esc(o.name||o.company||'—')}<br><span class="muted">${esc(o.phone||'')}</span></td>
              <td>${(o.items||[]).length}</td>
              <td>${money(o.total)}</td>
              <td><span class="pill ${esc(o.status||'placed')}">${STATUS_LABEL[o.status]||o.status}</span></td>
              <td class="muted">${fmtDate(o.placedAt)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>`;
}
function wireOrdersEvents(){
  wireOrdersListEvents();
  wireFilterChipEvents();
  const search = document.getElementById('order-search');
  if(search){
    search.oninput = () => { orderSearch = search.value; refreshOrdersList(); };
  }
}
function wireOrdersListEvents(){
  document.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => openModal(tr.dataset.id));
}
function wireFilterChipEvents(){
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { orderFilter = b.dataset.filter; refreshChips(); refreshOrdersList(); });
}
function refreshOrdersList(){
  const el = document.getElementById('orders-list');
  if(el){ el.innerHTML = ordersListHtml(); wireOrdersListEvents(); }
}
function refreshChips(){
  const el = document.getElementById('filter-chips');
  if(el){ el.innerHTML = filterChipsHtml(); wireFilterChipEvents(); }
}

function openModal(id){
  openOrderId = id;
  const o = orders.find(x => x.id === id);
  if(!o) return;
  document.getElementById('modal-content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div><b style="font-size:1.1rem;">${esc(o.orderNo||o.id)}</b><div class="muted">${fmtDate(o.placedAt)}</div></div>
      <button class="close-x" id="btn-close">×</button>
    </div>
    <div class="row"><span class="muted">Customer</span><span>${esc(o.name||'—')}${o.company?` (${esc(o.company)})`:''}</span></div>
    <div class="row"><span class="muted">Phone</span><span>${esc(o.phone||'—')}</span></div>
    ${o.gstin?`<div class="row"><span class="muted">GSTIN</span><span>${esc(o.gstin)}</span></div>`:''}
    ${o.address?`<div class="row" style="align-items:flex-start;"><span class="muted">Deliver to</span><span style="text-align:right;max-width:70%;">${esc(o.address)}</span></div>`:''}
    <div style="border-top:1px solid var(--line);margin:10px 0;padding-top:10px;">
      ${(o.items||[]).map(i=>`<div class="row"><span>${esc(i.name)} (${esc(i.label||'')}) × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}
    </div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:10px;font-weight:700;"><span>Total</span><span>${money(o.total)}</span></div>
    ${o.status==='cancelled' ? `
    <div class="muted" style="margin:14px 0 4px;font-weight:600;font-size:.85rem;">STATUS</div>
    <div class="status-btns"><button class="on" disabled style="background:#fbe4e2;color:var(--bad);border-color:#f3c6c2;cursor:default;">Cancelled by customer</button></div>` : o.status==='denied' ? `
    <div class="muted" style="margin:14px 0 4px;font-weight:600;font-size:.85rem;">STATUS</div>
    <div class="status-btns"><button class="on" disabled style="background:#fbe4e2;color:var(--bad);border-color:#f3c6c2;cursor:default;">Denied</button></div>
    <div class="row" style="align-items:flex-start;"><span class="muted">Denied by</span><span>${esc(o.deniedBy||'—')}</span></div>
    <div class="row" style="align-items:flex-start;"><span class="muted">Reason</span><span style="text-align:right;max-width:70%;">${esc(o.deniedReason||'—')}</span></div>` : `
    <div class="muted" style="margin:14px 0 4px;font-weight:600;font-size:.85rem;">UPDATE STATUS</div>
    <div class="status-btns">
      ${STATUS_FLOW.map(s=>`<button data-status="${s}" class="${o.status===s?'on':''}">${STATUS_LABEL[s]}</button>`).join('')}
    </div>
    <button id="btn-deny" class="btn-quiet btn-sm mt-8" style="width:100%;color:var(--bad);border-color:#f3c6c2;">Deny this order</button>
    <div id="deny-form" style="display:none;margin-top:10px;">
      <input id="deny-name" placeholder="Your name">
      <textarea id="deny-reason" placeholder="Reason for denying this order" rows="3" style="width:100%;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;"></textarea>
      <button id="btn-deny-confirm" class="btn-sm" style="width:100%;background:var(--bad);color:#fff;border-color:var(--bad);">Confirm denial</button>
    </div>`}
    ${o.createdByUid ? `
    <div class="muted" style="margin:14px 0 4px;font-weight:600;font-size:.85rem;">NOTIFY CUSTOMER</div>
    <textarea id="notify-message" placeholder="e.g. Running 20 min late today, sorry!" rows="2" style="width:100%;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;"></textarea>
    <button id="btn-notify" class="btn-quiet btn-sm" style="width:100%;">Send push notification</button>
    <span class="ok-msg" id="notify-sent" style="display:none;">Sent — should reach their phone within a few minutes ✓</span>` : ''}`;
  document.getElementById('btn-close').onclick = closeModal;
  document.querySelectorAll('#modal-content [data-status]').forEach(b => b.onclick = () => setStatus(id, b.dataset.status));
  const notifyBtn = document.getElementById('btn-notify');
  if(notifyBtn) notifyBtn.onclick = () => sendOrderNotification(id, o.createdByUid);
  const denyBtn = document.getElementById('btn-deny');
  if(denyBtn) denyBtn.onclick = () => { denyBtn.style.display='none'; document.getElementById('deny-form').style.display='block'; };
  const denyConfirm = document.getElementById('btn-deny-confirm');
  if(denyConfirm) denyConfirm.onclick = () => {
    const name = document.getElementById('deny-name').value.trim();
    const reason = document.getElementById('deny-reason').value.trim();
    if(!name || !reason){ alert('Please enter your name and a reason before denying this order.'); return; }
    denyOrder(id, name, reason);
  };
  document.getElementById('modal-bg').classList.add('on');
}
function closeModal(){ document.getElementById('modal-bg')?.classList.remove('on'); openOrderId = null; }

async function setStatus(id, status){
  try{
    await updateDoc(doc(db, 'orders', id), { status, statusUpdatedAt: serverTimestamp() });
    closeModal();
  }catch(e){ alert('Could not update status: ' + e.message); }
}
async function denyOrder(id, deniedBy, deniedReason){
  try{
    await updateDoc(doc(db, 'orders', id), { status: 'denied', deniedBy, deniedReason, statusUpdatedAt: serverTimestamp() });
    closeModal();
  }catch(e){ alert('Could not deny order: ' + e.message); }
}
// Human-triggered, per-order push — not automatic on status change. Reuses
// the 'broadcasts' collection with a targetUid instead of an audience; the
// scheduled relay (backend/scripts/send-broadcast-push.js) treats that as
// "send to this one customer's device(s)" rather than a whole audience.
async function sendOrderNotification(orderId, targetUid){
  const input = document.getElementById('notify-message');
  const message = input.value.trim();
  if(!message){ alert('Enter a message to send.'); return; }
  const btn = document.getElementById('btn-notify');
  try{
    if(btn) btn.disabled = true;
    await addDoc(collection(db, 'broadcasts'), { message, targetUid, createdAt: serverTimestamp() });
    input.value = '';
    const msg = document.getElementById('notify-sent');
    if(msg) msg.style.display = 'inline';
  }catch(e){ alert('Could not send: ' + e.message); }
  finally{ if(btn) btn.disabled = false; }
}

function startOrdersListener(){
  const q = query(collection(db, 'orders'), orderBy('placedAt', 'desc'), limit(200));
  unsubOrders = onSnapshot(q, snap => {
    orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(tab==='orders'){
      // Refresh the list/chip counts in place — never re-render the search
      // input itself, so a real-time update never steals focus/cursor
      // position from an admin who's mid-search.
      if(document.getElementById('orders-list')){ refreshOrdersList(); refreshChips(); }
      else { render(); }
      if(openOrderId) openModal(openOrderId);
    }
  }, err => {
    $app.innerHTML = `<div class="wrap"><div class="card err">Could not load orders: ${esc(err.message)}</div></div>`;
  });
}

/* ── Products ─────────────────────────────────────────── */
function productsBody(){
  if(!products.length) return `<div class="empty">Loading products…</div>`;
  return `<div>${products.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(p => `
    <div class="card" id="prod-${esc(p.id)}">
      <div class="row" style="margin-bottom:10px;"><h3 style="margin:0;">${esc(p.name)}</h3><span class="muted">${esc(p.cat||'')}</span></div>
      <div class="variant-row" style="font-size:.78rem;color:var(--ink-2);font-weight:600;text-transform:uppercase;">
        <div>Variant</div><div>MRP</div><div>B2B ₹</div><div>MOQ</div><div>Stock</div>
      </div>
      ${(p.variants||[]).map((v,vi) => `
        <div class="variant-row">
          <div class="vlabel">${esc(v.label)}</div>
          <input type="number" data-p="${esc(p.id)}" data-v="${vi}" data-f="mrp" value="${v.mrp}">
          <input type="number" data-p="${esc(p.id)}" data-v="${vi}" data-f="b2b" value="${v.b2b}">
          <input type="number" data-p="${esc(p.id)}" data-v="${vi}" data-f="moq" value="${v.moq||1}">
          <select data-p="${esc(p.id)}" data-v="${vi}" data-f="stock">
            <option value="in" ${v.stock==='in'?'selected':''}>In stock</option>
            <option value="low" ${v.stock==='low'?'selected':''}>Low stock</option>
            <option value="out" ${v.stock==='out'?'selected':''}>Out of stock</option>
          </select>
        </div>`).join('')}
      <button class="btn-primary btn-sm" data-save="${esc(p.id)}">Save ${esc(p.name)}</button>
      <span class="ok-msg" id="saved-${esc(p.id)}" style="display:none;margin-left:10px;">Saved ✓</span>
    </div>`).join('')}</div>`;
}
function wireProductsEvents(){
  document.querySelectorAll('[data-save]').forEach(btn => btn.onclick = () => saveProduct(btn.dataset.save));
}
async function saveProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  const variants = (p.variants||[]).map((v, vi) => {
    const get = f => document.querySelector(`[data-p="${id}"][data-v="${vi}"][data-f="${f}"]`).value;
    return { ...v, mrp: Number(get('mrp'))||0, b2b: Number(get('b2b'))||0, moq: Number(get('moq'))||1, stock: get('stock') };
  });
  try{
    await updateDoc(doc(db, 'products', id), { variants });
    const msg = document.getElementById(`saved-${id}`);
    if(msg){ msg.style.display='inline'; setTimeout(()=>msg.style.display='none', 2000); }
  }catch(e){ alert('Could not save: ' + e.message); }
}
function startProductsListener(){
  unsubProducts = onSnapshot(collection(db, 'products'), snap => {
    products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(tab==='products'){ render(); wireProductsEvents(); }
  }, err => console.error(err));
}

/* ── Broadcasts ───────────────────────────────────────── */
const AUDIENCE_LABEL = { all: 'Everyone', b2b: 'Business customers', b2c: 'Personal customers' };
function broadcastsBody(){
  return `
    <div class="card" style="padding:12px;margin-bottom:12px;">
      <label>Message</label>
      <textarea id="bc-message" rows="3" placeholder="e.g. Fresh paneer back in stock today!"></textarea>
      <div class="grid2">
        <div><label>Send to</label>
          <select id="bc-audience">
            <option value="all">Everyone</option>
            <option value="b2b">Business customers only</option>
            <option value="b2c">Personal customers only</option>
          </select></div>
      </div>
      <button class="btn-primary" id="btn-send-broadcast">Send broadcast</button>
    </div>
    <div class="muted" style="margin-bottom:10px;">${broadcasts.length} sent</div>
    <div class="card" style="padding:0;overflow:auto;">
      ${!broadcasts.length ? `<div class="empty">No broadcasts sent yet. Customers will see the newest one as a banner on their Home screen until they dismiss it.</div>` : `
      <table>
        <thead><tr><th>Message</th><th>Audience</th><th>Sent</th><th></th></tr></thead>
        <tbody>
          ${broadcasts.map(b => `
            <tr>
              <td style="max-width:320px;">${esc(b.message)}</td>
              <td>${AUDIENCE_LABEL[b.audience]||'Everyone'}</td>
              <td class="muted">${fmtDate(b.createdAt)}</td>
              <td><button class="btn-quiet btn-sm" data-delete="${esc(b.id)}" style="color:var(--bad);">Delete</button></td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>`;
}
function wireBroadcastsEvents(){
  const btn = document.getElementById('btn-send-broadcast');
  if(btn) btn.onclick = sendBroadcast;
  document.querySelectorAll('[data-delete]').forEach(b => b.onclick = () => deleteBroadcast(b.dataset.delete));
}
async function sendBroadcast(){
  const message = document.getElementById('bc-message').value.trim();
  const audience = document.getElementById('bc-audience').value;
  if(!message){ alert('Enter a message to send.'); return; }
  try{
    await addDoc(collection(db, 'broadcasts'), { message, audience, createdAt: serverTimestamp() });
  }catch(e){ alert('Could not send broadcast: ' + e.message); }
}
async function deleteBroadcast(id){
  if(!confirm('Delete this broadcast? Customers who haven\'t dismissed it will stop seeing it.')) return;
  try{ await deleteDoc(doc(db, 'broadcasts', id)); }
  catch(e){ alert('Could not delete: ' + e.message); }
}
function startBroadcastsListener(){
  const q = query(collection(db, 'broadcasts'), orderBy('createdAt', 'desc'), limit(50));
  unsubBroadcasts = onSnapshot(q, snap => {
    broadcasts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(tab==='broadcasts'){ render(); wireBroadcastsEvents(); }
  }, err => console.error(err));
}

/* ── Settings (app_config/singleton) ─────────────────────── */
let cfg = {};
function settingsBody(){
  return `
    <div class="card">
      <div class="grid2">
        <div><label>Business name</label><input id="s-businessName" value="${esc(cfg.businessName||'')}"></div>
        <div><label>Support phone</label><input id="s-supportPhone" value="${esc(cfg.supportPhone||'')}"></div>
        <div><label>WhatsApp number</label><input id="s-whatsapp" value="${esc(cfg.whatsapp||'')}"></div>
        <div><label>Email</label><input id="s-email" value="${esc(cfg.email||'')}"></div>
      </div>
      <label>Address</label><textarea id="s-address" rows="2">${esc(cfg.address||'')}</textarea>
      <label>Business hours</label><input id="s-businessHours" value="${esc(cfg.businessHours||'')}">
      <div class="grid2">
        <div><label>Minimum order value (₹)</label><input id="s-minOrderValue" type="number" value="${cfg.minOrderValue||0}"></div>
        <div><label>Delivery fee (₹)</label><input id="s-deliveryFee" type="number" value="${cfg.deliveryFee||0}"></div>
        <div><label>GST rate (e.g. 0.05 = 5%)</label><input id="s-gstRate" type="number" step="0.01" value="${cfg.gstRate??0.05}"></div>
        <div><label>Order cutoff time</label><input id="s-orderCutoff" value="${esc(cfg.orderCutoff||'')}"></div>
      </div>
      <label>Announcement banner (leave blank to hide)</label><textarea id="s-announcement" rows="2">${esc(cfg.announcement||'')}</textarea>
      <button class="btn-primary" id="btn-save-settings">Save settings</button>
      <span class="ok-msg" id="saved-settings" style="display:none;margin-left:10px;">Saved ✓</span>
    </div>`;
}
function wireSettingsEvents(){
  const btn = document.getElementById('btn-save-settings');
  if(btn) btn.onclick = saveSettings;
}
async function saveSettings(){
  const val = id => document.getElementById(id).value;
  const patch = {
    businessName: val('s-businessName'), supportPhone: val('s-supportPhone'), whatsapp: val('s-whatsapp'),
    email: val('s-email'), address: val('s-address'), businessHours: val('s-businessHours'),
    minOrderValue: Number(val('s-minOrderValue'))||0, deliveryFee: Number(val('s-deliveryFee'))||0,
    gstRate: Number(val('s-gstRate'))||0, orderCutoff: val('s-orderCutoff'), announcement: val('s-announcement'),
  };
  try{
    await setDoc(doc(db, 'app_config', 'singleton'), patch, { merge: true });
    cfg = { ...cfg, ...patch };
    const msg = document.getElementById('saved-settings');
    if(msg){ msg.style.display='inline'; setTimeout(()=>msg.style.display='none', 2000); }
  }catch(e){ alert('Could not save: ' + e.message); }
}
async function loadSettings(){
  try{
    const snap = await getDoc(doc(db, 'app_config', 'singleton'));
    if(snap.exists()) cfg = snap.data();
    if(tab==='settings') render();
  }catch(e){ console.error(e); }
}

onAuthStateChanged(auth, user => {
  if(user){
    startOrdersListener();
    startProductsListener();
    startBroadcastsListener();
    loadSettings();
    render();
  }else{
    if(unsubOrders){ unsubOrders(); unsubOrders = null; }
    if(unsubProducts){ unsubProducts(); unsubProducts = null; }
    if(unsubBroadcasts){ unsubBroadcasts(); unsubBroadcasts = null; }
    orders = []; products = []; broadcasts = []; tab = 'orders';
    renderLogin();
  }
});
</script>
</body>
</html>
