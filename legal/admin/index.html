<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modern Dairy — Admin</title>
<style>
  :root{--brand:#0e2036;--brand-2:#153a63;--brand-tint:#e3edf7;--bg:#f1f2ee;--surface:#fff;--line:#dee1db;--ink:#161b22;--ink-2:#4b5768;--fresh:#1a7a4c;--warn:#8a5f14;--warn-tint:#faf1de;--bad:#b3261e;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);margin:0;min-height:100vh;}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
  .center-wrap{max-width:360px;margin:80px auto;padding:0 16px;}
  h1{font-size:1.4rem;margin:0 0 4px;}
  h3{font-size:1rem;margin:0 0 12px;}
  .muted{color:var(--ink-2);font-size:.9rem;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:1rem;margin-bottom:14px;font-family:inherit;}
  button{cursor:pointer;font-size:1rem;font-weight:600;border:none;border-radius:8px;padding:12px 16px;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .btn-quiet{background:transparent;color:var(--brand);}
  .btn-sm{font-size:.85rem;padding:8px 12px;}
  .err{color:var(--bad);font-size:.85rem;margin:-8px 0 12px;}
  .ok-msg{color:var(--fresh);font-size:.85rem;margin:-8px 0 12px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{width:48px;height:48px;object-fit:contain;border-radius:10px;flex-shrink:0;}
  .login-logo{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 16px;}
  .m-entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .m-title{font-weight:700;font-size:1rem;margin:0;}
  .m-badges{display:flex;gap:6px;flex-wrap:wrap;}
  .m-field{margin-top:8px;font-size:.9rem;line-height:1.5;}
  .m-field b{color:var(--ink-2);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:1px;}
  .pill.security{background:#fbe4e2;color:var(--bad);}
  .pill.bugfix{background:var(--brand-tint);color:var(--brand-2);}
  .pill.improvement{background:#e2f3e9;color:var(--fresh);}
  .pill.critical{background:#b3261e;color:#fff;} .pill.high{background:#fbe4e2;color:var(--bad);}
  .pill.medium{background:var(--warn-tint);color:var(--warn);} .pill.low,.pill.info{background:var(--bg);color:var(--ink-2);}
  .pill.deployed,.pill.shipped,.pill.tested{background:#e2f3e9;color:var(--fresh);}
  .pill.action-needed{background:var(--warn-tint);color:var(--warn);}
  .signout{background:transparent;color:var(--ink-2);font-weight:500;font-size:.85rem;padding:6px 10px;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.9rem;}
  th{color:var(--ink-2);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;}
  tr:hover{background:var(--bg);cursor:pointer;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.75rem;font-weight:700;}
  .pill.placed,.pill.confirmed{background:var(--brand-tint);color:var(--brand-2);}
  .pill.pending_confirmation,.pill.packed,.pill.out_for_delivery{background:var(--warn-tint);color:var(--warn);}
  .pill.delivered{background:#e2f3e9;color:var(--fresh);}
  .pill.cancelled{background:#fbe4e2;color:var(--bad);}
  .pill.denied{background:#fbe4e2;color:var(--bad);}
  .pill.in{background:#e2f3e9;color:var(--fresh);} .pill.low{background:var(--warn-tint);color:var(--warn);} .pill.out{background:#fbe4e2;color:var(--bad);}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;}
  .modal-bg.on{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:480px;width:100%;max-height:85vh;overflow:auto;padding:20px;}
  .row{display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem;}
  .status-btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
  .status-btns button{flex:1;min-width:100px;font-size:.8rem;padding:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);}
  .status-btns button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-2);}
  .close-x{background:transparent;font-size:1.4rem;line-height:1;padding:4px 8px;color:var(--ink-2);}
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab{background:transparent;border-radius:0;padding:10px 4px;margin-right:20px;color:var(--ink-2);border-bottom:2px solid transparent;}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand);}
  .variant-row{display:grid;grid-template-columns:1fr 90px 90px 70px 110px;gap:8px;align-items:center;margin-bottom:8px;}
  .variant-row input,.variant-row select{margin-bottom:0;padding:8px;font-size:.85rem;}
  .variant-row .vlabel{font-size:.85rem;font-weight:600;}
  @media (max-width:640px){ .variant-row{grid-template-columns:1fr 1fr;} }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  @media (max-width:520px){ .grid2{grid-template-columns:1fr;} }
  /* ── Assistant (admin AI) ─────────────────────────────── */
  .asst-wrap{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:420px;}
  .asst-log{flex:1;overflow-y:auto;padding:4px 2px 12px;display:flex;flex-direction:column;gap:12px;}
  .asst-msg{max-width:86%;padding:11px 14px;border-radius:14px;font-size:.92rem;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;}
  .asst-msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px;}
  .asst-msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .asst-msg.tool{align-self:flex-start;background:var(--warn-tint);color:var(--warn);border:1px solid #e9d9b0;font-size:.82rem;font-family:ui-monospace,monospace;max-width:92%;}
  .asst-msg.err{align-self:flex-start;background:#fbe4e2;color:var(--bad);border:1px solid #f2c4c0;}
  .asst-msg b{font-weight:700;}
  .asst-empty{color:var(--ink-2);font-size:.9rem;text-align:center;margin:auto;max-width:420px;line-height:1.6;}
  .asst-bar{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:10px;}
  .asst-bar textarea{flex:1;margin:0;resize:none;max-height:140px;min-height:44px;}
  .asst-send{white-space:nowrap;}
  .asst-typing{align-self:flex-start;color:var(--ink-2);font-size:.85rem;font-style:italic;padding:4px 6px;}
  .asst-head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .asst-model{font-size:.82rem;padding:6px 8px;width:auto;margin:0;}
  .chip-btn{background:var(--bg);border:1px solid var(--line);color:var(--ink-2);font-size:.8rem;padding:6px 10px;border-radius:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, updateDoc, setDoc, getDoc, addDoc, deleteDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyD-3RNHrI9ZPmdTioLiuCi2gjwdNXZH8HI",
  authDomain: "modern-dairy-pune.firebaseapp.com",
  projectId: "modern-dairy-pune",
  storageBucket: "modern-dairy-pune.firebasestorage.app",
  messagingSenderId: "711745048614",
  appId: "1:711745048614:web:29e8641911c62c1bb856e7",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const STATUS_LABEL = {
  placed: 'Placed', confirmed: 'Confirmed', pending_confirmation: 'Pending confirmation',
  packed: 'Packed', out_for_delivery: 'Out for delivery', delivered: 'Delivered', cancelled: 'Cancelled',
  denied: 'Denied',
};
const STATUS_FLOW = ['placed', 'confirmed', 'packed', 'out_for_delivery', 'delivered'];

const $app = document.getElementById('app');
let tab = 'orders';
let orders = [];
let products = [];
let broadcasts = [];
let maintenance = [];
let unsubOrders = null, unsubProducts = null, unsubBroadcasts = null, unsubMaintenance = null;
let openOrderId = null;

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '₹' + Math.round(Number(n)||0).toLocaleString('en-IN'); }
function fmtDate(ts){
  const d = ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
  if(!d) return '—';
  return d.toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

function renderLogin(err){
  $app.innerHTML = `
    <div class="center-wrap">
      <img src="logo.png" alt="Modern Dairy" class="login-logo">
      <h1 style="text-align:center;">Modern Dairy Admin</h1>
      <div class="muted" style="margin-bottom:20px;text-align:center;">Super admin panel — sign in to manage the store.</div>
      <div class="card">
        <label>Username</label>
        <input id="f-user" autocomplete="off" placeholder="Username">
        <label>Password</label>
        <input id="f-pass" type="password" placeholder="Password">
        ${err ? `<div class="err">${esc(err)}</div>` : ''}
        <button class="btn-primary" id="btn-login" style="width:100%;">Sign in</button>
      </div>
    </div>`;
  document.getElementById('btn-login').onclick = doLogin;
  document.getElementById('f-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  const user = document.getElementById('f-user').value.trim();
  const pass = document.getElementById('f-pass').value;
  const btn = document.getElementById('btn-login');
  if(!user || !pass){ renderLogin('Enter a username and password.'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try{
    await signInWithEmailAndPassword(auth, user.toLowerCase().replace(/\s+/g,'_') + '@admin.local', pass);
  }catch(e){
    renderLogin('Incorrect username or password.');
  }
}

function renderShell(bodyHtml){
  $app.innerHTML = `
    <div class="wrap">
      <header>
        <div class="brand">
          <img src="logo.png" alt="Modern Dairy" class="brand-logo">
          <div>
            <h1>Modern Dairy Admin</h1>
            <div class="muted" style="font-size:.8rem;">Super admin panel</div>
          </div>
        </div>
        <button class="signout" id="btn-signout">Sign out</button>
      </header>
      <div class="tabs">
        <button class="tab ${tab==='orders'?'on':''}" data-tab="orders">Orders</button>
        <button class="tab ${tab==='products'?'on':''}" data-tab="products">Products</button>
        <button class="tab ${tab==='broadcasts'?'on':''}" data-tab="broadcasts">Broadcasts</button>
        <button class="tab ${tab==='settings'?'on':''}" data-tab="settings">Settings</button>
        <button class="tab ${tab==='maintenance'?'on':''}" data-tab="maintenance">Maintenance</button>
        <button class="tab ${tab==='assistant'?'on':''}" data-tab="assistant">Assistant</button>
      </div>
      <div id="tab-body">${bodyHtml}</div>
    </div>
    <div class="modal-bg" id="modal-bg"><div class="modal" id="modal-content"></div></div>`;
  document.getElementById('btn-signout').onclick = () => signOut(auth);
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.getElementById('modal-bg').onclick = (e) => { if(e.target.id==='modal-bg') closeModal(); };
}

function render(){
  if(tab==='orders'){ renderShell(ordersBody()); wireOrdersEvents(); }
  else if(tab==='products'){ renderShell(productsBody()); wireProductsEvents(); }
  else if(tab==='broadcasts'){ renderShell(broadcastsBody()); wireBroadcastsEvents(); }
  else if(tab==='maintenance'){ renderShell(maintenanceBody()); }
  else if(tab==='assistant'){ renderShell(assistantBody()); wireAssistantEvents(); }
  else { renderShell(settingsBody()); wireSettingsEvents(); }
}

/* ── Orders ───────────────────────────────────────────── */
let orderFilter = 'all';
let orderSearch = '';
const FILTER_SECTIONS = [
  { id: 'all', label: 'All' },
  { id: 'placed', label: 'Orders placed' },
  { id: 'confirmed', label: 'Order accepted' },
  { id: 'out_for_delivery', label: 'Out for delivery' },
  { id: 'delivered', label: 'Orders delivered' },
  { id: 'denied', label: 'Orders denied' },
  { id: 'cancelled', label: 'Cancelled' },
];
function filteredOrders(){
  return orders.filter(o => {
    if(orderFilter !== 'all' && (o.status||'placed') !== orderFilter) return false;
    if(orderSearch){
      const q = orderSearch.toLowerCase();
      const inOrderNo = String(o.orderNo||o.id||'').toLowerCase().includes(q);
      const inItems = (o.items||[]).some(i => String(i.name||'').toLowerCase().includes(q));
      if(!inOrderNo && !inItems) return false;
    }
    return true;
  });
}
function ordersBody(){
  // The search <input> lives outside #orders-list on purpose — only
  // #orders-list is replaced on every keystroke, so the input's own DOM
  // node (and cursor position) is never recreated while typing.
  return `
    <div class="card" style="padding:12px;margin-bottom:12px;">
      <input id="order-search" placeholder="Search by order ID or product name…" value="${esc(orderSearch)}" style="margin-bottom:12px;">
      <div id="filter-chips" style="display:flex;flex-wrap:wrap;gap:6px;">
        ${filterChipsHtml()}
      </div>
    </div>
    <div id="orders-list">${ordersListHtml()}</div>`;
}
function filterChipsHtml(){
  return FILTER_SECTIONS.map(s => {
    const count = s.id==='all' ? orders.length : orders.filter(o=>(o.status||'placed')===s.id).length;
    return `<button class="btn-quiet btn-sm" data-filter="${s.id}" style="background:${orderFilter===s.id?'var(--brand)':'var(--bg)'};color:${orderFilter===s.id?'#fff':'var(--ink)'};">${s.label} (${count})</button>`;
  }).join('');
}
function ordersListHtml(){
  const list = filteredOrders();
  return `
    <div class="muted" style="margin-bottom:10px;">${list.length} order${list.length===1?'':'s'}${orderFilter!=='all'||orderSearch?' matching':''}</div>
    <div class="card" style="padding:0;overflow:auto;">
      ${!list.length ? `<div class="empty">${orders.length?'No orders match this filter/search.':'No orders yet. New orders from the app will appear here in real time.'}</div>` : `
      <table>
        <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Placed</th></tr></thead>
        <tbody>
          ${list.map(o => `
            <tr data-id="${esc(o.id)}">
              <td><b>${esc(o.orderNo||o.id)}</b>${o.priceMismatch?' <span title="Price mismatch vs catalogue" style="color:var(--bad);">⚠</span>':''}</td>
              <td>${esc(o.name||o.company||'—')}<br><span class="muted">${esc(o.phone||'')}</span></td>
              <td>${(o.items||[]).length}</td>
              <td>${money(o.total)}</td>
              <td><span class="pill ${esc(o.status||'placed')}">${STATUS_LABEL[o.status]||o.status}</span></td>
              <td class="muted">${fmtDate(o.placedAt)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>`;
}
function wireOrdersEvents(){
  wireOrdersListEvents();
  wireFilterChipEvents();
  const search = document.getElementById('order-search');
  if(search){
    search.oninput = () => { orderSearch = search.value; refreshOrdersList(); };
  }
}
function wireOrdersListEvents(){
  document.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => openModal(tr.dataset.id));
}
function wireFilterChipEvents(){
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { orderFilter = b.dataset.filter; refreshChips(); refreshOrdersList(); });
}
function refreshOrdersList(){
  const el = document.getElementById('orders-list');
  if(el){ el.innerHTML = ordersListHtml(); wireOrdersListEvents(); }
}
function refreshChips(){
  const el = document.getElementById('filter-chips');
  if(el){ el.innerHTML = filterChipsHtml(); wireFilterChipEvents(); }
}

function openModal(id){
  openOrderId = id;
  const o = orders.find(x => x.id === id);
  if(!o) return;
  document.getElementById('modal-content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div><b style="font-size:1.1rem;">${esc(o.orderNo||o.id)}</b><div class="muted">${fmtDate(o.placedAt)}</div></div>
      <button class="close-x" id="btn-close">×</button>
    </div>
    ${o.priceMismatch ? `<div style="margin:10px 0;padding:10px;border-radius:8px;background:#fbe4e2;color:var(--bad);font-size:.85rem;">
      <b>⚠ Price mismatch detected</b> — this order's price doesn't match the current catalogue. Verify before fulfilling.<br>${esc(o.priceMismatchDetail||'')}
    </div>` : ''}
    <div class="row"><span class="muted">Customer</span><span>${esc(o.name||'—')}${o.company?` (${esc(o.company)})`:''}</span></div>
    <div class="row"><span class="muted">Phone</span><span>${esc(o.phone||'—')}</span></div>
    ${o.gstin?`<div class="row"><span class="muted">GSTIN</span><span>${esc(o.gstin)}</span></div>`:''}
    ${o.address?`<div class="row" style="align-items:flex-start;"><span class="muted">Deliver to</span><span style="text-align:right;max-width:70%;">${esc(o.address)}</span></div>`:''}
    <div style="border-top:1px solid var(--line);margin:10px 0;padding-top:10px;">
      ${(o.items||[]).map(i=>`<div class="row"><span>${esc(i.name)} (${esc(i.label||'')}) × ${esc(i.qty)}</span><span>${money(Number(i.price)*Number(i.qty))}</span></div>`).join('')}
    </div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:10px;font-weight:700;"><span>Total</span><span>${money(o.total)}</span></div>
    ${o.status==='cancelled' ? `
    <div class="muted" style="margin:14px 0 4px;font-weight:600;font-size:.85rem;">STATUS</div>
    <div class="status-btns"><button class="on" disabled style="background:#fbe4e2;color:var(--bad);border-color:#f3c6c2;cursor:default;">Cancelled by customer</button></div>` : o.status==='denied' ? `
    <div class="muted" style="margin:14px 0 4px;font-weight:600;font-size:.85rem;">STATUS</div>
    <div class="status-btns"><button class="on" disabled style="background:#fbe4e2;color:var(--bad);border-color:#f3c6c2;cursor:default;">Denied</button></div>
    <div class="row" style="align-items:flex-start;"><span class="muted">Denied by</span><span>${esc(o.deniedBy||'—')}</span></div>
    <div class="row" style="align-items:flex-start;"><span class="muted">Reason</span><span style="text-align:right;max-width:70%;">${esc(o.deniedReason||'—')}</span></div>` : `
    <div class="muted" style="margin:14px 0 4px;font-weight:600;font-size:.85rem;">UPDATE STATUS</div>
    <div class="status-btns">
      ${STATUS_FLOW.map(s=>`<button data-status="${s}" class="${o.status===s?'on':''}">${STATUS_LABEL[s]}</button>`).join('')}
    </div>
    <button id="btn-deny" class="btn-quiet btn-sm mt-8" style="width:100%;color:var(--bad);border-color:#f3c6c2;">Deny this order</button>
    <div id="deny-form" style="display:none;margin-top:10px;">
      <input id="deny-name" placeholder="Your name">
      <textarea id="deny-reason" placeholder="Reason for denying this order" rows="3" style="width:100%;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;"></textarea>
      <button id="btn-deny-confirm" class="btn-sm" style="width:100%;background:var(--bad);color:#fff;border-color:var(--bad);">Confirm denial</button>
    </div>`}`;
  document.getElementById('btn-close').onclick = closeModal;
  document.querySelectorAll('#modal-content [data-status]').forEach(b => b.onclick = () => setStatus(id, b.dataset.status));
  const denyBtn = document.getElementById('btn-deny');
  if(denyBtn) denyBtn.onclick = () => { denyBtn.style.display='none'; document.getElementById('deny-form').style.display='block'; };
  const denyConfirm = document.getElementById('btn-deny-confirm');
  if(denyConfirm) denyConfirm.onclick = () => {
    const name = document.getElementById('deny-name').value.trim();
    const reason = document.getElementById('deny-reason').value.trim();
    if(!name || !reason){ alert('Please enter your name and a reason before denying this order.'); return; }
    denyOrder(id, name, reason);
  };
  document.getElementById('modal-bg').classList.add('on');
}
function closeModal(){ document.getElementById('modal-bg')?.classList.remove('on'); openOrderId = null; }

async function setStatus(id, status){
  try{
    await updateDoc(doc(db, 'orders', id), { status, statusUpdatedAt: serverTimestamp() });
    closeModal();
  }catch(e){ alert('Could not update status: ' + e.message); }
}
async function denyOrder(id, deniedBy, deniedReason){
  try{
    await updateDoc(doc(db, 'orders', id), { status: 'denied', deniedBy, deniedReason, statusUpdatedAt: serverTimestamp() });
    closeModal();
  }catch(e){ alert('Could not deny order: ' + e.message); }
}
function startOrdersListener(){
  const q = query(collection(db, 'orders'), orderBy('placedAt', 'desc'), limit(200));
  unsubOrders = onSnapshot(q, snap => {

/* The one uid Firestore rules actually trust — must stay identical to

   what this page believes), but the check below matters anyway:

   an anonymous session created from the browser console with the public
   web API key. That rendered the whole admin shell — tabs, controls,
   Settings form — to a stranger. Every listener behind it failed with
   permission-denied, so no data leaked, but it told an attacker exactly
   what exists and invited them to hunt for one unguarded call. Anyone who

const ADMIN_UID = '63cH4Dduh4WS7okdV0s0DcJtD7q2';
/* ═══════════════════════════════════════════════════════════
   ADMIN AI ASSISTANT (Assistant tab)
   An operations assistant for the store owner. Chats with Claude
   using the owner's OWN API key, entered here and stored ONLY in
   this device's localStorage — never committed, never sent anywhere
   except api.anthropic.com. Because there is no backend yet, the
   call is made directly from the browser; when the backend deploys,
   move the key + call server-side (same reasoning as every other
   credential in this app). It can read the store's live data and,
   with a confirmation each time, send a broadcast or log a
   maintenance entry. It CANNOT change the app's code or deploy —
   it's an operator's assistant, not a self-editing system.
   ═══════════════════════════════════════════════════════════ */
const ASST_KEY_LS = 'mda_admin_ai_key';
const ASST_MODEL_LS = 'mda_admin_ai_model';
const ASST_MODELS = [
  { id:'claude-sonnet-5', label:'Sonnet 5 — balanced (recommended)' },

];
let asstChat = [];       // Anthropic message array: {role, content:string|blocks[]}
let asstBusy = false;

function asstGetKey(){ try{ return localStorage.getItem(ASST_KEY_LS)||''; }catch(e){ return ''; } }
function asstGetModel(){ try{ return localStorage.getItem(ASST_MODEL_LS)||'claude-sonnet-5'; }catch(e){ return 'claude-sonnet-5'; } }

function asstSetupBody(){

function assistantBody(){ return asstBody(); }

function asstLogHtml(){
  if(!asstChat.length && !asstBusy) return `<div class="asst-empty">
    Ask me about your orders, products or settings, to draft a broadcast, or to help work out
    why something isn't behaving. I read your live store data, and I'll always show you a
    confirmation before I send a broadcast or log anything.</div>`;
  let html = '';
  for(const m of asstChat){
    if(m.role==='user'){
      // Skip tool_result-only turns in the visible log.
      if(typeof m.content === 'string') html += `<div class="asst-msg user">${esc(m.content)}</div>`;
    } else if(m.role==='assistant'){
      const blocks = Array.isArray(m.content) ? m.content : [{type:'text',text:m.content}];
      for(const b of blocks){
        if(b.type==='text' && b.text.trim()) html += `<div class="asst-msg bot">${asstFmt(b.text)}</div>`;
        else if(b.type==='tool_use') html += `<div class="asst-msg tool">↳ ${esc(asstToolLabel(b.name))}…</div>`;
      }
    }
  }
  if(asstBusy) html += `<div class="asst-typing" id="asst-typing">Assistant is thinking…</div>`;
  return html;
}
// Minimal, safe formatting: bold **text**, escape everything else.
function asstFmt(t){
  return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
function asstToolLabel(name){
  return ({ get_orders:'Reading orders', get_products:'Reading products', get_settings:'Reading settings',

async function asstSend(){
  if(asstBusy) return;
  const input = document.getElementById('asst-input');
  const text = (input?.value || '').trim();
  if(!text) return;
  input.value=''; input.style.height='auto';
  asstChat.push({ role:'user', content:text });
  asstBusy = true;
  document.getElementById('asst-send')?.setAttribute('disabled','');
  asstRefreshLog();
  try{
    await asstRunLoop();
  }catch(e){
    asstChat.push({ role:'assistant', content:[{type:'text', text:'⚠ '+(e.message||'Something went wrong talking to Claude.')}] });
  }
  asstBusy = false;
  asstRefreshLog();
  document.getElementById('asst-send')?.removeAttribute('disabled');
  const inp = document.getElementById('asst-input'); if(inp){ inp.removeAttribute('disabled'); inp.focus(); }
}

// The tool-use loop: call Claude, run any tools it requests, feed results back,
// repeat until it returns a plain text answer. Capped so a misbehaving loop
// can't spin forever.
async function asstRunLoop(){
  for(let turn=0; turn<8; turn++){
    const data = await asstCallClaude();
    asstChat.push({ role:'assistant', content:data.content });
    asstRefreshLog();
    if(data.stop_reason !== 'tool_use') return;
    const toolResults = [];
    for(const block of data.content){
      if(block.type==='tool_use'){
        const result = await asstRunTool(block.name, block.input || {});
        toolResults.push({ type:'tool_result', tool_use_id:block.id, content:result.content, is_error: !!result.is_error });
      }
    }
    asstChat.push({ role:'user', content: toolResults });
  }
  asstChat.push({ role:'assistant', content:[{type:'text', text:'(Stopped after several tool steps — ask me to continue if needed.)'}] });
}

async function asstCallClaude(){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': asstGetKey(),
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify({
      model: asstGetModel(),
      max_tokens: 2048,
      system: asstSystemPrompt(),
      tools: ASST_TOOLS,
      messages: asstChat,
    }),
  });
  if(!res.ok){
    let msg = `Claude API error (HTTP ${res.status})`;
    try{ const e = await res.json(); msg = e?.error?.message || msg; }catch(_){}
    if(res.status===401) msg = 'That API key was rejected. Check it in the key settings.';
    if(res.status===429) msg = 'Rate limited or out of credit on that Claude account.';
    throw new Error(msg);
  }
  return res.json();
}

  }).join('\n');
  return `You are the operations assistant built into the admin panel of "Modern Dairy", a dairy and frozen-foods business in Pune, India, that takes wholesale (b2b) and personal (b2c) orders through an Android app.

You are talking to the store owner/operator. Be concise, practical and direct — this is a busy person running a shop, not a technical audience. Use ₹ for money and Indian number formatting. When you are unsure, say so.

WHAT YOU CAN DO:
- Answer questions about the store's orders, products, settings and broadcasts (you have tools to read the live data, and a snapshot is below).
- Help draft broadcast messages and, with the operator's confirmation, send them.
- Diagnose operational issues (e.g. "a push notification didn't arrive") and explain likely causes in plain language.
- Record a maintenance/issue entry in the log, with confirmation.

WHAT YOU CANNOT DO — be honest about this if asked:
- You cannot change the app's code, fix software bugs, or deploy anything. You are an operator's assistant, not a self-editing system. If something needs a code change, explain what's wrong and suggest the owner raise it with their developer.
- You cannot see customer passwords or wallets — those live on each customer's own device, not in the cloud.
- Every send_broadcast and log_maintenance action pops up a confirmation the operator must approve; never claim you've sent something until the tool returns success.

USEFUL CONTEXT:
- Push notifications for broadcasts are relayed by a scheduled job that GitHub often runs late, so pushes can be delayed by many minutes — that is the usual reason a broadcast "doesn't arrive" promptly, not a failure. If the app is open when a push arrives it shows as an in-app message, not a system banner.
- Orders flagged ⚠PRICE-MISMATCH were auto-flagged because their prices didn't match the catalogue — review before fulfilling.

LIVE SNAPSHOT (may be truncated; use the tools for the full/fresh picture):
Settings: min order ₹${(cfg&&cfg.minOrderValue)||0}, delivery fee ₹${(cfg&&cfg.deliveryFee)||0}, GST ${((cfg&&cfg.gstRate)||0)*100}%.
Products (${(products||[]).length}):
${prodLines || '(none loaded)'}
Recent orders (${(orders||[]).length} total, showing up to 40):
${orderLines || '(none yet)'}`;
}

const ASST_TOOLS = [
  { name:'get_orders', description:"Return the store's current orders as JSON. Use when you need full detail beyond the snapshot, or to filter by status.",
    input_schema:{ type:'object', properties:{ status:{ type:'string', description:"Optional status filter e.g. placed, confirmed, pending_confirmation, packed, out_for_delivery, delivered, cancelled, denied" } } } },
  { name:'get_products', description:"Return the full product catalogue as JSON (names, variants, prices, stock).",
    input_schema:{ type:'object', properties:{} } },
  { name:'get_settings', description:"Return the store's business settings as JSON.",
    input_schema:{ type:'object', properties:{} } },
  { name:'send_broadcast', description:"Send an in-app + push broadcast to customers. Pops up a confirmation the operator must approve first. Keep messages short and clear.",
    input_schema:{ type:'object', properties:{
      message:{ type:'string', description:'The message text (max ~200 chars).' },
      audience:{ type:'string', enum:['all','b2b','b2c'], description:"Who receives it: all customers, business (b2b) only, or personal (b2c) only." }
    }, required:['message','audience'] } },
  { name:'log_maintenance', description:"Add an entry to the maintenance log (shown in the Maintenance tab). Pops up a confirmation first. Use for recording issues, fixes or notes.",
    input_schema:{ type:'object', properties:{
      title:{ type:'string' },
      category:{ type:'string', enum:['security','bugfix','improvement'] },
      problem:{ type:'string', description:'What was wrong / the issue.' },
      fix:{ type:'string', description:'What was done or recommended.' },
      status:{ type:'string', enum:['shipped','deployed','tested','action-needed'] }
    }, required:['title','category'] } },
];

async function asstRunTool(name, input){
  try{
    if(name==='get_orders'){
      let list = orders||[];
      if(input.status) list = list.filter(o=>o.status===input.status);
      const slim = list.slice(0,80).map(o=>({ orderNo:o.orderNo, status:o.status, total:o.total, name:o.name,
        phone:o.phone, type:o.customerType, priceMismatch:!!o.priceMismatch,
        items:(o.items||[]).map(i=>({ name:i.name, qty:i.qty, price:i.price })), placedAt:o.placedAt }));
      return { content: JSON.stringify({ count:list.length, orders:slim }) };
    }
    if(name==='get_products'){
      return { content: JSON.stringify((products||[]).map(p=>({ id:p.id, name:p.name, variants:p.variants }))) };
    }
    if(name==='get_settings'){
      return { content: JSON.stringify(cfg||{}) };
    }
    if(name==='send_broadcast'){
      const message = String(input.message||'').slice(0,300).trim();
      const audience = ['all','b2b','b2c'].includes(input.audience) ? input.audience : 'all';
      if(!message) return { content:'No message text was provided.', is_error:true };
      const who = audience==='all'?'ALL customers':audience==='b2b'?'BUSINESS customers':'PERSONAL customers';
      if(!confirm(`Send this broadcast to ${who}?\n\n"${message}"`)) return { content:'The operator declined — broadcast NOT sent.' };
      await addDoc(collection(db,'broadcasts'), { message, audience, createdAt: serverTimestamp() });
      return { content:`Broadcast queued to ${who}. It shows in-app immediately; the push may take a few minutes (scheduled relay).` };
    }
    if(name==='log_maintenance'){
      const entry = {
        title: String(input.title||'Untitled').slice(0,200),
        category: ['security','bugfix','improvement'].includes(input.category)?input.category:'improvement',
        problem: String(input.problem||'').slice(0,2000),
        fix: String(input.fix||'').slice(0,2000),
        status: ['shipped','deployed','tested','action-needed'].includes(input.status)?input.status:'',
        date: serverTimestamp(),
      };
      if(!confirm(`Add this to the maintenance log?\n\n${entry.title} (${entry.category})`)) return { content:'The operator declined — nothing was logged.' };
      await addDoc(collection(db,'maintenance_log'), entry);
      return { content:'Maintenance entry added.' };
    }
    return { content:`Unknown tool: ${name}`, is_error:true };
  }catch(e){
    return { content:`Tool ${name} failed: ${e.message||e}`, is_error:true };
  }
}

onAuthStateChanged(auth, user => {
  if(user && user.uid !== ADMIN_UID){
    signOut(auth);
    renderLogin('That account is not an administrator.');
    return;
  }
  if(user){
    startOrdersListener();
    startProductsListener();
    startBroadcastsListener();
    startMaintenanceListener();
    loadSettings();
    render();
  }else{
    if(unsubOrders){ unsubOrders(); unsubOrders = null; }
    if(unsubProducts){ unsubProducts(); unsubProducts = null; }
    if(unsubBroadcasts){ unsubBroadcasts(); unsubBroadcasts = null; }
    if(unsubMaintenance){ unsubMaintenance(); unsubMaintenance = null; }
    orders = []; products = []; broadcasts = []; maintenance = []; asstChat = []; asstBusy = false; tab = 'orders';
    renderLogin();
  }
});
</script>
</body>
</html>
