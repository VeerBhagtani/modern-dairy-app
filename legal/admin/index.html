<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modern Dairy — Admin</title>
<style>
  :root{--brand:#0e2036;--brand-2:#153a63;--brand-tint:#e3edf7;--bg:#f1f2ee;--surface:#fff;--line:#dee1db;--ink:#161b22;--ink-2:#4b5768;--fresh:#1a7a4c;--warn:#8a5f14;--warn-tint:#faf1de;--bad:#b3261e;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);margin:0;min-height:100vh;}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
  .center-wrap{max-width:360px;margin:80px auto;padding:0 16px;}
  h1{font-size:1.4rem;margin:0 0 4px;}
  h3{font-size:1rem;margin:0 0 12px;}
  .muted{color:var(--ink-2);font-size:.9rem;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:1rem;margin-bottom:14px;font-family:inherit;}
  button{cursor:pointer;font-size:1rem;font-weight:600;border:none;border-radius:8px;padding:12px 16px;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .btn-quiet{background:transparent;color:var(--brand);}
  .btn-sm{font-size:.85rem;padding:8px 12px;}
  .err{color:var(--bad);font-size:.85rem;margin:-8px 0 12px;}
  .ok-msg{color:var(--fresh);font-size:.85rem;margin:-8px 0 12px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{width:48px;height:48px;object-fit:contain;border-radius:10px;flex-shrink:0;}
  .login-logo{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 16px;}
  .m-entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .m-title{font-weight:700;font-size:1rem;margin:0;}
  .m-badges{display:flex;gap:6px;flex-wrap:wrap;}
  .m-field{margin-top:8px;font-size:.9rem;line-height:1.5;}
  .m-field b{color:var(--ink-2);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:1px;}
  .pill.security{background:#fbe4e2;color:var(--bad);}
  .pill.bugfix{background:var(--brand-tint);color:var(--brand-2);}
  .pill.improvement{background:#e2f3e9;color:var(--fresh);}
  .pill.critical{background:#b3261e;color:#fff;} .pill.high{background:#fbe4e2;color:var(--bad);}
  .pill.medium{background:var(--warn-tint);color:var(--warn);} .pill.low,.pill.info{background:var(--bg);color:var(--ink-2);}
  .pill.deployed,.pill.shipped,.pill.tested{background:#e2f3e9;color:var(--fresh);}
  .pill.action-needed{background:var(--warn-tint);color:var(--warn);}
  .signout{background:transparent;color:var(--ink-2);font-weight:500;font-size:.85rem;padding:6px 10px;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.9rem;}
  th{color:var(--ink-2);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;}
  tr:hover{background:var(--bg);cursor:pointer;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.75rem;font-weight:700;}
  .pill.placed,.pill.confirmed{background:var(--brand-tint);color:var(--brand-2);}
  .pill.pending_confirmation,.pill.packed,.pill.out_for_delivery{background:var(--warn-tint);color:var(--warn);}
  .pill.delivered{background:#e2f3e9;color:var(--fresh);}
  .pill.cancelled{background:#fbe4e2;color:var(--bad);}
  .pill.denied{background:#fbe4e2;color:var(--bad);}
  .pill.in{background:#e2f3e9;color:var(--fresh);} .pill.low{background:var(--warn-tint);color:var(--warn);} .pill.out{background:#fbe4e2;color:var(--bad);}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;}
  .modal-bg.on{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:480px;width:100%;max-height:85vh;overflow:auto;padding:20px;}
  .row{display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem;}
  .status-btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
  .status-btns button{flex:1;min-width:100px;font-size:.8rem;padding:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);}
  .status-btns button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-2);}
  .close-x{background:transparent;font-size:1.4rem;line-height:1;padding:4px 8px;color:var(--ink-2);}
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab{background:transparent;border-radius:0;padding:10px 4px;margin-right:20px;color:var(--ink-2);border-bottom:2px solid transparent;}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand);}
  .variant-row{display:grid;grid-template-columns:1fr 90px 90px 70px 110px;gap:8px;align-items:center;margin-bottom:8px;}
  .variant-row input,.variant-row select{margin-bottom:0;padding:8px;font-size:.85rem;}
  .variant-row .vlabel{font-size:.85rem;font-weight:600;}
  @media (max-width:640px){ .variant-row{grid-template-columns:1fr 1fr;} }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  @media (max-width:520px){ .grid2{grid-template-columns:1fr;} }
  /* ── Assistant (admin AI) ─────────────────────────────── */
  .asst-wrap{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:420px;}
  .asst-log{flex:1;overflow-y:auto;padding:4px 2px 12px;display:flex;flex-direction:column;gap:12px;}
  .asst-msg{max-width:86%;padding:11px 14px;border-radius:14px;font-size:.92rem;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;}
  .asst-msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px;}
  .asst-msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .asst-msg.tool{align-self:flex-start;background:var(--warn-tint);color:var(--warn);border:1px solid #e9d9b0;font-size:.82rem;font-family:ui-monospace,monospace;max-width:92%;}
  .asst-msg.err{align-self:flex-start;background:#fbe4e2;color:var(--bad);border:1px solid #f2c4c0;}
  .asst-msg b{font-weight:700;}
  .asst-empty{color:var(--ink-2);font-size:.9rem;text-align:center;margin:auto;max-width:420px;line-height:1.6;}
  .asst-bar{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:10px;}
  .asst-bar textarea{flex:1;margin:0;resize:none;max-height:140px;min-height:44px;}
  .asst-send{white-space:nowrap;}
  .asst-typing{align-self:flex-start;color:var(--ink-2);font-size:.85rem;font-style:italic;padding:4px 6px;}
  .asst-head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .asst-model{font-size:.82rem;padding:6px 8px;width:auto;margin:0;}
  .inline-select{width:auto;max-width:100%;margin:0;padding:8px 10px;font-size:.85rem;}
  .chip-btn{background:var(--bg);border:1px solid var(--line);color:var(--ink-2);font-size:.8rem;padding:6px 10px;border-radius:8px;}
  /* ── Dashboard stat tiles ─────────────────────────────── */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .stat .n{font-size:1.8rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .stat .l{font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin-top:7px;font-weight:600;}
  .stat.good .n{color:var(--fresh);} .stat.bad .n{color:var(--bad);} .stat.warn .n{color:var(--warn);} .stat.brand .n{color:var(--brand);}
  .period-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .period-btn{background:var(--bg);border:1px solid var(--line);color:var(--ink-2);font-size:.85rem;padding:8px 14px;border-radius:20px;font-weight:600;}
  .period-btn.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  /* ── Emergency-control switches ───────────────────────── */
  .ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2);}
  .ctrl-row:last-child{border-bottom:none;}
  .ctrl-info{flex:1;} .ctrl-info .t{font-weight:600;font-size:.95rem;} .ctrl-info .d{font-size:.82rem;color:var(--ink-2);margin-top:2px;line-height:1.45;}
  .switch{position:relative;width:52px;height:30px;flex-shrink:0;cursor:pointer;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch .track{position:absolute;inset:0;background:var(--line);border-radius:30px;transition:background .15s;}
  .switch .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch input:checked + .track{background:var(--bad);}
  .switch input:checked + .track + .knob{transform:translateX(22px);}
  .switch.ok input:checked + .track{background:var(--fresh);}
  .ctrl-banner{background:#fbe4e2;color:var(--bad);border:1px solid #f2c4c0;border-radius:10px;padding:11px 14px;font-size:.85rem;font-weight:600;margin-bottom:14px;display:none;}
  .ctrl-banner.on{display:block;}
  /* ── Bills / bulk printing ────────────────────────────── */
  .bills-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .bill-hint{font-size:.8rem;color:var(--ink-2);line-height:1.55;margin-top:10px;}
  .tick{width:16px;height:16px;margin:0;padding:0;vertical-align:middle;cursor:pointer;}
  .printed-tag{font-size:.75rem;font-weight:700;color:var(--fresh);}
  .unprinted-tag{font-size:.75rem;font-weight:700;color:var(--warn);}
  .bill-toast{background:var(--brand-tint);color:var(--brand-2);border:1px solid #c6d8ea;border-radius:8px;padding:9px 12px;font-size:.85rem;font-weight:600;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .bill-toast button{background:transparent;color:var(--brand-2);font-size:.82rem;padding:4px 8px;text-decoration:underline;}
  /* ── The bill sheet ───────────────────────────────────── */
  /* Deliberately plain black-on-white with no background fills: a cheap 80mm
     thermal roll printer and an office laser render this identically, which
     is the whole point of one button serving both. */
  #print-root{display:none;}
  .bill{font-size:8.5pt;line-height:1.35;color:#000;background:#fff;border:1.2px solid #000;}
  .bill *{box-sizing:border-box;}
  .bill table{width:100%;border-collapse:collapse;}
  .bill table tr:hover{background:none;cursor:default;}
  .bill-title{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1.2px solid #000;padding:5px 9px;}
  .bill-title-t{font-size:12pt;font-weight:800;letter-spacing:.16em;text-transform:uppercase;}
  .bill-stamp{border:1.1px solid #000;padding:2px 7px;font-size:6.4pt;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;}
  /* 1. Seller header */
  .bill-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1.2px solid #000;padding:8px 9px;}
  .bill-seller{flex:1;min-width:0;}
  .bill-biz{font-size:13pt;font-weight:800;letter-spacing:-.01em;line-height:1.15;margin-bottom:2px;}
  .bill-sub{font-size:7.6pt;color:#222;line-height:1.45;}
  .bill-sub b{font-weight:700;}
  .bill-soft{color:#666;font-size:7pt;font-weight:400;}
  .bill-regs{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:4px;padding-top:4px;border-top:1px dotted #999;font-size:7.6pt;}
  /* QR: reserved, never faked */
  .bill-qr{width:74px;height:74px;flex-shrink:0;border:1px solid #000;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .bill-qr img{width:100%;height:100%;object-fit:contain;}
  .bill-qr.empty{border-style:dashed;border-color:#888;}
  .bill-qr.empty span{font-size:5.6pt;line-height:1.35;color:#777;text-align:center;padding:3px;}
  /* 2/3/4/8/9 boxes */
  .bill-cols2{display:flex;border-bottom:1.2px solid #000;}
  .bill-cols2 > .bill-box{flex:1;min-width:0;border:none;}
  .bill-cols2 > .bill-box + .bill-box{border-left:1.2px solid #000;}
  .bill-box{padding:6px 9px;border-bottom:1.2px solid #000;}
  .bill-sec{font-size:6.4pt;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#555;margin-bottom:3px;}
  table.bill-kv td{width:1%;white-space:nowrap;padding:1px 10px 1px 0;color:#555;font-size:7.6pt;border:none;text-align:left;}
  table.bill-kv th{padding:1px 0;text-align:left;font-weight:700;font-size:8pt;color:#000;border:none;text-transform:none;letter-spacing:0;}
  table.bill-kv.wide th{white-space:normal;}
  table.bill-kv th.bill-brk{word-break:break-all;font-weight:600;font-size:7pt;}
  table.bill-kv tr.bill-kv-sum td,table.bill-kv tr.bill-kv-sum th{border-top:1px solid #000;padding-top:3px;font-weight:800;color:#000;}
  /* 5. Product table */
  table.bill-items th{font-size:6.4pt;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.1px solid #000;padding:4px 5px;color:#000;font-weight:800;white-space:nowrap;}
  table.bill-items td{font-size:8.2pt;padding:3.5px 5px;border-bottom:1px dotted #b0b0b0;vertical-align:top;}
  table.bill-items tbody tr:last-child td{border-bottom:1.2px solid #000;}
  .col-sr{width:26px;text-align:center;color:#555;}
  .col-hsn{width:56px;text-align:center;}
  .col-unit{width:64px;}
  .bill-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  /* 6. Totals strip */
  table.bill-strip th{font-size:6.4pt;text-transform:uppercase;letter-spacing:.04em;padding:3px 5px;font-weight:800;text-align:right;white-space:nowrap;border-bottom:1px dotted #999;}
  table.bill-strip td{font-size:8.4pt;padding:4px 5px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1.2px solid #000;}
  table.bill-strip th.grand,table.bill-strip td.grand{border-left:1px solid #000;}
  table.bill-strip td.grand{font-size:11pt;font-weight:800;}
  /* 7. Amount in words */
  .bill-words{padding:5px 9px;border-bottom:1.2px solid #000;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
  .bill-words .bill-sec{margin:0;flex-shrink:0;}
  .bill-words-v{font-size:8.6pt;font-weight:700;}
  /* 8. GST summary */
  table.bill-gst th{font-size:6.4pt;text-transform:uppercase;letter-spacing:.04em;padding:2px 4px;font-weight:800;border-bottom:1px solid #000;white-space:nowrap;text-align:left;}
  table.bill-gst td{font-size:7.8pt;padding:2.5px 4px;border-bottom:1px dotted #ccc;font-variant-numeric:tabular-nums;}
  table.bill-gst tbody tr:last-child td{border-bottom:none;}
  /* 10-12. Legal */
  .bill-legal{font-size:6.8pt;color:#333;line-height:1.5;padding:6px 9px;border-bottom:1.2px solid #000;}
  .bill-legal > div + div{margin-top:2.5px;}
  .bill-legal b{color:#000;font-weight:800;}
  .bill-warn{font-weight:800;color:#000;border:1px solid #000;padding:2px 6px;display:inline-block;margin-top:4px;}
  /* 13/14. QR + authorisation */
  .bill-foot-grid{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:7px 9px;}
  .bill-sign{text-align:right;flex-shrink:0;}
  .bill-stampbox{border:1px dashed #888;width:150px;height:52px;margin:4px 0 3px auto;color:#999;font-size:6.4pt;display:flex;align-items:center;justify-content:center;letter-spacing:.1em;text-transform:uppercase;}
  /* Thermal rolls: no room for a nine-column table or any two-up block, so
     the sheet goes linear and the analytical columns drop away. */
  .fmt-80 .bill,.fmt-58 .bill{font-size:8.6pt;border:none;}
  .fmt-80 .bill-title,.fmt-58 .bill-title{display:block;text-align:center;padding:4px 0;}
  .fmt-80 .bill-title-t,.fmt-58 .bill-title-t{font-size:10.5pt;display:block;}
  .fmt-80 .bill-stamp,.fmt-58 .bill-stamp{border:none;font-size:6pt;margin-top:2px;display:inline-block;}
  .fmt-80 .bill-head,.fmt-58 .bill-head{display:block;text-align:center;padding:5px 0;}
  .fmt-80 .bill-biz,.fmt-58 .bill-biz{font-size:11pt;}
  .fmt-80 .bill-regs,.fmt-58 .bill-regs{display:block;text-align:center;}
  .fmt-80 .bill-qr,.fmt-58 .bill-qr{margin:5px auto 0;}
  .fmt-80 .bill-cols2,.fmt-58 .bill-cols2{display:block;}
  .fmt-80 .bill-cols2 > .bill-box + .bill-box,.fmt-58 .bill-cols2 > .bill-box + .bill-box{border-left:none;border-top:1px dotted #999;}
  .fmt-80 .bill-box,.fmt-58 .bill-box{padding:5px 0;}
  .fmt-80 .bill-words,.fmt-58 .bill-words{display:block;padding:5px 0;}
  .fmt-80 .bill-legal,.fmt-58 .bill-legal{padding:5px 0;}
  .fmt-80 .bill-foot-grid,.fmt-58 .bill-foot-grid{display:block;padding:6px 0;}
  .fmt-80 .bill-sign,.fmt-58 .bill-sign{text-align:left;margin-top:8px;}
  .fmt-80 .bill-stampbox,.fmt-58 .bill-stampbox{margin-left:0;width:110px;height:40px;}
  .fmt-80 .col-hsn,.fmt-80 .col-tax,.fmt-80 .col-sr,.fmt-80 .col-unit,
  .fmt-58 .col-hsn,.fmt-58 .col-tax,.fmt-58 .col-sr,.fmt-58 .col-unit,
  .fmt-58 .col-rate{display:none;}
  /* 58mm is too narrow for the 6-column GST summary — drop the per-component
     columns (they are already on the strip above) and keep rate/value. */
  .fmt-58 table.bill-gst th:nth-child(3),.fmt-58 table.bill-gst td:nth-child(3),
  .fmt-58 table.bill-gst th:nth-child(4),.fmt-58 table.bill-gst td:nth-child(4),
  .fmt-58 table.bill-gst th:nth-child(5),.fmt-58 table.bill-gst td:nth-child(5){display:none;}
  /* The 7-column strip cannot fit a roll: stack it as label/value rows. */
  .fmt-80 table.bill-strip,.fmt-58 table.bill-strip{display:block;}
  .fmt-80 table.bill-strip thead,.fmt-58 table.bill-strip thead{display:none;}
  .fmt-80 table.bill-strip tbody,.fmt-80 table.bill-strip tr,
  .fmt-58 table.bill-strip tbody,.fmt-58 table.bill-strip tr{display:block;}
  .fmt-80 table.bill-strip td,.fmt-58 table.bill-strip td{display:flex;justify-content:space-between;border-bottom:1px dotted #ccc;padding:2px 0;}
  .fmt-80 table.bill-strip td::before,.fmt-58 table.bill-strip td::before{content:attr(data-l);font-weight:600;color:#555;}
  .fmt-80 table.bill-strip td.grand,.fmt-58 table.bill-strip td.grand{border-left:none;border-top:1px solid #000;font-size:10.5pt;}
  /* ── Phone layout ─────────────────────────────────────
     The panel is used standing at a counter as often as at a desk, so this is
     a real layout rather than a shrink: the 9-tab bar scrolls instead of
     wrapping into three cramped lines, and the data tables — 6 and 7 columns
     wide — restack into one card per row. A 7-column table at 380px is not
     readable no matter how small the type gets. */
  @media (max-width:640px){
    .wrap{padding:14px 10px 48px;}
    .center-wrap{margin:36px auto;}
    header{margin-bottom:12px;}
    .brand{gap:10px;}
    .brand-logo{width:38px;height:38px;}
    h1{font-size:1.12rem;}
    .card{padding:13px;border-radius:10px;}
    .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-bottom:13px;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex:0 0 auto;white-space:nowrap;margin-right:15px;font-size:.92rem;}
    /* Chip rows scroll rather than stacking four lines deep. */
    .period-row,#filter-chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
    .period-row::-webkit-scrollbar,#filter-chips::-webkit-scrollbar{display:none;}
    .period-row .period-btn,#filter-chips button{flex:0 0 auto;white-space:nowrap;}
    /* One card per row. */
    table.stacked,table.stacked tbody,table.stacked tr,table.stacked td{display:block;width:auto;}
    table.stacked thead{display:none;}
    table.stacked tr{border-bottom:8px solid var(--bg);padding:11px 13px;}
    table.stacked tr:last-child{border-bottom:none;}
    table.stacked tr:hover{background:transparent;}
    table.stacked td{border:none;padding:4px 0;display:block;text-align:left;font-size:.94rem;}

async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(str)));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function loadBlocks(){

async function writeBlocks(phones, entries){
  const hashes = await Promise.all(phones.map(sha256Hex));
  await setDoc(doc(db,'order_blocks','list'), { blockedPhones:phones, entries });
  await setDoc(doc(db,'order_blocks_public','hashes'), { hashes });

async function blockCustomer(phone, gstin, name, reason, kind = 'hold'){

  try{ await writeBlocks(phones, entries); logAdmin(kind==='stop'?'customer_supply_stopped':'customer_order_blocked', phone+(reason?(' — '+reason):'')); render(); return true; }
  catch(e){ alert('Could not block: '+e.message); return false; }
}
async function unblockCustomer(phone){

/* ── Password recovery ──────────────────────────────────────
   Runs entirely through the backend: the server holds the recovery numbers
   (this page only ever sees their last four digits), sends and checks the
   SMS code, and hands the new password to Firebase Auth. Nothing here stores
   the password or a phone number. */
async function recoveryApi(path, body){
  let base = (cfg.backendUrl || '').trim();
  // Signed out, cfg hasn't loaded yet — app_config is public-read.
  if(!base){
    try{ const s = await getDoc(doc(db, 'app_config', 'singleton')); base = String((s.exists() && s.data().backendUrl) || '').trim(); }
    catch(e){ /* treated as not configured below */ }
  }
  base = base.replace(/\/+$/, '');
  if(!base) throw new Error('Password reset needs the Modern Dairy server, which is not live yet.');
  let res;
  try{
    res = await fetch(base + '/admin-recovery' + path, body
      ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      : {});
  }catch(e){ throw new Error('Could not reach the Modern Dairy server. Check the connection and try again.'); }
  let data = {};
  try{ data = await res.json(); }catch(e){ /* non-JSON error body */ }
  if(!res.ok || !data.success) throw new Error(data.message || `Server error (HTTP ${res.status})`);
  return data.data;
}
function renderRecovery(box, { title, onCancel }){
  const head = `<b style="font-size:1.05rem;">${esc(title)}</b>`;
  const back = label => `<button class="btn-quiet btn-sm" id="rc-cancel" style="width:100%;margin-top:10px;">${label}</button>`;

      </div>
      <div id="rc-msg" style="margin-top:8px;"></div>
      ${back('Cancel')}`;
    const msg = (text, good) => { document.getElementById('rc-msg').innerHTML = text ? `<div class="${good?'ok-msg':'err'}" style="display:block;">${esc(text)}</div>` : ''; };
    // The code is tied to the number it went to, so remember which one was
    // actually sent rather than whatever radio is ticked at submit time.
    let sentWhich = null;
    const send = document.getElementById('rc-send');
    send.onclick = async () => {
      const which = Number(box.querySelector('input[name="rc-which"]:checked')?.value);
      send.disabled = true; msg('');
      try{
        await recoveryApi('/send-otp', { which });
        sentWhich = which;
        msg(`Code sent to ${opts.find(o => Number(o.id) === which)?.label || 'the recovery number'}. It is valid for 10 minutes.`, true);
        send.textContent = 'Send a new code';
        document.getElementById('rc-step2').style.display = 'block';
        document.getElementById('rc-otp').focus();
      }catch(e){ msg(e.message); }
      finally{ send.disabled = false; }
    };
    const reset = document.getElementById('rc-reset');
    reset.onclick = async () => {
      const otp = document.getElementById('rc-otp').value.trim();
      const p1 = document.getElementById('rc-pass'), p2 = document.getElementById('rc-pass2');
      if(!/^\d{4,8}$/.test(otp)){ msg('Enter the code from the SMS.'); return; }
      if(p1.value !== p2.value){ msg('The two passwords do not match.'); return; }
      reset.disabled = true; msg('');
      try{
        await recoveryApi('/reset', { which: sentWhich, otp, newPassword: p1.value });
        p1.value = ''; p2.value = '';
        loginNote = 'Password changed. Sign in with the new password.';
        // The server has already ended every session; signing out makes this tab agree.
        if(auth.currentUser){ closeModal(); await signOut(auth); } else renderLogin();
      }catch(e){ msg(e.message); reset.disabled = false; }
    };
    document.getElementById('rc-cancel').onclick = onCancel;
  }).catch(e => {
    box.innerHTML = `${head}<div class="err" style="margin-top:8px;">${esc(e.message)}</div>${back('Back')}`;
    document.getElementById('rc-cancel').onclick = onCancel;
  });
}

/* ═══════════════════════════════════════════════════════════
   ACCOUNT CENTER
   Customer accounts still live on each phone; the app copies every profile
   (never the password) to customer_accounts/{installUid}_{phone}. One person
   can have several docs (reinstalled app, second phone), so the list groups
   by phone and shows the most recently seen copy.
   Office edits go into each doc's `admin` map — customers can't write it —
   and the app applies them back to the phone on its next launch.
   Hold/stop supply reuses the credit-hold list, which the order rules enforce.
   ═══════════════════════════════════════════════════════════ */
let accounts = [];
let unsubAccounts = null;
let acctFilter = 'all';
let acctSearch = '';
const ACCT_FILTERS = [
  { id:'all', label:'All' }, { id:'b2b', label:'Business (B2B)' },
  { id:'b2c', label:'Personal (B2C)' }, { id:'hold', label:'Supply held or stopped' },
];
function tsMs(ts){ return ts?.toMillis ? ts.toMillis() : (ts ? (new Date(ts).getTime() || 0) : 0); }
function startAccountsListener(){
  unsubAccounts = onSnapshot(query(collection(db, 'customer_accounts'), limit(2000)), snap => {
    accounts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(tab==='accounts'){ refreshAcctChips(); refreshAcctList(); }
  }, err => console.error(err));
}
function accountPeople(){
  const byPhone = new Map();
  for(const a of accounts){
    if(!a.phone) continue;
    const seen = tsMs(a.updatedAt);
    const cur = byPhone.get(a.phone);
    if(!cur) byPhone.set(a.phone, { ...a, docIds:[a.id], seen });
    else{
      cur.docIds.push(a.id);
      if(seen > cur.seen) Object.assign(cur, { ...a, docIds:cur.docIds, seen });
    }
  }
  return [...byPhone.values()];
}
// The office's edits win over whatever the phone last sent.
function effective(p){
  const e = p.admin || {};
  return { ...p, name: e.name || p.name, company: e.company || p.company, address: e.address || p.address };
}
function holdEntry(phone){ return (blockList.entries||[]).find(e => e.phone === phone) || null; }
function supplyPill(phone){
  const h = holdEntry(phone);
  return h ? `<span class="pill cancelled">${h.kind==='stop'?'Supply stopped':'Supply on hold'}</span>` : '<span class="pill delivered">Supplying</span>';
}
function acctMatches(p, f){ return f==='all' || (f==='hold' ? !!holdEntry(p.phone) : p.type===f); }
function ordersFor(phone){ return orders.filter(o => o.phone === phone); }
function acctChipsHtml(){
  const people = accountPeople();

}
function filteredPeople(){
  const q = acctSearch.trim().toLowerCase();
  return accountPeople()
    .filter(p => acctMatches(p, acctFilter))
    .filter(p => { if(!q) return true; const v = effective(p); return [v.name, v.company, p.phone, p.gstin].some(x => String(x||'').toLowerCase().includes(q)); })
    .sort((a, b) => b.seen - a.seen);
}
function acctListHtml(){

              <td data-l="Phone">+91 ${esc(p.phone)}</td>
              <td data-l="GSTIN">${esc(p.gstin||'—')}</td>
              <td data-l="Recent orders">${os.length} · ${money(os.reduce((s,o)=>s+(Number(o.total)||0),0))}</td>
              <td data-l="Supply">${supplyPill(p.phone)}</td>
              <td data-l="Last seen" class="muted">${fmtDate(p.updatedAt)}</td>
            </tr>`; }).join('')}
        </tbody>
      </table>`}
    </div>`;
}

function refreshAcctChips(){ const el = document.getElementById('acct-chips'); if(el){ el.innerHTML = acctChipsHtml(); wireAcctChips(); } }
function refreshAcctList(){ const el = document.getElementById('acct-list'); if(el){ el.innerHTML = acctListHtml(); wireAcctRows(); } }

function wireAcctRows(){ document.querySelectorAll('tr[data-acct]').forEach(tr => tr.onclick = () => openAccount(tr.dataset.acct)); }

function openAccount(phone){
  const p = accountPeople().find(x => x.phone === phone);

  document.getElementById('modal-content').innerHTML = `

async function saveAccountEdits(p){
  const val = id => (document.getElementById(id)?.value || '').trim();
  const edits = { name: val('acct-name').slice(0, 120), address: val('acct-address').slice(0, 500), editedAt: Date.now() };
  if(p.type==='b2b') edits.company = val('acct-company').slice(0, 200);
  try{
    // Every copy of this person (one per install) gets the same edits.
    await Promise.all(p.docIds.map(id => updateDoc(doc(db, 'customer_accounts', id), { admin: edits })));
    logAdmin('account_edited', p.phone);
    closeModal();
  }catch(e){ alert('Could not save: ' + e.message); }
}

/* ═══════════════════════════════════════════════════════════
   DRIVER REQUESTS
   Business customers press "Request a driver" in the app — to collect a
   payment (cash or cheque), for an urgent delivery, or for other help. The
   office assigns a driver here and the customer's app shows the driver's
   name and number live.
   ═══════════════════════════════════════════════════════════ */
let driverRequests = [];
let unsubDriverReqs = null;
let rfdFilter = 'active';
const RFD_REASONS = { collect_payment:'Collect payment', urgent_delivery:'Urgent delivery', other:'Other help' };
const RFD_STATUS = { open:'New', assigned:'Driver assigned', done:'Done', cancelled:'Cancelled' };
const RFD_PILL = { open:'pending_confirmation', assigned:'placed', done:'delivered', cancelled:'cancelled' };
const RFD_FILTERS = [{ id:'active', label:'Active' }, { id:'closed', label:'Done or cancelled' }, { id:'all', label:'All' }];
function rfdMatches(r, f){ return f==='all' || (f==='active' ? ['open','assigned'].includes(r.status) : ['done','cancelled'].includes(r.status)); }
function rfdTabLabel(){ const n = driverRequests.filter(r => r.status==='open').length; return 'Driver requests' + (n ? ` (${n})` : ''); }
function startDriverRequestsListener(){
  unsubDriverReqs = onSnapshot(query(collection(db, 'driver_requests'), orderBy('createdAt', 'desc'), limit(300)), snap => {
    driverRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const t = document.querySelector('.tab[data-tab="drivers"]');
    if(t) t.textContent = rfdTabLabel();
    // Don't rebuild the tab under an open request — that would close it.
    if(tab==='drivers' && !document.getElementById('modal-bg')?.classList.contains('on')) render();
  }, err => console.error(err));
}
function driversBody(){
  const list = driverRequests.filter(r => rfdMatches(r, rfdFilter));

async function setStatus(id, status){

    await updateDoc(doc(db, 'orders', id), { status, statusUpdatedAt: serverTimestamp() });

  }catch(e){ alert('Could not update status: ' + e.message); }

/* The rider's copy of a delivery.
   Riders sign in with nothing, so they must never touch an order document —
   an order carries the customer's full record (GSTIN, items, totals, the lot).
   Marking an order OUT FOR DELIVERY publishes deliveries/{code} holding only
   what someone on a doorstep needs. {code} is a fresh random delivery code,
   not the order number — order numbers run in sequence, so anyone could
   guess the next one. The rules allow get but never list, so only whoever
   holds the code (the rider's link, or the customer through their own order,
   where the code is written) can open that one record.

   Moving the status on sets active:false, which is what makes the rules stop
   accepting the rider's location writes — tracking cannot outlive the trip.
   Returns the new code when one is issued. */
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 32 symbols: no 0/O or 1/I to misread
function newDeliveryCode(){
  return Array.from(crypto.getRandomValues(new Uint8Array(10)), b => CODE_CHARS[b & 31]).join('');
}

/* ── Bills: bulk printing + reprint ───────────────────────
   Printing from a web page always goes through the browser's own print
   dialog, and that dialog is already pointed at whichever printer THIS
   computer is set up with — so "print" here means "print on the printer
   attached to this PC", A4 laser or 80mm thermal roll alike. What this tab
   adds is that ONE click builds every matching bill into a single document,
   one bill per page, so it's one dialog and one job instead of forty.
   (For a genuinely dialog-free click, launch Chrome once with
   --kiosk-printing; it then prints straight to the default printer.) */
let billSearch = '';
let billScope = 'today';
let billUnprintedOnly = false;
let billSelected = new Set();
let billFormat = (() => { try{ return localStorage.getItem('mda_bill_format') || 'a4'; }catch(e){ return 'a4'; } })();
let billCopy = (() => { try{ return localStorage.getItem('mda_bill_copy') || 'original'; }catch(e){ return 'original'; } })();

const BILL_SCOPES = [
  { id: 'today', label: 'Today' },
  { id: '7d',    label: 'Last 7 days' },
  { id: 'month', label: 'This month' },
  { id: 'all',   label: 'All loaded' },
];
const BILL_FORMATS = [
  { id: 'a4',   label: 'A4 sheet' },
  { id: 'a5',   label: 'A5 sheet' },
  { id: '80mm', label: '80mm thermal roll' },
  { id: '58mm', label: '58mm thermal roll' },
];
const PAGE_CSS = {
  a4:     '@page{size:A4;margin:12mm;}',
  a5:     '@page{size:A5;margin:8mm;}',
  '80mm': '@page{size:80mm auto;margin:3mm;}',
  '58mm': '@page{size:58mm auto;margin:2mm;}',
};
// A cancelled or denied order was never fulfilled, so it has no bill.
const NO_BILL_STATUSES = ['cancelled', 'denied'];

function orderMillis(o){
  const d = o.placedAt?.toDate ? o.placedAt.toDate() : (o.placedAt ? new Date(o.placedAt) : null);
  return d ? d.getTime() : 0;
}
function billScopeStart(){
  const n = new Date();
  if(billScope === 'today') return new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
  if(billScope === '7d')    return new Date(n.getFullYear(), n.getMonth(), n.getDate() - 6).getTime();
  if(billScope === 'month') return new Date(n.getFullYear(), n.getMonth(), 1).getTime();
  return 0;
}
function filteredBills(){
  const from = billScopeStart();
  const q = billSearch.trim().toLowerCase();
  return orders.filter(o => {
    if(NO_BILL_STATUSES.includes(o.status || 'placed')) return false;
    if(billUnprintedOnly && (o.billPrintCount || 0) > 0) return false;
    // A search deliberately IGNORES the date filter: "find bill MD-1042" has
    // to work whatever the tab is currently showing, otherwise reprinting an
    // old bill means hunting for the right date range first.
    if(!q) return orderMillis(o) >= from;
    return [o.orderNo, o.id, o.name, o.company, o.phone].some(v => String(v || '').toLowerCase().includes(q));
  });
}

/* ── The bill format ──────────────────────────────────────
   A GST tax invoice laid out to the agreed 14-section structure: seller
   header with registrations, e-invoice block, transaction block, party
   details, the SNo→Total product table, the taxable/CGST/SGST/IGST/cess
   strip, amount in words, GST-rate summary, customer account summary,
   declarations, GSTIN-verification note, jurisdiction, IRN QR area and the
   signatory block.

   Everything a bill legally has to carry comes out of Settings, so handing
   over the real registration numbers later is a form fill, not a code change.

   PLACEHOLDERS: every registration field falls back to an obviously-fake
   specimen value until Settings holds a real one. They're shaped like the
   real thing (a GSTIN really is 15 chars, state code first) so the layout
   you see now is the layout you'll get — but while ANY of them is still a
   specimen, the bill prints a "not valid for tax purposes" line and both the
   Bills and Settings tabs warn. All of it clears itself once the real values
   are saved. */
const BILL_PLACEHOLDERS = {
  gstin:       '27ABCDE1234F1Z5',
  pan:         'ABCDE1234F',
  fssai:       '12345678901234',
  msme:        'UDYAM-MH-00-0000000',
  hsn:         '0401',
  bankName:    'Specimen Bank — Camp Branch, Pune',
  bankAccount: '0000 1111 2222 33',
  bankIfsc:    'ABCD0001234',
  upi:         'moderndairy@specimenbank',
  jurisdiction:'Pune',
  declaration1:'We declare that this invoice shows the actual price of the goods described and that all particulars are true and correct.',
  declaration2:'Goods are supplied in sound and merchantable condition. Being perishable dairy produce, please check quantity, temperature and condition at the time of delivery — claims will not be entertained thereafter.',
  gstinNote:   'Customers are requested to verify the GST number printed on this invoice. We shall not be liable for any consequence arising from an incorrect or unverified GST number, including denial or reversal of input tax credit.',
  terms:       'Goods once sold will not be taken back. Payment due within 15 days of invoice date. Interest @18% p.a. is chargeable on overdue amounts.',
};
// A bill field: whatever Settings holds, else the specimen value.
function bf(key){ const v = (cfg[key] ?? '').toString().trim(); return v || BILL_PLACEHOLDERS[key] || ''; }
// True while any legally-significant registration is still a specimen.
function billUsesPlaceholders(){
  return ['gstin', 'pan', 'fssai', 'msme', 'bankAccount', 'bankIfsc'].some(k => !((cfg[k] ?? '').toString().trim()));
}

const GST_STATES = {
  '01':'Jammu & Kashmir','02':'Himachal Pradesh','03':'Punjab','04':'Chandigarh','05':'Uttarakhand',
  '06':'Haryana','07':'Delhi','08':'Rajasthan','09':'Uttar Pradesh','10':'Bihar','11':'Sikkim',
  '12':'Arunachal Pradesh','13':'Nagaland','14':'Manipur','15':'Mizoram','16':'Tripura','17':'Meghalaya',
  '18':'Assam','19':'West Bengal','20':'Jharkhand','21':'Odisha','22':'Chhattisgarh','23':'Madhya Pradesh',
  '24':'Gujarat','26':'Dadra & Nagar Haveli and Daman & Diu','27':'Maharashtra','29':'Karnataka','30':'Goa',
  '31':'Lakshadweep','32':'Kerala','33':'Tamil Nadu','34':'Puducherry','35':'Andaman & Nicobar Islands',
  '36':'Telangana','37':'Andhra Pradesh','38':'Ladakh','97':'Other Territory',
};
function stateOf(gstin){
  const code = String(gstin || '').slice(0, 2);
  return GST_STATES[code] ? { code, name: GST_STATES[code] } : null;
}
function stateLine(st){ return st ? `${st.code} — ${st.name}` : '—'; }

/* Rupees in words, Indian numbering (lakh/crore) — a tax invoice must carry
   the amount in words, and no browser API does Indian grouping in words. */
function amountInWords(amount){
  const abs = Math.abs(Number(amount) || 0);
  const whole = Math.floor(abs);
  const paise = Math.round((abs - whole) * 100);
  const ONES = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve',
                'Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const TENS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const under100 = v => v < 20 ? ONES[v] : TENS[Math.floor(v / 10)] + (v % 10 ? ' ' + ONES[v % 10] : '');
  const under1000 = v => v >= 100
    ? ONES[Math.floor(v / 100)] + ' Hundred' + (v % 100 ? ' ' + under100(v % 100) : '')
    : under100(v);
  function indian(v){
    if(v === 0) return 'Zero';
    const out = [];
    const crore = Math.floor(v / 10000000); v %= 10000000;
    const lakh  = Math.floor(v / 100000);   v %= 100000;
    const thou  = Math.floor(v / 1000);     v %= 1000;
    if(crore) out.push(under1000(crore) + ' Crore');
    if(lakh)  out.push(under1000(lakh) + ' Lakh');
    if(thou)  out.push(under1000(thou) + ' Thousand');
    if(v)     out.push(under1000(v));
    return out.join(' ');
  }
  return 'Rupees ' + indian(whole) + (paise ? ' and ' + under100(paise) + ' Paise' : '') + ' Only';
}

/* Which copy of the bill this is. Indian practice prints up to three, each
   labelled for a different holder; the operator picks in the Bills tab. */
const BILL_COPIES = [
  { id:'original',  label:'Original for Recipient' },
  { id:'duplicate', label:'Duplicate for Transporter' },
  { id:'triplicate',label:'Triplicate for Supplier' },
];

/* SAC codes for the non-goods charges. Freight and the platform fee are
   charged without GST in this app, so they ride as 0% lines — which is also
   how a real invoice presents them, and it keeps the taxable column and the
   invoice total footing to the paisa. */
const SAC_DELIVERY = '9968';
const SAC_PLATFORM = '9997';

/* One row per printed line. Per-item `gstRate`/`hsn`/`unit` are honoured when
   an order carries them, so a future multi-rate catalogue needs no change
   here; today every line shares cfg.gstRate and the GST summary is one row.

   RECONCILIATION: `o.subtotal` and `o.gst` are what the customer was actually
   charged and the invoice must agree with them exactly. If per-line arithmetic
   drifts by a paisa (rounding, or an older order whose subtotal was computed
   differently), the difference is absorbed by the largest line rather than
   left to make the invoice disagree with the payment. */
function billLines(o){
  const defaultRate = (Number(cfg.gstRate) || 0.05) * 100;
  const lines = (o.items || []).map(i => {
    const qty = Number(i.qty) || 0;
    const rate = Number(i.price) || 0;
    const taxable = rate * qty;
    const taxRate = i.gstRate != null ? Number(i.gstRate) * 100 : defaultRate;
    return { name: i.name || '', hsn: i.hsn || bf('hsn'), qty, unit: i.unit || i.label || 'Nos',
             rate, taxable, taxRate, tax: taxable * taxRate / 100 };
  });

  const absorb = (key, target) => {
    if(!lines.length || !Number.isFinite(target)) return;
    const sum = lines.reduce((s, l) => s + l[key], 0);
    const diff = target - sum;
    if(Math.abs(diff) > 0.005){
      lines.reduce((a, b) => (b[key] > a[key] ? b : a), lines[0])[key] += diff;
    }
  };
  absorb('taxable', Number(o.subtotal));
  absorb('tax', Number(o.gst));

  // Charges come after reconciliation so they're never used to absorb drift.
  if(Number(o.delivery)) lines.push({ name:'Delivery charges', hsn:SAC_DELIVERY, qty:1, unit:'Nos',
    rate:Number(o.delivery), taxable:Number(o.delivery), taxRate:0, tax:0 });
  if(Number(o.platform)) lines.push({ name:'Platform fee', hsn:SAC_PLATFORM, qty:1, unit:'Nos',
    rate:Number(o.platform), taxable:Number(o.platform), taxRate:0, tax:0 });

  lines.forEach(l => { l.total = l.taxable + l.tax; });
  return lines;
}

/* Tax treatment for one order. Same state on both GSTINs (or no buyer GSTIN
   at all — a walk-in B2C sale is always local) means CGST+SGST; a different
   state means IGST. The total tax is only ever SPLIT, never recomputed. */
function billTax(o){
  const seller = stateOf(bf('gstin'));
  const buyer = o.gstin ? stateOf(o.gstin) : null;
  const interState = !!(seller && buyer && seller.code !== buyer.code);
  const lines = billLines(o);
  const taxable = lines.reduce((s, l) => s + l.taxable, 0);
  const tax = lines.reduce((s, l) => s + l.tax, 0);

  const byRate = new Map();
  lines.forEach(l => {
    const g = byRate.get(l.taxRate) || { rate: l.taxRate, taxable: 0, tax: 0 };
    g.taxable += l.taxable; g.tax += l.tax;
    byRate.set(l.taxRate, g);
  });
  const groups = [...byRate.values()].sort((a, b) => a.rate - b.rate).map(g => ({
    rate: g.rate, taxable: g.taxable, tax: g.tax,
    cgst: interState ? 0 : g.tax / 2,
    sgst: interState ? 0 : g.tax / 2,
    igst: interState ? g.tax : 0,
    gross: g.taxable + g.tax,
  }));

  return {
    seller, buyer, interState, lines, groups, taxable, tax,
    cess: Number(o.cess) || 0,
    stateCess: Number(o.stateCess) || 0,
    cgst: interState ? 0 : tax / 2,
    sgst: interState ? 0 : tax / 2,
    igst: interState ? tax : 0,
    place: stateLine(buyer || seller),
  };
}

/* Customer account summary. Outstanding is a point-in-time figure, so the
   only trustworthy source is a number stamped on the order when it was
   raised — `prevOutstanding`. Nothing writes it yet (the ledger lands with
   the backend), and it is NOT inferred from the orders on screen: showing a
   guessed balance on a tax invoice is worse than showing none. Until then
   the section prints the current invoice and dashes. */
function billOutstanding(o){
  const raw = o.prevOutstanding;
  const prev = (raw === null || raw === undefined || !Number.isFinite(Number(raw))) ? null : Number(raw);
  const current = Number(o.total) || 0;
  return { prev, current, total: prev === null ? null : prev + current };
}

/* ── GoFrugal ─────────────────────────────────────────────
   GoFrugal is the billing system of record. Print doesn't just put ink on
   paper: it first asks the backend to raise the bill in GoFrugal, which allots
   the legal invoice number and (where applicable) registers the e-invoice.
   Only then do we print — carrying GoFrugal's number, not ours.

   The call goes admin panel → our Cloud Run backend → GoFrugal. It cannot go
   direct: GoFrugal sends no CORS headers for this origin, the hosting CSP's
   connect-src doesn't include them, and the API key would be sitting in the
   browser for anyone with this page open.

   Until Settings has a backend URL and the toggle is on, none of this runs and
   Print behaves exactly as it always has — our own number, no network call. */
function gofrugalOn(){ return !!(cfg.gofrugalEnabled && (cfg.backendUrl || '').trim()); }

async function raiseGoFrugalBill(order){
  const base = (cfg.backendUrl || '').trim().replace(/\/+$/, '');
  if(!base) throw new Error('Backend URL is not set (Settings → Backend URL).');
  const user = auth.currentUser;
  if(!user) throw new Error('Signed out — sign in again.');
  // The backend accepts this Firebase ID token and checks the uid against the
  // one admin uid, so there is no second login to keep track of.
  const token = await user.getIdToken();
  const res = await fetch(base + '/admin/orders/' + encodeURIComponent(order.id) + '/bill', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
  });
  let json = {};
  try{ json = await res.json(); }catch(e){}
  if(!res.ok || !json.success) throw new Error(json.message || ('Backend returned ' + res.status));
  return json.data;
}

/* Make sure every bill about to print has a GoFrugal bill number.
   Sequential on purpose: invoice numbers should come out in the order the
   operator sees them, and firing 40 concurrent requests at a billing system
   is a good way to get rate-limited or to interleave numbering. */
async function ensureGoFrugalBills(list){
  const ok = [], failed = [];
  let raised = 0, done = 0;
  const pending = list.filter(o => !o.gofrugal?.billNo).length;
  for(const o of list){
    if(o.gofrugal?.billNo){ ok.push(o); continue; }
    done++;
    billToast('Raising bill ' + done + ' of ' + pending + ' in GoFrugal — ' + (o.orderNo || o.id) + '…', null);
    try{
      const d = await raiseGoFrugalBill(o);
      // Merge locally so the print that follows has the number immediately,
      // without waiting for the Firestore snapshot to come back round.
      o.gofrugal = { ...(o.gofrugal || {}), ...(d.gofrugal || {}) };
      if(d.created) raised++;
      ok.push(o);
    }catch(e){
      failed.push({ order: o, message: e.message });
    }
  }
  return { ok, failed, raised };
}

/* One dialog, one job, N pages. */
async function printBills(list){
  if(!list.length){ alert('There are no bills to print for this filter.'); return; }

  if(gofrugalOn()){
    const btns = document.querySelectorAll('#bill-actions button, [data-reprint]');
    btns.forEach(b => b.disabled = true);
    let res;
    try{ res = await ensureGoFrugalBills(list); }
    finally{ btns.forEach(b => b.disabled = false); }

    if(res.failed.length){
      const lines = res.failed.slice(0, 8).map(f => '· ' + (f.order.orderNo || f.order.id) + ' — ' + f.message).join('\n');
      alert(res.failed.length + ' of ' + list.length + ' bill(s) could not be raised in GoFrugal and will NOT be printed:\n\n'
        + lines + (res.failed.length > 8 ? '\n· …' : '')
        + '\n\nThe rest will print. Fix these and print them again.');
    }
    if(!res.ok.length){ billToast('Nothing printed — no bill could be raised in GoFrugal.', null); return; }

    // GoFrugal recomputes tax from its own masters. A disagreement with what
    // the customer was actually charged is a catalogue/tax-master problem, and
    // printing over it silently would put a number on paper that nobody paid.
    const mismatched = res.ok.filter(o => o.gofrugal?.totalMismatch);
    if(mismatched.length && !confirm(mismatched.length + ' bill(s) have a total in GoFrugal that differs from what the customer was charged:\n\n'
        + mismatched.slice(0, 8).map(o => '· ' + (o.orderNo || o.id)).join('\n')
        + '\n\nThis usually means a price or tax master is out of step. Print anyway?')) return;

    list = res.ok;
  }

  const root = document.getElementById('print-root');
  const pageStyle = document.getElementById('print-page-style');
  root.className = 'fmt-' + billFormat.replace('mm', '');
  // 'all' lays down the three labelled copies back-to-back per bill, the
  // way a bill book does: recipient, transporter, supplier.
  const copies = billCopy === 'all' ? BILL_COPIES.map(c => c.id) : [billCopy];
  root.innerHTML = list.map(o => copies.map(c => billHtml(o, c)).join('')).join('');
  pageStyle.textContent = PAGE_CSS[billFormat] || PAGE_CSS.a4;
  window.print();
  markPrinted(list);
}

/* Print-marks are what make "print only what's new" work the next morning.
   The browser can't tell us whether the dialog ended in Print or Cancel, so
   the marking is always undoable rather than silently wrong. */
async function markPrinted(list){
  const prev = list.map(o => ({ id: o.id, billPrintCount: o.billPrintCount || 0, billPrintedAt: o.billPrintedAt || null }));
  try{
    for(let i = 0; i < list.length; i += 400){
      const batch = writeBatch(db);
      list.slice(i, i + 400).forEach(o => batch.update(doc(db, 'orders', o.id), { billPrintedAt: serverTimestamp(), billPrintCount: increment(1) }));
      await batch.commit();
    }
    logAdmin('bills_printed', `${list.length} bill(s) @ ${billFormat}/${billCopy}: ${list.slice(0, 20).map(o => o.orderNo || o.id).join(', ')}${list.length > 20 ? ' …' : ''}`);
    billToast(`${list.length} bill${list.length === 1 ? '' : 's'} sent to the printer and marked printed.`, prev);
  }catch(e){
    billToast('Sent to the printer, but the print marks could not be saved: ' + e.message, null);
  }
}
async function undoPrinted(prev){
  try{
    for(let i = 0; i < prev.length; i += 400){
      const batch = writeBatch(db);
      prev.slice(i, i + 400).forEach(p => batch.update(doc(db, 'orders', p.id), { billPrintCount: p.billPrintCount, billPrintedAt: p.billPrintedAt }));
      await batch.commit();
    }
    logAdmin('bills_print_undo', `${prev.length} bill(s)`);
    billToast('Print marks undone — those bills count as not printed again.', null);
  }catch(e){ alert('Could not undo: ' + e.message); }
}
let billUndo = null;
function billToast(msg, prev){
  billUndo = prev;
  const el = document.getElementById('bill-toast');
  if(!el) return;
  el.innerHTML = `<div class="bill-toast"><span>${esc(msg)}</span>${prev ? '<button id="btn-undo-print">Undo</button>' : ''}</div>`;
  const u = document.getElementById('btn-undo-print');
  if(u) u.onclick = () => { el.innerHTML = ''; if(billUndo) undoPrinted(billUndo); };
}

function wireBillsEvents(){
  const s = document.getElementById('bill-search');
  if(s) s.oninput = () => { billSearch = s.value; refreshBills(); };
  const f = document.getElementById('bill-format');
  if(f) f.onchange = () => { billFormat = f.value; try{ localStorage.setItem('mda_bill_format', billFormat); }catch(e){} };
  const c = document.getElementById('bill-copy');
  if(c) c.onchange = () => { billCopy = c.value; try{ localStorage.setItem('mda_bill_copy', billCopy); }catch(e){} };
  const u = document.getElementById('bill-unprinted');
  if(u) u.onchange = () => { billUnprintedOnly = u.checked; refreshBills(); };
  document.querySelectorAll('#bill-scope [data-scope]').forEach(b => b.onclick = () => {
    billScope = b.dataset.scope;
    document.querySelectorAll('#bill-scope [data-scope]').forEach(x => x.classList.toggle('on', x.dataset.scope === billScope));
    refreshBills();
  });
  wireBillActionsEvents();
  wireBillsListEvents();
}
function wireBillActionsEvents(){
  const all = document.getElementById('btn-print-all');
  if(all) all.onclick = () => { printBills(filteredBills()); };
  const fresh = document.getElementById('btn-print-new');
  if(fresh) fresh.onclick = () => { printBills(filteredBills().filter(o => !(o.billPrintCount || 0))); };
  const sel = document.getElementById('btn-print-sel');
  if(sel) sel.onclick = () => { printBills(filteredBills().filter(o => billSelected.has(o.id))); };
}
function wireBillsListEvents(){
  document.querySelectorAll('[data-reprint]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const o = orders.find(x => x.id === b.dataset.reprint);
    if(o) printBills([o]);
  });
  document.querySelectorAll('[data-tick]').forEach(c => c.onclick = (e) => {
    e.stopPropagation();
    if(c.checked) billSelected.add(c.dataset.tick); else billSelected.delete(c.dataset.tick);
    refreshBillActions();
  });
  const all = document.getElementById('bill-all-tick');
  if(all) all.onclick = (e) => {
    e.stopPropagation();
    const list = filteredBills();
    list.forEach(o => all.checked ? billSelected.add(o.id) : billSelected.delete(o.id));
    refreshBills();
  };
  document.querySelectorAll('tr[data-bill]').forEach(tr => tr.onclick = () => openBillPreview(tr.dataset.bill));
}

/* ── Maintenance log ──────────────────────────────────────
   Read-only record of automated/assisted maintenance: bugs fixed,
   security hardening, and improvements — what was wrong, how it was
   fixed, and whether it's live. Written to the `maintenance_log`
   Firestore collection (admin-only); newest first. */
const CAT_LABEL = { security: 'Security', bugfix: 'Bug fix', improvement: 'Improvement' };
function mEntryDate(e){ const d = e.date?.toDate ? e.date.toDate() : (e.date ? new Date(e.date) : null); return d ? d.getTime() : 0; }
// Rotating audit focuses — each nightly run does the NEXT one after the last,
// so successive audits look at the app from a different angle rather than
// repeating the same checks. Must match AUDIT_TYPES in
// backend/scripts/nightly-audit.js.
const AUDIT_TYPES = [
  { id:'security',       label:'Security & auth' },
  { id:'functionality',  label:'Features & flows' },
  { id:'data-integrity', label:'Data & money integrity' },
  { id:'performance',    label:'Performance & size' },
  { id:'ui-ux',          label:'UI / UX & accessibility' },
  { id:'code-quality',   label:'Code quality & robustness' },
  { id:'config-deps',    label:'Config, deps & CI' },
];
function nextAuditType(lastId){
  const i = AUDIT_TYPES.findIndex(t=>t.id===lastId);
  return AUDIT_TYPES[(i+1) % AUDIT_TYPES.length];
}
let auditState = {};   // audit_control/schedule doc
async function loadAuditState(){
  try{ const s = await getDoc(doc(db,'audit_control','schedule')); auditState = s.exists()?s.data():{}; }
  catch(e){ auditState = {}; }
  try{ const d = await getDoc(doc(db,'deploy_control','request')); if(d.exists()){ auditState.deployResult = d.data().lastResult||''; auditState.deployRequested = !!d.data().requested; } }
  catch(e){}
  if(tab==='maintenance') render();
}

function maintenanceControlsHtml(){
  const underMaint = !!cfg.maintenanceMode;

  return `
    <div class="card" style="border-left:4px solid ${underMaint?'var(--bad)':'var(--fresh)'};">
      <div class="m-head"><h3 class="m-title">App status</h3>
        <span class="pill ${underMaint?'cancelled':'delivered'}">${underMaint?'UNDER MAINTENANCE':'LIVE'}</span></div>
      <div class="muted" style="font-size:.85rem;margin:6px 0 12px;">
        ${underMaint ? 'Customers see a maintenance screen and cannot use the app right now.' : 'The app is live and usable by customers.'}</div>
      <button class="${underMaint?'btn-primary':''}" id="btn-maint-toggle" style="${underMaint?'':'background:var(--warn-tint);color:var(--warn);'}">
        ${underMaint ? 'End maintenance — put app back live' : 'Put app under maintenance now'}</button>

    </div>

    <div class="card">
      <div class="m-head"><h3 class="m-title">Nightly audit</h3>
        <span class="pill ${scheduled?'action-needed':'info'}">${scheduled?'SCHEDULED FOR TONIGHT':'Not scheduled'}</span></div>
      <div class="muted" style="font-size:.85rem;line-height:1.6;margin:6px 0 12px;">
        Arm a full automated audit to run tonight at ~3&nbsp;AM. It puts the app under maintenance,

        <br>Last audit: ${lastRun}${auditState.lastAuditType?` (${esc((AUDIT_TYPES.find(t=>t.id===auditState.lastAuditType)||{}).label||auditState.lastAuditType)})`:''}.
      </div>
      <label style="display:flex;align-items:flex-start;gap:9px;font-weight:400;margin:2px 0 12px;cursor:pointer;">

      </label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-primary" id="btn-schedule-audit" ${scheduled?'disabled':''}>${scheduled?'Audit armed for tonight':'Schedule audit tonight'}</button>
        ${scheduled?`<button class="btn-quiet" id="btn-cancel-audit">Cancel</button>`:''}
      </div>
      <div class="muted" style="font-size:.78rem;margin-top:10px;">
        Needs the one-time setup: an <code>ANTHROPIC_API_KEY</code> repo secret for the audit runner.

    <div class="card">

        If it passes, open the PR on GitHub, read the diff yourself, and merge it if it's good — AI-written

        maintenance baseline for what automation may and may not do.
      </div>
    </div>`;
}
function wireMaintenanceEvents(){
  const t = document.getElementById('btn-maint-toggle');
  if(t) t.onclick = async () => {
    const turningOn = !cfg.maintenanceMode;
    if(!turningOn && cfg.otpLoginDisabled){
      alert('Since OTP login is OFF, the app can\'t leave maintenance mode — customers wouldn\'t be able to sign in. Turn OTP login back ON (Controls tab) first.');
      return;
    }
    if(turningOn && !confirm('Put the app under maintenance now? Customers will not be able to use it until you end maintenance.')) return;
    t.disabled = true;
    try{
      await setDoc(doc(db,'app_config','singleton'), {
        maintenanceMode: turningOn,
        maintenanceMessage: cfg.maintenanceMessage || 'We are giving the app a quick tune-up and will be back shortly. Please check again in a little while.',
      }, { merge:true });
      cfg.maintenanceMode = turningOn; logAdmin('maintenance_'+(turningOn?'on':'off'), 'maintenance tab');
      const m=document.getElementById('maint-saved'); if(m){ m.style.display='inline'; }
      render();
    }catch(e){ alert('Could not change maintenance mode: '+e.message); t.disabled=false; }
  };
  const fix = document.getElementById('chk-autofix');
  if(fix) fix.onchange = async () => {
    try{ await setDoc(doc(db,'audit_control','schedule'), { autoFixPR: fix.checked }, { merge:true }); auditState.autoFixPR = fix.checked; }
    catch(e){ alert('Could not save that setting: '+e.message); fix.checked = !fix.checked; }
  };
  const s = document.getElementById('btn-schedule-audit');
  if(s) s.onclick = async () => {
    s.disabled = true;
    try{
      await setDoc(doc(db,'audit_control','schedule'), {
        requested: true, requestedAt: serverTimestamp(), requestedBy: (auth.currentUser&&auth.currentUser.email)||'admin',
        autoFixPR: !!(document.getElementById('chk-autofix')||{}).checked,
      }, { merge:true });
      auditState.requested = true; render();
    }catch(e){ alert('Could not schedule the audit: '+e.message); s.disabled=false; }
  };
  const c = document.getElementById('btn-cancel-audit');
  if(c) c.onclick = async () => {
    try{ await setDoc(doc(db,'audit_control','schedule'), { requested:false }, { merge:true }); auditState.requested=false; render(); }
    catch(e){ alert('Could not cancel: '+e.message); }
  };
  const ap = document.getElementById('btn-apply-fixes');
  if(ap) ap.onclick = async () => {
    if(!confirm('Validate the latest audit fix PR?\n\nThe job re-runs the tests and reports whether it passed. It does NOT merge or deploy — you review and merge the PR on GitHub yourself.')) return;
    ap.disabled = true;
    try{
      await setDoc(doc(db,'deploy_control','request'), {
        requested:true, requestedAt:serverTimestamp(), requestedBy:(auth.currentUser&&auth.currentUser.email)||'admin',
      }, { merge:true });
      const m=document.getElementById('apply-req'); if(m) m.style.display='inline';
    }catch(e){ alert('Could not request apply: '+e.message); ap.disabled=false; }
  };
}

function orderDate(o){ const d=o.placedAt; return d&&d.toDate ? d.toDate() : (d ? new Date(d) : null); }
function inPeriod(date, period){
  if(!date) return false;
  const now = new Date();
  if(period==='today') return date.toDateString() === now.toDateString();
  if(period==='week'){ const w=new Date(now); w.setDate(now.getDate()-now.getDay()); w.setHours(0,0,0,0); return date >= w; }
  if(period==='month') return date.getMonth()===now.getMonth() && date.getFullYear()===now.getFullYear();
  if(period==='year') return date.getFullYear()===now.getFullYear();
  return true; // all-time
}
function periodStats(period){
  const os = orders.filter(o => period==='all' || inPeriod(orderDate(o), period));
  const s = { total:os.length, delivered:0, cancelled:0, notDelivered:0, revenue:0 };
  for(const o of os){
    if(o.status==='delivered'){ s.delivered++; s.revenue += Number(o.total)||0; }
    else if(o.status==='cancelled' || o.status==='denied') s.cancelled++;
    else s.notDelivered++;   // placed / confirmed / pending / packed / out for delivery
  }
  return s;
}
function distinctCustomers(){
  const set = new Set();
  for(const o of orders){ const k = o.phone || o.createdByUid; if(k) set.add(String(k)); }
  return set.size;
}

/* ═══════════════════════════════════════════════════════════
   EMERGENCY CONTROLS (Controls tab)
   Instant kill switches, stored as flags on app_config/singleton. The
   customer app reads them (public read) and enforces them, and — thanks to
   the app's 20s live-poll — a flip takes effect on open apps within seconds.
   ═══════════════════════════════════════════════════════════ */
const EMERGENCY_CONTROLS = [
  { key:'ordersDisabled',   t:'Disable new orders',            d:'Customers can browse but cannot place any new order.' },
  { key:'paymentsDisabled', t:'Disable online payments',       d:'Hides online payment; orders can still go through as cash/other.' },
  { key:'creditDisabled',   t:'Disable credit / wallet purchases', d:'Blocks paying from wallet balance or on credit.' },
  { key:'b2cDisabled',      t:'Disable the customer (personal) app', d:'Personal (B2C) customers see an “unavailable” screen and cannot use the app.' },
  { key:'b2bDisabled',      t:'Disable the business app',       d:'Business (B2B) customers see an “unavailable” screen and cannot use the app.' },
  { key:'maintenanceMode',  t:'Put the whole app into maintenance', d:'Everyone — personal and business — sees the maintenance screen. Nothing is usable.' },
];
function controlsBody(){
  const anyOn = EMERGENCY_CONTROLS.some(c => !!cfg[c.key]) || Object.values(products||[]).some(p=>p.disabled);
  const disabledProducts = (products||[]).filter(p=>p.disabled).map(p=>p.name);
  return `
    <div class="ctrl-banner ${anyOn?'on':''}" id="ctrl-banner">⚠ One or more emergency controls are ACTIVE right now — customers are affected.</div>
    <div class="muted" style="font-size:.85rem;line-height:1.55;margin-bottom:14px;">
      Instant kill switches. Flip one and it takes effect on customers’ open apps within seconds (and on next open otherwise).
      Turn it back off to restore. Red = the control is ON (restricting something).
    </div>

    <div class="card" style="border-left:4px solid ${cfg.otpLoginDisabled?'var(--bad)':'var(--fresh)'};">
      <div class="ctrl-row" style="border-bottom:none;">
        <div class="ctrl-info">
          <div class="t">OTP login ${cfg.otpLoginDisabled?'<span style="color:var(--bad)">— OFF</span>':'<span style="color:var(--fresh)">— ON</span>'}</div>
          <div class="d">When OTP login is turned OFF, customers can’t sign in, so the app is automatically put into <b>maintenance mode</b>. You can’t leave maintenance until OTP login is switched back ON.</div>
        </div>
        <label class="switch ok"><input type="checkbox" id="otp-login-toggle" ${cfg.otpLoginDisabled?'':'checked'}><span class="track"></span><span class="knob"></span></label>
      </div>
    </div>

    <div class="card">
      ${EMERGENCY_CONTROLS.map(c=>`
        <div class="ctrl-row">
          <div class="ctrl-info"><div class="t">${esc(c.t)}</div><div class="d">${esc(c.d)}</div></div>
          <label class="switch"><input type="checkbox" data-ctrl="${c.key}" ${cfg[c.key]?'checked':''}><span class="track"></span><span class="knob"></span></label>
        </div>`).join('')}
    </div>

    <div class="section-head" style="margin:20px 0 10px;"><span class="eyebrow" style="font-size:.78rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;">Disable a product</span></div>
    <div class="muted" style="font-size:.82rem;margin-bottom:10px;">Hide a specific item from the catalogue instantly. ${disabledProducts.length?`Currently hidden: <b>${esc(disabledProducts.join(', '))}</b>.`:''}</div>
    <div class="card">
      ${(products||[]).length ? products.map(p=>`
        <div class="ctrl-row">
          <div class="ctrl-info"><div class="t">${esc(p.name||p.id)}</div><div class="d">${p.disabled?'Hidden from the app':'Visible to customers'}</div></div>
          <label class="switch"><input type="checkbox" data-product-disable="${esc(p.id)}" ${p.disabled?'checked':''}><span class="track"></span><span class="knob"></span></label>
        </div>`).join('') : '<div class="muted">No products loaded.</div>'}
    </div>

    <div class="section-head" style="margin:20px 0 10px;"><span class="eyebrow" style="font-size:.78rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;">Credit holds — block a customer's ordering</span></div>
    <div class="muted" style="font-size:.82rem;line-height:1.5;margin-bottom:10px;">
      Stop a specific customer (by mobile number) from placing new orders — e.g. over their credit limit or on payment hold.
      Enforced on the server: a blocked customer's order is rejected, and their app shows an "account on hold" message. Unblock any time.
    </div>
    <div class="card">
      <div class="grid2">
        <div><label>Customer mobile (10 digits)</label><input id="blk-phone" inputmode="numeric" placeholder="9812345678"></div>
        <div><label>Reason (optional, private)</label><input id="blk-reason" placeholder="e.g. over credit limit"></div>
      </div>
