/* ═══════════════════════════════════════════════════════════
   3. FORMATTERS
   ═══════════════════════════════════════════════════════════ */
const money = n => '₹' + Math.round(Number(n)||0).toLocaleString('en-IN');
const money2 = n => '₹' + (Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const dateFmt = d => new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const dtFmt = d => new Date(d).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ═══════════════════════════════════════════════════════════
   3b. OUTPUT SAFETY
   Every string that reaches the DOM here goes through a template
   literal into innerHTML, so anything not run through esc() is an
   injection point. esc() above covers text and quoted attributes.
   These two cover the cases esc() alone can't:
   ═══════════════════════════════════════════════════════════ */

/* URL going into src/href/window.open. Remote config (app_config) and the
   product catalogue are read straight from Firestore into image srcs and
   link handlers, so a bad value there could otherwise be `javascript:...`
   (script execution) or `data:text/html,...`. Allowlist the schemes that
   are actually needed and reject everything else. */
const SAFE_URL_SCHEMES = ['http:', 'https:', 'tel:', 'mailto:'];
function safeUrl(u, fallback=''){
  const s = String(u ?? '').trim();
  if(!s) return fallback;
  // Relative paths ("assets/logo.png", "/terms.html") are ours — allow.
  if(/^[^a-zA-Z]/.test(s) || !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) {
    return /^\s*(javascript|data|vbscript)\s*:/i.test(s) ? fallback : s;
  }
  try{
    const parsed = new URL(s, 'https://modern-dairy-pune.web.app/');
    return SAFE_URL_SCHEMES.includes(parsed.protocol) ? s : fallback;
  }catch(e){ return fallback; }
}
/* Same value, but also going *inside* a single-quoted JS string in an inline
   onclick=. esc() handles the HTML layer; this handles the JS-string layer
   so a quote can't close the string and append a second statement. */
function jsStr(v){ return esc(String(v ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }

/* ═══════════════════════════════════════════════════════════
   3c. PASSWORD HASHING — PBKDF2-SHA256 via WebCrypto
   Accounts live in localStorage until the backend deploys (see
   getCustomerAccounts). They used to store the password as plaintext,
   so anything with read access to app storage — an `adb backup`, a
   rooted/stolen phone, another app exploiting a WebView bug, or just
   DevTools — got every customer's real password directly, and people
   reuse passwords. Now only a salted PBKDF2 hash is stored.

   PBKDF2-SHA256 is used because it is the only established password KDF
   available natively in a WebView (SubtleCrypto). Argon2id/bcrypt would
   mean shipping a WASM/JS crypto dependency into the APK; no custom
   crypto is implemented here either way. 210,000 iterations matches the
   current OWASP guidance for PBKDF2-HMAC-SHA256.
   ═══════════════════════════════════════════════════════════ */
const PBKDF2_ITERATIONS = 210000;
const PW_MIN_LENGTH = 8;
const subtle = (globalThis.crypto && globalThis.crypto.subtle) || null;

function toHex(buf){ return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function randomHex(bytes){
  const a = new Uint8Array(bytes); globalThis.crypto.getRandomValues(a);
  return [...a].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function sha256Hex(str){
  if(!subtle) return '';
  try{ return toHex(await subtle.digest('SHA-256', new TextEncoder().encode(String(str)))); }
  catch(e){ return ''; }
}
async function pbkdf2Hex(password, saltHex, iterations){
  const enc = new TextEncoder();
  const key = await subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await subtle.deriveBits(
    { name:'PBKDF2', salt: enc.encode(saltHex), iterations, hash:'SHA-256' }, key, 256);
  return toHex(bits);
}
// Length-independent, value-independent comparison — no early return on the
// first differing character, so response time can't be used as an oracle.
function timingSafeEqual(a, b){
  const x = String(a||''), y = String(b||'');
  let diff = x.length ^ y.length;
  const n = Math.max(x.length, y.length);
  for(let i=0;i<n;i++) diff |= (x.charCodeAt(i)||0) ^ (y.charCodeAt(i)||0);
  return diff === 0;
}
/* Returns the stored record for a new/changed password. Never returns or
   stores the password itself. */
async function hashPassword(password){
  if(!subtle) throw new Error('This device does not support secure password storage.');
  const salt = randomHex(16);
  return { algo:'pbkdf2-sha256', iters:PBKDF2_ITERATIONS, salt, hash: await pbkdf2Hex(password, salt, PBKDF2_ITERATIONS) };
}
/* Verifies against a stored record. Transparently upgrades accounts created
   before hashing existed (plaintext `password` field) on the first correct
   sign-in, then deletes the plaintext — so nobody has to reset anything and
   no plaintext survives a single successful login. */
async function verifyPassword(account, password){
  if(!account) return false;
  if(account.pw && account.pw.hash && account.pw.salt){
    const candidate = await pbkdf2Hex(password, account.pw.salt, account.pw.iters || PBKDF2_ITERATIONS);
    return timingSafeEqual(candidate, account.pw.hash);
  }
  if(typeof account.password === 'string'){       // legacy plaintext record
    return timingSafeEqual(password, account.password);
  }
  return false;
}

/* ═══════════════════════════════════════════════════════════
   3d. ATTEMPT THROTTLING (brute-force / abuse protection)
   There is no server to enforce this yet, so it is enforced here and
   persisted in localStorage — which an attacker with full control of
   the device can obviously clear. That is fine for what it is actually
   defending: it stops repeated online guessing against a password or a
   4-digit OTP by someone holding an unlocked phone, and it stops the
   app being used to spam a victim's number with paid SMS or to burn
   the GST provider's quota. Real server-enforced limits already exist
   in backend/src/middleware/rateLimit.js and take over on deploy.
   ═══════════════════════════════════════════════════════════ */
const THROTTLE_KEY = 'mda_throttle';
const THROTTLE_RULES = {
  // action: [max attempts, window ms, lockout ms after exceeding]
  signin:    { max: 5,  windowMs: 15*60*1000, lockMs: 15*60*1000 },
  otpVerify: { max: 5,  windowMs: 15*60*1000, lockMs: 15*60*1000 },
  otpSend:   { max: 5,  windowMs: 15*60*1000, lockMs: 15*60*1000 },
  gstLookup: { max: 10, windowMs: 60*60*1000, lockMs: 30*60*1000 },
  pwReset:   { max: 5,  windowMs: 15*60*1000, lockMs: 15*60*1000 },
  bankVerify:{ max: 8,  windowMs: 60*60*1000, lockMs: 30*60*1000 },
};
function throttleAll(){
  try{ return JSON.parse(localStorage.getItem(THROTTLE_KEY)||'{}'); }catch(e){ return {}; }
}
function throttleSave(all){
  try{ localStorage.setItem(THROTTLE_KEY, JSON.stringify(all)); }catch(e){ /* storage full/blocked — fail open, nothing else to do */ }
}
function throttleMinsLeft(ms){ return Math.max(1, Math.ceil(ms/60000)); }
/* Call BEFORE the attempt. Returns null if allowed, or a user-facing message
   if locked out. Deliberately identical wording whether or not the account
   exists — no existence oracle. */
function throttleCheck(action, subject=''){
  const rule = THROTTLE_RULES[action]; if(!rule) return null;
  const all = throttleAll(); const rec = all[`${action}:${subject}`];
  if(!rec) return null;
  if(rec.until && Date.now() < rec.until){
    return `Too many attempts. Please wait ${throttleMinsLeft(rec.until - Date.now())} minute(s) and try again.`;
  }
  return null;
}
/* Call AFTER a failed attempt. */
function throttleFail(action, subject=''){
  const rule = THROTTLE_RULES[action]; if(!rule) return;
  const all = throttleAll(); const k = `${action}:${subject}`;
  const now = Date.now();
  let rec = all[k];
  if(!rec || now - (rec.first||0) > rule.windowMs || (rec.until && now >= rec.until)) rec = { first: now, count: 0 };
  rec.count += 1;
  if(rec.count >= rule.max) rec.until = now + rule.lockMs;
  all[k] = rec; throttleSave(all);
}
/* Call after a successful attempt — clears that subject's counter. */
function throttleReset(action, subject=''){
  const all = throttleAll(); delete all[`${action}:${subject}`]; throttleSave(all);
}

/* ═══════════════════════════════════════════════════════════
   4. AUTH + STATE
   ═══════════════════════════════════════════════════════════ */
const S = {
  user: JSON.parse(localStorage.getItem('mda_user')||'null'),
  token: localStorage.getItem('mda_token')||'',
  refresh: localStorage.getItem('mda_refresh')||'',

  wallet: { balance:0, txns:[] },
  orders: [],
  tab: 'catalogue',
  cat: 'all',
  query: '',
  loading: false,
  lastOrder: null,
};
function persist(){
  localStorage.setItem('mda_cart', JSON.stringify(S.cart));
  if(S.user) localStorage.setItem('mda_user', JSON.stringify(S.user));
}
function isB2B(){ return S.user?.customerType === 'b2b'; }
function signOut(){
  if(FB) FB.signOut().catch(()=>{});
  ['mda_user','mda_token','mda_refresh','mda_cart'].forEach(k=>localStorage.removeItem(k));
  S.user=null;S.token='';S.cart=[];S.wallet={balance:0,txns:[]};
  go('login');
}

/* ═══════════════════════════════════════════════════════════
   5. API LAYER
   ═══════════════════════════════════════════════════════════ */
const API = {
  async call(method, path, body){
    if(CONFIG.DEMO || !CONFIG.API_BASE) return MOCK(method, path, body);
    const opt = { method, headers:{'Content-Type':'application/json', ...(S.token?{Authorization:'Bearer '+S.token}:{})} };
    if(body) opt.body = JSON.stringify(body);
    try{
      let res = await fetch(CONFIG.API_BASE+path, opt);
      if(res.status===401 && S.refresh){
        const rr = await fetch(CONFIG.API_BASE+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:S.refresh})});
        const rd = await rr.json();
        if(rd.success){
          S.token = rd.data.accessToken; localStorage.setItem('mda_token',S.token);
          opt.headers.Authorization = 'Bearer '+S.token;
          res = await fetch(CONFIG.API_BASE+path, opt);
        } else { signOut(); return {success:false,message:'Session expired. Please sign in again.'}; }
      }
      return await res.json();
    }catch(e){
      return {success:false, offline:true, message:'No connection. Check your network and try again.'};
    }
  },
  get:(p)=>API.call('GET',p),
  post:(p,b)=>API.call('POST',p,b),
  patch:(p,b)=>API.call('PATCH',p,b),
};
</script>
<script>
/* ═══════════════════════════════════════════════════════════
   6. DEMO BACKEND — mirrors the real API contract exactly.
   Keeps a genuine append-only ledger so the wallet behaves
   correctly (no silent balance edits) even offline.
   ═══════════════════════════════════════════════════════════ */
const DB = {
  get wallet(){ return JSON.parse(localStorage.getItem('mda_wallet')||'{"balance":0,"txns":[]}'); },
  set wallet(v){ localStorage.setItem('mda_wallet', JSON.stringify(v)); },
  get orders(){ return JSON.parse(localStorage.getItem('mda_orders')||'[]'); },
  set orders(v){ localStorage.setItem('mda_orders', JSON.stringify(v)); },
};
function ledgerPost(type, amount, note, orderNo){
  const w = DB.wallet;
  const prev = w.balance;
  const next = type==='DEPOSIT'||type==='REFUND'||type==='MANUAL_CREDIT' ? prev+amount : prev-amount;
  const txn = {
    id:'TXN'+Date.now().toString(36).toUpperCase(),
    type, amount, prevBalance:prev, newBalance:next,
    note, orderNo:orderNo||null, at:new Date().toISOString(),
  };
  w.balance = next; w.txns.unshift(txn); DB.wallet = w;
  return txn;
}
function orderNo(){ return 'MD'+Date.now().toString(36).toUpperCase().slice(-6); }

function MOCK(method, path, b){
  const ok = (data,extra={}) => ({success:true,data,...extra});

  if(path==='/config') return ok(APPCFG);

  if(path==='/auth/b2c/send-otp'||path==='/auth/b2b/send-otp')
    return ok(null,{message:'OTP sent. Use 123456 in demo mode.'});

  if(path==='/auth/b2b/verify-gstin'){
    const g=(b.gstin||'').toUpperCase();
    if(!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g))
      return {success:false,message:'That GSTIN format is not valid. It should look like 27AAPFM1234A1ZV.'};
    return ok({legalName:b.companyName,tradeName:b.companyName,status:'Active',stateCode:g.slice(0,2)},{message:'GSTIN verified'});
  }
  if(path==='/auth/b2b/register')
    return ok(null,{gofrugalMatched:true,requiresApproval:false,message:'Verified against our customer records. OTP sent.'});

  if(path.endsWith('/verify-otp')){
    if(b.otp!=='123456') return {success:false,message:'That OTP is incorrect. In demo mode use 123456.'};
    const b2b = path.includes('b2b');
    return ok({
      user:{id:'u1',name:b.name||S.user?.name||'Purchase Manager',phone:b.phone,
            customerType:b2b?'b2b':'b2c',company:b.company||null,gstin:b.gstin||null,
            outlet:b2b?(b.company||'Main Outlet'):'Home'},
      accessToken:'demo.'+Date.now(), refreshToken:'demo.r.'+Date.now(),
    });
  }

  if(path==='/wallet'){ const w=DB.wallet; return ok({balance:w.balance,txns:w.txns}); }
  if(path==='/wallet/topup'){
    const t=ledgerPost('DEPOSIT', Number(b.amount)||0, b.note||'Prepaid deposit');
    return ok({txn:t,balance:DB.wallet.balance});
  }

  if(path==='/orders'&&method==='POST'){
    const w=DB.wallet;
    if(b.payment==='credit'){
      if(w.balance < b.total) return {success:false,code:'INSUFFICIENT',shortfall:b.total-w.balance,
        message:`Insufficient business credit. You need ${money(b.total-w.balance)} more.`};
    }
    const no=orderNo();
    let txn=null;
    if(b.payment==='credit') txn=ledgerPost('ORDER_DEBIT', b.total, 'Order payment', no);
    // Auto-confirm when every line item is fully in stock. If any item is on
    // low stock it needs a human to check before it is confirmed, so it is left
    // as pending_confirmation for the admin website to action.
    const anyLow = (b.items||[]).some(i=>CATALOGUE[i.pk]?.variants.find(v=>v.id===i.vid)?.stock==='low');
    const status = anyLow ? 'pending_confirmation' : 'confirmed';
    const o={orderNo:no,...b,status,placedAt:new Date().toISOString(),txnId:txn?.id||null,
             deliverySlot:'Tomorrow, 7:00 AM – 11:00 AM'};
    const list=DB.orders; list.unshift(o); DB.orders=list;
    return ok({orderNo:no,total:b.total,balance:DB.wallet.balance,txnId:txn?.id||null,deliverySlot:o.deliverySlot});
  }
  if(path==='/orders'&&method==='GET') return ok(DB.orders);
  if(path.startsWith('/orders/')){
    const o=DB.orders.find(x=>x.orderNo===path.split('/')[2]);
    return o?ok(o):{success:false,message:'Order not found'};
  }
  return ok({});
}

/* ═══════════════════════════════════════════════════════════
   7. CATALOGUE HELPERS
   ═══════════════════════════════════════════════════════════ */
const CAT_COLOR = {
  dairy:{c:'var(--c-dairy)',t:'var(--c-dairy-t)'},
  curd:{c:'var(--c-curd)',t:'var(--c-curd-t)'},
  beverages:{c:'var(--c-beverages)',t:'var(--c-beverages-t)'},
  sweets:{c:'var(--c-sweets)',t:'var(--c-sweets-t)'},
  frozen:{c:'var(--c-frozen)',t:'var(--c-frozen-t)'},
};
const catC = id => CAT_COLOR[id] || {c:'var(--brand-2)',t:'var(--brand-tint)'};

const CATEGORIES = [
  {id:'all',      label:'All items'},
  {id:'dairy',    label:'Dairy'},
  {id:'curd',     label:'Curd & Dahi'},
  {id:'frozen',   label:'Frozen'},
  {id:'beverages',label:'Beverages'},
  {id:'sweets',   label:'Sweets'},

/* Price the customer actually pays — B2B rate for business accounts */
function unitPrice(v){ return isB2B() ? v.b2b : v.mrp; }
function showsMRP(v){ return isB2B() && v.b2b < v.mrp; }
function savingPct(v){ return Math.round((1 - v.b2b/v.mrp)*100); }

function filtered(){
  const q = S.query.trim().toLowerCase();
  return Object.entries(CATALOGUE).filter(([k,p])=>{
    if(p.disabled) return false;   // admin-disabled products are hidden from the app
    if(S.cat!=='all' && p.cat!==S.cat) return false;

    return true;
  });
}

/* ═══════════════════════════════════════════════════════════
   8. CART — quantities are in units (packs/cases), MOQ enforced
   ═══════════════════════════════════════════════════════════ */
function cartKey(pk,vid){ return pk+'::'+vid; }
function inCart(pk,vid){ return S.cart.find(i=>i.key===cartKey(pk,vid)); }
function cartQty(pk,vid){ return inCart(pk,vid)?.qty || 0; }

function setQty(pk, vid, qty){
  const p = CATALOGUE[pk]; const v = p.variants.find(x=>x.id===vid);
  const key = cartKey(pk,vid);
  const i = S.cart.findIndex(x=>x.key===key);
  if(qty<=0){ if(i>=0) S.cart.splice(i,1); }
  else{
    const line = {key,pk,vid,qty,name:p.name,label:v.label,unit:p.unit,
                  price:unitPrice(v),mrp:v.mrp,img:p.img,moq:v.moq};
    if(i>=0) S.cart[i]=line; else S.cart.push(line);
  }
  persist(); renderTabBadge(); renderOrderBar();
  repaintRows();   // every ADD/stepper on screen: catalogue grid, home shelves, related items
  if(S.screen==='cart') paintCart();
  if(S.screen==='product') paintProduct();
}
function addToCart(pk,vid){
  const v = CATALOGUE[pk].variants.find(x=>x.id===vid);
  const cur = cartQty(pk,vid);
  setQty(pk,vid, cur>0 ? cur+1 : v.moq);
  if(cur===0 && v.moq>1) toast(`Added ${v.moq} ${CATALOGUE[pk].unit}s — minimum order`, 'check');
}
function cartTotals(){
  const sub = S.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const gst = Math.round(sub*APPCFG.gstRate*100)/100;
  const del = (isB2B()||sub>=APPCFG.freeDeliveryAbove) ? 0 : APPCFG.deliveryFee;
  // Flat platform fee on every order that has items. Configurable via
  // APPCFG.platformFee (admin Settings); defaults to ₹2.
  const plat = S.cart.length ? (Number(APPCFG.platformFee)||0) : 0;
  return {sub, gst, del, plat, total: sub+gst+del+plat, count: S.cart.reduce((s,i)=>s+i.qty,0)};
}
function movMet(){ return cartTotals().sub >= (isB2B()?APPCFG.minOrderValue:0); }
function clearCart(){ S.cart=[]; persist(); renderTabBadge(); renderOrderBar(); paintCart(); }

/* ═══════════════════════════════════════════════════════════
   9. UI PRIMITIVES
   ═══════════════════════════════════════════════════════════ */
let toastT;
function toast(msg, ic='info'){

<script>
/* ═══════════════════════════════════════════════════════════
   10. ROUTER
   ═══════════════════════════════════════════════════════════ */
const APP = () => document.getElementById('app');
const NAV = [];
function go(screen, opt={}){
  if(S.screen && S.screen!==screen && !opt.replace) NAV.push({s:S.screen, o:S.opt});
  S.screen=screen; S.opt=opt; paint();

   enumeration oracle: anyone holding the phone could learn which numbers

const SIGNIN_GENERIC_ERR = 'Incorrect mobile number or password.';
async function doSignIn(){

  LOGIN.company=existing.company||''; LOGIN.gstin=existing.gstin||''; LOGIN.address=existing.address||'';

function getCustomerAccounts(){
  try{ return JSON.parse(localStorage.getItem('mda_customer_accounts')||'{}'); }
  catch(e){ return {}; }
}
/* Profile fields only. A plaintext `password` can no longer be written
   through here even by accident — it is stripped, and any legacy plaintext
   left on the record is dropped the moment the record is touched. Password
   changes go through setAccountPassword() below. */
const ACCOUNT_FIELDS = ['name','company','gstin','type','address','lat','lng','bankVerified','bankName','acctLast4'];
function saveCustomerAccount(phone, patch){
  const cur = getCustomerAccounts();
  const clean = {};
  for(const k of ACCOUNT_FIELDS) if(k in (patch||{})) clean[k] = patch[k];
  const next = {...cur[phone], ...clean};
  delete next.password;                       // never persist plaintext
  cur[phone] = next;
  localStorage.setItem('mda_customer_accounts', JSON.stringify(cur));
}
async function setAccountPassword(phone, plaintext){
  const cur = getCustomerAccounts();
  const next = {...cur[phone], pw: await hashPassword(plaintext)};
  delete next.password;                       // drop any legacy plaintext
  cur[phone] = next;
  localStorage.setItem('mda_customer_accounts', JSON.stringify(cur));
}
/* An account that verified with a legacy plaintext password gets silently
   re-stored as a hash. Called only after a *correct* password, so we know
   the plaintext is the real one. */
async function upgradeLegacyPassword(phone, plaintext){
  const acct = getCustomerAccounts()[phone];
  if(acct && !acct.pw && typeof acct.password === 'string'){
    try{ await setAccountPassword(phone, plaintext); }catch(e){ /* keep the user signed in even if upgrade fails */ }
  }
}

async function checkLoginPassword(phone){
  const pw = document.getElementById('f-password').value;
  const pw2 = document.getElementById('f-password2').value;
  setErr('f-password','h-password',''); setErr('f-password2','h-password2','');
  const locked = throttleCheck('signin', phone);
  if(locked){ setErr('f-password','h-password', locked); return null; }
  const existing = getCustomerAccounts()[phone];
  if(existing){
    // Signing up again on a number that already has an account is really a
    // sign-in, so it gets the same throttle and the same generic message.
    if(!await verifyPassword(existing, pw)){
      throttleFail('signin', phone);
      setErr('f-password','h-password', SIGNIN_GENERIC_ERR); return null;
    }
    throttleReset('signin', phone);
    await upgradeLegacyPassword(phone, pw);
  } else {
    if(!isStrongEnough(pw)){ setErr('f-password','h-password', PW_RULE_TEXT); return null; }
    if(pw !== pw2){ setErr('f-password2','h-password2','Passwords do not match.'); return null; }
  }
  return pw;
}
/* Minimum was 6 characters with no other rule, which allows "123456" —
   the single most common password in every breach corpus. */
const PW_RULE_TEXT = `Use at least ${PW_MIN_LENGTH} characters, including a letter and a number.`;
function isStrongEnough(pw){
  const s = String(pw||'');
  return s.length >= PW_MIN_LENGTH && /[A-Za-z]/.test(s) && /\d/.test(s);
}

  if(!addr){ setErr('f-address','h-address','Enter a delivery address.'); return; }

async function doVerifyOTP(){
  const o=document.getElementById('f-otp').value.trim();
  if(o.length!==OTP_LENGTH){ setErr('f-otp','h-otp',`Enter all ${OTP_LENGTH} digits.`); return; }
  const btn=document.getElementById('btn-verify'); btn.dataset.lbl='Verify and continue';
  busy('btn-verify',true,'Verifying');
  let r;
  if(OTP_READY){
    try{
      // Message Central verifies the phone number itself (actual SMS, actual code).
      // Profile/wallet/orders still live in local demo storage — see the
      // saveCustomerAccount call below — since no backend is deployed yet.
      await otpVerify(o);
      const existing = getCustomerAccounts()[LOGIN.phone] || {};
      const profile = {
        name: LOGIN.name || existing.name || 'Customer',
        phone: LOGIN.phone,
        type: LOGIN.mode==='b2b' ? 'b2b' : 'b2c',
        address: LOGIN.address || existing.address || '',
        ...(LOGIN.mode==='b2b' ? { company:LOGIN.company, gstin:LOGIN.gstin } : {}),
      };
      r={success:true,data:{user:{id:'local.'+LOGIN.phone,name:profile.name,phone:profile.phone,
         customerType:profile.type,company:profile.company||null,gstin:profile.gstin||null,address:profile.address},
         accessToken:'demo.'+Date.now(),refreshToken:'demo.r.'+Date.now()}};
    }catch(e){
      busy('btn-verify',false,'Verify and continue');
      setErr('f-otp','h-otp', e.message || 'Incorrect or expired code.');
      return;
    }
  } else if(FB){
    try{
      // Real Firebase Auth verifies the phone number itself (actual SMS, actual
      // code). Profile/wallet/orders still live in local demo storage below —
      // see FIRESTORE_LIVE — since the backend that would own those in Firestore
      // isn't deployed yet.
      const u = await FB.verifyOTP(o);
      const existing = FIRESTORE_LIVE ? (await FB.customer(u.uid) || {}) : {};
      const profile = {
        name: LOGIN.name || existing.name || 'Customer',
        phone: LOGIN.phone,
        type: LOGIN.mode==='b2b' ? 'b2b' : 'b2c',
        ...(LOGIN.mode==='b2b' ? { company:LOGIN.company, gstin:LOGIN.gstin } : {}),
        balance: existing.balance ?? 0,
      };
      if(FIRESTORE_LIVE) await FB.saveCustomer(u.uid, profile);
      r={success:true,data:{user:{id:u.uid,name:profile.name,phone:profile.phone,
         customerType:profile.type,company:profile.company||null,gstin:profile.gstin||null},
         accessToken:'firebase',refreshToken:'firebase'}};
    }catch(e){
      busy('btn-verify',false,'Verify and continue');
      setErr('f-otp','h-otp',
        e.code==='auth/invalid-verification-code' ? 'That code is incorrect.'
      : e.code==='auth/code-expired' ? 'That code expired. Request a new one.'
      : (e.message||'Could not verify the code.'));
      return;
    }
  } else {
    r=await API.post(`/auth/${LOGIN.mode}/verify-otp`,
      {phone:LOGIN.phone,otp:o,name:LOGIN.name,company:LOGIN.company,gstin:LOGIN.gstin});
  }
  busy('btn-verify',false,'Verify and continue');
  if(!r.success){ setErr('f-otp','h-otp', r.message); return; }
  if(LOGIN.phone){
    saveCustomerAccount(LOGIN.phone, {name:LOGIN.name, company:LOGIN.company||null, gstin:LOGIN.gstin||null, type:LOGIN.mode, address:LOGIN.address||null, lat:LOGIN.lat??null, lng:LOGIN.lng??null, bankVerified:LOGIN.bankVerified||false, bankName:LOGIN.bankName||null, acctLast4:LOGIN.acctLast4||null});
    // Only set/replace the stored credential when this flow actually
    // captured one (signup, or a signup on an existing number). Plain
    // sign-in clears LOGIN.password, so it never rewrites the hash.
    if(LOGIN.password){ try{ await setAccountPassword(LOGIN.phone, LOGIN.password); }catch(e){ console.warn('Could not store password hash:', e); } }
  }
  LOGIN.password='';                          // don't keep plaintext in memory
  S.user=r.data.user; S.token=r.data.accessToken; S.refresh=r.data.refreshToken;
  localStorage.setItem('mda_user',JSON.stringify(S.user));
  localStorage.setItem('mda_token',S.token);
  localStorage.setItem('mda_refresh',S.refresh);
  await Promise.all([loadWallet(), loadOrders()]);
  S.tab='home'; NAV.length=0; go('home',{replace:true});
  initPushNotifications();
  syncAccount();
}

<script>

/* ═══════════════════════════════════════════════════════════
   HOME — what a purchaser needs the moment they open the app:
   1. Is an order already coming?   2. Reorder the usual
   3. What can I spend?             4. Jump into the catalogue
   ═══════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════
   REQUEST A DRIVER
   Any customer can ask the office for a driver — to collect a payment (cash
   or cheque), for an urgent delivery, or for other help. It is offered on
   Home, in Account, and on an order (then the request names that order).
   It lands live in the admin website's Driver requests tab; once the office
   assigns someone, the row shows the driver's name and number.
   ═══════════════════════════════════════════════════════════ */
const RFD_KEY = 'mda_rfd';
const RFD_REASONS = [
  { id:'collect_payment', label:'Collect payment', hint:'A driver comes to pick up cash or a cheque.' },
  { id:'urgent_delivery', label:'Urgent delivery', hint:'You need stock before the next delivery slot.' },
  { id:'other',           label:'Other help',      hint:'Tell us what you need below.' },
];
const RFD_STATUS = { open:'Waiting for the office', assigned:'Driver assigned', done:'Completed', cancelled:'Cancelled' };
let RFD = { last:null, unsub:null };
function rfdLoad(){
  if(RFD.last) return RFD.last;
  try{ RFD.last = JSON.parse(localStorage.getItem(RFD_KEY) || 'null'); }catch(e){ RFD.last = null; }
  return RFD.last;
}
function rfdStore(){ try{ localStorage.setItem(RFD_KEY, JSON.stringify(RFD.last)); }catch(e){} }
// The request this account still has open with the office, if any.
function rfdActive(){
  const r = rfdLoad();
  return r && r.phone === S.user?.phone && (r.status === 'open' || r.status === 'assigned') ? r : null;
}
function rfdChargeText(){
  const fee = Number(APPCFG.rfdFee) || 0;
  return fee > 0 ? `An extra ${money(fee)} applies per request.` : 'A small extra charge applies.';
}
function openRfdSheet(orderNo){
  RFD.forOrder = orderNo || null;
  openSheet(`<div class="sheet-head"><div class="t-lg">Request a driver</div></div>
    <div class="t-sm muted mb-12" style="line-height:1.5;">${orderNo ? `For order <b>${esc(orderNo)}</b>. ` : ''}What do you need the driver for? ${esc(rfdChargeText())}</div>
    ${RFD_REASONS.map((x, i) => `<label class="card mb-8" style="display:flex;gap:12px;padding:12px;align-items:flex-start;">
      <input type="radio" name="rfd-reason" value="${x.id}" ${i===0?'checked':''} style="margin-top:3px;">
      <div><div class="t-base" style="font-weight:600;">${x.label}</div><div class="t-sm muted">${x.hint}</div></div></label>`).join('')}
    <div class="field"><label class="label">Details (optional)</label>
      <textarea class="input" id="f-rfd-note" rows="2" maxlength="300" placeholder="e.g. Cheque for last week's bill is ready"></textarea>
      <div class="hint" id="h-rfd-note"></div></div>
    <button class="btn" id="btn-rfd-send" onclick="sendRfd()">Send request</button>`);
}
async function sendRfd(){
  const reason = document.querySelector('input[name="rfd-reason"]:checked')?.value;
  const note = (document.getElementById('f-rfd-note')?.value || '').trim().slice(0, 300);
  setErr('f-rfd-note','h-rfd-note','');
  if(reason === 'other' && !note){ setErr('f-rfd-note','h-rfd-note','Tell us what help you need.'); return; }
  if(!window.createDriverRequest){ toast('Could not reach the office. Check your connection.','alert'); return; }
  const btn = document.getElementById('btn-rfd-send'); btn.dataset.lbl = 'Send request';
  busy('btn-rfd-send', true, 'Sending');
  try{
    const id = await window.createDriverRequest({ reason, note: note || null, company:S.user?.company, name:S.user?.name,
      phone:S.user?.phone, address:S.user?.address, gstin:S.user?.gstin,
      customerType: isB2B() ? 'b2b' : 'b2c', orderNo: RFD.forOrder });
    RFD.last = { id, reason, status:'open', at:Date.now(), phone:S.user?.phone, orderNo: RFD.forOrder || null };
    rfdStore(); closeSheet(); rfdListen();
    toast('Request sent — the office will call you','check');
    paint();
  }catch(e){
    busy('btn-rfd-send', false, 'Send request');
    toast('Could not send the request. Try again.','alert');
  }
}
function rfdListen(){
  if(RFD.unsub){ try{ RFD.unsub(); }catch(e){} RFD.unsub = null; }
  const r = rfdActive();
  if(!r || !window.listenToDriverRequest) return;
  RFD.unsub = window.listenToDriverRequest(r.id, d => {
    if(!d || RFD.last?.id !== r.id) return;
    RFD.last = { ...RFD.last, status:d.status, driverName:d.driverName || null, driverPhone:d.driverPhone || null };
    rfdStore();
    if(!rfdActive() && RFD.unsub){ RFD.unsub(); RFD.unsub = null; }
    if(['home','account','placed','order'].includes(S.screen)){
      if(S.screen === 'order'){ document.querySelectorAll('.rfd-slot').forEach(el => el.innerHTML = rfdRowHtml(RFD.forOrder)); }
      else paint();
    }
  });
}
async function rfdWithdraw(){
  const r = rfdActive();
  if(!r || !window.cancelDriverRequest) return;
  try{
    await window.cancelDriverRequest(r.id);
    RFD.last = { ...r, status:'cancelled' }; rfdStore();
    toast('Request withdrawn','check'); paint();
  }catch(e){ toast('Could not withdraw — the office may already have assigned a driver.','alert'); }
}

/* ═══════════════════════════════════════════════════════════
   ACCOUNT CENTER SYNC
   Copies this phone's account profile — never the password — to the admin
   website's Account Center, and applies back any edits the office made
   there. Runs on launch, after sign-in and after an address change; a
   failure only logs, it never gets in the customer's way.
   ═══════════════════════════════════════════════════════════ */
const ADMIN_EDITS_KEY = 'mda_admin_edits_applied';
async function syncAccount(){
  const phone = S.user?.phone;
  if(!phone || !window.syncCustomerAccount) return;
  const a = getCustomerAccounts()[phone] || {};
  try{
    const edits = await window.syncCustomerAccount({
      phone, type: S.user.customerType === 'b2b' ? 'b2b' : 'b2c',
      name: a.name ?? S.user.name, company: a.company ?? S.user.company, gstin: a.gstin ?? S.user.gstin,
      address: a.address ?? S.user.address, lat: a.lat, lng: a.lng,
      bankVerified: a.bankVerified, acctLast4: a.acctLast4,
    });
    applyAdminEdits(phone, edits);
  }catch(e){ console.warn('Account sync failed:', e); }
}
// Each office edit is applied once. editedAt is the office's own clock, so it
// is only ever compared with the last editedAt applied on this phone.
function applyAdminEdits(phone, edits){
  if(!edits || typeof edits.editedAt !== 'number') return;
  let applied = {};
  try{ applied = JSON.parse(localStorage.getItem(ADMIN_EDITS_KEY) || '{}'); }catch(e){}
  if((applied[phone] || 0) >= edits.editedAt) return;
  const patch = {};
  if(typeof edits.name === 'string' && edits.name) patch.name = edits.name.slice(0, 120);
  if(typeof edits.company === 'string' && edits.company) patch.company = edits.company.slice(0, 200);
  if(typeof edits.address === 'string' && edits.address) patch.address = edits.address.slice(0, 500);
  saveCustomerAccount(phone, patch);
  if(S.user?.phone === phone){ S.user = { ...S.user, ...patch }; localStorage.setItem('mda_user', JSON.stringify(S.user)); }
  applied[phone] = edits.editedAt;
  localStorage.setItem(ADMIN_EDITS_KEY, JSON.stringify(applied));
  if(Object.keys(patch).length){ paint(); syncAccount(); }   // send the merged profile back up once
}

/* ═══════════════════════════════════════════════════════════
   STOREFRONT PHOTOGRAPHY
   Product photos come from Cloudinary as full-size studio shots, 1–3 MB
   each. pimg() asks for a trimmed, square, right-sized copy instead:
   e_trim crops the white studio margin so every pack fills its tile the
   same way, c_pad squares it back up on white, and f_auto/q_auto serve
   WebP/AVIF at a sensible quality. Any other URL just goes through safeUrl.
   ═══════════════════════════════════════════════════════════ */
function pimg(url, size = 400){
  const u = safeUrl(url);
  if(!/^https:\/\/res\.cloudinary\.com\/[^/]+\/image\/upload\//.test(u)) return u;
  return u.replace('/image/upload/', `/image/upload/e_trim:10/c_pad,b_white,w_${size},h_${size}/f_auto,q_auto/`);
}
// Each category's soft tint and the pack that stands for it. The tints share
// one lightness, so the tiles read as a set rather than a rainbow.
const CAT_LOOK = {
  all:       { tint:'#EFEDFB' },
  dairy:     { tint:'#E8F0FF', pk:'paneer' },
  curd:      { tint:'#E6F5EC', pk:'matka-dahi' },
  frozen:    { tint:'#E3F2F8', pk:'samosa' },
  beverages: { tint:'#FFF0DE', pk:'mango-crush' },
  sweets:    { tint:'#FCEBF0', pk:'amrakhand' },
};
function catPhoto(id){
  const pk = CAT_LOOK[id]?.pk;
  const p = (pk && CATALOGUE[pk] && !CATALOGUE[pk].disabled) ? CATALOGUE[pk]
          : Object.values(CATALOGUE).find(x => x.cat === id && !x.disabled);
  return p?.img || '';
}
// A fresh shuffle once per app session: the highlights, "Popular" and the
// category rows rotate every time the app opens, so every product gets its
// turn instead of the same few.
const SESSION_PICKS = {};
function sessionPick(key, list, n){
  if(!SESSION_PICKS[key]){
    const a = list.slice();
    for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    SESSION_PICKS[key] = a;
  }
  return SESSION_PICKS[key].filter(k => list.includes(k)).slice(0, n);
}
// Products worth featuring: on sale, in stock, with a photo.
function liveKeys(){
  return Object.keys(CATALOGUE).filter(k => { const p = CATALOGUE[k]; return !p.disabled && p.img && p.variants.some(v => v.stock !== 'out'); });
}
// Banner colours: five deep tones at one depth, so they sit together.
const PROMO_BG = ['#1B2A6B', '#1D5E47', '#7B2335', '#0F5B6B', '#6A3F22'];   // navy, forest, maroon, teal, cocoa
// Five highlights: one from every category first, then any others.
function promoSlides(){
  const keys = sessionPick('promos', liveKeys(), 999);
  const picks = [], cats = new Set();
  for(const k of keys){ if(!cats.has(CATALOGUE[k].cat)){ cats.add(CATALOGUE[k].cat); picks.push(k); } }
  for(const k of keys){ if(picks.length >= 5) break; if(!picks.includes(k)) picks.push(k); }
  return picks.slice(0, 5);
}
// Every order still on its way, as a swipeable row: a second order must
// never hide the first.
function liveOrdersHtml(){
  const live = S.orders.filter(o => !['delivered','cancelled','denied'].includes(o.status));
  if(!live.length) return '';
  const card = o => `<button class="card live-card" onclick="openOrder('${jsStr(o.orderNo)}')">
      <div class="row between mb-8">
        <span class="eyebrow" style="color:var(--brand);">${live.length > 1 ? 'Placed ' + esc(dtFmt(o.placedAt)) : 'Order in progress'}</span>
        <span class="pill b">${(STATUS[o.status] || STATUS.placed).l}</span></div>
      <div class="row between">
        <div><div class="t-base num" style="font-weight:700;">${esc(o.orderNo)}</div>
          <div class="t-sm muted mt-4">${o.items.length} items · ${money(o.total)}</div></div>
        ${icon('right',18)}</div>
    </button>`;
  if(live.length === 1) return `<div style="padding:0 16px 14px;">${card(live[0])}</div>`;
  return `<div class="shead" style="padding-top:0;"><h2>Orders in progress</h2><span class="t-sm muted">${live.length} orders</span></div>
    <div class="live-row">${live.map(card).join('')}</div>`;
}

// Time left before today's order cutoff (APPCFG.orderCutoff, e.g. "6:00 PM").
function cutoffInfo(){
  const m = String(APPCFG.orderCutoff || '').match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
  if(!m) return null;
  let h = +m[1]; const min = +(m[2] || 0); const ap = (m[3] || '').toLowerCase();
  if(ap === 'pm' && h < 12) h += 12;
  if(ap === 'am' && h === 12) h = 0;
  const now = new Date(), cut = new Date(now); cut.setHours(h, min, 0, 0);
  const left = Math.max(0, Math.round((cut - now) / 60000));
  return { open: left > 0, mins: left, left: left >= 60 ? `${Math.floor(left / 60)}h ${left % 60}m` : `${left}m` };
}
/* Shop hours: Monday–Saturday 8 AM–2 PM and 4 PM–9 PM; Sunday 8 AM–2 PM.
   Minutes from midnight, by day of the week (0 = Sunday). */
const SHOP_HOURS = { 0: [[480, 840]], week: [[480, 840], [960, 1260]] };
function clockLabel(mins){
  const h = Math.floor(mins / 60), m = mins % 60;
  return `${h % 12 || 12}${m ? ':' + String(m).padStart(2, '0') : ''} ${h < 12 ? 'AM' : 'PM'}`;
}
function shopStatus(now = new Date()){
  const slots = d => SHOP_HOURS[d] || SHOP_HOURS.week;
  const day = now.getDay(), mins = now.getHours() * 60 + now.getMinutes();
  const cur = slots(day).find(([a, b]) => mins >= a && mins < b);
  if(cur) return { open: true, text: `Open till ${clockLabel(cur[1])}` };
  const later = slots(day).find(([a]) => mins < a);
  if(later) return { open: false, text: `Opens ${clockLabel(later[0])}` };
  return { open: false, text: `Opens ${clockLabel(slots((day + 1) % 7)[0][0])} tomorrow` };
}

// Carousel dots follow the swipe; slides advance on their own until the
// customer touches them, and never under reduced motion. The same timer
// keeps the delivery card's cutoff current.
let HOME_TIMER = null;
function wireHome(){
  clearInterval(HOME_TIMER);
  const track = document.getElementById('promos');
  const dots = [...document.querySelectorAll('#promo-dots i')];
  const step = () => (track?.firstElementChild?.offsetWidth || 1) + 10;
  let touched = false;
  if(track){
    track.addEventListener('scroll', () => {
      const i = Math.round(track.scrollLeft / step());
      dots.forEach((d, j) => d.classList.toggle('on', i === j));
    }, { passive:true });
    track.addEventListener('touchstart', () => { touched = true; }, { passive:true, once:true });
  }
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let tick = 0;
  HOME_TIMER = setInterval(() => {
    if(S.screen !== 'home' || !document.getElementById('home-scroll')){ clearInterval(HOME_TIMER); return; }
    tick++;
    if(tick % 12 === 0){
      const el = document.getElementById('cut'), c = shopLabel();
      if(el){ el.className = 'ticket-cut ' + c.tone; el.innerHTML = `<div class="ticket-k">${c.k}</div><div class="ticket-v">${c.v}</div>`; }
    }
    if(track && !touched && !still && dots.length > 1){
      const next = (Math.round(track.scrollLeft / step()) + 1) % dots.length;
      track.scrollTo({ left: next * step(), behavior: 'smooth' });
    }
  }, 5000);
}

  if(!q) return `<button class="addbtn" onclick="event.stopPropagation();addToCart('${jsStr(pk)}','${v.id}')">Add</button>`;
  return `<div class="qty" onclick="event.stopPropagation()">

function stepQty(pk,vid,d){
  const v=CATALOGUE[pk].variants.find(x=>x.id===vid);

  if(d<0 && cur<=v.moq) next=0;               // below MOQ = remove the line entirely
  if(d<0 && next>0 && next<v.moq) next=v.moq;
  setQty(pk,vid,next);

  if(n>0 && n<v.moq){ n=v.moq; toast(`Minimum order is ${v.moq} ${CATALOGUE[pk].unit}s`,'info'); }

  setQty(pk,vid,n);

let PLACING_ORDER = false;   // re-entry guard: never place the same order twice
async function placeOrder(){
  if(PLACING_ORDER) return;   // a place is already in flight (double-tap / retry)
  if(ORDER_BLOCKED){ toast('Your account is on hold for new orders. Please contact us to clear your account before ordering.','alert'); return; }
  if(APPCFG.ordersDisabled){ toast('Ordering is temporarily paused. Please try again a little later.','alert'); return; }
  if(!S.user?.address){ toast('Add a delivery address before placing your order','alert'); editDeliveryAddressSheet(); return; }
  PLACING_ORDER = true;
  const t=cartTotals();
  const btn=document.getElementById('btn-place'); btn.dataset.lbl=`Place order · ${money(t.total)}`;
  busy('btn-place',true,'Placing order');
  const payload={
    items:S.cart.map(i=>({pk:i.pk,vid:i.vid,name:i.name,label:i.label,unit:i.unit,qty:i.qty,price:i.price})),
    subtotal:t.sub, gst:t.gst, delivery:t.del, platform:t.plat, total:t.total,
    payment:PAY, customerType:S.user?.customerType||'b2c',
    company:S.user?.company||null, gstin:S.user?.gstin||null,
    name:S.user?.name, phone:S.user?.phone, address:S.user?.address||null,
  };
  let r;
  if(FIRESTORE_LIVE && FB){
    try{
      const out = await FB.placeOrder({
        items:payload.items, subtotal:payload.subtotal, gst:payload.gst,
        delivery:payload.delivery, total:payload.total, payment:payload.payment,
        type:payload.customerType, company:payload.company, gstin:payload.gstin,
        name:payload.name, phone:payload.phone,
      });
      r = { success:true, data:{ ...out, deliverySlot:'Tomorrow, 7:00 AM – 11:00 AM' } };
    }catch(e){
      r = { success:false, code:e.code, message:e.message };
    }
  } else {
    r = await API.post('/orders',payload);
  }
  busy('btn-place',false, payload.total?`Place order · ${money(t.total)}`:'Place order');
  if(!r.success){
    PLACING_ORDER = false;   // failed — allow another attempt
    if(r.code==='INSUFFICIENT'){ toast(r.message,'alert'); return; }
    toast(r.message||'Could not place the order. Try again.','alert'); return;
  }
  S.lastOrder={...r.data, items:payload.items, total:payload.total, payment:PAY};
  // Refresh the in-memory order list from storage right away — the order was
  // just written to DB.orders, but S.orders (what the Orders/Invoices/Home
  // screens render) is only otherwise reloaded on app boot, so without this a
  // freshly placed order wouldn't show until the app was restarted.
  S.cart=[]; persist(); await Promise.all([loadWallet(), loadOrders()]);
  go('placed',{replace:true});
  // Fire-and-forget: doesn't block navigation, but once the doc id comes
  // back it's saved onto the local order record so the tracking screen can
  // live-listen to status changes and self-cancel against the right doc.
  if(window.mirrorOrderToFirestore){
    window.mirrorOrderToFirestore({...payload, orderNo:r.data.orderNo}).then(firestoreId=>{
      if(!firestoreId) return;
      const list = DB.orders;
      const idx = list.findIndex(o=>o.orderNo===r.data.orderNo);
      if(idx!==-1){ list[idx] = {...list[idx], firestoreId}; DB.orders = list; }
      if(S.lastOrder?.orderNo===r.data.orderNo) S.lastOrder = {...S.lastOrder, firestoreId};
      const oi = S.orders.findIndex(o=>o.orderNo===r.data.orderNo);
      if(oi!==-1) S.orders[oi] = {...S.orders[oi], firestoreId};
    });
  }
  PLACING_ORDER = false;   // order placed and navigated away — ready for the next one
}

const STATUS = {
  placed:{l:'Placed',c:'b'}, pending_confirmation:{l:'Pending confirmation',c:'a'},
  confirmed:{l:'Confirmed',c:'b'}, packed:{l:'Packed',c:'a'},
  out_for_delivery:{l:'Out for delivery',c:'a'}, delivered:{l:'Delivered',c:'g'}, cancelled:{l:'Cancelled',c:'r'},
  denied:{l:'Denied',c:'r'},
};
async function loadOrders(){
  // Orders live in DB.orders (localStorage, 'mda_orders') — the durable,
  // correctly-keyed record of what this device actually ordered, including
  // the firestoreId patched on at placement time for live status/cancel.
  // FB.orders(uid) was a dead end: it queried Firestore docs by a 'uid'
  // field that mirrorOrderToFirestore() never writes (it writes
  // createdByUid, under a separate anonymous auth session), so it always
  // returned an empty list and silently wiped out the real local order
  // history every time this ran — this was the "can't track my order" bug.
  const r=await API.get('/orders'); S.orders=r.success?r.data:[];
}
function scrOrders(){
  return `<div class="screen on">
    ${navBar('Orders',{noBack:true,sub:S.user?.company||''})}
    <div class="scroll" id="orders-body">${ordersBody()}</div>
    ${tabBar()}
  </div>`;
}
function ordersBody(){
  if(!S.orders.length) return stateBlock('receipt','No orders yet',
    'Once you place an order it will appear here, and you can reorder it with one tap.',
    `<button class="btn" style="max-width:220px;" onclick="switchTab('catalogue')">Start an order</button>`);
  return `<div>${S.orders.map(o=>{
    const st=STATUS[o.status]||STATUS.placed;
    return `<div class="lrow" onclick="openOrder('${jsStr(o.orderNo)}')" style="align-items:flex-start;">
      <div class="lrow-body">
        <div class="row between mb-4"><span class="t-base num" style="font-weight:700;">${esc(o.orderNo)}</span>
          <span class="pill ${st.c}">${st.l}</span></div>

        <div class="t-base num mt-4" style="font-weight:600;">${money(o.total)}</div>
      </div>
      ${icon('right',18)}
    </div>`;
  }).join('')}<div style="height:calc(24px + var(--safe-b));"></div></div>`;
}
let ORDER_STATUS_UNSUB = null;
const CANCELLABLE_STATUSES = ['placed','confirmed','pending_confirmation','packed']; // must match backend/firestore.rules isCancellable()
function stopOrderStatusListener(){
  stopDeliveryListener(); if(ORDER_STATUS_UNSUB){ ORDER_STATUS_UNSUB(); ORDER_STATUS_UNSUB=null; } }
function startOrderStatusListener(o){
  stopOrderStatusListener();
  if(!o?.firestoreId || !window.listenToOrderDoc) return;
  // The whole document, not just status — the rider's coordinates ride along
  // on the same snapshot, so the map updates with no extra listener or poll.
  if(o.status === 'out_for_delivery') startDeliveryListener(o);
  ORDER_STATUS_UNSUB = window.listenToOrderDoc(o.firestoreId, (data)=>{
    if(!data) return;
    const status = data.status;
    const code = data.deliveryCode || null;
    const codeChanged = code !== (S.order?.deliveryCode || null);
    const changed = status && status !== S.order?.status;
    // The office's reason for denying (or cancelling) travels with the status.
    const why = { deniedReason: data.deniedReason || S.order?.deniedReason || null,
                  deniedBy: data.deniedBy || S.order?.deniedBy || null };
    const whyChanged = why.deniedReason !== (S.order?.deniedReason || null);
    if(!changed && !codeChanged && !whyChanged) return;
    S.order = {...S.order, status: status || S.order?.status, deliveryCode: code, ...why};
    // Rider position lives on the delivery record (keyed by the office's
    // delivery code), so start/stop that listener as the order enters and
    // leaves out_for_delivery, or when the office issues a fresh code.
    if(S.order.status === 'out_for_delivery') startDeliveryListener(S.order);
    else { stopDeliveryListener(); S.order = {...S.order, riderLat:null, riderLng:null}; }
    if(changed || whyChanged){
      const patch = { status: S.order.status, ...why };
      const list = DB.orders;
      const idx = list.findIndex(x=>x.orderNo===o.orderNo);
      if(idx!==-1){ list[idx] = {...list[idx], ...patch}; DB.orders = list; }
      const oi = S.orders.findIndex(x=>x.orderNo===o.orderNo);
      if(oi!==-1) S.orders[oi] = {...S.orders[oi], ...patch};
    }
    if(S.screen==='order'){

        // disappeared (e.g. the order went out for delivery). Don't leave it
        // hanging over a screen that no longer offers the action.

      renderTrackMap();
    }
  });
}

/* ── Maps: MapLibre + OpenFreeMap ─────────────────────────────────────────
   OpenFreeMap serves free vector maps — streets, buildings, place names —
   with no API key, no account and no usage cap, and MapLibre draws them
   sharply at any zoom. mdMap() and friends wrap it with the lat-first calls
   the screens use (MapLibre itself speaks lng-first). A phone that can't run
   WebGL gets null back, and the screen says so instead of breaking.

   Customer tracking: coordinates arrive from the delivery record through a
   Firestore listener, so there is no polling — the scooter moves when the
   rider moves. */
const MAP_STYLE = 'https://tiles.openfreemap.org/styles/liberty';
function mdMap(el, center, zoom){
  if(!window.maplibregl) return null;
  try{
    if(!mdMap.worker){ maplibregl.setWorkerUrl('vendor/maplibre/maplibre-gl-csp-worker.js'); mdMap.worker = true; }
    const map = new maplibregl.Map({ container: el, style: MAP_STYLE, center: [center[1], center[0]], zoom,
      attributionControl: { compact: true }, dragRotate: false, pitchWithRotate: false });
    map.touchZoomRotate.disableRotation();
    // Credit stays one tap away on the ⓘ button instead of covering the map.
    map.once('load', () => el.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show'));
    return map;
  }catch(e){ console.warn('Map unavailable on this device:', e); return null; }
}
function mdPin(map, at, html){
  const box = document.createElement('div'); box.innerHTML = html;
  return new maplibregl.Marker({ element: box.firstElementChild }).setLngLat([at[1], at[0]]).addTo(map);
}
function mdMove(marker, at){ marker.setLngLat([at[1], at[0]]); }
function mdFit(map, a, b){
  map.fitBounds([[Math.min(a[1], b[1]), Math.min(a[0], b[0])], [Math.max(a[1], b[1]), Math.max(a[0], b[0])]],
    { padding: 60, maxZoom: 16, duration: 0 });
}
// Who is bringing the order, roughly how far and how soon, and how fresh
// that position is. Distance is a straight line; the time assumes ~20 km/h
// through city traffic, so it is labelled "about".
function riderCardHtml(o){
  const dest = (typeof S.user?.lat === 'number' && typeof S.user?.lng === 'number') ? [S.user.lat, S.user.lng] : null;
  const km = dest && o.riderLat ? distKm([o.riderLat, o.riderLng], dest) : null;
  const eta = km != null ? Math.max(1, Math.round(km / 20 * 60)) : null;
  const at = riderAtMs(o), secs = at ? Math.max(0, Math.round((Date.now() - at) / 1000)) : null;
  const fresh = secs == null ? '' : secs < 60 ? 'updated just now' : `updated ${Math.round(secs / 60)} min ago`;
  const away = km == null ? 'Heading to you' : `${km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km'} away · about ${eta} min`;
  return `<div class="rider-av">🛵</div>
    <div class="grow"><b>${esc(o.riderName || 'Your rider')} is on the way</b>
      <span>${away}${fresh ? ' · ' + fresh : ''}</span></div>
    ${o.riderPhone ? `<a class="rider-call" href="tel:${esc(o.riderPhone)}" aria-label="Call the rider">${icon('phone',18)}</a>` : ''}`;
}
let TRACK_MAP = null, TRACK_RIDER = null, TRACK_DEST = null, TRACK_FITTED = false;
let DELIVERY_UNSUB = null;   // the rider-position listener, separate from status
// Older than this and we say so rather than showing a stale dot as if live.
const RIDER_STALE_MS = 90 * 1000;

function destroyTrackMap(){
  if(TRACK_MAP){ try{ TRACK_MAP.remove(); }catch(e){} }
  TRACK_MAP = null; TRACK_RIDER = null; TRACK_DEST = null; TRACK_FITTED = false;
}
/* The rider writes to deliveries/{code}, not to the order, so the map
   needs its own listener alongside the status one. Started only while an
   order is out for delivery (and its code has arrived), torn down after. */
function startDeliveryListener(o){
  stopDeliveryListener();
  if(!o?.deliveryCode || !window.listenToDelivery) return;
  DELIVERY_UNSUB = window.listenToDelivery(o.deliveryCode, (d)=>{
    if(!d) return;
    const moved = d.riderLat !== S.order?.riderLat || d.riderLng !== S.order?.riderLng;
    if(!moved) return;
    S.order = {...S.order, riderLat: d.riderLat ?? null, riderLng: d.riderLng ?? null,
               riderAt: d.riderAt ?? null, riderName: d.riderName ?? null, riderPhone: d.riderPhone ?? null};
    // Only the marker moves — a repaint would rebuild and re-centre the map.
    if(S.screen==='order') renderTrackMap();
  });
}
function stopDeliveryListener(){
  if(DELIVERY_UNSUB){ try{ DELIVERY_UNSUB(); }catch(e){} DELIVERY_UNSUB = null; }
}
function riderAtMs(o){
  const t = o?.riderAt;
  if(!t) return 0;
  if(typeof t?.toMillis === 'function') return t.toMillis();
  if(typeof t?.seconds === 'number') return t.seconds * 1000;
  const d = new Date(t);
  return isNaN(d) ? 0 : d.getTime();
}
function renderTrackMap(){
  const o = S.order;
  const el = document.getElementById('track-map');
  // Screen changed, or the delivery ended — tear the map down so it can't
  // hold a stale position or leak a map instance.
  if(!el || !o || o.status !== 'out_for_delivery'){ destroyTrackMap(); return; }
  const card = document.getElementById('rider-card');
  if(card) card.innerHTML = riderCardHtml(o);
  if(!o.riderLat) return;
  if(TRACK_MAP && TRACK_MAP.getContainer() !== el) destroyTrackMap();
  const rider = [o.riderLat, o.riderLng];
  // The customer's own saved pin; the order document carries no coordinates.
  const dest = (typeof S.user?.lat === 'number' && typeof S.user?.lng === 'number') ? [S.user.lat, S.user.lng] : null;
  if(!TRACK_MAP){
    el.innerHTML = '';
    TRACK_MAP = mdMap(el, rider, 15);
    if(!TRACK_MAP){ el.innerHTML = '<div class="map-empty">This phone can’t show the map, but your rider is on the way.</div>'; return; }
  }
  if(!TRACK_RIDER) TRACK_RIDER = mdPin(TRACK_MAP, rider, '<div class="rider-dot">🛵</div>');
  else mdMove(TRACK_RIDER, rider);
  if(dest && !TRACK_DEST) TRACK_DEST = mdPin(TRACK_MAP, dest, '<div class="dest-dot">🏠</div>');
  // Fit both points once, then leave the view alone so the map doesn't fight
  // a customer who has panned or zoomed it themselves.
  if(!TRACK_FITTED && dest){ mdFit(TRACK_MAP, rider, dest); TRACK_FITTED = true; }
  // Honesty about staleness: a rider who loses signal or force-quits leaves a
  // last-known position behind, and showing that as "live" is worse than saying so.
  const age = Date.now() - riderAtMs(o);
  const old = el.querySelector('.map-stale');
  if(age > RIDER_STALE_MS){
    const mins = Math.round(age / 60000);
    const msg = 'Last update ' + (mins < 60 ? mins + ' min ago' : 'over an hour ago') + ' — the rider may have lost signal.';
    if(old) old.textContent = msg;
    else { const d = document.createElement('div'); d.className = 'map-stale'; d.textContent = msg; el.appendChild(d); }
  } else if(old) old.remove();
}

/* Android's in-app WebView has no print support — window.print() does

const INVOICE_PAGE = 'https://modern-dairy-pune.web.app/invoice/';
function invoicePayload(o){
  return {
    v:1,
    biz:{ n:APPCFG.businessName, a:APPCFG.address, e:APPCFG.email, p:APPCFG.supportPhone },
    no:o.orderNo, at:o.placedAt,

function openInvoicePdf(){
  const o=S.order; if(!o) return;
  const bytes = new TextEncoder().encode(JSON.stringify(invoicePayload(o)));
  let bin=''; bytes.forEach(b=>{ bin+=String.fromCharCode(b); });
  const data = btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  window.open(INVOICE_PAGE + '#' + data, '_blank');
}

function scrReorder(){
  const hist={};

/* ═══════════════════════════════════════════════════════════
   22. RIDER MODE — live delivery tracking
   ═══════════════════════════════════════════════════════════
   Five taps on the logo. No password: the rider gives their name and phone
   (so the office knows who is carrying the order), then types the order
   number the office issued them.

   That number is the key. It is the document id of deliveries/{orderNo}, and
   the rules allow `get` but never `list` — so knowing a number fetches
   exactly that one delivery and nothing else. A rider never touches an order
   document, which is what keeps every other customer's record out of reach.

   BACKGROUNDING IS THE HARD PART. A rider cannot ride with the screen on, and
   Android suspends timers and GPS in a backgrounded web view within seconds.
   Tracking therefore runs through @capacitor-community/background-geolocation,
   which holds a real foreground service with a persistent notification — the
   only way Android permits continuous location. The browser fallback below is
   for desktop testing and pauses when the tab hides, which is exactly why it
   is not what riders use.

   Tracking cannot outlive the trip: the admin sets active:false when the
   status moves on, and the rules then refuse every further write. */
const RIDER_KEY = 'mda_rider';
let RIDER = {
  name: null,
  phone: null,
  delivery: null,     // the deliveries/{orderNo} document being tracked
  looking: false,
  lookupTried: null,
  watchId: null,      // background-geolocation watcher
  webWatchId: null,   // browser fallback
  lastFix: null,
  pushes: 0,
  error: null,
};

function riderRestore(){
  try{
    const v = JSON.parse(localStorage.getItem(RIDER_KEY) || 'null');
    if(v && v.name){ RIDER.name = v.name; RIDER.phone = v.phone || null; }
  }catch(e){}
}
function riderRemember(){
  try{ localStorage.setItem(RIDER_KEY, JSON.stringify({ name: RIDER.name, phone: RIDER.phone })); }catch(e){}
}
function riderForget(){
  try{ localStorage.removeItem(RIDER_KEY); }catch(e){}
}

  riderRestore();
  return `<div class="screen on" style="background:var(--brand);">

function doRiderStart(){

/* ── Find the delivery ─────────────────────────────────── */
// A code typed with or without dashes, or the whole rider link pasted in.
function riderCode(s){ return String(s || '').split('#').pop().toUpperCase().replace(/[^A-Z0-9]/g, ''); }
async function riderLookup(typed){
  const raw = riderCode(typed ?? document.getElementById('f-rider-order')?.value);
  if(!raw){ RIDER.error = 'Enter the delivery code.'; paint(); return; }
  // Order and bill numbers (MD-1041) run in sequence, so anyone could guess
  // the next one; deliveries are found only by the office's random code.
  // Say so plainly instead of a bare "not found".
  if(raw.length !== 10){
    RIDER.error = /^(MD)?\d+$/.test(raw)
      ? 'That is the order / bill number. For the customer’s safety the app finds a delivery by its delivery code instead — the 10 letters and numbers in the office’s WhatsApp message (like K7QMP-4XA9R). Or just tap the link in that message: it opens in the browser, no app needed.'
      : 'A delivery code has 10 letters and numbers, like K7QMP-4XA9R. Check the office’s WhatsApp message, or tap the link in it.';
    RIDER.lookupTried = raw;
    paint(); return;
  }
  RIDER.error = null;
  RIDER.looking = true;
  paint();
  try{
    const d = await window.riderFindDelivery(raw);
    if(!d){
      // Either the code is wrong, or the office has not marked the order out
      // for delivery yet — the delivery record only exists from that moment.
      RIDER.error = 'No delivery found for that code. Check it, and that the office has marked the order out for delivery.';
      RIDER.lookupTried = raw;
    }else if(d.active === false){
      RIDER.error = 'That delivery has already been completed.';
      RIDER.lookupTried = raw;
    }else{
      RIDER.delivery = d;
      RIDER.lookupTried = null;
    }
  }catch(e){
    RIDER.error = 'Could not look that up. Check your connection.';
  }finally{
    RIDER.looking = false;
    paint();
  }
}

function riderLiveHtml(){
  const live = RIDER.watchId || RIDER.webWatchId, fix = RIDER.lastFix;
  return live ? `<div class="t-sm muted mb-12" style="line-height:1.5;">
      Your location is going to the customer${fix ? ` · last sent ${esc(dtFmt(fix.at))}` : '…'}<br>

      Google Maps — tracking keeps running in the background.</div>`
    : `<div class="t-sm muted mb-12" style="line-height:1.5;">
      Start the trip and the customer sees you move on their map. Android will ask for location —

}

/* Rider map: where the rider is, where the order is going, how far is left.
   A location update moves the markers only — rebuilding the map on every fix
   would keep throwing away the view the rider is looking at. */
let RIDER_MAP = null, RIDER_ME = null, RIDER_DEST = null, RIDER_FITTED = false;
function riderDest(d){ return d && typeof d.destLat === 'number' && typeof d.destLng === 'number' ? [d.destLat, d.destLng] : null; }
function distKm(a, b){
  const rad = x => x * Math.PI / 180, dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}
function riderDistText(){
  const dest = riderDest(RIDER.delivery), fix = RIDER.lastFix;
  if(!dest) return 'No map pin saved for this customer — Navigate uses the address.';
  if(!fix) return '';
  const km = distKm([fix.lat, fix.lng], dest);
  return km < 1 ? `${Math.round(km * 1000)} m away (straight line)` : `${km.toFixed(1)} km away (straight line)`;
}
// Turn-by-turn is Google Maps' job; background tracking keeps running meanwhile.
function riderNavigate(){
  const d = RIDER.delivery; if(!d) return;
  const dest = riderDest(d);
  const to = dest ? `${dest[0]},${dest[1]}` : (d.address ? encodeURIComponent(d.address) : '');
  if(!to){ toast('No address on this delivery — call the customer','alert'); return; }
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${to}&travelmode=driving`, '_blank');
}
function destroyRiderMap(){
  if(RIDER_MAP){ try{ RIDER_MAP.remove(); }catch(e){} }
  RIDER_MAP = null; RIDER_ME = null; RIDER_DEST = null; RIDER_FITTED = false;
}
function renderRiderMap(){
  const el = document.getElementById('rider-map');
  const d = RIDER.delivery;
  if(!el || !d){ destroyRiderMap(); return; }
  if(RIDER_MAP && RIDER_MAP.getContainer() !== el) destroyRiderMap();
  const dest = riderDest(d);
  const me = RIDER.lastFix ? [RIDER.lastFix.lat, RIDER.lastFix.lng] : null;
  if(!dest && !me){
    el.innerHTML = '<div class="map-empty">No map pin for this customer yet.<br>Start the trip to see yourself on the map.</div>';
    return;
  }
  if(!RIDER_MAP){
    el.innerHTML = '';
    RIDER_MAP = mdMap(el, me || dest, 15);
    if(!RIDER_MAP){ el.innerHTML = '<div class="map-empty">This phone can’t show the map — use Navigate for directions.</div>'; return; }
  }
  if(dest && !RIDER_DEST) RIDER_DEST = mdPin(RIDER_MAP, dest, '<div class="dest-dot">🏠</div>');
  if(me){ if(!RIDER_ME) RIDER_ME = mdPin(RIDER_MAP, me, '<div class="rider-dot">🛵</div>'); else mdMove(RIDER_ME, me); }
  if(me && dest && !RIDER_FITTED){ mdFit(RIDER_MAP, me, dest); RIDER_FITTED = true; }
}

function riderClearOrder(){
  if(RIDER.watchId || RIDER.webWatchId){ toast('Stop tracking first','alert'); return; }
  RIDER.delivery = null; RIDER.error = null; RIDER.lookupTried = null; paint();
}

async function doRiderSignOut(){
  await riderStopTracking(true);
  riderForget();
  RIDER = { name:null, phone:null, delivery:null, looking:false, lookupTried:null,
            watchId:null, webWatchId:null, lastFix:null, pushes:0, error:null };
  go('account', {replace:true});
}

/* ── The tracking itself ───────────────────────────────── */
async function riderPush(lat, lng, accuracy){
  const d = RIDER.delivery;
  if(!d) return;
  try{
    await window.riderPushLocation(d.code, lat, lng, accuracy, RIDER.name, RIDER.phone);
    RIDER.lastFix = { lat, lng, at: new Date().toISOString() };
    RIDER.pushes++;
    if(S.screen === 'rider'){
      const live = document.getElementById('rider-live-text'); if(live) live.innerHTML = riderLiveHtml();
      const dist = document.getElementById('rider-dist'); if(dist) dist.textContent = riderDistText();
      renderRiderMap();
    }
  }catch(e){
    // The rules refuse writes once active:false — that is the office closing
    // the delivery, not a fault. Stop cleanly and say so.
    RIDER.error = 'Tracking stopped — this delivery has been closed by the office.';
    await riderStopTracking(true);
    paint();
  }
}

async function riderStartTracking(){
  if(!RIDER.delivery) return;
  RIDER.error = null;
  const BG = window.Capacitor?.Plugins?.BackgroundGeolocation;
  if(BG){
    try{
      RIDER.watchId = await BG.addWatcher({
        // Android requires this text; it is what the rider sees in the
        // persistent notification for as long as tracking runs.
        backgroundMessage: 'Sharing your location with the customer',
        backgroundTitle: 'Delivery in progress',
        requestPermissions: true,
        stale: false,
        distanceFilter: 12,       // metres — real movement, not GPS jitter
      }, (location, error) => {
        if(error){
          RIDER.error = error.code === 'NOT_AUTHORIZED'
            ? 'Location permission is off. Enable “Allow all the time” in Settings, then start again.'
            : 'Location error: ' + (error.message || error.code);
          paint();
          return;
        }
        if(location && riderFixUsable(location.accuracy)) riderPush(location.latitude, location.longitude, location.accuracy);
      });
      paint();
      return;
    }catch(e){
      RIDER.error = 'Could not start background tracking: ' + (e?.message || e);
    }
  }
  // Browser fallback — desktop testing only. This one DOES pause when the tab
  // is hidden, which is precisely why the plugin above is what ships.
  if(!navigator.geolocation){ RIDER.error = 'This device has no location support.'; paint(); return; }
  RIDER.webWatchId = navigator.geolocation.watchPosition(
    p => { if(riderFixUsable(p.coords.accuracy)) riderPush(p.coords.latitude, p.coords.longitude, p.coords.accuracy); },
    e => { RIDER.error = 'Location error: ' + e.message; paint(); },
    { enableHighAccuracy:true, maximumAge:0, timeout:20000 });
  paint();
}
/* A rough tower/Wi-Fi fix (worse than 60 m) would make the scooter jump
   around the customer's map, so it is skipped — unless nothing better has
   come for 30 s, when a rough position beats a frozen one. */
function riderFixUsable(accuracy){
  if(accuracy == null || accuracy <= 60) return true;
  const last = RIDER.lastFix ? Date.parse(RIDER.lastFix.at) : 0;
  return Date.now() - last > 30000;
}

async function riderStopTracking(quiet){
  const BG = window.Capacitor?.Plugins?.BackgroundGeolocation;
  if(RIDER.watchId && BG){
    try{ await BG.removeWatcher({ id: RIDER.watchId }); }catch(e){}
    RIDER.watchId = null;
  }
  if(RIDER.webWatchId != null){
    try{ navigator.geolocation.clearWatch(RIDER.webWatchId); }catch(e){}
    RIDER.webWatchId = null;
  }
  if(!quiet){ toast('Tracking stopped','check'); paint(); }
}

  login:scrLogin, pending:scrPending, home:scrHome,
  catalogue:scrCatalogue, product:scrProduct,
  cart:scrCart, checkout:scrCheckout, placed:scrPlaced,
  orders:scrOrders, order:scrOrder, reorder:scrReorder,
