<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#047857">
<!-- ═══════════════════════════════════════════════════════════
     CONTENT SECURITY POLICY (defence in depth)
     The app is one file of inline script with inline onclick= handlers, so
     'unsafe-inline' is unavoidable without a rewrite and this is NOT an
     anti-XSS control on its own — escaping at the sinks (esc/safeUrl/jsStr)
     is. What it does buy, and why it is worth having:
       · connect-src pins where data can be sent, so injected script cannot
         quietly POST the cart, profile or session anywhere it likes;
       · script-src pins where code can be loaded from, so a remotely
         loaded script from an attacker host is refused;
       · object-src 'none' + base-uri 'self' kill plugin embedding and
         <base> hijacking;
       · frame-ancestors blocks the app being framed for clickjacking.
     Every host below is one the app genuinely talks to — see the audit in
     the security report. Remove messagecentral/sandbox once OTP and GST
     move behind the backend.
     ═══════════════════════════════════════════════════════════ -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://checkout.razorpay.com https://*.razorpay.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' data: https://fonts.gstatic.com;
  img-src 'self' data: blob: https://res.cloudinary.com https://*.googleapis.com https://*.razorpay.com https://tiles.openfreemap.org;
  connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://cpaas.messagecentral.com https://api.sandbox.co.in https://*.razorpay.com https://fonts.googleapis.com https://fonts.gstatic.com https://api.bigdatacloud.net https://nominatim.openstreetmap.org https://tiles.openfreemap.org;
  frame-src https://*.razorpay.com https://modern-dairy-pune.firebaseapp.com;
  media-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'none';
  frame-ancestors 'none'
">
<title>Modern Dairy — Business Ordering</title>
<!-- MapLibre (CSP build), bundled rather than CDN-loaded: script-src is 'self'
     only, and its worker loads from vendor/ too. The maps themselves come from
     OpenFreeMap (tiles.openfreemap.org), which connect-src and img-src allow. -->
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<script src="vendor/maplibre/maplibre-gl-csp.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700;8..144,800&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="config.js"></script>
<script src="secrets.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════
   MODERN DAIRY — DESIGN SYSTEM
   One scale for type, space, radius, elevation. No exceptions.
   ═══════════════════════════════════════════════════════════ */
:root{
  /* ── INK · slate, AA verified on porcelain base ──────────── */
  --ink:#0F172A; --ink-2:#475569; --ink-3:#7C8798; --ink-4:#B4BCC8;
  /* ── SURFACE · milk white on a cool chiller-room ground ──── */
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#F1F4FA;
  --line:#DFE4EF; --line-2:#EBEFF6;
  /* ── BRAND · straight off the packs: "Modern" navy + crest red ── */
  --brand:#1B2A6B; --brand-2:#121D4F; --brand-3:#3A4FA8;
  --brand-tint:#EEF1FA; --brand-line:#C5CDEB;
  --crimson:#D7262F; --crimson-tint:#FDE8E9;
  /* ── ACCENTS · butter for money-off and the cutoff; frost for frozen ── */
  --butter:#FFC928; --butter-ink:#4A3600; --frost:#125C8C;
  /* ── SEMANTIC · dairy-fresh green, ghee-amber ────────────── */
  --fresh:#047857; --fresh-tint:#DCFCE7;
  --gold:#92400E;  --gold-tint:#FEF3E2;
  --warn:#92400E;  --warn-tint:#FEF3E2;
  --bad:#DC2626;   --bad-tint:#FEE2E2;
  /* ── TYPE SCALE · display → caption, distinct roles ──────── */
  --t-caption:10px; --t-xs:11px; --t-sm:12px; --t-md:13px; --t-base:14.5px;
  --t-lg:16.5px; --t-xl:19px; --t-h3:21px; --t-h2:25px; --t-h1:30px; --t-display:34px;
  --t-price:20px;
  /* ── RADIUS · restrained, product-not-toy ────────────────── */
  --r-sm:8px; --r:12px; --r-lg:16px;
  /* ── ELEVATION · low-contrast, functional not decorative ── */
  --e-1:0 1px 2px rgba(5,20,15,.06);
  --e-2:0 1px 2px rgba(5,20,15,.05), 0 4px 10px rgba(5,20,15,.06);
  --e-3:0 8px 24px rgba(4,60,40,.14);
  /* ── MOTION · quick, workmanlike ─────────────────────────── */
  --ease:cubic-bezier(.4,0,.2,1);
  --fast:110ms; --mid:170ms; --slow:240ms;
  /* ── CATEGORY ACCENTS · appetizing, functional tags not decor */
  --c-dairy:#0369A1;     --c-dairy-t:#E0F2FE;
  --c-curd:#0F766E;      --c-curd-t:#CCFBF1;
  --c-beverages:#C2410C; --c-beverages-t:#FFEDD5;
  --c-sweets:#BE185D;    --c-sweets-t:#FCE7F3;
  --c-frozen:#4338CA;    --c-frozen-t:#E0E7FF;
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-display:'Bricolage Grotesque','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --tap:44px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
/* Accessibility: honour reduced-motion (pre-delivery checklist) */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;}
}
/* Keyboard focus is always visible */
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:4px;}
/* Every interactive element shows a pointer */
button,[onclick],a,.chip,.prow,.lrow,.tab{cursor:pointer;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}   /* app shell — inner panes do the scrolling */
body{
  font-family:var(--font);font-size:var(--t-base);line-height:1.45;color:var(--ink);
  background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;}
input,textarea{outline:none;}
a{color:inherit;text-decoration:none;}
svg{display:block;flex-shrink:0;}
::-webkit-scrollbar{width:0;height:0;}

/* ── APP SHELL ─────────────────────────────────────────── */
/* height:100% (of html/body, which fill the native window) — NOT 100dvh.
   On Android WebView, 100dvh often does not shrink when the soft keyboard
   opens, so the app stayed full-height and the keyboard covered the inputs.
   With adjustResize + the Capacitor Keyboard plugin, the window resizes and
   100% follows it, so the focused field stays visible above the keyboard. */
#app{max-width:520px;margin:0 auto;height:100%;background:var(--surface);position:relative;
     display:flex;flex-direction:column;overflow:hidden;}
.screen{display:none;flex-direction:column;height:100%;min-height:0;overflow:hidden;}
.screen.on{display:flex;}
/* min-height:0 is required — without it flex items refuse to shrink below
   their content size and overflow-y:auto never engages. */
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
        overscroll-behavior:contain;}

/* ── TYPOGRAPHY · display → caption, one hierarchy, no exceptions ── */
.t-display{font-size:var(--t-display);font-weight:700;letter-spacing:-.025em;line-height:1.08;}
.t-h1{font-size:var(--t-h1);font-weight:700;letter-spacing:-.02em;line-height:1.15;}
.t-h2{font-size:var(--t-h2);font-weight:700;letter-spacing:-.018em;line-height:1.2;}
.t-h3{font-size:var(--t-h3);font-weight:700;letter-spacing:-.015em;line-height:1.22;}
.t-2xl{font-size:var(--t-h3);font-weight:700;letter-spacing:-.015em;line-height:1.22;}
.t-xl{font-size:var(--t-xl);font-weight:700;letter-spacing:-.012em;line-height:1.28;}
.t-lg{font-size:var(--t-lg);font-weight:600;letter-spacing:-.008em;line-height:1.32;}
.t-base{font-size:var(--t-base);font-weight:500;line-height:1.4;}
.t-md{font-size:var(--t-md);line-height:1.4;}
.t-sm{font-size:var(--t-sm);line-height:1.42;}
.t-xs{font-size:var(--t-xs);line-height:1.4;}
.t-caption{font-size:var(--t-caption);font-weight:600;letter-spacing:.03em;line-height:1.3;}
.t-price{font-size:var(--t-price);font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums;}
.t-label{font-size:var(--t-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.muted{color:var(--ink-2);}
.muted-2{color:var(--ink-3);}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';}
.eyebrow{font-size:var(--t-md);font-weight:700;color:var(--ink-2);}

/* ── HEADER ────────────────────────────────────────────── */
.appbar{
  background:var(--brand);color:#fff;padding:calc(var(--safe-t) + 12px) 16px 12px;
  flex-shrink:0;position:relative;z-index:10;
}
.appbar-row{display:flex;align-items:center;gap:12px;}
.topbar{
  display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 10px) 16px 10px;
  border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0;z-index:20;
}
.iconbtn{
  width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-sm);flex-shrink:0;color:var(--ink-2);margin:-10px;
}
.iconbtn:active{background:var(--line-2);}
.iconbtn.on-brand{color:#fff;}
.iconbtn.on-brand:active{background:rgba(255,255,255,.14);}

/* ── SEARCH ────────────────────────────────────────────── */
.search{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r);padding:0 12px;height:42px;
}
.search input{flex:1;border:none;background:none;font-size:var(--t-base);min-width:0;}
.search input::placeholder{color:var(--ink-3);}
.search:focus-within{border-color:var(--brand-line);background:var(--surface);}

/* ── Live tracking map ───────────────────────────────────── */
.map-wrap{position:relative;height:260px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line-2);background:#EEF1F5;}
.map-wrap .maplibregl-ctrl-attrib{font-size:10px;}
/* Who is bringing the order: under the customer's live map. */
.rider-card{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r-lg);}
.rider-av{width:40px;height:40px;border-radius:50%;background:var(--brand-tint);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.rider-card b{display:block;font-size:var(--t-base);font-weight:700;}
.rider-card .grow span{display:block;font-size:var(--t-sm);color:var(--ink-2);margin-top:1px;}
.rider-call{width:42px;height:42px;border-radius:50%;background:var(--fresh);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.map-stale{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;background:var(--warn-tint);color:var(--warn);
  border:1px solid #e9d9b0;border-radius:8px;padding:7px 10px;font-size:.78rem;font-weight:600;line-height:1.4;}
.map-empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
  color:var(--ink-3);font-size:.85rem;line-height:1.5;}
/* Map pins that explain themselves: the rider is a scooter, the address a house. */
.rider-dot,.dest-dot{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.3);line-height:1;}
.rider-dot{width:40px;height:40px;font-size:22px;border:3px solid var(--brand);}
.dest-dot{width:34px;height:34px;font-size:18px;border:3px solid var(--crimson);}
/* ── Rider mode ──────────────────────────────────────────── */
.rider-live{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--fresh);}
.rider-live i{width:8px;height:8px;border-radius:50%;background:var(--fresh);display:block;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ── BUTTONS · flat, functional, no lift/glow gimmicks ───── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:48px;padding:0 18px;border-radius:var(--r);font-size:var(--t-base);font-weight:700;
  letter-spacing:-.005em;background:var(--brand);color:#fff;width:100%;
  border:1px solid var(--brand);
  transition:background var(--fast) linear,opacity var(--fast) linear;
}
@media(hover:hover){.btn:hover{background:var(--brand-2);border-color:var(--brand-2);}}
.btn:active{opacity:.85;}
.btn:disabled{background:var(--line);color:var(--ink-3);border-color:var(--line);pointer-events:none;}
.btn-sm{height:34px;padding:0 14px;font-size:var(--t-md);border-radius:var(--r-sm);width:auto;}
.btn-ghost{background:var(--surface);color:var(--brand);border:1px solid var(--line);}
@media(hover:hover){.btn-ghost:hover{border-color:var(--brand-3);}}
.btn-ghost:active{background:var(--surface-2);}
.btn-quiet{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
.btn-danger{background:var(--surface);color:var(--bad);border:1px solid var(--line);}

/* ── FORM ──────────────────────────────────────────────── */
.field{margin-bottom:16px;}
.label{display:block;font-size:var(--t-sm);font-weight:600;color:var(--ink-2);margin-bottom:6px;}
.input{
  width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);font-size:var(--t-base);transition:border-color .12s;
}
.input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-tint);}
.input::placeholder{color:var(--ink-3);}
.input.err{border-color:var(--bad);}
.hint{font-size:var(--t-xs);color:var(--ink-3);margin-top:5px;}
.hint.err{color:var(--bad);}
.phone-field{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);}
.phone-field:focus-within{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-tint);}
.phone-cc{display:flex;align-items:center;gap:6px;padding:0 12px;height:46px;background:var(--surface-2);border-right:1px solid var(--line);font-size:var(--t-base);font-weight:600;color:var(--ink-2);flex-shrink:0;}
.phone-field input{flex:1;height:46px;border:none;padding:0 12px;font-size:var(--t-base);letter-spacing:.02em;min-width:0;}

/* ── SEGMENTED CONTROL ─────────────────────────────────── */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:3px;}
.seg-item{flex:1;height:38px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-sm);font-size:var(--t-md);font-weight:600;color:var(--ink-2);transition:background .14s,color .14s;}
.seg-item.on{background:var(--surface);color:var(--brand);box-shadow:var(--e-1);}

/* ── CHIPS ─────────────────────────────────────────────── */
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scroll-snap-type:x proximity;flex-shrink:0;border-bottom:1px solid var(--line-2);}
.chip{
  flex-shrink:0;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:var(--t-sm);font-weight:600;color:var(--ink-2);
  display:flex;align-items:center;gap:6px;white-space:nowrap;scroll-snap-align:start;
}
@media(hover:hover){.chip:hover{border-color:var(--ink-4);}}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}

/* ── PRODUCT ROW (B2B density — SKU sheet, not a social card) ── */
.plist{background:var(--surface);}
.prow{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2);align-items:flex-start;}
@media(hover:hover){.prow:hover{background:var(--surface-2);}}
.prow:active{background:var(--line-2);}
.prow{transition:background var(--fast) linear;}
.pthumb{
  width:92px;height:92px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--line-2);overflow:hidden;flex-shrink:0;
}
.pthumb img{width:100%;height:100%;object-fit:contain;padding:3px;}
.pinfo{flex:1;min-width:0;}
.pname{font-size:var(--t-base);font-weight:600;line-height:1.28;margin-bottom:2px;}
.pmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:var(--t-sm);color:var(--ink-2);}
.punit{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);}
.dot{width:3px;height:3px;border-radius:50%;background:var(--ink-4);flex-shrink:0;}
.pprice{display:flex;align-items:baseline;gap:6px;margin-top:5px;}
.price{font-size:var(--t-lg);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.mrp{font-size:var(--t-sm);color:var(--ink-3);text-decoration:line-through;font-variant-numeric:tabular-nums;}
.save{font-size:var(--t-xs);font-weight:700;color:var(--crimson);background:var(--crimson-tint);padding:2px 7px;border-radius:6px;white-space:nowrap;}
.pmoq{font-size:var(--t-xs);font-weight:600;color:var(--ink-3);margin-top:3px;}

/* ── STOCK BADGE ───────────────────────────────────────── */
.stk{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:600;}
.stk::before{content:'';width:6px;height:6px;border-radius:50%;}
.stk.in{color:var(--fresh);} .stk.in::before{background:var(--fresh);}
.stk.low{color:var(--warn);} .stk.low::before{background:var(--warn);}
.stk.out{color:var(--ink-3);} .stk.out::before{background:var(--ink-4);}

/* ── QUANTITY STEPPER · crest red, bulk-friendly, direct entry is primary ── */
.qty{display:flex;align-items:center;border-radius:var(--r-sm);overflow:hidden;background:var(--crimson);color:#fff;height:34px;}
.qty button{width:30px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.qty button:active{background:rgba(255,255,255,.16);}
.qty button:disabled{opacity:.5;pointer-events:none;}
.qty input{
  width:40px;height:100%;text-align:center;border:none;font-size:var(--t-md);font-weight:800;
  font-variant-numeric:tabular-nums;background:transparent;color:#fff;min-width:0;
}
.qty-case{font-size:var(--t-caption);color:var(--ink-3);text-align:center;margin-top:3px;font-weight:600;letter-spacing:.02em;}
.addbtn{height:34px;min-width:68px;padding:0 14px;border-radius:var(--r-sm);background:#fff;color:var(--crimson);font-size:var(--t-md);
  font-weight:800;letter-spacing:.04em;text-transform:uppercase;border:1.5px solid var(--crimson);}
.addbtn:active{background:var(--crimson-tint);}
.addbtn.out{background:#fff;color:var(--ink-3);border-color:var(--line);box-shadow:none;text-transform:none;letter-spacing:0;pointer-events:none;}

/* ── CARDS / SECTIONS · bordered, not floating ───────────── */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:hidden;}
.section{padding:16px;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;}
.section-head .t-lg{font-weight:700;}
.divider{height:10px;background:var(--bg);}

/* ── LIST ROWS ─────────────────────────────────────────── */
.lrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);min-height:var(--tap);}
.lrow:last-child{border-bottom:none;}
.lrow:active{background:var(--surface-2);}
.lrow-ic{width:34px;height:34px;border-radius:var(--r-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex-shrink:0;}
.lrow-body{flex:1;min-width:0;}

/* ── BOTTOM NAV ────────────────────────────────────────── */
.tabbar{
  display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);flex-shrink:0;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;color:var(--ink-3);position:relative;}
.tab.on{color:var(--brand);}
.tab.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--brand);}
.tab-lbl{font-size:10px;font-weight:700;letter-spacing:.015em;}
.tab-badge{
  position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;
  font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}

/* ── STICKY ORDER BAR · always shows distance-to-minimum-order ── */
.orderbar{
  position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + var(--safe-b));z-index:15;
}
.mov-track{height:3px;background:var(--line-2);border-radius:2px;overflow:hidden;margin-bottom:9px;}
.mov-fill{height:100%;background:var(--brand);border-radius:2px;transition:width .25s var(--ease);}
.mov-fill.met{background:var(--fresh);}
.mov-msg{display:flex;align-items:center;justify-content:space-between;font-size:var(--t-xs);font-weight:600;color:var(--ink-2);margin-bottom:8px;}
.mov-msg.met{color:var(--fresh);}

/* ── BANNERS ───────────────────────────────────────────── */
.banner{display:flex;gap:10px;padding:11px 12px;border-radius:var(--r-sm);font-size:var(--t-md);line-height:1.45;align-items:flex-start;}
.banner.info{background:var(--brand-tint);color:var(--brand);}
.banner.warn{background:var(--warn-tint);color:var(--warn);}
.banner.ok{background:var(--fresh-tint);color:var(--fresh);}
.banner.bad{background:var(--bad-tint);color:var(--bad);}

/* ── STATUS PILL ───────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--r-sm);font-size:var(--t-xs);font-weight:600;}
.pill.b{background:var(--brand-tint);color:var(--brand);}
.pill.g{background:var(--fresh-tint);color:var(--fresh);}
.pill.a{background:var(--warn-tint);color:var(--warn);}
.pill.r{background:var(--bad-tint);color:var(--bad);}
.pill.n{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);}

/* ── EMPTY / LOADING / ERROR STATES ────────────────────── */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 32px;text-align:center;flex:1;}
.state-ic{width:52px;height:52px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-3);margin-bottom:16px;}
.state-t{font-size:var(--t-lg);font-weight:600;margin-bottom:6px;}
.state-d{font-size:var(--t-md);color:var(--ink-2);line-height:1.5;max-width:280px;margin-bottom:20px;}
.skel{background:linear-gradient(90deg,var(--line-2) 25%,var(--line) 37%,var(--line-2) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:var(--r-sm);}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── SHEET ─────────────────────────────────────────────── */
.sheet-bg{position:fixed;inset:0;background:rgba(14,18,25,.46);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;}
.sheet-bg.on{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);
  border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:101;transform:translateY(100%);
  transition:transform .22s var(--ease);max-height:88dvh;display:flex;flex-direction:column;
  padding-bottom:var(--safe-b);border-top:1px solid var(--line);
}
.sheet.on{transform:translateY(0);}
.sheet-grip{width:34px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 4px;flex-shrink:0;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px;border-bottom:1px solid var(--line-2);flex-shrink:0;}

/* ── TOAST ─────────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translate(-50%,10px);
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--r);font-size:var(--t-md);
  font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:all .22s;max-width:88%;
  display:flex;align-items:center;gap:9px;box-shadow:var(--e-2);
}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* ── TOTALS TABLE ──────────────────────────────────────── */
.tot{display:flex;justify-content:space-between;padding:7px 0;font-size:var(--t-md);}
.tot.grand{border-top:1px solid var(--line);margin-top:7px;padding-top:12px;font-size:var(--t-lg);font-weight:700;}

/* ═══════════════════════════════════════════════════════════
   STOREFRONT
   One system, used everywhere: navy for structure and navigation, crest
   red only where money moves (ADD, the stepper, discounts, the cart
   badge), neutrals for everything else, green only for "in stock".
   White cards with 16px corners on the cool ground, 12px on controls.
   The product photos bring the colour, so nothing around them competes.
   ═══════════════════════════════════════════════════════════ */
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:24px 16px 12px;}
.shead h2{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.2;}
.shead button{font-size:var(--t-sm);font-weight:700;color:var(--brand);flex-shrink:0;}

/* ── Home masthead ── */
.mast{background:var(--brand);color:#fff;padding:calc(var(--safe-t) + 12px) 16px 0;}
.mast-row{display:flex;align-items:center;gap:12px;}
.mast-logo{width:44px;height:44px;border-radius:var(--r);background:#fff;padding:3px;object-fit:contain;flex-shrink:0;}
.mast-hi{font-size:var(--t-sm);color:rgba(255,255,255,.7);}
.mast-name{font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.015em;}
.mast-cart{position:relative;width:42px;height:42px;border-radius:var(--r);background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.mast-cart b{position:absolute;top:-4px;right:-4px;background:var(--crimson);color:#fff;font-size:10px;font-weight:800;
  min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;
  box-shadow:0 0 0 2px var(--brand);}
.mast-search{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;height:46px;padding:0 14px;
  border-radius:var(--r);background:#fff;color:var(--ink-3);text-align:left;font-size:var(--t-base);}
.mast-search input{flex:1;border:none;background:none;min-width:0;color:var(--ink);font-size:var(--t-base);}
.mast-search input::placeholder{color:var(--ink-3);}
.mast-search button{display:flex;color:var(--ink-3);}

/* ── Delivery card: tomorrow's slot and when today's ordering closes ── */
.ticket{position:relative;z-index:2;display:flex;margin:14px 0 -30px;background:#fff;color:var(--ink);
  border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:0 6px 20px rgba(12,22,60,.1);}
.ticket-slot,.ticket-cut{padding:12px 14px;min-width:0;}
.ticket-slot{flex:1;}
.ticket-cut{flex-shrink:0;text-align:right;border-left:1px solid var(--line-2);}
.ticket-k{font-size:var(--t-xs);font-weight:600;color:var(--ink-3);}
.ticket-v{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.2;
  margin-top:2px;color:var(--brand);font-variant-numeric:tabular-nums;}
.ticket-cut .ticket-v{font-size:16px;}
.ticket-cut.open .ticket-v{color:var(--fresh);}
.ticket-cut.shut .ticket-v{color:var(--ink-2);}
.home-body{padding-top:46px;}

/* ── Promotions: one treatment for every slide ── */
.promos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;padding:0 16px 2px;}
.promo{flex:0 0 86%;scroll-snap-align:start;position:relative;height:144px;border-radius:var(--r-lg);overflow:hidden;
  display:flex;text-align:left;background:var(--brand);color:#fff;}
.promo-copy{position:relative;z-index:1;width:62%;padding:16px 0 14px 16px;display:flex;flex-direction:column;justify-content:space-between;}
.promo-k{display:block;font-size:var(--t-xs);font-weight:600;color:rgba(255,255,255,.7);}
.promo-t{display:block;font-family:var(--font-display);font-size:18px;font-weight:700;line-height:1.15;letter-spacing:-.015em;margin-top:4px;}
.promo-cta{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-size:var(--t-sm);font-weight:700;
  padding:7px 12px;border-radius:999px;background:#fff;color:var(--brand);}
.promo-plate{position:absolute;right:-14px;top:50%;width:140px;height:140px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;transform:translateY(-50%);}
.promo-plate img{width:72%;height:72%;object-fit:contain;}
.promo-dots{display:flex;justify-content:center;gap:5px;margin-top:10px;}
.promo-dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s var(--ease),background .2s;}
.promo-dots i.on{width:16px;background:var(--brand);}

/* ── Category tiles: plain white, the photo is the colour ── */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px;}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 12px;border-radius:var(--r-lg);text-align:center;}
.cat:active{filter:brightness(.97);}
.cat-plate{width:74%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;margin-bottom:6px;color:var(--brand);}
.cat-plate img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;}   /* white studio ground takes the tile's tint */
.cat-lbl{font-size:var(--t-md);font-weight:700;line-height:1.2;}
.cat-n{font-size:var(--t-xs);color:var(--ink-3);}

/* ── Product card (home shelves and the catalogue grid) ── */
.shelf{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 16px;padding:0 16px 2px;}
.shelf .pcard{flex:0 0 40%;scroll-snap-align:start;}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:hidden;}
.pcard-img{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#fff;}
.pcard-img img{width:84%;height:84%;object-fit:contain;}
.pcard-img .save{position:absolute;top:8px;left:8px;}
/* The body takes the spare height, so price + ADD sit on the same line
   across a row while the pack size stays right under the name. */
.pcard-body{display:flex;flex-direction:column;gap:3px;flex:1;padding:2px 10px 0;text-align:left;}
.pcard-name{font-size:var(--t-md);font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pcard-size{font-size:var(--t-xs);color:var(--ink-3);}
.pcard-price{display:flex;align-items:baseline;gap:6px;margin-top:auto;padding-top:6px;}
.pcard-price b{font-family:var(--font-display);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
.pcard-price s{font-size:var(--t-xs);color:var(--ink-3);font-variant-numeric:tabular-nums;}
.pcard-act{margin-top:auto;padding:10px;}
.pcard-act .addbtn,.pcard-act .qty{width:100%;}
.pcard-act .qty input{flex:1;}
.pcard.out .pcard-img img{opacity:.45;filter:grayscale(1);}

/* ── Home shortcuts: one grouped list ── */
.rfd-block{padding:0 0 4px;}
.rfd-block .utils{margin-top:12px;}
.rfd-note{margin:8px 20px 0;font-size:var(--t-xs);line-height:1.5;color:var(--ink-3);}
.loc-map{height:220px;margin:0 0 10px;}
.pin-drag{cursor:grab;touch-action:none;}
.utils{margin:24px 16px 0;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:hidden;}
.util{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;color:var(--ink-3);
  border-bottom:1px solid var(--line-2);}
.util:last-child{border-bottom:none;}
.util b{display:block;font-size:var(--t-base);font-weight:700;color:var(--ink);}
.util .grow>span{display:block;font-size:var(--t-sm);color:var(--ink-2);margin-top:1px;}
.util-ic{width:36px;height:36px;border-radius:var(--r);background:var(--brand-tint);color:var(--brand);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.util-act{font-size:var(--t-sm);font-weight:700;color:var(--crimson);flex-shrink:0;}
.util-ic.g{background:#E6F5EC;color:#1D6B45;}
.util-ic.a{background:#FFF0DE;color:#8A5200;}
.live-row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;padding:0 16px 14px;}
.live-row .live-card{flex:0 0 82%;scroll-snap-align:start;}
.live-card{width:100%;text-align:left;padding:14px;border-color:var(--brand-line);background:var(--brand-tint);}
.home-foot{padding:30px 16px calc(28px + var(--safe-b));text-align:center;font-size:var(--t-xs);color:var(--ink-3);}
.home-foot img{display:block;width:32px;height:32px;object-fit:contain;opacity:.5;margin:0 auto 8px;}

/* ── Catalogue: category rail on the left, product grid on the right ── */
.cat-head{background:var(--brand);color:#fff;padding:calc(var(--safe-t) + 12px) 16px 12px;flex-shrink:0;}
.cat-head .mast-search{margin-top:12px;}
.cat-head-t{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.015em;}
.cat-layout{flex:1;min-height:0;display:flex;}
.rail{width:80px;flex-shrink:0;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line-2);padding:4px 0 24px;}
.rail-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:10px 4px;}
.rail-plate{width:52px;height:52px;border-radius:var(--r);border:1.5px solid transparent;
  display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--brand);}
.rail-plate img{width:86%;height:86%;object-fit:contain;mix-blend-mode:multiply;}
.rail-lbl{font-size:11px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.2;}
.rail-item.on{background:var(--brand-tint);}
.rail-item.on .rail-plate{border-color:var(--brand);}
.rail-item.on .rail-lbl{color:var(--brand);font-weight:700;}
.rail-item.on::after{content:'';position:absolute;right:0;top:10px;bottom:10px;width:3px;border-radius:3px 0 0 3px;background:var(--brand);}
.grid-pane{flex:1;min-width:0;background:var(--bg);}
.grid-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:14px 12px 2px;}
.grid-head h2{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-.015em;}
.grid-head span{font-size:var(--t-xs);color:var(--ink-3);flex-shrink:0;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;}

/* ── Product page ── */
.pd-hero{position:relative;height:min(84vw,400px);background:#fff;display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--line-2);cursor:zoom-in;}
.pd-hero img{max-width:80%;max-height:86%;object-fit:contain;}
.pd-zoom{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;background:#fff;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-2);}
.pd-title{padding:16px 16px 4px;}
.pd-name{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15;}
.pd-from{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:6px;font-size:var(--t-md);color:var(--ink-2);}
.pd-from b{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--ink);}
.vcard{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);}
.vcard.on{border-color:var(--brand);background:var(--brand-tint);}
.vcard-price{font-family:var(--font-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}

/* Full-screen photo: tap to zoom, scroll to look around */
.zoom{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;background:#fff;opacity:0;transition:opacity .18s;}
.zoom.on{opacity:1;}
.zoom-x{position:absolute;top:calc(var(--safe-t) + 10px);right:12px;z-index:1;width:42px;height:42px;border-radius:50%;
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink);}
.zoom-pane{flex:1;min-height:0;overflow:auto;display:flex;}
.zoom-pane img{margin:auto;width:100%;max-width:520px;object-fit:contain;cursor:zoom-in;transition:width .25s var(--ease);}
.zoom-pane img.big{width:230%;max-width:none;cursor:zoom-out;}
.zoom-hint{text-align:center;padding:12px 16px calc(16px + var(--safe-b));font-size:var(--t-sm);color:var(--ink-3);}

/* ── UTIL ──────────────────────────────────────────────── */
.row{display:flex;align-items:center;}
.between{justify-content:space-between;}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}
.grow{flex:1;min-width:0;}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.mb-4{margin-bottom:4px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.px-16{padding-left:16px;padding-right:16px}
.center{text-align:center}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hide{display:none !important;}
</style>
</head>

      },
      async customer(uid) {
        const s = await getDoc(doc(db, 'customers', uid));
        return s.exists() ? s.data() : null;
      },
      async saveCustomer(uid, data) {
        await setDoc(doc(db, 'customers', uid), data, { merge: true });
      },
      async orders(uid) {
        return asList(await getDocs(
          query(collection(db, 'orders'), where('uid', '==', uid), orderBy('at', 'desc'), limit(50))));
      },
      async ledger(uid) {
        return asList(await getDocs(
          query(collection(db, 'ledger'), where('uid', '==', uid), orderBy('at', 'desc'), limit(50))));
      },

      /* ── Order placement. Credit orders debit the balance inside a
           transaction so the same rupee cannot be spent twice. ── */
      async placeOrder(order) {
        const uid = auth.currentUser?.uid;
        if (!uid) throw new Error('Please sign in again.');

        if (order.payment !== 'credit') {
          const ref = await addDoc(collection(db, 'orders'),
            { ...order, uid, status: 'placed', paymentStatus: 'pending', at: serverTimestamp() });
          return { orderNo: ref.id, total: order.total };
        }

        return await runTransaction(db, async tx => {
          const cRef = doc(db, 'customers', uid);
          const snap = await tx.get(cRef);
          const prev = Number(snap.data()?.balance || 0);
          if (prev < order.total) {
            const e = new Error(`Insufficient business credit. You need ₹${(order.total - prev).toLocaleString('en-IN')} more.`);
            e.code = 'INSUFFICIENT'; e.shortfall = order.total - prev; throw e;
          }
          const next = prev - order.total;
          const oRef = doc(collection(db, 'orders'));
          tx.set(oRef, { ...order, uid, status: 'placed', paymentStatus: 'paid', at: serverTimestamp() });
          tx.update(cRef, { balance: next });
          tx.set(doc(collection(db, 'ledger')), {
            uid, type: 'ORDER_DEBIT', amount: order.total,
            prevBalance: prev, newBalance: next,
            orderId: oRef.id, note: 'Order payment', at: serverTimestamp(),
          });
          return { orderNo: oRef.id, total: order.total, balance: next };
        });
      },
    });
  } catch (err) {
    console.error('Firebase failed to load:', err);
    window.__fbResolve(null);                  // fall back to demo mode
  }
}
</script>
<script type="module">
/* ── Order mirroring to Firestore — separate from the main (still dormant)
   Firebase bridge above. Until the backend deploys to Cloud Run, this is
   how the admin website (legal/admin/) sees real orders: every placed
   order gets an anonymous, create-only write straight to Firestore
   alongside the existing local-storage order (which the customer app
   itself keeps reading from, unchanged). Firestore rules only allow
   create here — never read/update/delete — see backend/firestore.rules. ── */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, addDoc, doc, getDoc, getDocs, updateDoc, setDoc, onSnapshot, serverTimestamp, query, where, limit } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const mirrorConfig = {
  apiKey: "AIzaSyD-3RNHrI9ZPmdTioLiuCi2gjwdNXZH8HI",
  authDomain: "modern-dairy-pune.firebaseapp.com",
  projectId: "modern-dairy-pune",
  storageBucket: "modern-dairy-pune.firebasestorage.app",
  messagingSenderId: "711745048614",
  appId: "1:711745048614:web:29e8641911c62c1bb856e7",
};
const mirrorApp = initializeApp(mirrorConfig, 'orderMirror');
const mirrorAuth = getAuth(mirrorApp);
const mirrorDb = getFirestore(mirrorApp);

// Statuses a customer can still self-cancel from. Must match isCancellable()
// in backend/firestore.rules — the rule is the real enforcement, this is
// just so the UI doesn't offer a cancel that the rule would reject anyway.
const CANCELLABLE_STATUSES = ['placed', 'confirmed', 'pending_confirmation', 'packed'];

async function ensureSignedIn() {
  if (!mirrorAuth.currentUser) await signInAnonymously(mirrorAuth);
  return mirrorAuth.currentUser;
}

function buildOrderDoc(order, uid) {
  return {
    orderNo: order.orderNo, items: order.items, subtotal: order.subtotal,
    gst: order.gst, delivery: order.delivery, platform: order.platform ?? 0, total: order.total,
    payment: order.payment, customerType: order.customerType,
    company: order.company || null, gstin: order.gstin || null,
    name: order.name || null, phone: order.phone || null, address: order.address || null,
    status: 'placed', createdByUid: uid,
  };
}

// Plain Firestore REST fallback — bypasses the Firestore SDK's real-time
// (WebChannel/streaming) transport entirely, using plain HTTP instead.
// Kept as a fallback because that streaming transport has a known history
// of breaking silently under WebView network interception (e.g. Capacitor's
// CapacitorHttp plugin, now disabled, was exactly this) — plain fetch is
// far more reliable in a Capacitor WebView than a long-lived stream.
function toFirestoreValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'string') return { stringValue: v };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(toFirestoreValue) } };
  if (typeof v === 'object') return { mapValue: { fields: Object.fromEntries(Object.entries(v).map(([k, val]) => [k, toFirestoreValue(val)])) } };
  return { stringValue: String(v) };
}
async function mirrorOrderViaRest(order, uid, idToken) {
  const fields = toFirestoreValue({ ...buildOrderDoc(order, uid), placedAt: new Date().toISOString() }).mapValue.fields;
  const res = await fetch('https://firestore.googleapis.com/v1/projects/modern-dairy-pune/databases/(default)/documents/orders', {
    method: 'POST',
    headers: { Authorization: `Bearer ${idToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields }),
  });
  if (!res.ok) throw new Error(`Firestore REST write failed (HTTP ${res.status})`);
  const body = await res.json();
  return body.name.split('/').pop();
}

// Returns the created Firestore doc id (or null if the write failed
// entirely), so the app can target this exact doc later for live status
// sync and self-cancel — no query/read-list permission needed for that.
window.mirrorOrderToFirestore = async function(order) {
  try {
    const user = await ensureSignedIn();
    const ref = await addDoc(collection(mirrorDb, 'orders'), { ...buildOrderDoc(order, user.uid), placedAt: serverTimestamp() });
    return ref.id;
  } catch (e) {
    console.warn('Firestore SDK write failed, falling back to plain REST:', e);
    try {
      const user = await ensureSignedIn();
      const token = await user.getIdToken();
      return await mirrorOrderViaRest(order, user.uid, token);
    } catch (e2) {
      console.warn('Could not mirror order to Firestore at all (admin website will not see this one):', e2);
      return null;
    }
  }
};

// Live status sync: called when the order-tracking screen is open. Returns
// an unsubscribe function. onChange(status|null) fires once immediately
// with the current value, then again on every admin-side status change.
window.listenToOrderStatus = function(firestoreId, onChange) {
  try {
    return onSnapshot(doc(mirrorDb, 'orders', firestoreId),
      snap => onChange(snap.exists() ? snap.data().status : null),
      err => { console.warn('Order status listener failed:', err); onChange(null); });
  } catch (e) {
    console.warn('Could not start order status listener:', e);
    return () => {};
  }
};

// Live TRACKING listener — the whole order doc, not just its status, so the
// rider's coordinates reach the tracking map. Kept separate from
// listenToOrderStatus above so the existing status flow is untouched.
window.listenToOrderDoc = function(firestoreId, onChange) {
  try {
    return onSnapshot(doc(mirrorDb, 'orders', firestoreId),
      snap => onChange(snap.exists() ? snap.data() : null),
      err => { console.warn('Order listener failed:', err); onChange(null); });
  } catch (e) {
    console.warn('Could not start order listener:', e);
    return () => {};
  }
};

/* ── Rider mode ───────────────────────────────────────────────────────────
   Riders have no account. They give a name and phone (attribution, so the
   office knows who is carrying an order) and enter the delivery code the
   office sent them — the same code as in the rider web link. That code is the
   document id of deliveries/{code}: random, so unlike an order number it
   can't be guessed.

   The rules allow `get` on a delivery but never `list`, so holding a code
   fetches exactly that one record — the customer's address and phone for THAT
   delivery — and gives no way to enumerate any other. A rider never reads or
   writes an order document, which is what keeps every other customer's full
   record (GSTIN, items, totals) out of reach entirely.

   Anonymous auth still applies: the rules require request.auth != null, so a
   completely unauthenticated caller gets nothing. */
window.riderFindDelivery = async function(code) {
  await ensureSignedIn();
  const snap = await getDoc(doc(mirrorDb, 'deliveries', String(code)));
  return snap.exists() ? { ...snap.data(), code: String(code) } : null;
};
window.riderPushLocation = async function(code, lat, lng, accuracy, riderName, riderPhone) {
  await ensureSignedIn();
  await updateDoc(doc(mirrorDb, 'deliveries', String(code)), {
    riderLat: lat, riderLng: lng, riderAt: serverTimestamp(),
    riderAccuracy: accuracy ?? null,
    riderName: String(riderName || '').slice(0, 80),
    riderPhone: riderPhone ? String(riderPhone).slice(0, 20) : null,
  });
};
// The customer watches the same delivery record for the rider's position.
// The office writes its code onto their order, which only they can read.
window.listenToDelivery = function(code, onChange) {
  try {
    return onSnapshot(doc(mirrorDb, 'deliveries', String(code)),
      snap => onChange(snap.exists() ? snap.data() : null),
      err => { console.warn('Delivery listener failed:', err); onChange(null); });
  } catch (e) {
    console.warn('Could not start delivery listener:', e);
    return () => {};
  }
};

// Self-cancel, customer-initiated only — enforced server-side by
// backend/firestore.rules (owner + still-cancellable + status-only diff),
// this call just attempts it and reports success/failure.
window.cancelOrderInFirestore = async function(firestoreId) {
  await ensureSignedIn();
  await updateDoc(doc(mirrorDb, 'orders', firestoreId), { status: 'cancelled', cancelledAt: serverTimestamp() });
};

/* ── Request a driver ──────────────────────────────────────────────────────
   Create-only from here; the office moves it open → assigned → done in the
   admin website, and the customer may withdraw it while it is still open. */
window.createDriverRequest = async function(req) {
  const user = await ensureSignedIn();
  const ref = await addDoc(collection(mirrorDb, 'driver_requests'), {
    reason: req.reason, note: req.note || null,
    company: req.company || null, name: req.name || null, phone: req.phone,
    address: req.address || null, gstin: req.gstin || null,
    customerType: req.customerType === 'b2b' ? 'b2b' : 'b2c',
    ...(req.orderNo ? { orderNo: String(req.orderNo).slice(0, 30) } : {}),
    status: 'open', createdByUid: user.uid, createdAt: serverTimestamp(),
  });
  return ref.id;
};
window.listenToDriverRequest = function(id, onChange) {
  try {
    return onSnapshot(doc(mirrorDb, 'driver_requests', id),
      snap => onChange(snap.exists() ? snap.data() : null),
      err => { console.warn('Driver request listener failed:', err); onChange(null); });
  } catch (e) {
    console.warn('Could not start driver request listener:', e);
    return () => {};
  }
};
window.cancelDriverRequest = async function(id) {
  await ensureSignedIn();
  await updateDoc(doc(mirrorDb, 'driver_requests', id), { status: 'cancelled' });
};

/* ── Account Center sync ───────────────────────────────────────────────────
   Accounts still live on the phone. This copies the profile — never the
   password — to customer_accounts/{installUid}_{phone} so the office can see
   and manage every customer, and returns the office's edits (the `admin`
   map) so the caller can apply them back to the phone. */
const ACCOUNT_SYNC_FIELDS = ['name', 'company', 'gstin', 'address', 'lat', 'lng', 'acctLast4'];
window.syncCustomerAccount = async function(profile) {
  const phone = String(profile.phone || '');
  if (!/^[6-9]\d{9}$/.test(phone)) return null;
  const user = await ensureSignedIn();
  const data = { phone, type: profile.type === 'b2b' ? 'b2b' : 'b2c', bankVerified: !!profile.bankVerified };
  for (const k of ACCOUNT_SYNC_FIELDS) data[k] = profile[k] ?? null;
  const ref = doc(mirrorDb, 'customer_accounts', `${user.uid}_${phone}`);
  const snap = await getDoc(ref);
  if (snap.exists()) await updateDoc(ref, { ...data, updatedAt: serverTimestamp() });
  else await setDoc(ref, { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
  return snap.exists() ? (snap.data().admin || null) : null;
};

// Registers this device's FCM token so the broadcast relay (a scheduled
// GitHub Action — see backend/scripts/send-broadcast-push.js, no Cloud
// Function/Blaze needed) knows where to push admin broadcasts. Doc ID is
// the token itself, so re-registering just overwrites in place.
window.registerPushToken = async function(fcmToken, audience) {
  try {
    const user = await ensureSignedIn();
    // uid lets the admin target a single customer's device directly (e.g.
    // "notify this specific order's customer") instead of only broadcasting
    // to an entire audience — same uid this device's orders are created
    // under (buildOrderDoc's createdByUid), since both use ensureSignedIn().
    await setDoc(doc(mirrorDb, 'device_tokens', fcmToken), { token: fcmToken, audience, uid: user.uid, updatedAt: serverTimestamp() });
  } catch (e) { console.warn('Could not register push token:', e); }
};

<script>
/* ═══════════════════════════════════════════════════════════
   1. RUNTIME CONFIG
   Everything here is overridden by the backend /config endpoint
   so the Admin Panel can change it without an APK rebuild.
   ═══════════════════════════════════════════════════════════ */
let FB = null;   // Firebase bridge, resolved during boot
// Firestore rules currently deny ALL direct client access (by design — only the
// backend, via the Admin SDK, is meant to touch it, and the backend isn't deployed
// yet). So even though FB/Firebase Auth is live for real phone-number verification,
// every FB.* call that reads/writes Firestore must stay off until the backend ships.
// Flip this to true once the backend is deployed and this app talks to it, or once
// Firestore rules are updated to allow authenticated client access directly.
const FIRESTORE_LIVE = false;
const CONFIG = window.APP_CONFIG;   // build/environment config — see config.js

/* ── Real OTP via Message Central's VerifyNow REST API — sends and verifies
   an actual SMS with no backend and no Firebase/GCP billing involved.
   Switched from MSG91 after confirming (via their own delivery logs) that
   their plain API requires a DLT-registered template — a real TRAI/India
   regulatory requirement, not something fixable in code. Message Central's
   OTP route runs on their own pre-approved compliant routes, so no DLT/
   Sender ID registration is needed on our side. Takes priority over
   Firebase/demo-mode OTP everywhere below. Profile/wallet/orders still live
   in local demo storage until the backend is deployed. ── */
/* SECURITY: these used to be hardcoded literals in this file, which is
   committed to a PUBLIC GitHub repo — i.e. the account credential was
   readable by anyone on the internet. They now come from window.APP_SECRETS
   (www/secrets.js), which CI overwrites from GitHub Actions secrets at build
   time and which is never committed with real values. See the header comment
   in www/secrets.js: this stops public scraping, it does NOT make them
   server-side — that happens when backend/ deploys. */
const SECRETS = (typeof window !== 'undefined' && window.APP_SECRETS) || {};
const OTP_CUSTOMER_ID = SECRETS.OTP_CUSTOMER_ID || '';
const OTP_AUTH_TOKEN  = SECRETS.OTP_AUTH_TOKEN  || '';
// Whether a REAL Message Central credential was injected at build time. Gates
// whether otpSend actually hits the paid provider vs uses the test bypass.
const OTP_HAS_CREDENTIAL = Boolean(OTP_CUSTOMER_ID && OTP_AUTH_TOKEN);
// Whether the Message Central send/verify PATH is the one to use at all (as
// opposed to the Firebase/legacy-API fallbacks). This is true in both a real
// build (credential present) and a demo build (the test-code bypass stands in
// for the provider), so every caller that gates on OTP_READY keeps routing
// through otpSend/otpVerify — otpSend itself decides real-vs-test inside.
// Keeping these separate is the fix for a regression where demo builds, which
// have no credential, stopped taking the OTP path and fell through to the
// unconfigured Firebase/API branches, breaking 0000 login entirely.
const OTP_READY = true;
let OTP_VERIFICATION_ID = null; // set by otpSend(), consumed by otpVerify()

// One free-to-use test number for development — signing in with this number
// never calls the real (paid) OTP provider at all, so testing the login flow
// repeatedly doesn't cost anything.
const TEST_PHONE = '9000000000';
const TEST_OTP = '0000';

/* SECURITY — AUTHENTICATION BYPASS, NOW CLOSED.
   This was `const OTP_TESTING_MODE = true`, hardcoded. While true, EVERY
   phone number (not just TEST_PHONE) skipped the real SMS and accepted the
   fixed code 0000 — and the app even printed "Testing mode — the code is
   0000" on screen. Anyone who typed any 10-digit number plus 0000 was signed
   in as that number's account: a complete, one-tap account takeover of every
   user, shipped in a public APK.

   It is now derived, not hardcoded: testing mode is only ever on in a build
   that has NO real OTP credential injected (a dev/demo build). Any build
   that can actually send SMS always demands a real code. There is no way to
   ship a production APK with the bypass on by accident.

   Two separate things:
   - OTP_TESTING_MODE = EVERY number accepts 0000. This is the dangerous one,
     so it is ONLY ever on in a demo build (no real credential). A real build
     never lets every number use a fixed code.
   - The dedicated TEST_PHONE (9000000000) shortcut stays available in ALL
     builds (including real ones), so the app can be tested without burning
     real SMS. That's a SINGLE known test number, not "every number", so it's
     not a broad backdoor — only sign-ins to 9000000000 itself use 0000, and
     every other number still gets a real SMS code. */
const OTP_TESTING_MODE = !OTP_HAS_CREDENTIAL;
// The test-number (9000000000 + 0000) path is always allowed; only the
// all-numbers testing mode is gated to demo builds.
const OTP_TEST_BYPASS_ALLOWED = true;

/* ── Real GST verification via sandbox.co.in — called directly from the app,
   same reasoning as OTP: the backend that would normally own this isn't
   deployed yet.

   SECURITY: the live key + secret used to be hardcoded literals right here,
   in a file committed to a PUBLIC GitHub repo — free for anyone to scrape
   and spend real money against. They now come from window.APP_SECRETS,
   injected by CI at build time and never committed. They still ship inside
   the APK (unavoidable while there is no server: sandbox.co.in tokens
   expire, so there's no long-lived-token trick as with OTP), so BOTH VALUES
   MUST BE ROTATED — the old ones are public — and this must move to
   backend/src/services/gstClient.js the moment the backend is deployed. ── */
const GST_API_KEY = SECRETS.GST_API_KEY || '';
const GST_API_SECRET = SECRETS.GST_API_SECRET || '';
const GST_READY = Boolean(GST_API_KEY && GST_API_SECRET);
let GST_ACCESS_TOKEN = null;
const TEST_GSTIN = '27AAPFM1234A1ZV'; // free — bypasses the real (paid) GST provider entirely

/* Structural + checksum validation of a GSTIN, done locally before any
   paid lookup. Two reasons this is a security control and not just UX:
   it stops the app being used to burn our metered GST quota with junk
   input, and it means a malformed value never reaches the provider. The
   algorithm is the standard GSTIN mod-36 check digit. */
const GSTIN_CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const GSTIN_RE = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
function isWellFormedGSTIN(gstin){
  const g = String(gstin||'').toUpperCase();
  if(!GSTIN_RE.test(g)) return false;
  let sum = 0;
  for(let i=0;i<14;i++){
    const v = GSTIN_CHARS.indexOf(g[i]);
    if(v < 0) return false;
    const p = v * (i % 2 === 0 ? 1 : 2);
    sum += Math.floor(p / 36) + (p % 36);
  }
  return GSTIN_CHARS[(36 - (sum % 36)) % 36] === g[14];
}

async function gstAuthenticate() {
  if (!GST_READY) { const e = new Error('GST verification is not configured in this build.'); e.code = 'NOT_CONFIGURED'; throw e; }

    method: 'POST',
    headers: { 'x-api-key': GST_API_KEY, 'x-api-secret': GST_API_SECRET, 'x-api-version': '1.0' },
  }), 20000, 'Could not reach the GST verification provider. Check your connection and try again.');
  const data = await res.json().catch(() => ({}));
  const token = data.access_token || data.data?.access_token;
  if (!res.ok || !token) throw new Error(data.message || `GST provider auth failed (HTTP ${res.status})`);
  GST_ACCESS_TOKEN = token;
  return token;
}
function gstFetchVerify(gstin, token) {
  return withTimeout(fetch('https://api.sandbox.co.in/gst/compliance/public/gstin/verify', {
    method: 'POST',
    headers: { authorization: token, 'x-api-key': GST_API_KEY, 'x-api-version': '1.0', 'Content-Type': 'application/json' },
    body: JSON.stringify({ gstin }),
  }), 20000, 'Could not reach the GST verification provider. Check your connection and try again.');
}
async function verifyGSTIN(gstin) {
  if (gstin === TEST_GSTIN) return { legalName: 'Test Business Pvt Ltd', tradeName: 'Test Business', status: 'Active', stateCode: gstin.slice(0, 2) };
  if (!isWellFormedGSTIN(gstin)) throw new Error('That GSTIN is not valid — check the 15 characters and try again.');
  const blocked = throttleCheck('gstLookup', 'device');
  if (blocked) throw new Error(blocked);
  throttleFail('gstLookup', 'device');   // every metered lookup counts
  let token = GST_ACCESS_TOKEN || await gstAuthenticate();
  let res = await gstFetchVerify(gstin, token);
  if (res.status === 401) { token = await gstAuthenticate(); res = await gstFetchVerify(gstin, token); }
  let body = {};
  try { body = await res.json(); } catch (e) { /* non-JSON error body — fall through with res.status only */ }
  const data = body.data?.data;
  if (!res.ok || !data || data.validGstin === false) {
    throw new Error(body.message || 'GSTIN not found or invalid.');
  }
  return { legalName: data.legalName, tradeName: data.tradeName || data.legalName, status: data.status, stateCode: data.stateCode };
}

/* ═══════════════════════════════════════════════════════════
   BANK-ACCOUNT OWNERSHIP CHECK (business anti-fraud)
   GSTIN + business name + PAN are all public/derivable, so verifying them
   only proves a business is REAL — not that the applicant OWNS it. The one
   thing a fraudster using someone's public GSTIN cannot produce is that
   business's BANK ACCOUNT. So a business signup must verify a bank account
   whose holder name matches the GST legal name. Uses sandbox.co.in's
   penny-less verification (no ₹1 deposit) with the same auth as GST.

   NOTE: the account number is used only to run the check — we store only the
   verified result (matched name + last 4 digits), never the full number. Like
   GST, this call runs client-side until the backend ships; it's throttled to
   limit abuse of the paid API and must move server-side on deploy. ── */
function gstBankFetch(ifsc, accountNumber, token) {
  return withTimeout(fetch(
    `https://api.sandbox.co.in/bank/${encodeURIComponent(ifsc)}/accounts/${encodeURIComponent(accountNumber)}/penniless-verify`,
    { headers: { authorization: token, 'x-api-key': GST_API_KEY, 'x-api-version': '1.0' } }),
    25000, 'Could not reach the bank verification service. Check your connection and try again.');
}
// Free test path, paired with TEST_GSTIN. That GSTIN resolves to a fictional
// "Test Business Pvt Ltd", so accepting one fixed account for it lets a demo
// build finish business signup without the paid provider — and it can't be
// used to pass as any real business.
const TEST_BANK = { ifsc: 'TEST0000001', account: '000123456789' };
async function verifyBankAccount(ifsc, accountNumber) {
  if (ifsc === TEST_BANK.ifsc && accountNumber === TEST_BANK.account) {
    if (LOGIN.gstin !== TEST_GSTIN) throw new Error('The test bank account only works with the test GSTIN.');
    return { name: 'Test Business Pvt Ltd', exists: true };
  }
  if (!GST_READY) { const e = new Error('Bank verification is not configured in this build.'); e.code = 'NOT_CONFIGURED'; throw e; }
  const blocked = throttleCheck('bankVerify', 'device');
  if (blocked) throw new Error(blocked);
  throttleFail('bankVerify', 'device');           // every metered check counts
  let token = GST_ACCESS_TOKEN || await gstAuthenticate();
  let res = await gstBankFetch(ifsc, accountNumber, token);
  if (res.status === 401) { token = await gstAuthenticate(); res = await gstBankFetch(ifsc, accountNumber, token); }
  let body = {};
  try { body = await res.json(); } catch (e) { /* non-JSON — fall through with status only */ }
  const data = body.data || {};
  if (!res.ok || data.account_exists === false || !data.name_at_bank) {
    throw new Error(body.message || 'That bank account could not be verified. Check the number and IFSC.');
  }
  return { name: String(data.name_at_bank), exists: true };
}

// Fuzzy name match between the bank account holder and the GST legal name.
// Ignores common business suffixes and word order so legitimate variants
// ("XYZ Enterprises" vs "XYZ") pass, while an unrelated name (a fraudster's
// own account) scores ~0 and is rejected.
const NAME_NOISE = new Set(['PRIVATE','LIMITED','PVT','LTD','LLP','AND','CO','COMPANY','CORPORATION','ENTERPRISES','ENTERPRISE','TRADERS','TRADING','INDUSTRIES','THE','MS','M','S','SONS','INDIA','STORE','STORES','SHOP','AGENCIES','AGENCY','DISTRIBUTORS','DISTRIBUTOR','FOODS','DAIRY','MILK','PROP','PROPRIETOR']);
function nameTokens(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(t=>t && !NAME_NOISE.has(t)); }
function nameMatchScore(a, b){
  const ta=nameTokens(a), tb=nameTokens(b);
  if(!ta.length || !tb.length) return 0;
  const setB=new Set(tb);
  const common=ta.filter(t=>setB.has(t)).length;
  return common / Math.min(ta.length, tb.length);
}
function bankNameMatches(bankName, gstName){ return nameMatchScore(bankName, gstName) >= 0.6; }

function bankForm(){
  const legal = LOGIN.gstData?.legalName || LOGIN.company || 'your business';
  return `
    <div class="banner ok mb-16">${icon('check',17)}<div><b>GSTIN verified</b><br>${esc(legal)}</div></div>
    <div class="banner info mb-16">${icon('shield',17)}<div>To confirm you represent this business, verify a bank account in the business's name. We check the account holder's name matches — we don't store your account number.</div></div>
    <div class="field"><label class="label">Bank account number</label>
      <input class="input" id="f-acct" inputmode="numeric" autocomplete="off" placeholder="Business account number" value="${esc(LOGIN.acctNo||'')}"></div>
    <div class="field"><label class="label">IFSC code</label>
      <input class="input" id="f-ifsc" maxlength="11" placeholder="e.g. HDFC0001234" value="${esc(LOGIN.ifsc||'')}" style="text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()">
      <div class="hint" id="h-ifsc">${LOGIN.gstin===TEST_GSTIN
        ? `Testing? Use account <b>${TEST_BANK.account}</b> with IFSC <b>${TEST_BANK.ifsc}</b>.`
        : 'The account should be in the name registered under this GSTIN.'}</div></div>
    <button class="btn" id="btn-bank" onclick="doVerifyBank()">Verify business account</button>
    <button class="btn btn-quiet mt-8" onclick="LOGIN.step='entry';paint()">Back</button>`;
}
async function doVerifyBank(){
  const acct=(document.getElementById('f-acct').value||'').replace(/\s/g,'');
  const ifsc=(document.getElementById('f-ifsc').value||'').trim().toUpperCase();
  setErr('f-ifsc','h-ifsc','');
  if(!/^\d{6,20}$/.test(acct)){ toast('Enter a valid bank account number','alert'); return; }
  if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)){ setErr('f-ifsc','h-ifsc','Enter a valid 11-character IFSC code.'); return; }
  LOGIN.acctNo=acct; LOGIN.ifsc=ifsc;
  const btn=document.getElementById('btn-bank'); btn.dataset.lbl='Verify business account';
  busy('btn-bank',true,'Verifying account');
  let result;
  try{ result = await verifyBankAccount(ifsc, acct); }
  catch(e){ busy('btn-bank',false,'Verify business account'); setErr('f-ifsc','h-ifsc', e.message||'Could not verify that account.'); return; }
  busy('btn-bank',false,'Verify business account');
  const gstName = LOGIN.gstData?.legalName || LOGIN.company || '';
  if(!bankNameMatches(result.name, gstName)){
    setErr('f-ifsc','h-ifsc', `That account is in the name "${result.name}", which doesn't match this GSTIN's registered business. Use the business's own bank account.`);
    return;
  }
  // Passed — record only the result, never the full account number.
  LOGIN.bankVerified = true; LOGIN.bankName = result.name; LOGIN.acctLast4 = acct.slice(-4);
  LOGIN.acctNo = '';   // drop the number from memory
  toast('Business account verified','check');
  LOGIN.step='contact'; paint();
}

/* ═══════════════════════════════════════════════════════════
   LOCATION AUTO-DETECT (signup convenience)
   Tapping "Use my current location" reads the device GPS and turns it
   into a rough area/city/PIN to pre-fill the delivery address, which the
   customer then completes (flat/shop no. + landmark) or corrects. The GPS
   pin is saved alongside the address for delivery later. Entirely optional
   — if permission is denied or GPS fails, the customer just types the
   address as before.

   Reverse geocoding uses BigDataCloud's free, key-less client endpoint —
   no API key, no billing, fine for signup-volume use. It gives area/city/
   state/PIN, not a full street address, which is exactly why the customer
   adds the specifics. Swap for Google's geocoder later for a fuller address
   once billing is on; the saved coordinates work with either.
   ═══════════════════════════════════════════════════════════ */
/* A phone's first location fix is often a rough Wi-Fi or mobile-tower
   estimate, 50–500 m out; GPS sharpens it over the next few seconds. So
   rather than take the first answer, watch for up to 12 s, keep the most
   accurate reading, and stop early once it is within 15 m. onFix(metres)
   reports progress so the screen can show the fix tightening. */
const FIX_GOOD_M = 15, FIX_WAIT_MS = 12000;
function bestFix(start, stop, onFix){
  return new Promise((resolve, reject)=>{
    let best = null, id = null, done = false;
    const end = err => {
      if(done) return; done = true; clearTimeout(timer);
      if(id != null){ try{ stop(id); }catch(e){} }
      if(err) reject(err);
      else if(best) resolve({ lat:best.latitude, lng:best.longitude, accuracy:best.accuracy });
      else reject(new Error('location-failed'));
    };
    const timer = setTimeout(() => end(), FIX_WAIT_MS);
    const fix = c => {
      if(!c || typeof c.latitude !== 'number') return;
      if(!best || (c.accuracy || 9999) < (best.accuracy || 9999)) best = c;
      onFix && onFix(best.accuracy);
      if((best.accuracy || 9999) <= FIX_GOOD_M) end();
    };
    const fail = err => {
      if(err && (err.code === 1 || /denied|permission/i.test(err.message || ''))){
        const e = new Error('permission-denied'); e.denied = true; end(e);
      }
      // Anything else (a timeout, a weak signal) — keep waiting for a fix.
    };
    Promise.resolve(start(fix, fail)).then(x => {
      id = x;
      if(done && id != null){ try{ stop(id); }catch(e){} }
    }, err => end(err));
  });
}
async function detectDeviceCoords(onFix){
  const Geo = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation;
  if(Geo){
    let perm = await Geo.checkPermissions().catch(()=>({location:'prompt'}));
    if(perm.location !== 'granted'){ perm = await Geo.requestPermissions(); }
    if(perm.location !== 'granted') { const e=new Error('permission-denied'); e.denied=true; throw e; }
    return bestFix(
      (fix, fail) => Geo.watchPosition({ enableHighAccuracy:true, timeout:FIX_WAIT_MS, maximumAge:0 },
        (pos, err) => err ? fail(err) : fix(pos && pos.coords)),
      id => Geo.clearWatch({ id }), onFix);
  }
  if(navigator.geolocation){
    return bestFix(
      (fix, fail) => navigator.geolocation.watchPosition(p => fix(p.coords), fail,
        { enableHighAccuracy:true, timeout:FIX_WAIT_MS, maximumAge:0 }),
      id => navigator.geolocation.clearWatch(id), onFix);
  }
  throw new Error('Location is not available on this device.');
}
function dedupeJoin(parts){
  const seen = new Set();
  return parts.filter(Boolean).filter(x => { const k=String(x).toLowerCase().trim(); if(!k || seen.has(k)) return false; seen.add(k); return true; }).join(', ');
}
async function reverseGeocode(lat, lng){
  // Primary: Nominatim (OpenStreetMap) — resolves down to road / neighbourhood /
  // suburb / PIN, not just city+state, so the prefilled address is genuinely
  // useful. It reflects the real coordinates — nothing is hardcoded.
  try{
    const res = await withTimeout(fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=jsonv2&addressdetails=1&zoom=18`,
      { headers: { 'Accept': 'application/json' } }), 12000, 'geocode-timeout');
    if(res.ok){
      const d = await res.json();
      const a = d.address || {};
      const road = a.road || a.pedestrian || a.footway || a.residential || '';
      const spot = a.neighbourhood || a.suburb || a.quarter || a.city_district || '';
      const city = a.city || a.town || a.village || a.county || '';
      const text = dedupeJoin([road, spot, city, a.state, a.postcode]);
      if(text) return { text, postcode: a.postcode || '', city };
    }
  }catch(e){ /* fall through to the coarse fallback */ }
  // Fallback: BigDataCloud's key-less endpoint (area/city only) if OSM is down.
  const res2 = await withTimeout(fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`),
    10000, 'Could not look up the address.');
  if(!res2.ok) throw new Error('Could not look up the address.');
  const d = await res2.json();
  return { text: dedupeJoin([d.locality, d.city, d.principalSubdivision, d.postcode]), postcode: d.postcode || '', city: d.city || d.locality || '' };
}
function setLocStatus(msg, kind){
  const el = document.getElementById('h-loc-status'); if(!el) return;
  el.textContent = msg || '';
  el.style.color = kind==='err' ? 'var(--crimson)' : kind==='ok' ? 'var(--fresh)' : 'var(--ink-3)';
}
// Most recently detected GPS pin, so whichever save path runs next (signup or
// the edit-address sheet) can persist it. `targetId` is the textarea to fill.
let LAST_DETECTED_COORDS = null;
async function useMyLocation(targetId){
  targetId = targetId || 'f-address';
  const btn = document.getElementById('btn-detect-loc');
  if(btn){ btn.disabled = true; btn.dataset.lbl = btn.textContent; btn.innerHTML = `<span class="spin"></span> Detecting…`; }
  setLocStatus('Getting your location… stay near a window for the best fix.');
  try{
    const { lat, lng, accuracy } = await detectDeviceCoords(m => setLocStatus(`Getting a precise fix… now within ${Math.round(m)} m`));
    LOGIN.lat = lat; LOGIN.lng = lng; LAST_DETECTED_COORDS = { lat, lng };
    let detected = '';
    try{ detected = (await reverseGeocode(lat, lng)).text; }catch(e){ /* keep coords even if geocode fails */ }
    const ta = document.getElementById(targetId);
    if(ta){
      // Pre-fill the detected area and leave the cursor ready for the specifics.
      ta.value = detected ? (detected + ' — ') : ta.value;
    }
    const within = accuracy ? ` (within ${Math.round(accuracy)} m)` : '';
    setLocStatus(`📍 Pinned${within}. Drag the 🏠 pin onto your exact door or gate, then add your flat/shop number and a landmark.`, 'ok');
    showPinPicker(lat, lng);
  }catch(e){
    setLocStatus(e && e.denied
      ? 'Location access was declined — no problem, just type your address below.'
      : 'Couldn’t detect your location — please type your address below.', 'err');
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = btn.dataset.lbl || 'Use my current location'; }
  }
}
/* GPS indoors can still be a building or two out, so the detected spot is
   shown on a map with a 🏠 pin the customer drags (or taps) onto their exact
   door. Wherever it ends up is the pin saved for delivery and the rider's
   directions. Without WebGL there is no map; the GPS pin stands as is. */
let PIN_MAP = null;
function showPinPicker(lat, lng){
  const status = document.getElementById('h-loc-status'); if(!status) return;
  let box = document.getElementById('loc-map');
  if(!box){ box = document.createElement('div'); box.id = 'loc-map'; box.className = 'map-wrap loc-map'; status.after(box); }
  if(PIN_MAP){ try{ PIN_MAP.remove(); }catch(e){} PIN_MAP = null; }
  box.innerHTML = '';
  const map = mdMap(box, [lat, lng], 17);
  if(!map){ box.remove(); return; }
  PIN_MAP = map;
  const el = document.createElement('div'); el.className = 'dest-dot pin-drag'; el.textContent = '🏠';
  const pin = new maplibregl.Marker({ element: el, draggable: true }).setLngLat([lng, lat]).addTo(map);
  const set = ll => {
    LOGIN.lat = ll.lat; LOGIN.lng = ll.lng; LAST_DETECTED_COORDS = { lat: ll.lat, lng: ll.lng };
    setLocStatus('📍 Pin set. This exact spot is where the rider will come.', 'ok');
  };
  pin.on('dragend', () => set(pin.getLngLat()));
  map.on('click', e => { pin.setLngLat(e.lngLat); set(e.lngLat); });
}

function withTimeout(promise, ms, timeoutMessage) {
  let timer;
  const timeout = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(timeoutMessage)), ms); });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}
async function otpApi(path, params, opts = {}) {
  const url = `https://cpaas.messagecentral.com${path}?${new URLSearchParams(params).toString()}`;
  let res;
  try {
    res = await withTimeout(fetch(url, {
      method: opts.method || 'GET',
      headers: { authToken: OTP_AUTH_TOKEN },
    }), 20000, 'The OTP provider did not respond in time. Check your internet connection and try again.');
  } catch (e) {
    throw new Error(e.message || 'Could not reach the OTP provider.');
  }
  let data = {};
  try { data = await res.json(); } catch (e) { /* non-JSON error body — fall through with res.status only */ }
  if (!res.ok || data.responseCode !== 200) {
    throw new Error(data.message || `OTP provider error (HTTP ${res.status})`);
  }
  return data;
}
async function otpSend(identifier) {
  const mobileNumber = String(identifier).replace(/^91/, '');
  // Per-number send throttle: without this the app is a free SMS-bombing
  // tool aimed at any number the attacker types, on our paid account.
  if (APPCFG.otpLoginDisabled) throw new Error('Login is temporarily unavailable. Please try again later.');
  const blocked = throttleCheck('otpSend', mobileNumber);
  if (blocked) throw new Error(blocked);
  throttleFail('otpSend', mobileNumber); // every send counts, success or not

  // Test/demo shortcut — only ever reachable in a build with no real OTP
  // credential (see OTP_TEST_BYPASS_ALLOWED). In a production build this
  // branch is dead, so no number has a fixed known code.
  if (OTP_TEST_BYPASS_ALLOWED && (OTP_TESTING_MODE || mobileNumber === TEST_PHONE)) {
    OTP_VERIFICATION_ID = 'test';
    return { responseCode: 200, message: 'SUCCESS' };
  }
  if (!OTP_HAS_CREDENTIAL) throw new Error('Phone verification is not configured in this build.');
  const data = await otpApi('/verification/v3/send',
    { countryCode: '91', customerId: OTP_CUSTOMER_ID, flowType: 'SMS', otpLength: '4', mobileNumber }, { method: 'POST' });
  OTP_VERIFICATION_ID = data.data?.verificationId || null;
  return data;
}
function otpVerify(otp) {
  // Guessing throttle. A 4-digit code is only 10,000 possibilities; without a
  // cap, an attacker holding the phone (or replaying the provider call) walks
  // the whole space in seconds. Keyed to the verification attempt, not the
  // number, so it survives the number being changed mid-flow.
  const blocked = throttleCheck('otpVerify', String(OTP_VERIFICATION_ID || 'none'));
  if (blocked) return Promise.reject(new Error(blocked));

  if (OTP_VERIFICATION_ID === 'test') {
    if (OTP_TEST_BYPASS_ALLOWED && timingSafeEqual(otp, TEST_OTP)) {
      throttleReset('otpVerify', 'test');
      return Promise.resolve({ responseCode: 200 });
    }
    throttleFail('otpVerify', String(OTP_VERIFICATION_ID));
    return Promise.reject(new Error('Incorrect or expired code.'));
  }
  if (!OTP_VERIFICATION_ID) return Promise.reject(new Error('No OTP was requested for this session — tap Resend and try again.'));
  const vid = String(OTP_VERIFICATION_ID);
  return otpApi('/verification/v3/validateOtp', { verificationId: vid, code: otp })
    .then(d => { throttleReset('otpVerify', vid); return d; })
    .catch(e => { throttleFail('otpVerify', vid); throw e; });
}
function otpRetry(identifier) {
  return otpSend(identifier); // Message Central: a fresh send is the resend
}
