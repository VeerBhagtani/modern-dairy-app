<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#047857">
<title>Modern Dairy — Business Ordering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700;8..144,800&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="config.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════
   MODERN DAIRY — DESIGN SYSTEM
   One scale for type, space, radius, elevation. No exceptions.
   ═══════════════════════════════════════════════════════════ */
:root{
  /* ── INK · slate, AA verified on porcelain base ──────────── */
  --ink:#0F172A; --ink-2:#475569; --ink-3:#7C8798; --ink-4:#B4BCC8;
  /* ── SURFACE · soft mint-porcelain, not sterile white ────── */
  --bg:#F3F8F6; --surface:#FFFFFF; --surface-2:#EEF9F3;
  --line:#DCE7E1; --line-2:#E7F2EC;
  /* ── BRAND · fresh dairy emerald + food amber accent ─────── */
  --brand:#047857; --brand-2:#065F46; --brand-3:#10B981;
  --brand-tint:#ECFDF5; --brand-line:#A7D8C4;
  --crimson:#DC2626; --crimson-tint:#FEE2E2;
  /* ── SEMANTIC · dairy-fresh green, ghee-amber ────────────── */
  --fresh:#047857; --fresh-tint:#DCFCE7;
  --gold:#92400E;  --gold-tint:#FEF3E2;
  --warn:#92400E;  --warn-tint:#FEF3E2;
  --bad:#DC2626;   --bad-tint:#FEE2E2;
  /* ── TYPE SCALE · display → caption, distinct roles ──────── */
  --t-caption:10px; --t-xs:11px; --t-sm:12px; --t-md:13px; --t-base:14.5px;
  --t-lg:16.5px; --t-xl:19px; --t-h3:21px; --t-h2:25px; --t-h1:30px; --t-display:34px;
  --t-price:20px;
  /* ── RADIUS · restrained, product-not-toy ────────────────── */
  --r-sm:6px; --r:10px; --r-lg:14px;
  /* ── ELEVATION · low-contrast, functional not decorative ── */
  --e-1:0 1px 2px rgba(5,20,15,.06);
  --e-2:0 1px 2px rgba(5,20,15,.05), 0 4px 10px rgba(5,20,15,.06);
  --e-3:0 8px 24px rgba(4,60,40,.14);
  /* ── MOTION · quick, workmanlike ─────────────────────────── */
  --ease:cubic-bezier(.4,0,.2,1);
  --fast:110ms; --mid:170ms; --slow:240ms;
  /* ── CATEGORY ACCENTS · appetizing, functional tags not decor */
  --c-dairy:#0369A1;     --c-dairy-t:#E0F2FE;
  --c-curd:#0F766E;      --c-curd-t:#CCFBF1;
  --c-beverages:#C2410C; --c-beverages-t:#FFEDD5;
  --c-sweets:#BE185D;    --c-sweets-t:#FCE7F3;
  --c-frozen:#4338CA;    --c-frozen-t:#E0E7FF;
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-display:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --tap:44px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
/* Accessibility: honour reduced-motion (pre-delivery checklist) */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;}
}
/* Keyboard focus is always visible */
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:4px;}
/* Every interactive element shows a pointer */
button,[onclick],a,.chip,.prow,.lrow,.tab{cursor:pointer;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}   /* app shell — inner panes do the scrolling */
body{
  font-family:var(--font);font-size:var(--t-base);line-height:1.45;color:var(--ink);
  background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;}
input,textarea{outline:none;}
a{color:inherit;text-decoration:none;}
svg{display:block;flex-shrink:0;}
::-webkit-scrollbar{width:0;height:0;}

/* ── APP SHELL ─────────────────────────────────────────── */
#app{max-width:520px;margin:0 auto;height:100dvh;background:var(--surface);position:relative;
     display:flex;flex-direction:column;overflow:hidden;}
.screen{display:none;flex-direction:column;height:100%;min-height:0;overflow:hidden;}
.screen.on{display:flex;}
/* min-height:0 is required — without it flex items refuse to shrink below
   their content size and overflow-y:auto never engages. */
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
        overscroll-behavior:contain;}

/* ── TYPOGRAPHY · display → caption, one hierarchy, no exceptions ── */
.t-display{font-size:var(--t-display);font-weight:700;letter-spacing:-.025em;line-height:1.08;}
.t-h1{font-size:var(--t-h1);font-weight:700;letter-spacing:-.02em;line-height:1.15;}
.t-h2{font-size:var(--t-h2);font-weight:700;letter-spacing:-.018em;line-height:1.2;}
.t-h3{font-size:var(--t-h3);font-weight:700;letter-spacing:-.015em;line-height:1.22;}
.t-2xl{font-size:var(--t-h3);font-weight:700;letter-spacing:-.015em;line-height:1.22;}
.t-xl{font-size:var(--t-xl);font-weight:700;letter-spacing:-.012em;line-height:1.28;}
.t-lg{font-size:var(--t-lg);font-weight:600;letter-spacing:-.008em;line-height:1.32;}
.t-base{font-size:var(--t-base);font-weight:500;line-height:1.4;}
.t-md{font-size:var(--t-md);line-height:1.4;}
.t-sm{font-size:var(--t-sm);line-height:1.42;}
.t-xs{font-size:var(--t-xs);line-height:1.4;}
.t-caption{font-size:var(--t-caption);font-weight:600;letter-spacing:.03em;line-height:1.3;}
.t-price{font-size:var(--t-price);font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums;}
.t-label{font-size:var(--t-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.muted{color:var(--ink-2);}
.muted-2{color:var(--ink-3);}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';}
.eyebrow{font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}

/* ── HEADER ────────────────────────────────────────────── */
.appbar{
  background:var(--brand);color:#fff;padding:calc(var(--safe-t) + 12px) 16px 12px;
  flex-shrink:0;position:relative;z-index:10;border-bottom:2px solid var(--crimson);
}
.appbar-row{display:flex;align-items:center;gap:12px;}
.topbar{
  display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 10px) 12px 10px;
  border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0;z-index:20;
}
.iconbtn{
  width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-sm);flex-shrink:0;color:var(--ink-2);margin:-10px;
}
.iconbtn:active{background:var(--line-2);}
.iconbtn.on-brand{color:#fff;}
.iconbtn.on-brand:active{background:rgba(255,255,255,.14);}

/* ── SEARCH ────────────────────────────────────────────── */
.search{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r);padding:0 12px;height:42px;
}
.search input{flex:1;border:none;background:none;font-size:var(--t-base);min-width:0;}
.search input::placeholder{color:var(--ink-3);}
.search:focus-within{border-color:var(--brand-line);background:var(--surface);}

/* ── BUTTONS · flat, functional, no lift/glow gimmicks ───── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:46px;padding:0 18px;border-radius:var(--r-sm);font-size:var(--t-base);font-weight:700;
  letter-spacing:-.005em;background:var(--brand);color:#fff;width:100%;
  border:1px solid var(--brand);
  transition:background var(--fast) linear,opacity var(--fast) linear;
}
@media(hover:hover){.btn:hover{background:var(--brand-2);border-color:var(--brand-2);}}
.btn:active{opacity:.85;}
.btn:disabled{background:var(--line);color:var(--ink-3);border-color:var(--line);pointer-events:none;}
.btn-sm{height:34px;padding:0 14px;font-size:var(--t-md);border-radius:var(--r-sm);width:auto;}
.btn-ghost{background:var(--surface);color:var(--brand);border:1px solid var(--line);}
@media(hover:hover){.btn-ghost:hover{border-color:var(--brand-3);}}
.btn-ghost:active{background:var(--surface-2);}
.btn-quiet{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
.btn-danger{background:var(--surface);color:var(--bad);border:1px solid var(--line);}

/* ── FORM ──────────────────────────────────────────────── */
.field{margin-bottom:16px;}
.label{display:block;font-size:var(--t-sm);font-weight:600;color:var(--ink-2);margin-bottom:6px;}
.input{
  width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);font-size:var(--t-base);transition:border-color .12s;
}
.input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-tint);}
.input::placeholder{color:var(--ink-3);}
.input.err{border-color:var(--bad);}
.hint{font-size:var(--t-xs);color:var(--ink-3);margin-top:5px;}
.hint.err{color:var(--bad);}
.phone-field{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);}
.phone-field:focus-within{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-tint);}
.phone-cc{display:flex;align-items:center;gap:6px;padding:0 12px;height:46px;background:var(--surface-2);border-right:1px solid var(--line);font-size:var(--t-base);font-weight:600;color:var(--ink-2);flex-shrink:0;}
.phone-field input{flex:1;height:46px;border:none;padding:0 12px;font-size:var(--t-base);letter-spacing:.02em;min-width:0;}

/* ── SEGMENTED CONTROL ─────────────────────────────────── */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:3px;}
.seg-item{flex:1;height:38px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-sm);font-size:var(--t-md);font-weight:600;color:var(--ink-2);transition:background .14s,color .14s;}
.seg-item.on{background:var(--surface);color:var(--brand);box-shadow:var(--e-1);}

/* ── CHIPS ─────────────────────────────────────────────── */
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scroll-snap-type:x proximity;flex-shrink:0;border-bottom:1px solid var(--line-2);}
.chip{
  flex-shrink:0;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:var(--t-sm);font-weight:600;color:var(--ink-2);
  display:flex;align-items:center;gap:6px;white-space:nowrap;scroll-snap-align:start;
}
@media(hover:hover){.chip:hover{border-color:var(--ink-4);}}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}

/* ── PRODUCT ROW (B2B density — SKU sheet, not a social card) ── */
.plist{background:var(--surface);}
.prow{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2);align-items:flex-start;}
@media(hover:hover){.prow:hover{background:var(--surface-2);}}
.prow:active{background:var(--line-2);}
.prow{transition:background var(--fast) linear;}
.pthumb{
  width:92px;height:92px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--line-2);overflow:hidden;flex-shrink:0;
}
.pthumb img{width:100%;height:100%;object-fit:contain;padding:3px;}
.pinfo{flex:1;min-width:0;}
.pname{font-size:var(--t-base);font-weight:600;line-height:1.28;margin-bottom:2px;}
.pmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:var(--t-sm);color:var(--ink-2);}
.punit{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);}
.dot{width:3px;height:3px;border-radius:50%;background:var(--ink-4);flex-shrink:0;}
.pprice{display:flex;align-items:baseline;gap:6px;margin-top:5px;}
.price{font-size:var(--t-lg);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.mrp{font-size:var(--t-sm);color:var(--ink-3);text-decoration:line-through;font-variant-numeric:tabular-nums;}
.save{font-size:var(--t-xs);font-weight:700;color:var(--fresh);background:var(--fresh-tint);padding:2px 6px;border-radius:4px;}
.pmoq{font-size:var(--t-xs);font-weight:600;color:var(--ink-3);margin-top:3px;}

/* ── STOCK BADGE ───────────────────────────────────────── */
.stk{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:600;}
.stk::before{content:'';width:6px;height:6px;border-radius:50%;}
.stk.in{color:var(--fresh);} .stk.in::before{background:var(--fresh);}
.stk.low{color:var(--warn);} .stk.low::before{background:var(--warn);}
.stk.out{color:var(--ink-3);} .stk.out::before{background:var(--ink-4);}

/* ── QUANTITY STEPPER · bulk-friendly, direct entry is primary ── */
.qty{display:flex;align-items:center;border:1px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;background:var(--surface);height:36px;}
.qty button{width:34px;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
.qty button:active{background:var(--surface-2);}
.qty button:disabled{color:var(--ink-4);pointer-events:none;}
.qty input{
  width:48px;height:100%;text-align:center;border:none;border-left:1px solid var(--line);
  border-right:1px solid var(--line);font-size:var(--t-md);font-weight:700;
  font-variant-numeric:tabular-nums;background:var(--surface);min-width:0;
}
.qty-case{font-size:var(--t-caption);color:var(--ink-3);text-align:center;margin-top:3px;font-weight:600;letter-spacing:.02em;}
.addbtn{height:36px;padding:0 16px;border-radius:var(--r-sm);background:var(--brand);color:#fff;font-size:var(--t-md);font-weight:700;border:1px solid var(--brand);}
.addbtn:active{opacity:.85;}
.addbtn.out{background:var(--surface);color:var(--ink-3);border-color:var(--line);pointer-events:none;}

/* ── CARDS / SECTIONS · bordered, not floating ───────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;}
.section{padding:16px;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;}
.section-head .t-lg{font-weight:700;}
.divider{height:8px;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}

/* ── LIST ROWS ─────────────────────────────────────────── */
.lrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);min-height:var(--tap);}
.lrow:last-child{border-bottom:none;}
.lrow:active{background:var(--surface-2);}
.lrow-ic{width:34px;height:34px;border-radius:var(--r-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex-shrink:0;}
.lrow-body{flex:1;min-width:0;}

/* ── BOTTOM NAV ────────────────────────────────────────── */
.tabbar{
  display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);flex-shrink:0;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;color:var(--ink-3);position:relative;}
.tab.on{color:var(--brand);}
.tab.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:2px;background:var(--crimson);}
.tab-lbl{font-size:10px;font-weight:700;letter-spacing:.015em;}
.tab-badge{
  position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;
  font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}

/* ── STICKY ORDER BAR · always shows distance-to-minimum-order ── */
.orderbar{
  position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + var(--safe-b));z-index:15;
}
.mov-track{height:3px;background:var(--line-2);border-radius:2px;overflow:hidden;margin-bottom:9px;}
.mov-fill{height:100%;background:var(--brand);border-radius:2px;transition:width .25s var(--ease);}
.mov-fill.met{background:var(--fresh);}
.mov-msg{display:flex;align-items:center;justify-content:space-between;font-size:var(--t-xs);font-weight:600;color:var(--ink-2);margin-bottom:8px;}
.mov-msg.met{color:var(--fresh);}

/* ── BANNERS ───────────────────────────────────────────── */
.banner{display:flex;gap:10px;padding:11px 12px;border-radius:var(--r-sm);font-size:var(--t-md);line-height:1.45;align-items:flex-start;}
.banner.info{background:var(--brand-tint);color:var(--brand);}
.banner.warn{background:var(--warn-tint);color:var(--warn);}
.banner.ok{background:var(--fresh-tint);color:var(--fresh);}
.banner.bad{background:var(--bad-tint);color:var(--bad);}

/* ── STATUS PILL ───────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--r-sm);font-size:var(--t-xs);font-weight:600;}
.pill.b{background:var(--brand-tint);color:var(--brand);}
.pill.g{background:var(--fresh-tint);color:var(--fresh);}
.pill.a{background:var(--warn-tint);color:var(--warn);}
.pill.r{background:var(--bad-tint);color:var(--bad);}
.pill.n{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);}

/* ── EMPTY / LOADING / ERROR STATES ────────────────────── */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 32px;text-align:center;flex:1;}
.state-ic{width:52px;height:52px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-3);margin-bottom:16px;}
.state-t{font-size:var(--t-lg);font-weight:600;margin-bottom:6px;}
.state-d{font-size:var(--t-md);color:var(--ink-2);line-height:1.5;max-width:280px;margin-bottom:20px;}
.skel{background:linear-gradient(90deg,var(--line-2) 25%,var(--line) 37%,var(--line-2) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:var(--r-sm);}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── SHEET ─────────────────────────────────────────────── */
.sheet-bg{position:fixed;inset:0;background:rgba(14,18,25,.46);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;}
.sheet-bg.on{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);
  border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:101;transform:translateY(100%);
  transition:transform .22s var(--ease);max-height:88dvh;display:flex;flex-direction:column;
  padding-bottom:var(--safe-b);border-top:1px solid var(--line);
}
.sheet.on{transform:translateY(0);}
.sheet-grip{width:34px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 4px;flex-shrink:0;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px;border-bottom:1px solid var(--line-2);flex-shrink:0;}

/* ── TOAST ─────────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translate(-50%,10px);
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--r);font-size:var(--t-md);
  font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:all .22s;max-width:88%;
  display:flex;align-items:center;gap:9px;box-shadow:var(--e-2);
}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* ── TOTALS TABLE ──────────────────────────────────────── */
.tot{display:flex;justify-content:space-between;padding:7px 0;font-size:var(--t-md);}
.tot.grand{border-top:1px solid var(--line);margin-top:7px;padding-top:12px;font-size:var(--t-lg);font-weight:700;}

/* ── UTIL ──────────────────────────────────────────────── */
.row{display:flex;align-items:center;}
.between{justify-content:space-between;}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}

<script>
/* Firebase loads as an ES module, which defers. This promise lets the main
   app wait for it instead of racing it. */
window.__fbResolve = null;
window.__fbReady = new Promise(r => { window.__fbResolve = r; });

<script type="module">
/* ═══════════════════════════════════════════════════════════════
   FIREBASE BRIDGE
   Paste the same config you used in the admin panel. Leave the
   placeholders and the app runs in offline demo mode instead.
   ═══════════════════════════════════════════════════════════════ */
// Real values for the modern-dairy-pune Firebase Web app (registered 2026-08-15) —
// commented out because Phone Auth on this project currently requires reCAPTCHA
// Enterprise, which requires the Blaze billing plan (confirmed via the Identity
// Toolkit + Cloud Billing APIs: billingEnabled=false, recaptchaenterprise.googleapis.com
// not enabled). Uncomment once Blaze is on, and OTP goes live with no other changes.
//   apiKey:            "AIzaSyD-3RNHrI9ZPmdTioLiuCi2gjwdNXZH8HI",
//   authDomain:        "modern-dairy-pune.firebaseapp.com",
//   projectId:         "modern-dairy-pune",
//   storageBucket:     "modern-dairy-pune.firebasestorage.app",
//   messagingSenderId: "711745048614",
//   appId:             "1:711745048614:web:29e8641911c62c1bb856e7",
const firebaseConfig = {
  apiKey:            "PASTE_API_KEY",
  authDomain:        "PASTE_PROJECT.firebaseapp.com",
  projectId:         "PASTE_PROJECT_ID",
  storageBucket:     "PASTE_PROJECT.appspot.com",
  messagingSenderId: "PASTE_SENDER_ID",
  appId:             "PASTE_APP_ID",
};

if (firebaseConfig.apiKey === "PASTE_API_KEY") {
  window.__fbResolve(null);                    // not configured — demo mode
} else {
  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getAuth, RecaptchaVerifier, signInWithPhoneNumber, signOut, onAuthStateChanged }
      = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    const { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc,
            query, where, orderBy, limit, serverTimestamp, runTransaction }
      = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    let confirmation = null;

    const asList = s => s.docs.map(d => ({ id: d.id, ...d.data() }));

    window.__fbResolve({
      auth, db,

      /* ── Phone OTP. Free tier: 10k verifications/month, no DLT. ── */
      async sendOTP(phone) {
        if (!window.__recaptcha) {
          window.__recaptcha = new RecaptchaVerifier(auth, 'recaptcha-holder', { size: 'invisible' });
        }
        confirmation = await signInWithPhoneNumber(auth, '+91' + phone, window.__recaptcha);
        return true;
      },
      async verifyOTP(code) {
        if (!confirmation) throw new Error('Request a code first.');
        const cred = await confirmation.confirm(code);
        return cred.user;
      },
      signOut: () => signOut(auth),
      onAuth: cb => onAuthStateChanged(auth, cb),
      uid: () => auth.currentUser?.uid || null,

      /* ── Reads ── */
      async config() {
        const s = await getDoc(doc(db, 'config', 'app'));
        return s.exists() ? s.data() : {};
      },
      async products() {
        return asList(await getDocs(collection(db, 'products')));
      },
      async customer(uid) {
        const s = await getDoc(doc(db, 'customers', uid));
        return s.exists() ? s.data() : null;
      },
      async saveCustomer(uid, data) {
        await setDoc(doc(db, 'customers', uid), data, { merge: true });
      },
      async orders(uid) {
        return asList(await getDocs(
          query(collection(db, 'orders'), where('uid', '==', uid), orderBy('at', 'desc'), limit(50))));
      },
      async ledger(uid) {
        return asList(await getDocs(
          query(collection(db, 'ledger'), where('uid', '==', uid), orderBy('at', 'desc'), limit(50))));
      },

      /* ── Order placement. Credit orders debit the balance inside a
           transaction so the same rupee cannot be spent twice. ── */
      async placeOrder(order) {
        const uid = auth.currentUser?.uid;
        if (!uid) throw new Error('Please sign in again.');

        if (order.payment !== 'credit') {
          const ref = await addDoc(collection(db, 'orders'),
            { ...order, uid, status: 'placed', paymentStatus: 'pending', at: serverTimestamp() });
          return { orderNo: ref.id, total: order.total };
        }

        return await runTransaction(db, async tx => {
          const cRef = doc(db, 'customers', uid);
          const snap = await tx.get(cRef);
          const prev = Number(snap.data()?.balance || 0);
          if (prev < order.total) {
            const e = new Error(`Insufficient business credit. You need ₹${(order.total - prev).toLocaleString('en-IN')} more.`);
            e.code = 'INSUFFICIENT'; e.shortfall = order.total - prev; throw e;
          }
          const next = prev - order.total;
          const oRef = doc(collection(db, 'orders'));
          tx.set(oRef, { ...order, uid, status: 'placed', paymentStatus: 'paid', at: serverTimestamp() });
          tx.update(cRef, { balance: next });
          tx.set(doc(collection(db, 'ledger')), {
            uid, type: 'ORDER_DEBIT', amount: order.total,
            prevBalance: prev, newBalance: next,
            orderId: oRef.id, note: 'Order payment', at: serverTimestamp(),
          });
          return { orderNo: oRef.id, total: order.total, balance: next };
        });
      },
    });
  } catch (err) {
    console.error('Firebase failed to load:', err);
    window.__fbResolve(null);                  // fall back to demo mode
  }
}
</script>
<script type="module">
/* ── Order mirroring to Firestore — separate from the main (still dormant)
   Firebase bridge above. Until the backend deploys to Cloud Run, this is
   how the admin website (legal/admin/) sees real orders: every placed
   order gets an anonymous, create-only write straight to Firestore
   alongside the existing local-storage order (which the customer app
   itself keeps reading from, unchanged). Firestore rules only allow
   create here — never read/update/delete — see backend/firestore.rules. ── */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const mirrorConfig = {
  apiKey: "AIzaSyD-3RNHrI9ZPmdTioLiuCi2gjwdNXZH8HI",
  authDomain: "modern-dairy-pune.firebaseapp.com",
  projectId: "modern-dairy-pune",
  storageBucket: "modern-dairy-pune.firebasestorage.app",
  messagingSenderId: "711745048614",
  appId: "1:711745048614:web:29e8641911c62c1bb856e7",
};
const mirrorApp = initializeApp(mirrorConfig, 'orderMirror');
const mirrorAuth = getAuth(mirrorApp);
const mirrorDb = getFirestore(mirrorApp);

// Statuses a customer can still self-cancel from. Must match isCancellable()
// in backend/firestore.rules — the rule is the real enforcement, this is
// just so the UI doesn't offer a cancel that the rule would reject anyway.
const CANCELLABLE_STATUSES = ['placed', 'confirmed', 'pending_confirmation', 'packed'];

async function ensureSignedIn() {
  if (!mirrorAuth.currentUser) await signInAnonymously(mirrorAuth);
  return mirrorAuth.currentUser;
}

function buildOrderDoc(order, uid) {
  return {
    orderNo: order.orderNo, items: order.items, subtotal: order.subtotal,
    gst: order.gst, delivery: order.delivery, total: order.total,
    payment: order.payment, customerType: order.customerType,
    company: order.company || null, gstin: order.gstin || null,
    name: order.name || null, phone: order.phone || null, address: order.address || null,
    status: 'placed', createdByUid: uid,
  };
}

// Plain Firestore REST fallback — bypasses the Firestore SDK's real-time
// (WebChannel/streaming) transport entirely, using plain HTTP instead.
// Kept as a fallback because that streaming transport has a known history
// of breaking silently under WebView network interception (e.g. Capacitor's
// CapacitorHttp plugin, now disabled, was exactly this) — plain fetch is
// far more reliable in a Capacitor WebView than a long-lived stream.
function toFirestoreValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'string') return { stringValue: v };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(toFirestoreValue) } };
  if (typeof v === 'object') return { mapValue: { fields: Object.fromEntries(Object.entries(v).map(([k, val]) => [k, toFirestoreValue(val)])) } };
  return { stringValue: String(v) };
}
async function mirrorOrderViaRest(order, uid, idToken) {
  const fields = toFirestoreValue({ ...buildOrderDoc(order, uid), placedAt: new Date().toISOString() }).mapValue.fields;
  const res = await fetch('https://firestore.googleapis.com/v1/projects/modern-dairy-pune/databases/(default)/documents/orders', {
    method: 'POST',
    headers: { Authorization: `Bearer ${idToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields }),
  });
  if (!res.ok) throw new Error(`Firestore REST write failed (HTTP ${res.status})`);
  const body = await res.json();
  return body.name.split('/').pop();
}

// Returns the created Firestore doc id (or null if the write failed
// entirely), so the app can target this exact doc later for live status
// sync and self-cancel — no query/read-list permission needed for that.
window.mirrorOrderToFirestore = async function(order) {
  try {
    const user = await ensureSignedIn();
    const ref = await addDoc(collection(mirrorDb, 'orders'), { ...buildOrderDoc(order, user.uid), placedAt: serverTimestamp() });
    return ref.id;
  } catch (e) {
    console.warn('Firestore SDK write failed, falling back to plain REST:', e);
    try {
      const user = await ensureSignedIn();
      const token = await user.getIdToken();
      return await mirrorOrderViaRest(order, user.uid, token);
    } catch (e2) {
      console.warn('Could not mirror order to Firestore at all (admin website will not see this one):', e2);
      return null;
    }
  }
};

// Live status sync: called when the order-tracking screen is open. Returns
// an unsubscribe function. onChange(status|null) fires once immediately
// with the current value, then again on every admin-side status change.
window.listenToOrderStatus = function(firestoreId, onChange) {
  try {
    return onSnapshot(doc(mirrorDb, 'orders', firestoreId),
      snap => onChange(snap.exists() ? snap.data().status : null),
      err => { console.warn('Order status listener failed:', err); onChange(null); });
  } catch (e) {
    console.warn('Could not start order status listener:', e);
    return () => {};
  }
};

// Self-cancel, customer-initiated only — enforced server-side by
// backend/firestore.rules (owner + still-cancellable + status-only diff),
// this call just attempts it and reports success/failure.
window.cancelOrderInFirestore = async function(firestoreId) {
  await ensureSignedIn();
  await updateDoc(doc(mirrorDb, 'orders', firestoreId), { status: 'cancelled', cancelledAt: serverTimestamp() });
};
</script>

const money = n => '₹' + Math.round(Number(n)||0).toLocaleString('en-IN');
const money2 = n => '₹' + (Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const dateFmt = d => new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const dtFmt = d => new Date(d).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ═══════════════════════════════════════════════════════════
   4. AUTH + STATE
   ═══════════════════════════════════════════════════════════ */
const S = {
  user: JSON.parse(localStorage.getItem('mda_user')||'null'),

  refresh: localStorage.getItem('mda_refresh')||'',

};
function persist(){
  localStorage.setItem('mda_cart', JSON.stringify(S.cart));
  if(S.user) localStorage.setItem('mda_user', JSON.stringify(S.user));
}
function isB2B(){ return S.user?.customerType === 'b2b'; }
function signOut(){
  if(FB) FB.signOut().catch(()=>{});
  ['mda_user','mda_token','mda_refresh','mda_cart'].forEach(k=>localStorage.removeItem(k));
  S.user=null;S.token='';S.cart=[];S.wallet={balance:0,txns:[]};
  go('login');
}

/* ═══════════════════════════════════════════════════════════
   5. API LAYER
   ═══════════════════════════════════════════════════════════ */
const API = {
  async call(method, path, body){
    if(CONFIG.DEMO || !CONFIG.API_BASE) return MOCK(method, path, body);
    const opt = { method, headers:{'Content-Type':'application/json', ...(S.token?{Authorization:'Bearer '+S.token}:{})} };
    if(body) opt.body = JSON.stringify(body);
    try{
      let res = await fetch(CONFIG.API_BASE+path, opt);
      if(res.status===401 && S.refresh){
        const rr = await fetch(CONFIG.API_BASE+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:S.refresh})});
        const rd = await rr.json();
        if(rd.success){
          S.token = rd.data.accessToken; localStorage.setItem('mda_token',S.token);
          opt.headers.Authorization = 'Bearer '+S.token;
          res = await fetch(CONFIG.API_BASE+path, opt);
        } else { signOut(); return {success:false,message:'Session expired. Please sign in again.'}; }
      }
      return await res.json();
    }catch(e){
      return {success:false, offline:true, message:'No connection. Check your network and try again.'};
    }
  },
  get:(p)=>API.call('GET',p),
  post:(p,b)=>API.call('POST',p,b),
  patch:(p,b)=>API.call('PATCH',p,b),
};
</script>
<script>
/* ═══════════════════════════════════════════════════════════
   6. DEMO BACKEND — mirrors the real API contract exactly.
   Keeps a genuine append-only ledger so the wallet behaves
   correctly (no silent balance edits) even offline.
   ═══════════════════════════════════════════════════════════ */
const DB = {
  get wallet(){ return JSON.parse(localStorage.getItem('mda_wallet')||'{"balance":0,"txns":[]}'); },
  set wallet(v){ localStorage.setItem('mda_wallet', JSON.stringify(v)); },
  get orders(){ return JSON.parse(localStorage.getItem('mda_orders')||'[]'); },
  set orders(v){ localStorage.setItem('mda_orders', JSON.stringify(v)); },
};
function ledgerPost(type, amount, note, orderNo){
  const w = DB.wallet;
  const prev = w.balance;
  const next = type==='DEPOSIT'||type==='REFUND'||type==='MANUAL_CREDIT' ? prev+amount : prev-amount;
  const txn = {
    id:'TXN'+Date.now().toString(36).toUpperCase(),
    type, amount, prevBalance:prev, newBalance:next,
    note, orderNo:orderNo||null, at:new Date().toISOString(),
  };
  w.balance = next; w.txns.unshift(txn); DB.wallet = w;
  return txn;
}
function orderNo(){ return 'MD'+Date.now().toString(36).toUpperCase().slice(-6); }

function MOCK(method, path, b){
  const ok = (data,extra={}) => ({success:true,data,...extra});

  if(path==='/config') return ok(APPCFG);

  if(path==='/auth/b2c/send-otp'||path==='/auth/b2b/send-otp')
    return ok(null,{message:'OTP sent. Use 123456 in demo mode.'});

  if(path==='/auth/b2b/verify-gstin'){
    const g=(b.gstin||'').toUpperCase();
    if(!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g))
      return {success:false,message:'That GSTIN format is not valid. It should look like 27AAPFM1234A1ZV.'};
    return ok({legalName:b.companyName,tradeName:b.companyName,status:'Active',stateCode:g.slice(0,2)},{message:'GSTIN verified'});
  }
  if(path==='/auth/b2b/register')
    return ok(null,{gofrugalMatched:true,requiresApproval:false,message:'Verified against our customer records. OTP sent.'});

  if(path.endsWith('/verify-otp')){
    if(b.otp!=='123456') return {success:false,message:'That OTP is incorrect. In demo mode use 123456.'};
    const b2b = path.includes('b2b');
    return ok({
      user:{id:'u1',name:b.name||S.user?.name||'Purchase Manager',phone:b.phone,
            customerType:b2b?'b2b':'b2c',company:b.company||null,gstin:b.gstin||null,
            outlet:b2b?(b.company||'Main Outlet'):'Home'},
      accessToken:'demo.'+Date.now(), refreshToken:'demo.r.'+Date.now(),
    });
  }

  if(path==='/wallet'){ const w=DB.wallet; return ok({balance:w.balance,txns:w.txns}); }
  if(path==='/wallet/topup'){
    const t=ledgerPost('DEPOSIT', Number(b.amount)||0, b.note||'Prepaid deposit');
    return ok({txn:t,balance:DB.wallet.balance});
  }

  if(path==='/orders'&&method==='POST'){
    const w=DB.wallet;
    if(b.payment==='credit'){
      if(w.balance < b.total) return {success:false,code:'INSUFFICIENT',shortfall:b.total-w.balance,
        message:`Insufficient business credit. You need ${money(b.total-w.balance)} more.`};
    }
    const no=orderNo();
    let txn=null;
    if(b.payment==='credit') txn=ledgerPost('ORDER_DEBIT', b.total, 'Order payment', no);
    // Auto-confirm when every line item is fully in stock. If any item is on
    // low stock it needs a human to check before it's confirmed — send it to
    // the super admin's Pending confirmation queue instead.
    const anyLow = (b.items||[]).some(i=>CATALOGUE[i.pk]?.variants.find(v=>v.id===i.vid)?.stock==='low');
    const status = anyLow ? 'pending_confirmation' : 'confirmed';
    const o={orderNo:no,...b,status,placedAt:new Date().toISOString(),txnId:txn?.id||null,
             deliverySlot:'Tomorrow, 7:00 AM – 11:00 AM'};
    const list=DB.orders; list.unshift(o); DB.orders=list;
    return ok({orderNo:no,total:b.total,balance:DB.wallet.balance,txnId:txn?.id||null,deliverySlot:o.deliverySlot});
  }
  if(path==='/orders'&&method==='GET') return ok(DB.orders);
  if(path.startsWith('/orders/')){
    const o=DB.orders.find(x=>x.orderNo===path.split('/')[2]);
    return o?ok(o):{success:false,message:'Order not found'};
  }
  return ok({});
}

const CAT_COLOR = {

/* Price the customer actually pays — B2B rate for business accounts */
function unitPrice(v){ return isB2B() ? v.b2b : v.mrp; }
function showsMRP(v){ return isB2B() && v.b2b < v.mrp; }
function savingPct(v){ return Math.round((1 - v.b2b/v.mrp)*100); }

function filtered(){
  const q = S.query.trim().toLowerCase();
  return Object.entries(CATALOGUE).filter(([k,p])=>{
    if(S.cat!=='all' && p.cat!==S.cat) return false;
    if(q && !p.name.toLowerCase().includes(q) && !p.cat.includes(q)) return false;
    return true;
  });
}

/* ═══════════════════════════════════════════════════════════
   8. CART — quantities are in units (packs/cases), MOQ enforced
   ═══════════════════════════════════════════════════════════ */
function cartKey(pk,vid){ return pk+'::'+vid; }
function inCart(pk,vid){ return S.cart.find(i=>i.key===cartKey(pk,vid)); }
function cartQty(pk,vid){ return inCart(pk,vid)?.qty || 0; }

function setQty(pk, vid, qty){
  const p = CATALOGUE[pk]; const v = p.variants.find(x=>x.id===vid);
  const key = cartKey(pk,vid);
  const i = S.cart.findIndex(x=>x.key===key);
  if(qty<=0){ if(i>=0) S.cart.splice(i,1); }
  else{
    const line = {key,pk,vid,qty,name:p.name,label:v.label,unit:p.unit,
                  price:unitPrice(v),mrp:v.mrp,img:p.img,moq:v.moq};
    if(i>=0) S.cart[i]=line; else S.cart.push(line);
  }
  persist(); renderTabBadge(); renderOrderBar();
  if(S.tab==='catalogue') repaintRows();
  if(S.screen==='cart') paintCart();
  if(S.screen==='product') paintProduct();
}
function addToCart(pk,vid){
  const v = CATALOGUE[pk].variants.find(x=>x.id===vid);
  const cur = cartQty(pk,vid);
  setQty(pk,vid, cur>0 ? cur+1 : v.moq);
  if(cur===0 && v.moq>1) toast(`Added ${v.moq} ${CATALOGUE[pk].unit}s — minimum order`, 'check');
}
function cartTotals(){
  const sub = S.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const gst = Math.round(sub*APPCFG.gstRate*100)/100;
  const del = (isB2B()||sub>=APPCFG.freeDeliveryAbove) ? 0 : APPCFG.deliveryFee;
  return {sub, gst, del, total: sub+gst+del, count: S.cart.reduce((s,i)=>s+i.qty,0)};
}
function movMet(){ return cartTotals().sub >= (isB2B()?APPCFG.minOrderValue:0); }
function clearCart(){ S.cart=[]; persist(); renderTabBadge(); renderOrderBar(); paintCart(); }

/* ═══════════════════════════════════════════════════════════
   9. UI PRIMITIVES
   ═══════════════════════════════════════════════════════════ */
let toastT;
function toast(msg, ic='info'){
  const t=document.getElementById('toast'); if(!t) return;

async function doB2BRegister(){
  const n=document.getElementById('f-name').value.trim();

  if(!n){ toast('Enter the contact person name','alert'); return; }
  if(!/^[6-9]\d{9}$/.test(p)){ setErr('f-phone','h-phone','Enter a valid 10-digit Indian mobile number.'); return; }

  if(pw===null) return;
  LOGIN.name=n; LOGIN.phone=p; LOGIN.password=pw; LOGIN.address=addr;

  busy('btn-reg',true,'Verifying account');

async function doSendOTP(){
  const n=document.getElementById('f-name').value.trim();
  const p=document.getElementById('f-phone').value.trim();
  const addr=document.getElementById('f-address').value.trim();
  if(!n){ toast('Enter your name','alert'); return; }
  if(!/^[6-9]\d{9}$/.test(p)){ setErr('f-phone','h-phone','Enter a valid 10-digit Indian mobile number.'); return; }
  if(!addr){ setErr('f-address','h-address','Enter a delivery address.'); return; }
  const pw = checkLoginPassword(p);
  if(pw===null) return;
  LOGIN.name=n; LOGIN.phone=p; LOGIN.password=pw; LOGIN.address=addr;
  const btn=document.getElementById('btn-otp'); btn.dataset.lbl='Send code';
  busy('btn-otp',true,'Sending');
  if(OTP_READY){
    try{ await otpSend('91'+p); }
    catch(e){ busy('btn-otp',false,'Send code'); showDebugError('Could not send the code', e); return; }
    busy('btn-otp',false,'Send code'); LOGIN.step='otp'; paint(); return;
  }
  if(FB){
    try{ await FB.sendOTP(p); }
    catch(e){
      busy('btn-otp',false,'Send code');
      toast(e.code==='auth/invalid-phone-number'?'That number is not valid.'
           :e.code==='auth/too-many-requests'?'Too many attempts. Try again later.'
           :'Could not send the code. '+(e.code||''),'alert');

  }
  const r=await API.post('/auth/b2c/send-otp',{phone:p,name:n});

  if(!r.success){ toast(r.message,'alert'); return; }
  LOGIN.step='otp'; paint();
}

  else if(FB){ try{ await FB.sendOTP(LOGIN.phone); }catch(e){ toast('Could not resend.','alert'); } }

async function doVerifyOTP(){
  const o=document.getElementById('f-otp').value.trim();
  if(o.length!==OTP_LENGTH){ setErr('f-otp','h-otp',`Enter all ${OTP_LENGTH} digits.`); return; }
  const btn=document.getElementById('btn-verify'); btn.dataset.lbl='Verify and continue';
  busy('btn-verify',true,'Verifying');
  let r;
  if(OTP_READY){
    try{
      // Message Central verifies the phone number itself (actual SMS, actual code).
      // Profile/wallet/orders still live in local demo storage — see the
      // saveCustomerAccount call below — since no backend is deployed yet.
      await otpVerify(o);
      const existing = getCustomerAccounts()[LOGIN.phone] || {};
      const profile = {
        name: LOGIN.name || existing.name || 'Customer',
        phone: LOGIN.phone,
        type: LOGIN.mode==='b2b' ? 'b2b' : 'b2c',
        address: LOGIN.address || existing.address || '',
        ...(LOGIN.mode==='b2b' ? { company:LOGIN.company, gstin:LOGIN.gstin } : {}),
      };
      r={success:true,data:{user:{id:'local.'+LOGIN.phone,name:profile.name,phone:profile.phone,
         customerType:profile.type,company:profile.company||null,gstin:profile.gstin||null,address:profile.address},
         accessToken:'demo.'+Date.now(),refreshToken:'demo.r.'+Date.now()}};
    }catch(e){
      busy('btn-verify',false,'Verify and continue');
      setErr('f-otp','h-otp', e.message || 'Incorrect or expired code.');
      return;
    }
  } else if(FB){
    try{
      // Real Firebase Auth verifies the phone number itself (actual SMS, actual
      // code). Profile/wallet/orders still live in local demo storage below —
      // see FIRESTORE_LIVE — since the backend that would own those in Firestore
      // isn't deployed yet.
      const u = await FB.verifyOTP(o);
      const existing = FIRESTORE_LIVE ? (await FB.customer(u.uid) || {}) : {};
      const profile = {
        name: LOGIN.name || existing.name || 'Customer',
        phone: LOGIN.phone,
        type: LOGIN.mode==='b2b' ? 'b2b' : 'b2c',
        ...(LOGIN.mode==='b2b' ? { company:LOGIN.company, gstin:LOGIN.gstin } : {}),
        balance: existing.balance ?? 0,
      };
      if(FIRESTORE_LIVE) await FB.saveCustomer(u.uid, profile);
      r={success:true,data:{user:{id:u.uid,name:profile.name,phone:profile.phone,
         customerType:profile.type,company:profile.company||null,gstin:profile.gstin||null},
         accessToken:'firebase',refreshToken:'firebase'}};
    }catch(e){
      busy('btn-verify',false,'Verify and continue');
      setErr('f-otp','h-otp',
        e.code==='auth/invalid-verification-code' ? 'That code is incorrect.'
      : e.code==='auth/code-expired' ? 'That code expired. Request a new one.'
      : (e.message||'Could not verify the code.'));
      return;
    }
  } else {
    r=await API.post(`/auth/${LOGIN.mode}/verify-otp`,
      {phone:LOGIN.phone,otp:o,name:LOGIN.name,company:LOGIN.company,gstin:LOGIN.gstin});
  }
  busy('btn-verify',false,'Verify and continue');
  if(!r.success){ setErr('f-otp','h-otp', r.message); return; }
  if(LOGIN.phone && LOGIN.password) saveCustomerAccount(LOGIN.phone, {password:LOGIN.password, name:LOGIN.name, company:LOGIN.company||null, gstin:LOGIN.gstin||null, type:LOGIN.mode, address:LOGIN.address||null});
  S.user=r.data.user; S.token=r.data.accessToken; S.refresh=r.data.refreshToken;
  localStorage.setItem('mda_user',JSON.stringify(S.user));
  localStorage.setItem('mda_token',S.token);
  localStorage.setItem('mda_refresh',S.refresh);
  await Promise.all([loadWallet(), loadOrders()]);
  S.tab='home'; NAV.length=0; go('home',{replace:true});
}

    ${navBar('Account under review',{noBack:true})}
    ${stateBlock('clock','We are verifying your business',
      'Our team checks every new business account against our customer records. This usually takes a few working hours — we will message you on +91 '+LOGIN.phone+' once it is active.',
      `<a class="btn" style="max-width:220px;" href="tel:${APPCFG.supportPhone}">${icon('phone',18)} Call the office</a>
       <button class="btn btn-quiet mt-8" style="max-width:220px;" onclick="LOGIN.step='entry';go('login',{replace:true})">Back to sign in</button>`)}
  </div>`;
}

function homeQuickAdd(){
  const freq = {};
  S.orders.forEach(o=>o.items.forEach(i=>{
    const k=i.pk+'::'+i.vid; freq[k]=(freq[k]||0)+1;
  }));
  let list = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,4)
    .map(([k])=>({pk:k.split('::')[0], vid:k.split('::')[1]}))
    .filter(x=>CATALOGUE[x.pk]);
  const title = list.length ? 'Your regular items' : 'Popular with restaurants';
  if(!list.length){
    list = ['paneer','curd-cup','ghee','samosa']
      .filter(k=>CATALOGUE[k]).map(k=>({pk:k, vid:CATALOGUE[k].variants[0].id}));
  }
  if(!list.length) return '';
  return `<div class="section-head"><span class="eyebrow">${title}</span></div>
    <div class="plist" style="border-top:1px solid var(--line-2);">
      ${list.map(({pk,vid})=>{
        const p=CATALOGUE[pk]; const v=p.variants.find(x=>x.id===vid)||p.variants[0];
        return `<div class="prow">
          <div class="pthumb" onclick="openProduct('${pk}')">
            <img src="${p.img}" alt="" loading="lazy" onerror="this.style.opacity=0"></div>
          <div class="pinfo" onclick="openProduct('${pk}')">
            <div class="pname">${esc(p.name)}</div>
            <div class="pmeta"><span>${esc(v.label)} ${esc(p.unit)}</span>
              <span class="dot"></span><span class="stk ${v.stock}">${v.stock==='in'?'In stock':'Low'}</span></div>
            <div class="pprice"><span class="price num">${money(unitPrice(v))}</span>
              <span class="t-sm muted">/ ${esc(p.unit)}</span>
              ${showsMRP(v)?`<span class="save">${savingPct(v)}% off</span>`:''}</div>
          </div>
          <div style="display:flex;align-items:flex-end;padding-top:26px;" id="act-${pk}-${v.id}">
            ${qtyControl(pk,v)}</div>
        </div>`;
      }).join('')}
    </div>`;
}

function repaintRows(){

/* One product row = image, name, packs, price, action. Nothing else. */
function prow(k,p){
  const v = p.variants[0];
  const multi = p.variants.length>1;
  return `<div class="prow">
    <div class="pthumb" onclick="openProduct('${k}')" style="background:${catC(p.cat).t};border-color:transparent;">
      <img src="${p.img}" alt="" loading="lazy" onerror="this.style.opacity=0"></div>
    <div class="pinfo" onclick="openProduct('${k}')">
      <div class="pname">${esc(p.name)}</div>
      <div class="pmeta">
        <span>${esc(v.label)} ${esc(p.unit)}</span>
        ${multi?`<span class="dot"></span><span style="color:var(--brand);font-weight:600;">+${p.variants.length-1} more size${p.variants.length>2?'s':''}</span>`:''}
      </div>
      <div class="pmeta mt-4">
        <span class="stk ${v.stock}">${v.stock==='in'?'In stock':v.stock==='low'?'Low stock':'Out of stock'}</span>
        ${v.moq>1?`<span class="dot"></span><span class="t-xs muted">Min ${v.moq}</span>`:''}
      </div>
      <div class="pprice">
        <span class="price num">${money(unitPrice(v))}</span>
        <span class="t-sm muted">/ ${esc(p.unit)}</span>
        ${showsMRP(v)?`<span class="mrp num">${money(v.mrp)}</span><span class="save">${savingPct(v)}% off</span>`:''}
      </div>
    </div>
    <div style="display:flex;align-items:flex-end;padding-top:26px;" id="act-${k}-${v.id}">${qtyControl(k,v)}</div>
  </div>`;
}
function qtyControl(pk,v){
  if(v.stock==='out') return `<span class="addbtn out">Sold out</span>`;
  const q = cartQty(pk,v.id);
  if(!q) return `<button class="addbtn" onclick="event.stopPropagation();addToCart('${pk}','${v.id}')">Add</button>`;
  return `<div class="qty" onclick="event.stopPropagation()">
    <button onclick="stepQty('${pk}','${v.id}',-1)" aria-label="Decrease">${icon(q<=v.moq?'trash':'minus',16)}</button>
    <input type="tel" inputmode="numeric" value="${q}" onchange="typeQty('${pk}','${v.id}',this.value)"
           onclick="this.select()" aria-label="Quantity">
    <button onclick="stepQty('${pk}','${v.id}',1)" aria-label="Increase">${icon('plus',16)}</button>
  </div>`;
}
function stepQty(pk,vid,d){
  const v=CATALOGUE[pk].variants.find(x=>x.id===vid);
  const cur=cartQty(pk,vid);
  let next=cur+d;
  if(d<0 && cur<=v.moq) next=0;               // below MOQ = remove the line entirely
  if(d<0 && next>0 && next<v.moq) next=v.moq;
  setQty(pk,vid,next);
}
function typeQty(pk,vid,val){
  const v=CATALOGUE[pk].variants.find(x=>x.id===vid);
  let n=parseInt(String(val).replace(/\D/g,''))||0;
  if(n>0 && n<v.moq){ n=v.moq; toast(`Minimum order is ${v.moq} ${CATALOGUE[pk].unit}s`,'info'); }
  if(n>9999) n=9999;
  setQty(pk,vid,n);
}

/* Sticky order bar — shows progress to the minimum order value */
function renderOrderBar(){
  const slot=document.getElementById('orderbar-slot'); if(!slot) return;
  const t=cartTotals();
  if(!t.count){ slot.innerHTML=''; return; }
  const mov=isB2B()?APPCFG.minOrderValue:0;
  const met=t.sub>=mov;
  const pct=mov?Math.min(100,(t.sub/mov)*100):100;
  slot.innerHTML=`<div class="orderbar">
    ${mov?`<div class="mov-msg ${met?'met':''}">
        <span>${met?`${icon('check',13)} Minimum order met`:`Minimum order: ${money(mov)}`}</span>
        ${met?'':`<span class="num">${money(t.sub)} / ${money(mov)}</span>`}
      </div>
      <div class="mov-track"><div class="mov-fill ${met?'met':''}" style="width:${pct}%"></div></div>`:''}
    <div class="row between gap-12">
      <div style="min-width:0;">
        <div class="t-lg num" style="font-weight:700;">${money(t.sub)}</div>
        <div class="t-xs ${met?'muted':''}" style="${met?'':'color:var(--warn);font-weight:600;'}">
          ${met? `${t.count} item${t.count>1?'s':''} · excl. GST`
               : `Add ${money(mov-t.sub)} more to order`}</div>
      </div>
      <button class="btn btn-sm" style="height:42px;padding:0 20px;${met?'':'background:var(--line);color:var(--ink-3);border-color:var(--line);pointer-events:none;'}"
              onclick="go('cart')">Review order ${icon('right',17)}</button>
    </div>
  </div>`;
}

function productBody(k,p){
  return `
  <div style="background:linear-gradient(180deg,${catC(p.cat).t} 0%,var(--surface) 100%);padding:24px 20px;display:flex;justify-content:center;border-bottom:1px solid var(--line);">

        <div class="row between gap-12">
          <div class="grow">
            <div class="row gap-8 mb-4">
              <span class="t-base" style="font-weight:600;">${esc(v.label)}</span>
              <span class="stk ${v.stock}">${v.stock==='in'?'In stock':v.stock==='low'?'Low':'Sold out'}</span>
            </div>
            <div class="row gap-6">
              <span class="t-lg num" style="font-weight:700;">${money(unitPrice(v))}</span>
              <span class="t-sm muted">per ${esc(p.unit)}</span>
              ${showsMRP(v)?`<span class="mrp num t-sm">${money(v.mrp)}</span>`:''}
            </div>
            <div class="t-xs muted mt-4">

              ${q?` · <b style="color:var(--brand);">${money(unitPrice(v)*q)} for ${q}</b>`:''}
            </div>
          </div>
          <div id="act-${k}-${v.id}">${qtyControl(k,v)}</div>

  </div>
  ${p.desc?`<div class="divider"></div><div class="section">

    <div class="t-md muted" style="line-height:1.6;">${esc(p.desc)}</div>
  </div>`:''}
  ${(p.storage||p.freshness)?`<div class="divider"></div><div class="section">

    ${p.freshness?`<div class="row gap-12 mb-12" style="align-items:flex-start;">

      <div class="t-sm muted">${esc(p.storage)}</div></div></div>`:''}

  <div style="height:24px;"></div>`;

      <div>Minimum order met — ready for checkout.</div></div></div>`):''}

function radio(on){

async function placeOrder(){
  if(!S.user?.address){ toast('Add a delivery address before placing your order','alert'); editDeliveryAddressSheet(); return; }
  const t=cartTotals();
  const btn=document.getElementById('btn-place'); btn.dataset.lbl=`Place order · ${money(t.total)}`;
  busy('btn-place',true,'Placing order');
  const payload={
    items:S.cart.map(i=>({pk:i.pk,vid:i.vid,name:i.name,label:i.label,unit:i.unit,qty:i.qty,price:i.price})),
    subtotal:t.sub, gst:t.gst, delivery:t.del, total:t.total,
    payment:PAY, customerType:S.user?.customerType||'b2c',
    company:S.user?.company||null, gstin:S.user?.gstin||null,
    name:S.user?.name, phone:S.user?.phone, address:S.user?.address||null,
  };
  let r;
  if(FIRESTORE_LIVE && FB){
    try{
      const out = await FB.placeOrder({
        items:payload.items, subtotal:payload.subtotal, gst:payload.gst,
        delivery:payload.delivery, total:payload.total, payment:payload.payment,
        type:payload.customerType, company:payload.company, gstin:payload.gstin,
        name:payload.name, phone:payload.phone,
      });
      r = { success:true, data:{ ...out, deliverySlot:'Tomorrow, 7:00 AM – 11:00 AM' } };
    }catch(e){
      r = { success:false, code:e.code, message:e.message };
    }
  } else {
    r = await API.post('/orders',payload);
  }
  busy('btn-place',false, payload.total?`Place order · ${money(t.total)}`:'Place order');
  if(!r.success){
    if(r.code==='INSUFFICIENT'){ toast(r.message,'alert'); return; }
    toast(r.message||'Could not place the order. Try again.','alert'); return;
  }
  S.lastOrder={...r.data, items:payload.items, total:payload.total, payment:PAY};
  S.cart=[]; persist(); await loadWallet();
  go('placed',{replace:true});
  // Fire-and-forget: doesn't block navigation, but once the doc id comes
  // back it's saved onto the local order record so the tracking screen can
  // live-listen to status changes and self-cancel against the right doc.
  if(window.mirrorOrderToFirestore){
    window.mirrorOrderToFirestore({...payload, orderNo:r.data.orderNo}).then(firestoreId=>{
      if(!firestoreId) return;
      const list = DB.orders;
      const idx = list.findIndex(o=>o.orderNo===r.data.orderNo);
      if(idx!==-1){ list[idx] = {...list[idx], firestoreId}; DB.orders = list; }
      if(S.lastOrder?.orderNo===r.data.orderNo) S.lastOrder = {...S.lastOrder, firestoreId};
      const oi = S.orders.findIndex(o=>o.orderNo===r.data.orderNo);
      if(oi!==-1) S.orders[oi] = {...S.orders[oi], firestoreId};
    });
  }
}

/* ═══════════════════════════════════════════════════════════
   17. ORDERS

const STATUS = {
  placed:{l:'Placed',c:'b'}, pending_confirmation:{l:'Pending confirmation',c:'a'},
  confirmed:{l:'Confirmed',c:'b'}, packed:{l:'Packed',c:'a'},
  out_for_delivery:{l:'Out for delivery',c:'a'}, delivered:{l:'Delivered',c:'g'}, cancelled:{l:'Cancelled',c:'r'},
  denied:{l:'Denied',c:'r'},
};
async function loadOrders(){
  // Orders live in DB.orders (localStorage, 'mda_orders') — the durable,
  // correctly-keyed record of what this device actually ordered, including
  // the firestoreId patched on at placement time for live status/cancel.
  // FB.orders(uid) was a dead end: it queried Firestore docs by a 'uid'
  // field that mirrorOrderToFirestore() never writes (it writes
  // createdByUid, under a separate anonymous auth session), so it always
  // returned an empty list and silently wiped out the real local order
  // history every time this ran — this was the "can't track my order" bug.
  const r=await API.get('/orders'); S.orders=r.success?r.data:[];
}
function scrOrders(){
  return `<div class="screen on">
    ${navBar('Orders',{noBack:true,sub:S.user?.company||''})}
    <div class="scroll" id="orders-body">${ordersBody()}</div>

}
function ordersBody(){
  if(!S.orders.length) return stateBlock('receipt','No orders yet',
    'Once you place an order it will appear here, and you can reorder it with one tap.',
    `<button class="btn" style="max-width:220px;" onclick="switchTab('catalogue')">Start an order</button>`);
  return `<div>${S.orders.map(o=>{
    const st=STATUS[o.status]||STATUS.placed;
    return `<div class="lrow" onclick="openOrder('${esc(o.orderNo)}')" style="align-items:flex-start;">
      <div class="lrow-body">
        <div class="row between mb-4"><span class="t-base num" style="font-weight:700;">${esc(o.orderNo)}</span>
          <span class="pill ${st.c}">${st.l}</span></div>

        <div class="t-base num mt-4" style="font-weight:600;">${money(o.total)}</div>
      </div>
      ${icon('right',18)}
    </div>`;
  }).join('')}<div style="height:calc(24px + var(--safe-b));"></div></div>`;
}
let ORDER_STATUS_UNSUB = null;
const CANCELLABLE_STATUSES = ['placed','confirmed','pending_confirmation','packed']; // must match backend/firestore.rules isCancellable()
function stopOrderStatusListener(){ if(ORDER_STATUS_UNSUB){ ORDER_STATUS_UNSUB(); ORDER_STATUS_UNSUB=null; } }
function startOrderStatusListener(o){
  stopOrderStatusListener();
  if(!o?.firestoreId || !window.listenToOrderStatus) return;
  ORDER_STATUS_UNSUB = window.listenToOrderStatus(o.firestoreId, (status)=>{
    if(!status || status===S.order?.status) return;
    S.order = {...S.order, status};
    const list = DB.orders;
    const idx = list.findIndex(x=>x.orderNo===o.orderNo);
    if(idx!==-1){ list[idx] = {...list[idx], status}; DB.orders = list; }
    const oi = S.orders.findIndex(x=>x.orderNo===o.orderNo);
    if(oi!==-1) S.orders[oi] = {...S.orders[oi], status};
    if(S.screen==='order') paint();
  });
}
async function openOrder(no){
  if(!no) return;
  if(FIRESTORE_LIVE && FB && S.user?.id){
    const o=S.orders.find(x=>x.orderNo===no);
    if(o){ S.order=o; go('order'); startOrderStatusListener(o); return; }
  }
  const r=await API.get('/orders/'+no);
  if(!r.success){ toast('Could not load that order','alert'); return; }
  S.order=r.data; go('order');
  startOrderStatusListener(r.data);
}
async function doCancelOrder(){
  const o=S.order; if(!o?.firestoreId) return;
  if(!CANCELLABLE_STATUSES.includes(o.status)) return;
  try{ await window.cancelOrderInFirestore(o.firestoreId); }
  catch(e){ closeSheet(); toast('Could not cancel — please call us instead.','alert'); return; }
  S.order = {...o, status:'cancelled'};
  const list = DB.orders;
  const idx = list.findIndex(x=>x.orderNo===o.orderNo);
  if(idx!==-1){ list[idx] = {...list[idx], status:'cancelled'}; DB.orders = list; }
  const oi = S.orders.findIndex(x=>x.orderNo===o.orderNo);
  if(oi!==-1) S.orders[oi] = {...S.orders[oi], status:'cancelled'};
  paint();
  // Cancelling in-app is the last step of the flow, not the whole thing —
  // the customer still needs to speak to someone to close it out (refund,
  // confirming nothing's already left the shop, etc).
  openSheet(`<div class="sheet-head"><div class="t-lg">Order cancelled</div>
      <button class="iconbtn" onclick="closeSheet()">${icon('close',20)}</button></div>
    <div class="section">
      <div class="banner warn mb-16">${icon('alert',17)}<div>One last step — please call us to confirm the cancellation${o.payment!=='cod'?' and start your refund':''}.</div></div>
      <a class="btn" href="tel:${APPCFG.supportPhone}">${icon('phone',18)} Call ${esc(APPCFG.supportPhone)}</a>
    </div>`);
}
function confirmCancelOrder(){
  const o=S.order; if(!o) return;
  if(!CANCELLABLE_STATUSES.includes(o.status)){
    openSheet(`<div class="sheet-head"><div class="t-lg">Can't cancel from here</div>
        <button class="iconbtn" onclick="closeSheet()">${icon('close',20)}</button></div>
      <div class="section">
        <div class="banner warn mb-16">${icon('alert',17)}<div>This order is already ${(STATUS[o.status]||STATUS.placed).l.toLowerCase()} — please call us to cancel or make changes.</div></div>
        <a class="btn" href="tel:${APPCFG.supportPhone}">${icon('phone',18)} Call ${esc(APPCFG.supportPhone)}</a>
      </div>`);
    return;
  }
  openSheet(`<div class="sheet-head"><div class="t-lg">Cancel this order?</div>
      <button class="iconbtn" onclick="closeSheet()">${icon('close',20)}</button></div>
    <div class="section">
      <div class="t-md muted mb-16">${esc(o.orderNo)} · ${money(o.total)} will be cancelled. This can't be undone from the app.</div>
      <button class="btn" style="background:var(--bad);border-color:var(--bad);" onclick="doCancelOrder()">Yes, cancel order</button>
      <button class="btn btn-quiet mt-8" onclick="closeSheet()">Keep order</button>
    </div>`);
}

  return `<div class="screen on">

        ${o.status==='denied'?`<div class="banner alert mb-16">${icon('alert',17)}<div><b>This order was denied</b><br>${esc(o.deniedReason||'Please call us for details.')}</div></div>`:''}
        ${o.address?`<div class="banner info mb-16">${icon('pin',17)}<div><b>Delivering to</b><br>${esc(o.address)}</div></div>`:''}
        ${o.status!=='denied' && o.status!=='cancelled' ? steps.map((s,i)=>`<div class="row gap-12" style="align-items:flex-start;">

              ${i<=at?icon('check',12,2.4):''}</div>
            ${i<steps.length-1?`<div style="width:1.5px;height:26px;background:${i<at?'var(--brand)':'var(--line)'};"></div>`:''}
          </div>
          <div style="padding-bottom:${i<steps.length-1?'8px':'0'};">
            <div class="t-md" style="font-weight:${i<=at?'600':'400'};color:${i<=at?'var(--ink)':'var(--ink-3)'};">${STATUS[s].l}</div>
          </div></div>`).join('') : ''}
      </div>
      <div class="divider"></div>
      <div class="section">
        <div class="eyebrow mb-12">Items</div>
        ${o.items.map(i=>`<div class="tot"><span class="muted truncate" style="max-width:64%;">${esc(i.name)} ${esc(i.label)} × ${i.qty}</span>
          <span class="num">${money(i.price*i.qty)}</span></div>`).join('')}
        <div class="tot" style="border-top:1px solid var(--line-2);margin-top:8px;padding-top:10px;">
          <span class="muted">GST</span><span class="num">${money2(o.gst||0)}</span></div>
        <div class="tot grand"><span>Total</span><span class="num">${money2(o.total)}</span></div>
      </div>
      <div class="divider"></div>
      <div class="section">

function reorder(no){
  const o=S.orders.find(x=>x.orderNo===no)||S.order;
  if(!o) return;
  let added=0, skipped=0;
  o.items.forEach(i=>{
    const p=CATALOGUE[i.pk]; if(!p){skipped++;return;}
    const v=p.variants.find(x=>x.id===i.vid); if(!v||v.stock==='out'){skipped++;return;}
    setQty(i.pk,i.vid, Math.max(i.qty, v.moq)); added++;
  });
  toast(added? `${added} item${added>1?'s':''} added to your order` : 'Those items are unavailable', added?'check':'alert');
  if(added) go('cart');
}

function scrReorder(){

async function openAdmin(){

/* ═══════════════════════════════════════════════════════════
   22. LOCAL ADMIN PANEL (demo mode — no backend yet)
   Edits are stored in localStorage under mda_admin_overrides and merged over
   APPCFG/CATALOGUE on every boot, so they persist across app restarts on this
   device. Once a real backend exists, openAdmin() above should be pointed at
   CONFIG.API_BASE and this local panel becomes a fallback only.
   ═══════════════════════════════════════════════════════════ */
// Super admin: a single named account (not a shared password gate) that owns
// this device's admin panel, including confirming low-stock orders. Local-only
// until a real backend/Firebase Auth exists.
const SUPER_ADMIN_DEFAULT = { username: 'moderndairy', password: 'Moderndairy@2026' };
function getSuperAdmin(){
  try{ return {...SUPER_ADMIN_DEFAULT, ...JSON.parse(localStorage.getItem('mda_super_admin')||'{}')}; }
  catch(e){ return SUPER_ADMIN_DEFAULT; }
}
function setSuperAdmin(patch){
  localStorage.setItem('mda_super_admin', JSON.stringify({...getSuperAdmin(), ...patch}));
}
const ADMIN = { authed: sessionStorage.getItem('mda_admin_authed')==='1' };

function loadAdminOverrides(){
  try{ return JSON.parse(localStorage.getItem('mda_admin_overrides')||'{}'); }
  catch(e){ return {}; }
}
function saveAdminOverrides(patch){
  const cur = loadAdminOverrides();
  const next = {...cur, ...patch};
  localStorage.setItem('mda_admin_overrides', JSON.stringify(next));
  return next;
}
function applyAdminOverrides(){
  const o = loadAdminOverrides();
  if(o.appcfg) APPCFG = {...APPCFG, ...o.appcfg};
  if(o.products){
    Object.keys(o.products).forEach(pid=>{
      if(!CATALOGUE[pid]) return;
      const patch = o.products[pid];
      if(patch.variants){
        CATALOGUE[pid].variants = CATALOGUE[pid].variants.map(v=>
          patch.variants[v.id] ? {...v, ...patch.variants[v.id]} : v);
      }
    });
  }
}

async function saveAdminApiKey(key){
  const val = document.getElementById(`adm-key-${key}`).value.trim();
  if(CONFIG.API_BASE){
    // Real backend: the raw key is sent once over HTTPS and stored server-side
    // (Secret Manager) — the app never keeps or displays the raw value again.
    try{
      const r = await API.post('/admin/secrets', {key, value: val});
      if(!r.success){ toast(r.message||'Could not save key to server','alert'); return; }
      toast('Key saved to server — integration is live','check');
    }catch(e){ toast('Could not reach the server to save this key','alert'); return; }
  } else {
    const cur = loadAdminOverrides();
    const apiKeys = {...(cur.apiKeys||{}), [key]: val};
    saveAdminOverrides({apiKeys});
    toast('Key saved locally (demo mode — no backend connected yet)','check');
  }
  paint();
}
function changeAdminPassword(){
  const cur = document.getElementById('adm-pw-cur').value;

  const confirm = document.getElementById('adm-pw-confirm').value;

  if(cur !== sa.password){ toast('Current password is incorrect','alert'); return; }
  if(!next && !newUser){ toast('Enter a new username and/or password to change','alert'); return; }
  if(next && next.length < 6){ toast('New password must be at least 6 characters','alert'); return; }
  if(next && next !== confirm){ toast('New passwords do not match','alert'); return; }
  setSuperAdmin({ username: newUser || sa.username, password: next || sa.password });
  toast('Super admin account updated','check');
  document.getElementById('adm-pw-cur').value='';
  document.getElementById('adm-user-new').value='';
  document.getElementById('adm-pw-new').value='';

  paint();
}

async function loadWallet(){
  if(FIRESTORE_LIVE && FB && S.user?.id){
    const c = await FB.customer(S.user.id);
    const txns = await FB.ledger(S.user.id).catch(()=>[]);
    S.wallet = { balance: Number(c?.balance||0),
      txns: txns.map(t=>({ id:t.id, type:t.type, amount:t.amount,
        prevBalance:t.prevBalance, newBalance:t.newBalance, note:t.note,
        orderNo:t.orderId||null, at:t.at?.toDate?.()?.toISOString()||new Date().toISOString() })) };
    return;
  }
  const r=await API.get('/wallet');
  if(r.success) S.wallet=r.data;
}

function openRazorpayCheckout(amount, onSuccess){
  const keys = loadAdminOverrides().apiKeys || {};
  const keyId = keys.razorpay_key_id || keys.razorpay;
  if(window.Razorpay && keyId){
    try{
      const rzp = new Razorpay({
        key: keyId, amount: amount*100, currency:'INR',
        name: APPCFG.businessName, description:`${isB2B()?'Business credit':'Wallet'} top-up`,
        prefill:{ name:S.user?.name||'', contact:S.user?.phone||'' },
        handler: function(){ onSuccess(); },
        modal:{ ondismiss:function(){ toast('Payment cancelled','info'); } },
      });
      rzp.open();
      return;
    }catch(e){ console.warn('Razorpay widget failed, falling back to simulated checkout:', e); }
  }
  window.__rzpFakeSuccess = onSuccess;
  openSheet(`<div class="sheet-head"><div class="t-lg">Razorpay Checkout</div>
      <button class="iconbtn" onclick="closeSheet()">${icon('close',20)}</button></div>
    <div class="section" style="text-align:center;">
      <div class="banner info mb-16">${icon('info',17)}
        <div>No live Razorpay key is configured yet — this simulates a successful payment so
        you can test the wallet end-to-end. Add a real Key ID in Admin Panel → API keys →
        Razorpay to switch to the live checkout.</div></div>
      <div class="t-sm muted mb-4">Amount</div>
      <div class="t-2xl num mb-20" style="font-weight:700;">${money(amount)}</div>
      <button class="btn" id="btn-fake-pay" onclick="fakeRazorpayPay()">Pay ${money(amount)}</button>
    </div>`);
}
async function fakeRazorpayPay(){
  busy('btn-fake-pay',true,'Processing payment');
  await new Promise(r=>setTimeout(r,1200));
  closeSheet();
  const cb = window.__rzpFakeSuccess; window.__rzpFakeSuccess = null;
  if(cb) await cb();
}

/* ═══════════════════════════════════════════════════════════
   21. ROUTES + BOOT
   ═══════════════════════════════════════════════════════════ */

  catalogue:scrCatalogue, product:scrProduct,

  invoices:scrInvoices, invoiceDetail:scrInvoiceDetail,

// Firestore REST value -> plain JS. products/app_config are public-read
// (see backend/firestore.rules), so this is a plain unauthenticated fetch —
// no SDK, no auth needed, just how it fetches the admin website's live edits.
function fromFirestoreValue(v){
  if(!v) return null;
  if('stringValue' in v) return v.stringValue;
  if('integerValue' in v) return parseInt(v.integerValue,10);
  if('doubleValue' in v) return v.doubleValue;
  if('booleanValue' in v) return v.booleanValue;
  if('nullValue' in v) return null;
  if('arrayValue' in v) return (v.arrayValue.values||[]).map(fromFirestoreValue);
  if('mapValue' in v) return fromFirestoreDoc(v.mapValue.fields||{});
  return null;
}
function fromFirestoreDoc(fields){
  const out={};
  for(const [k,v] of Object.entries(fields||{})) out[k]=fromFirestoreValue(v);
  return out;
}
async function loadLiveCatalogueAndConfig(){
  try{
    const [prodRes, cfgRes] = await Promise.all([
      fetch('https://firestore.googleapis.com/v1/projects/modern-dairy-pune/databases/(default)/documents/products?pageSize=300'),
      fetch('https://firestore.googleapis.com/v1/projects/modern-dairy-pune/databases/(default)/documents/app_config/singleton'),
    ]);
    if(prodRes.ok){
      const data = await prodRes.json();
      (data.documents||[]).forEach(doc=>{
        const id = doc.name.split('/').pop();
        CATALOGUE[id] = { ...CATALOGUE[id], ...fromFirestoreDoc(doc.fields) };
      });
    }
    if(cfgRes.ok){
      const doc = await cfgRes.json();
      if(doc.fields) APPCFG = { ...APPCFG, ...fromFirestoreDoc(doc.fields) };
    }
  }catch(e){ console.warn('Could not load live catalogue/config, using bundled defaults:', e); }
}
async function boot(){
  FB = await (window.__fbReady || Promise.resolve(null));

  if(FIRESTORE_LIVE && FB){
    try{
      const [cfg, prods] = await Promise.all([FB.config(), FB.products()]);
      if(cfg && Object.keys(cfg).length) APPCFG = {...APPCFG, ...cfg};
      if(prods && prods.length){
        Object.keys(CATALOGUE).forEach(k=>delete CATALOGUE[k]);
        prods.filter(p=>p.active!==false).forEach(p=>{
          CATALOGUE[p.id] = { name:p.name, cat:p.cat, img:p.img, unit:p.unit,
            desc:p.desc||'', storage:p.storage||'', freshness:p.freshness||'',
            variants:(p.variants||[]).map(v=>({ id:v.id, label:v.label, mrp:v.mrp, b2b:v.b2b,
              moq:v.moq||1, case:v.case||1, stock:(v.stock??0)>0 ? ((v.stock??0)<=(v.lowStock??10)?'low':'in') : 'out' })) };
        });
      }
    }catch(e){ console.warn('Firestore read failed, using bundled catalogue:', e); }
  } else {
    // products/app_config allow public read in Firestore rules — no auth
    // needed. This is how the admin website's edits (business settings,
    // product prices/stock) actually reach every customer, without waiting
    // on the backend. Bundled CATALOGUE/APPCFG stay as the fallback if this
    // fetch fails (offline, etc).
    await loadLiveCatalogueAndConfig();
  }
  applyAdminOverrides();
  if(!S.user){ S.screen='login'; paint(); return; }
  S.screen='home'; S.tab='home'; paint();
  await Promise.all([loadWallet(), loadOrders()]);
  paint();
}
boot();

/* ── Native offline banner (Capacitor Network plugin, no-op on plain web) ── */
(function(){
  function showOfflineBanner(offline){
    let el = document.getElementById('native-offline-banner');
    if (offline && !el) {
      el = document.createElement('div');
      el.id = 'native-offline-banner';
      el.textContent = 'No internet connection — some features are unavailable';
      el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;'
        + 'background:#DC2626;color:#fff;font:600 12px/1.4 sans-serif;'
        + 'text-align:center;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;';
      document.body.appendChild(el);
    } else if (!offline && el) {
      el.remove();
    }
  }
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Network) {
    const Network = window.Capacitor.Plugins.Network;
    Network.getStatus().then(s => showOfflineBanner(!s.connected));
    Network.addListener('networkStatusChange', s => showOfflineBanner(!s.connected));
  } else {
    window.addEventListener('offline', () => showOfflineBanner(true));
    window.addEventListener('online', () => showOfflineBanner(false));
    if (!navigator.onLine) showOfflineBanner(true);
  }
})();
