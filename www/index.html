  riderLogin:scrRiderLogin, rider:scrRider,
  forgotPassword:scrForgotPassword,
};
window.addEventListener('popstate',()=>{ if(NAV.length) back(); });

// Firestore REST value -> plain JS. products/app_config are public-read
// (see backend/firestore.rules), so this is a plain unauthenticated fetch —
// no SDK, no auth needed, just how it fetches the admin website's live edits.
function fromFirestoreValue(v){
  if(!v) return null;
  if('stringValue' in v) return v.stringValue;
  if('integerValue' in v) return parseInt(v.integerValue,10);
  if('doubleValue' in v) return v.doubleValue;
  if('booleanValue' in v) return v.booleanValue;
  if('nullValue' in v) return null;
  if('arrayValue' in v) return (v.arrayValue.values||[]).map(fromFirestoreValue);
  if('mapValue' in v) return fromFirestoreDoc(v.mapValue.fields||{});
  return null;
}
function fromFirestoreDoc(fields){
  const out={};
  for(const [k,v] of Object.entries(fields||{})) out[k]=fromFirestoreValue(v);
  return out;
}
/* Remote documents are merged into the running app's config and catalogue.
   They used to be spread in wholesale — every field the document happened to
   carry became app state, which is mass assignment against the client: one
   bad/compromised write to app_config could introduce keys the app never
   expected, and there was no bound on the size or type of any value. Only
   these fields are accepted, each coerced to the type the app expects. */
const APPCFG_FIELDS = {
  businessName:'str', logo:'url', supportPhone:'str', whatsapp:'str', email:'str',
  instagram:'url', linkedin:'url', address:'str', minOrderValue:'num', freeDeliveryAbove:'num',
  deliveryFee:'num', platformFee:'num', gstRate:'num', orderCutoff:'str', businessHours:'str',
  announcement:'str', walletEnabled:'bool',
  rfdFee:'num',   // "Request a driver" charge; 0 = the card just says a small charge applies
  // Maintenance mode — set by the admin (manually, or automatically by the
  // nightly-audit job while it runs). When on, the whole app is locked behind
  // a maintenance screen and nothing is usable until it clears.
  maintenanceMode:'bool', maintenanceMessage:'str',
  // Emergency kill switches (admin Controls tab).
  ordersDisabled:'bool', paymentsDisabled:'bool', creditDisabled:'bool', b2cDisabled:'bool', b2bDisabled:'bool', otpLoginDisabled:'bool',
};
const PRODUCT_FIELDS = { name:'str', cat:'str', img:'url', unit:'str', desc:'str', storage:'str', freshness:'str', variants:'variants', disabled:'bool' };
const MAX_REMOTE_STR = 2000;
function coerce(kind, v){
  switch(kind){
    case 'str':  return typeof v === 'string' ? v.slice(0, MAX_REMOTE_STR) : undefined;
    case 'url':  return typeof v === 'string' ? (safeUrl(v.slice(0, MAX_REMOTE_STR)) || undefined) : undefined;
    case 'num':  return Number.isFinite(Number(v)) ? Number(v) : undefined;
    case 'bool': return typeof v === 'boolean' ? v : undefined;
    case 'variants':
      if(!Array.isArray(v)) return undefined;
      return v.slice(0, 50).map(x => ({
        id: String(x?.id ?? '').slice(0,64), label: String(x?.label ?? '').slice(0,64),
        mrp: Number(x?.mrp) || 0, b2b: Number(x?.b2b) || 0,
        moq: Number(x?.moq) || 1, case: Number(x?.case) || 1,
        stock: ['in','low','out'].includes(x?.stock) ? x.stock : 'in',
      })).filter(x => x.id);
    default: return undefined;
  }
}
function pickFields(obj, schema){
  const out = {};
  for(const [k, kind] of Object.entries(schema)){
    if(!Object.prototype.hasOwnProperty.call(obj||{}, k)) continue;
    const v = coerce(kind, obj[k]);
    if(v !== undefined) out[k] = v;
  }
  return out;
}
async function loadLiveCatalogueAndConfig(){
  try{
    const [prodRes, cfgRes] = await Promise.all([
      fetch('https://firestore.googleapis.com/v1/projects/modern-dairy-pune/databases/(default)/documents/products?pageSize=300'),
      fetch('https://firestore.googleapis.com/v1/projects/modern-dairy-pune/databases/(default)/documents/app_config/singleton'),
    ]);
    if(prodRes.ok){
      const data = await prodRes.json();
      (data.documents||[]).forEach(doc=>{
        const id = doc.name.split('/').pop();
        if(!/^[A-Za-z0-9_-]{1,128}$/.test(id)) return;   // reject odd doc ids outright
        CATALOGUE[id] = { ...CATALOGUE[id], ...pickFields(fromFirestoreDoc(doc.fields), PRODUCT_FIELDS) };
      });
    }
    if(cfgRes.ok){
      const doc = await cfgRes.json();
      if(doc.fields) APPCFG = { ...APPCFG, ...pickFields(fromFirestoreDoc(doc.fields), APPCFG_FIELDS) };
    }
  }catch(e){ console.warn('Could not load live catalogue/config, using bundled defaults:', e); }
}
// Admin broadcasts are NOT shown inside the app, by choice. They still go out
// as push notifications (backend/scripts/send-broadcast-push.js, run by the
// send-broadcast-push GitHub Action) and the admin Broadcasts tab still sends
// and lists them — they simply never render as an in-app banner, so nothing
// here fetches the broadcasts collection any more.
async function boot(){
  FB = await (window.__fbReady || Promise.resolve(null));

  if(FIRESTORE_LIVE && FB){
    try{
      const [cfg, prods] = await Promise.all([FB.config(), FB.products()]);
      if(cfg && Object.keys(cfg).length) APPCFG = {...APPCFG, ...pickFields(cfg, APPCFG_FIELDS)};
      if(prods && prods.length){
        Object.keys(CATALOGUE).forEach(k=>delete CATALOGUE[k]);
        prods.filter(p=>p.active!==false).forEach(p=>{
          CATALOGUE[p.id] = { name:p.name, cat:p.cat, img:p.img, unit:p.unit,
            desc:p.desc||'', storage:p.storage||'', freshness:p.freshness||'',
            variants:(p.variants||[]).map(v=>({ id:v.id, label:v.label, mrp:v.mrp, b2b:v.b2b,
              moq:v.moq||1, case:v.case||1, stock:(v.stock??0)>0 ? ((v.stock??0)<=(v.lowStock??10)?'low':'in') : 'out' })) };
        });
      }
    }catch(e){ console.warn('Firestore read failed, using bundled catalogue:', e); }
  } else {
    // products/app_config allow public read in Firestore rules — no auth
    // needed. This is how the admin website's edits (business settings,
    // product prices/stock) actually reach every customer, without waiting
    // on the backend. Bundled CATALOGUE/APPCFG stay as the fallback if this
    // fetch fails (offline, etc).
    await loadLiveCatalogueAndConfig();
  }
  // Block gate — maintenance, or a per-segment (b2c/b2b) disable from the admin
  // Controls tab. Lock the app here before rendering anything else, and keep
  // polling so it unlocks on its own when the admin flips it back.
  startMaintenancePolling();
  if(evaluateAppBlock()) return;
  if(!S.user){ S.screen='login'; paint(); return; }
  S.screen='home'; S.tab='home'; paint();
  await Promise.all([loadWallet(), loadOrders()]);
  refreshOrderBlock();
  paint();
  initPushNotifications();
  syncAccount();
}

/* ═══════════════════════════════════════════════════════════
   MAINTENANCE MODE
   A single full-screen lock. When APPCFG.maintenanceMode is true the
   app is not usable — used both for a manual "put the app under
   maintenance" toggle and automatically by the nightly audit job,
   which flips it on before it starts and off when it finishes.
   ═══════════════════════════════════════════════════════════ */
let MAINTENANCE_LOCKED = false;   // true whenever the app is blocked (maintenance OR a segment disable)
// Why is the app blocked right now, if at all? Maintenance wins over segment
// disables. Segment disables only apply once we know the signed-in user's type.
function appBlockReason(){
  if(APPCFG.maintenanceMode) return 'maintenance';
  const t = S.user && S.user.customerType;
  if(t==='b2c' && APPCFG.b2cDisabled) return 'b2c';
  if(t==='b2b' && APPCFG.b2bDisabled) return 'b2b';
  return null;
}
function blockScreen(title, msg){
  MAINTENANCE_LOCKED = true;
  const app = APP(); if(!app) return;
  app.innerHTML = `<div class="screen on" style="display:flex;align-items:center;justify-content:center;padding:32px 24px;text-align:center;background:var(--brand);">
    <div style="max-width:360px;color:#fff;">
      <div style="width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;">
        ${icon('shield',38)}</div>
      <div class="t-2xl" style="color:#fff;margin-bottom:10px;">${esc(title)}</div>
      <div class="t-md" style="color:rgba(255,255,255,.85);line-height:1.6;">${esc(msg)}</div>
      <button class="btn mt-24" style="max-width:220px;margin:24px auto 0;background:#fff;color:var(--brand);" onclick="recheckMaintenance()">${icon('refresh',18)} Check again</button>
    </div></div>`;
}
function showMaintenanceScreen(){
  blockScreen('Under maintenance', APPCFG.maintenanceMessage || 'We are giving the app a quick tune-up and will be back shortly. Please check again in a little while.');
}
function showDisabledScreen(who){
  blockScreen('Temporarily unavailable',
    `The app is temporarily unavailable for ${who==='b2b'?'business':'personal'} customers right now. Please check back a little later, or call us if it’s urgent.`);
}
// Shows the right block screen if the app is currently blocked; returns true if so.
function evaluateAppBlock(){
  const r = appBlockReason();
  if(!r){ return false; }
  if(r==='maintenance') showMaintenanceScreen(); else showDisabledScreen(r);
  return true;
}
async function recheckMaintenance(){
  await loadLiveCatalogueAndConfig();
  if(!evaluateAppBlock()){ MAINTENANCE_LOCKED = false; boot(); }
}
/* ═══════════════════════════════════════════════════════════
   LIVE-STATE POLLING
   Broadcasts and maintenance are driven by Firestore, but there's no
   server pushing changes to an already-open app. So the app polls them
   itself — every 20s AND immediately whenever it regains focus — so a
   broadcast or a maintenance toggle shows up within seconds without the
   customer reopening the app, and WITHOUT waiting on the (heavily
   delayed) GitHub-Actions push relay. The push relay still exists for
   apps that are fully closed; this makes the in-app experience instant.
   ═══════════════════════════════════════════════════════════ */
let LIVE_TIMER = null;
async function pollLiveState(){
  // 1) App-block flags (maintenance + per-segment disables) from app_config.
  try{
    const res = await fetch('https://firestore.googleapis.com/v1/projects/modern-dairy-pune/databases/(default)/documents/app_config/singleton');
    if(res.ok){
      const doc = await res.json();
      const f = doc.fields || {};
      const bool = k => !!(f[k] && f[k].booleanValue);
      APPCFG.maintenanceMode = bool('maintenanceMode');
      if(f.maintenanceMessage && f.maintenanceMessage.stringValue) APPCFG.maintenanceMessage = f.maintenanceMessage.stringValue;
      APPCFG.b2cDisabled = bool('b2cDisabled');
      APPCFG.b2bDisabled = bool('b2bDisabled');
      APPCFG.ordersDisabled = bool('ordersDisabled');
      APPCFG.paymentsDisabled = bool('paymentsDisabled');
      APPCFG.creditDisabled = bool('creditDisabled');
      APPCFG.otpLoginDisabled = bool('otpLoginDisabled');
      const blocked = !!appBlockReason();
      if(blocked && !MAINTENANCE_LOCKED){ evaluateAppBlock(); return; }
      if(!blocked && MAINTENANCE_LOCKED){ MAINTENANCE_LOCKED = false; boot(); return; }
    }
  }catch(e){ /* offline — keep current state */ }
  if(MAINTENANCE_LOCKED) return;
  // 3) Credit hold — is this customer blocked from ordering? (opaque phone
  //    hashes, public-read; the real enforcement is in the Firestore rules.)
  await refreshOrderBlock();
}
let ORDER_BLOCKED = false;
async function refreshOrderBlock(){
  if(!S.user?.phone){ ORDER_BLOCKED = false; return; }
  try{
    const res = await fetch('https://firestore.googleapis.com/v1/projects/modern-dairy-pune/databases/(default)/documents/order_blocks_public/hashes');
    if(!res.ok){ if(res.status===404) ORDER_BLOCKED = false; return; }
    const doc = await res.json();
    const arr = (doc.fields && doc.fields.hashes && doc.fields.hashes.arrayValue && doc.fields.hashes.arrayValue.values) || [];
    const hashes = arr.map(v=>v.stringValue).filter(Boolean);
    const mine = await sha256Hex(String(S.user.phone));
    const wasBlocked = ORDER_BLOCKED;
    ORDER_BLOCKED = !!mine && hashes.includes(mine);
    if(ORDER_BLOCKED !== wasBlocked && (S.screen==='home' || S.screen==='checkout')) paint();
  }catch(e){ /* offline — leave current state */ }
}
function startMaintenancePolling(){
  if(LIVE_TIMER) return;
  LIVE_TIMER = setInterval(pollLiveState, 20000);
  // Instant check when the app is brought back to the foreground (or a tab
  // becomes visible) — this is what makes it feel immediate in real use.
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pollLiveState(); });
  window.addEventListener('focus', pollLiveState);
  if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
    try{ window.Capacitor.Plugins.App.addListener('appStateChange', st=>{ if(st && st.isActive) pollLiveState(); }); }catch(e){}
  }
}

/* ═══════════════════════════════════════════════════════════
   ANDROID BACK BUTTON
   With @capacitor/app installed, Android hands the back button to the app
   only if the app listens for it; otherwise it closes the app, because a
   single-page app like this never adds browser history for the WebView to
   go back through. So back is handled here, in this order: close whatever
   sits on top (zoomed photo, bottom sheet), step back inside a multi-step
   form, walk back through the screens the customer came through, fall back
   to Home from any other tab, and only leave the app from Home — on a
   second press, so one stray tap never closes it.
   ═══════════════════════════════════════════════════════════ */
let BACK_EXIT_AT = 0;
function appExit(){
  const App = window.Capacitor?.Plugins?.App;
  if(App?.exitApp) App.exitApp(); else if(App?.minimizeApp) App.minimizeApp();
}
function handleHardwareBack(){
  if(document.getElementById('zoom')){ closeZoom(); return; }
  if(document.getElementById('sheet')?.classList.contains('on')){ closeSheet(); return; }
  if(MAINTENANCE_LOCKED){ appExit(); return; }
  // Multi-step forms live on one screen; back steps through them first.
  if(S.screen === 'login' && LOGIN.step !== 'entry'){
    LOGIN.step = (LOGIN.step === 'otp' && LOGIN.mode === 'b2b' && LOGIN.authMode === 'signup') ? 'contact'
               : LOGIN.step === 'contact' ? 'bank' : 'entry';
    paint(); return;
  }
  if(S.screen === 'forgotPassword' && RESET.step !== 'entry'){ RESET.step = 'entry'; paint(); return; }
  // A rider mid-trip keeps tracking: back only sends the app to the background.
  if(S.screen === 'rider' && (RIDER.watchId || RIDER.webWatchId)){ window.Capacitor?.Plugins?.App?.minimizeApp?.(); return; }
  if(S.screen === 'rider' && RIDER.delivery){ riderClearOrder(); return; }
  // The order is placed — back from the confirmation goes home, not to checkout.
  if(S.screen === 'placed'){ switchTab('home'); return; }
  if(NAV.length){ back(); return; }
  if(S.user && S.screen !== 'home'){ switchTab('home'); return; }
  if(Date.now() - BACK_EXIT_AT < 2000){ appExit(); return; }
  BACK_EXIT_AT = Date.now();
  toast('Press back again to exit');
}
if(window.Capacitor?.Plugins?.App){
  try{ window.Capacitor.Plugins.App.addListener('backButton', handleHardwareBack); }catch(e){}
}
boot();

/* Keep the focused input visible when the keyboard opens. With the native
   resize configured above this is mostly automatic, but centering the focused
   field guarantees it — including inside bottom sheets — so nothing hides
   behind the keyboard. The short delay lets the keyboard/resize settle. */
document.addEventListener('focusin', (e)=>{
  const el = e.target;
  if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
    setTimeout(()=>{ try{ el.scrollIntoView({ block:'center', behavior:'smooth' }); }catch(_){} }, 280);
  }
});

/* ── Native push notifications (Capacitor PushNotifications plugin, no-op
   on plain web / if permission is denied). Registers this device's FCM
   token against the signed-in customer's account type so admin broadcasts
   (legal/admin/ "Broadcasts" tab) reach it — see window.registerPushToken
   in the module script above and backend/scripts/send-broadcast-push.js
   for how those actually get sent (a free scheduled relay, not a paid
   Cloud Function). ── */
let PUSH_INIT_DONE = false;
async function initPushNotifications(){
  if(PUSH_INIT_DONE || !S.user) return;
  const Push = window.Capacitor?.Plugins?.PushNotifications;
  if(!Push) return; // plain web / plugin unavailable — nothing to do
  PUSH_INIT_DONE = true;
  try{
    let perm = await Push.checkPermissions();
    if(perm.receive === 'prompt') perm = await Push.requestPermissions();
    if(perm.receive !== 'granted') return;
    Push.addListener('registration', token => {
      if(token?.value && window.registerPushToken) window.registerPushToken(token.value, isB2B()?'b2b':'b2c');
    });
    Push.addListener('registrationError', err => console.warn('Push registration failed:', err));
    Push.addListener('pushNotificationReceived', n => {
      // App was open when it arrived — Android won't auto-show a system
      // banner in that case, so surface it the same way other in-app
      // messages appear.
      toast(n?.body || n?.title || 'New notification', 'check');
    });
    await Push.register();
  }catch(e){ console.warn('Could not set up push notifications:', e); }
}

/* ── Native offline banner (Capacitor Network plugin, no-op on plain web) ── */
(function(){
  function showOfflineBanner(offline){
    let el = document.getElementById('native-offline-banner');
    if (offline && !el) {
      el = document.createElement('div');
      el.id = 'native-offline-banner';
      el.textContent = 'No internet connection — some features are unavailable';
      el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;'
        + 'background:#DC2626;color:#fff;font:600 12px/1.4 sans-serif;'
        + 'text-align:center;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;';
      document.body.appendChild(el);
    } else if (!offline && el) {
      el.remove();
    }
  }
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Network) {
    const Network = window.Capacitor.Plugins.Network;
    Network.getStatus().then(s => showOfflineBanner(!s.connected));
    Network.addListener('networkStatusChange', s => showOfflineBanner(!s.connected));
  } else {
    window.addEventListener('offline', () => showOfflineBanner(true));
    window.addEventListener('online', () => showOfflineBanner(false));
    if (!navigator.onLine) showOfflineBanner(true);
  }
})();
</script>
