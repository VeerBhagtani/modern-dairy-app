name: Apply Audit Fixes

# Backs the admin panel's "Validate audit fixes" button. It only acts when the
# admin has clicked it (deploy_control/request.requested). Then it checks out the
# newest audit fix PR and RE-RUNS THE TESTS, and reports whether they pass. It
# does NOT merge and does NOT deploy — a human reviews the diff and merges the PR
# on GitHub. Runs on a short schedule so a click is picked up within ~10-15 min
# (GitHub's scheduler can add delay), plus manual dispatch.
#
# FCM_SERVICE_ACCOUNT_JSON is already set; GITHUB_TOKEN is automatic.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply latest audit fixes if the admin requested it
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: node backend/scripts/apply-audit-fixes.js
