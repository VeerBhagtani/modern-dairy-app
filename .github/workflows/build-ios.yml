name: Build iOS App (Simulator)

# Unsigned build for the iOS Simulator only — installable on a real iPhone
# requires an Apple Developer Program account ($99/yr) for code signing,
# which this workflow deliberately does not assume. This exists to prove the
# app builds and runs on iOS before spending on that.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # SECURITY: the OTP and GST credentials used to be hardcoded literals in
      # www/index.html, a file committed to a PUBLIC repo. They now live only
      # in GitHub Actions secrets and are written into www/secrets.js here, at
      # build time, right before the app bundle is assembled. The copy of
      # www/secrets.js committed to the repo stays empty. See the header of
      # scripts/inject-secrets.js for what this does and does not achieve.
      - name: Inject build-time secrets into www/secrets.js
        env:
          OTP_CUSTOMER_ID: ${{ secrets.OTP_CUSTOMER_ID }}
          OTP_AUTH_TOKEN: ${{ secrets.OTP_AUTH_TOKEN }}
          GST_API_KEY: ${{ secrets.GST_API_KEY }}
          GST_API_SECRET: ${{ secrets.GST_API_SECRET }}
        run: node scripts/inject-secrets.js

      - name: Add iOS platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build for iOS Simulator (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Zip the .app bundle
        working-directory: ios/App/build/Build/Products/Debug-iphonesimulator
        run: zip -r ModernDairy-Simulator.zip App.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modern-dairy-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/ModernDairy-Simulator.zip
