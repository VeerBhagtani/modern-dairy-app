name: Secret Scan

# This repository is PUBLIC and has already leaked credentials once: a live
# GST API key + secret, a long-lived OTP provider bearer token and an admin
# password were committed as plain literals and are permanently in the git
# history. This job is the tripwire that stops it happening again — it fails
# the build if anything shaped like a credential appears in the working tree.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan working tree for committed credentials
        run: node scripts/check-no-secrets.js

      - name: Fail if www/secrets.js was committed with real values
        run: node scripts/check-secrets-placeholder.js

      - name: Run security regression tests
        run: |
          npm ci --ignore-scripts
          cd backend && npm ci --ignore-scripts && cd ..
          node tests/frontend-security.test.mjs
          node tests/backend-security.test.mjs

      - name: Audit dependencies that actually ship
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          cd backend && npm ci --ignore-scripts && npm audit --audit-level=moderate
