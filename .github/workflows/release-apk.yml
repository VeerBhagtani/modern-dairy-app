name: Publish downloadable APK

# Builds the apps and puts the APKs — plus the admin website's index.html — on
# a GitHub Release page, so they can be downloaded from a plain link with no
# GitHub login and no expiry. (Actions artifacts need a login and vanish after
# 90 days, which is no good for handing an APK to a driver.)
#
# It runs automatically whenever this workflow or an app changes on the
# branches listed below, and can also be run by hand from the Actions tab.

on:
  push:
    branches:
      - master
      - main
      - claude/modern-drivers-dairy-platform-ezt936
    paths:
      - 'www/**'
      - 'legal/admin/**'
      - 'driver-app/**'
      - 'android/**'
      - 'scripts/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        type: choice
        required: true
        default: 'both'
        options: [both, modern-dairy, modern-drivers]
      tag:
        description: 'Release tag (blank = auto)'
        required: false
        default: ''

permissions:
  contents: write        # create the release and upload the files

# A push while a build is running supersedes it, so the latest release always
# reflects the latest code rather than whichever job happened to finish last.
concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # On a push there are no workflow inputs, so everything gets built.
  APP: ${{ github.event.inputs.app || 'both' }}

jobs:
  # ── Modern Dairy: the customer ordering app ─────────────────────────────
  modern-dairy:
    if: ${{ (github.event.inputs.app || 'both') == 'both' || github.event.inputs.app == 'modern-dairy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      # OTP and GST credentials come from repository secrets at build time; the
      # committed www/secrets.js stays empty. With the secrets absent the build
      # still succeeds and produces a DEMO-mode app — deliberately, so a
      # misconfigured run can never ship a half-live build.
      - name: Inject build-time secrets
        env:
          OTP_CUSTOMER_ID: ${{ secrets.OTP_CUSTOMER_ID }}
          OTP_AUTH_TOKEN: ${{ secrets.OTP_AUTH_TOKEN }}
          GST_API_KEY: ${{ secrets.GST_API_KEY }}
          GST_API_SECRET: ${{ secrets.GST_API_SECRET }}
        run: node scripts/inject-secrets.js

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Stage the files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/modern-dairy.apk
          # The admin website. It is a single self-contained HTML file, so this
          # is the whole thing — open it in a browser and it works.
          cp legal/admin/index.html out/admin-website.html
          # The customer app's own front end, as built into this APK.
          cp www/index.html out/modern-dairy-app.html
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: modern-dairy-build
          path: out/*
          if-no-files-found: error

  # ── Modern Drivers: the driver tracking app ─────────────────────────────
  modern-drivers:
    if: ${{ (github.event.inputs.app || 'both') == 'both' || github.event.inputs.app == 'modern-drivers' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: driver-app
        run: npm install

      # The driver app refuses to start a ride without a backend address, on
      # purpose — an APK that silently records nothing would be worse than one
      # that says it is not set up. Without the secret it still builds, so the
      # screens can be seen, and the release notes say plainly what it can't do.
      - name: Point the build at the backend
        id: apibase
        working-directory: driver-app
        env:
          API_BASE: ${{ secrets.DRIVERS_API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::warning::DRIVERS_API_BASE is not set — this driver APK cannot enrol a driver or start a ride."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            node ../scripts/set-drivers-api-base.js "$API_BASE"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the native Android project
        working-directory: driver-app
        run: npx cap add android

      - name: Patch the manifest for background location
        run: node scripts/patch-drivers-manifest.js

      # cap add android generates the stock Capacitor icon. Both apps live on the
      # same phone, so the driver app gets its own artwork — same brand mark,
      # inverted palette — or the launcher shows a generic developer-sample icon
      # next to the real Modern Dairy one.
      #
      # @capacitor/assets is deliberately NOT a dependency of this repo (its
      # sharp/uuid advisories were the reason it was removed), so it is invoked
      # through npx here: it runs on a CI runner over files from this repo and
      # nothing it pulls in ever ships inside the APK.
      - name: Generate the launcher icon and splash
        working-directory: driver-app
        run: npx --yes @capacitor/assets@3 generate --android

      - name: Sync web assets
        working-directory: driver-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: driver-app
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Stage the files
        run: |
          mkdir -p out
          cp driver-app/android/app/build/outputs/apk/debug/app-debug.apk out/modern-drivers.apk
          cp legal/drivers/index.html out/drivers-dashboard.html
          echo "${{ steps.apibase.outputs.configured }}" > out/.drivers-configured
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: modern-drivers-build
          path: |
            out/*
            out/.drivers-configured
          include-hidden-files: true
          if-no-files-found: error

  # ── Publish one download page ───────────────────────────────────────────
  release:
    needs: [modern-dairy, modern-drivers]
    # Publishes whatever actually built. One app failing must not deny anyone
    # the other — a broken driver build should not take the ordering APK and
    # the admin site down with it. The notes below say what is missing and why.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Collect the files
        id: collect
        run: |
          mkdir -p release
          find staged -type f ! -name '.drivers-configured' -exec cp {} release/ \;
          if [ -f staged/modern-drivers-build/.drivers-configured ]; then
            echo "drivers_configured=$(cat staged/modern-drivers-build/.drivers-configured)" >> "$GITHUB_OUTPUT"
          fi
          ls -lh release
          if [ -z "$(ls -A release)" ]; then
            echo "::error::Nothing was produced — refusing to publish an empty release."
            exit 1
          fi

      - name: Write the download page text
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="download-$(date +%Y%m%d)-${{ github.run_number }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          {
            echo "**Download the files below.** Scroll to the bottom of this page — they are under **Assets**."
            echo
            echo "These are **two separate apps**. They install side by side on the same phone — different names, different icons, different app IDs. Neither replaces the other."
            echo
            echo "## 1. Modern Dairy — the ordering app"
            echo
            echo "For customers. White icon, red mark. App ID \`in.moderndairy.app\`."
            echo
            echo "| File | What it is |"
            echo "|---|---|"
            [ -f release/modern-dairy.apk ] && echo "| \`modern-dairy.apk\` | The app. Works straight away, no setup. |"
            [ -f release/admin-website.html ] && echo "| \`admin-website.html\` | The admin website, one self-contained file — open it in Chrome. |"
            [ -f release/modern-dairy-app.html ] && echo "| \`modern-dairy-app.html\` | The app's screens as one HTML file, for reference. |"
            echo
            echo "## 2. Modern Drivers — the driver tracking app"
            echo
            echo "For delivery drivers. **Navy icon**, white mark with a route line. App ID \`in.moderndairy.drivers\`."
            echo
            echo "| File | What it is |"
            echo "|---|---|"
            [ -f release/modern-drivers.apk ] && echo "| \`modern-drivers.apk\` | The driver app. **See the note below before handing it to a driver.** |"
            [ -f release/drivers-dashboard.html ] && echo "| \`drivers-dashboard.html\` | The tracking dashboard page, for reference. |"
            echo
            echo "## Installing an APK on Android"
            echo
            echo "1. Open this page in Chrome **on the phone**."
            echo "2. Tap the \`.apk\` file under Assets. Chrome will warn that this file type can harm your device — that warning appears for every APK not from the Play Store. Tap **Download anyway**."
            echo "3. Tap the downloaded file. Android asks to allow installing from Chrome — allow it once."
            echo "4. Install."
            echo
            echo "These are **debug** builds. They install alongside a Play Store version rather than replacing it."
            if [ "${{ steps.collect.outputs.drivers_configured }}" = "false" ]; then
              echo
              echo "## ⚠️ About modern-drivers.apk"
              echo
              echo "**It installs and opens, but it cannot track anything yet.** The tracking backend is not deployed, so the app has no server to talk to — it will not enrol a driver or start a ride. It refuses rather than pretending to record, which is deliberate."
              echo
              echo "To make it work: deploy the backend to Cloud Run, add a repository secret \`DRIVERS_API_BASE\` with that URL, and this page will rebuild with a working APK."
            fi
            if [ ! -f release/modern-dairy.apk ] && [ "${{ needs.modern-dairy.result }}" = "failure" ]; then
              echo
              echo "> ⚠️ The **ordering app** build failed, so its APK is missing from this release. [See the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            fi
            if [ ! -f release/modern-drivers.apk ] && [ "${{ needs.modern-drivers.result }}" = "failure" ]; then
              echo
              echo "> ⚠️ The **driver app** build failed, so its APK is missing from this release. [See the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            fi
            echo
            echo "---"
            echo "Built from \`${{ github.ref_name }}\` at commit \`${{ github.sha }}\`."
          } > NOTES.md
          cat NOTES.md

      # gh is preinstalled on the runner, so this needs no third-party action.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Downloads — ${{ steps.notes.outputs.tag }}" \
            --notes-file NOTES.md \
            release/*
          echo "Published: $(gh release view "${{ steps.notes.outputs.tag }}" --repo "${{ github.repository }}" --json url -q .url)"

      - name: Put the link in the run summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh release view "${{ steps.notes.outputs.tag }}" --repo "${{ github.repository }}" --json url -q .url)
          echo "## Download page" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
