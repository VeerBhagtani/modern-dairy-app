name: Build and publish the app

# Builds the driver APK and puts it on a Release page, so it can be downloaded
# from a plain link with no GitHub login and no expiry.

on:
  push:
    branches: [main, master, modern-drivers-standalone]
    paths: ['app/**', 'scripts/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (blank = auto)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # Nothing ships unless the whole test suite passes on this commit.
      - name: Run the test suite
        run: |
          (cd backend && npm ci --no-audit --no-fund)
          npm test
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install dependencies
        working-directory: app
        run: npm install

      # The app refuses to start a ride without a server address, on purpose —
      # an APK that silently records nothing is worse than one that says it is
      # not set up. Without the secret it still builds so the screens can be
      # seen, and the release notes say plainly what it cannot do.
      - name: Point the build at the backend
        id: apibase
        working-directory: app
        env:
          API_BASE: ${{ secrets.DRIVERS_API_BASE }}
          # The production API, as the deploy reported it. It lives here rather
          # than in app/www/config.js because the committed app must stay
          # environment-agnostic — one source tree, and the target chosen at
          # build time. A DRIVERS_API_BASE secret overrides it for a staging
          # build.
          DEFAULT_API_BASE: https://modern-drivers-795895369854.asia-south1.run.app
        run: |
          API_BASE="${API_BASE:-$DEFAULT_API_BASE}"
          if [ -z "$API_BASE" ]; then
            echo "::warning::DRIVERS_API_BASE is not set — this APK cannot register a driver or start a ride."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            node ../scripts/set-api-base.js "$API_BASE" www/config.js
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # The APK shipped for days without this file. Android injects only
      # Capacitor's low-level bridge; registerPlugin, which every GPS call goes
      # through, is in @capacitor/core's browser bundle, and an app with no
      # bundler has to load it itself. Without it the app reported "not running
      # inside the app" from inside the app. Copied from the installed package so
      # it can never drift from the native side's version. cp fails the build if
      # the file is missing, which is the point.
      - name: Add Capacitor's JavaScript runtime
        working-directory: app
        run: cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js

      - name: Generate the native project
        working-directory: app
        run: npx cap add android

      - name: Patch the manifest for background location
        run: node scripts/patch-manifest.js app/android/app/src/main/AndroidManifest.xml

      - name: Add the app's own native code
        run: node scripts/add-native.js app/android

      - name: Generate the launcher icon and splash
        working-directory: app
        run: npx --yes @capacitor/assets@3 generate --android

      - name: Sync web assets
        working-directory: app
        run: npx cap sync android

      - name: Build the APK
        working-directory: app
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      # The APK goes into the gh-pages branch first, because that is a plain
      # file in a public repository: a link anyone can tap on a phone, with no
      # GitHub login, no settings to switch on, and nothing that can expire.
      # The Release below is a nicer landing page on top of that, and it is
      # allowed to fail — GitHub's Releases API is not always open to a
      # workflow's own token, and an APK that cannot be downloaded is a worse
      # outcome than a missing Release page.
      - name: Publish the APK to the download branch
        id: apk
        run: |
          set -euo pipefail
          URL="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf site
          git clone -q --depth 1 --branch gh-pages "$URL" site 2>/dev/null \
            || { mkdir site && git -C site init -q -b gh-pages; }
          cp app/android/app/build/outputs/apk/debug/app-debug.apk site/modern-drivers.apk
          cd site
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The published APK already matches this build."
          else
            git commit -q -m "Publish the driver app from ${GITHUB_SHA::7}"
            git push -q "$URL" gh-pages
          fi
          echo "url=https://github.com/${GITHUB_REPOSITORY}/raw/gh-pages/modern-drivers.apk" >> "$GITHUB_OUTPUT"

      - name: Say where it is
        run: |
          {
            echo "## Download the app"
            echo
            echo "${{ steps.apk.outputs.url }}"
            echo
            echo "Open that on the phone, in Chrome."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Also make a Release page, if GitHub allows it
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release
          cp app/android/app/build/outputs/apk/debug/app-debug.apk release/modern-drivers.apk

          OWNER="${GITHUB_REPOSITORY%%/*}"; NAME="${GITHUB_REPOSITORY##*/}"
          SITE="https://${OWNER,,}.github.io/${NAME}/"

          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="v$(date +%Y%m%d)-${{ github.run_number }}"

          {
            echo "## Modern Drivers — driver app"
            echo
            echo "Download **modern-drivers.apk** below, under Assets."
            echo
            echo "### Installing it on a phone"
            echo
            echo "1. Open this page in Chrome **on the phone**."
            echo "2. Tap \`modern-drivers.apk\`. Chrome warns about APK files — that happens for anything not from the Play Store. Tap **Download anyway**."
            echo "3. Tap the downloaded file, allow installing from Chrome once, install."
            echo
            echo "### Using it"
            echo
            echo "The driver types their **name**, once. No password, no code, nothing to remember. The app asks for location straight away and shows them on the map. Then Start Ride each morning."
            echo
            echo "Only the office can stop a ride."
            echo
            echo "### The office dashboard"
            echo
            echo "$SITE"
            echo
            echo "A website, not a download. Open it on the office PC and sign in."
            if [ "${{ steps.apibase.outputs.configured }}" = "false" ]; then
              echo
              echo "> ⚠️ **The backend is not deployed yet.** This APK records the route on the phone and draws it live on the map — real GPS, kept locally — and says plainly that nothing has reached the office. Nothing is invented. The dashboard has no drivers to show until the backend is up. Deploy it, set the \`DRIVERS_API_BASE\` repository secret, and this page rebuilds with an APK that syncs."
            fi
            echo
            echo "---"
            echo "Built from \`${{ github.sha }}\`."
          } > NOTES.md

          gh release create "$TAG" --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "Modern Drivers $TAG" \
            --notes-file NOTES.md release/*
          echo "Published: $(gh release view "$TAG" --repo "${{ github.repository }}" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
