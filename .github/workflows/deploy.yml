name: Deploy

# One run puts the whole thing live: the API, the database rules, and the
# office dashboard. Safe to re-run; every step checks its prerequisites and
# fails with a plain message rather than half-deploying.
#
# ── ONE-TIME SETUP ──────────────────────────────────────────────────────
# Two repository secrets (Settings → Secrets and variables → Actions):
#
#   GCP_PROJECT_ID   the Google Cloud project for THIS product
#   GCP_SA_KEY       a service-account JSON key holding:
#                      Cloud Run Admin, Cloud Build Editor,
#                      Artifact Registry Admin (writer cannot create the
#                        container repository on a first deploy),
#                      Service Account User,
#                      Secret Manager Admin, Storage Admin,
#                      Firebase Rules Admin, Cloud Datastore Index Admin
#
# Billing must be on, or Cloud Run and Firestore refuse.
#
# IMPORTANT: use a project dedicated to Modern Drivers. Deploying the rules in
# this repo to a project that also serves another product would replace that
# product's rules with this one's deny-all.

on:
  workflow_dispatch:
    inputs:
      region:
        description: Cloud Run region
        default: asia-south1
        required: true
      service:
        description: Cloud Run service name
        default: modern-drivers-api
        required: true
  # GitHub only shows the "Run workflow" button for workflows on the default
  # branch, and this project lives on its own branch. Touching this marker file
  # is the way to ask for a deploy from here.
  push:
    branches: [modern-drivers-standalone]
    paths: ['.github/deploy-now']

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # The secrets arrive as environment variables, never interpolated into the
      # script text: the key is multi-line JSON, and pasting it into a bash
      # condition breaks the script's own syntax before it can test anything.
      - name: Check the prerequisites before touching anything
        id: cfg
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          miss=0
          if [ -z "$PROJECT_ID" ]; then echo "::error::GCP_PROJECT_ID is not set."; miss=1; fi
          if [ -z "$SA_KEY" ]; then echo "::error::GCP_SA_KEY is not set."; miss=1; fi
          if [ "$miss" = "1" ]; then exit 1; fi

          # A secret pasted into a web form picks up stray whitespace more often
          # than not, and gcloud rejects " my-project" as "a project name, not a
          # project ID" — a confusing message for an invisible character. Trim it
          # once here and use the trimmed value everywhere below.
          CLEAN=$(printf '%s' "$PROJECT_ID" | tr -d '[:space:]')
          echo "project=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Prerequisites present."

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      # Every driver and office token is signed with this. Created once, never
      # replaced — rotating it signs every driver out of their phone, so that is
      # a deliberate act, not a side effect of a deploy.
      - name: Ensure the signing key exists
        run: |
          P="${{ steps.cfg.outputs.project }}"
          if gcloud secrets describe jwt-signing-key --project "$P" >/dev/null 2>&1; then
            echo "jwt-signing-key already exists — untouched."
          else
            node -e "console.log(require('crypto').randomBytes(48).toString('hex'))" \
              | gcloud secrets create jwt-signing-key --project "$P" --data-file=- --replication-policy=automatic
            echo "Created jwt-signing-key."
          fi

      # Cloud Run's source deploy creates this repository implicitly on the very
      # first run, which is the one moment the deploy needs a permission it
      # never needs again — and a freshly granted IAM role can take a couple of
      # minutes to take effect. Creating it here, with a few retries, turns a
      # confusing PERMISSION_DENIED mid-deploy into a step that simply waits.
      - name: Ensure the container repository exists
        run: |
          P="${{ steps.cfg.outputs.project }}"
          R="${{ github.event.inputs.region || 'asia-south1' }}"
          if gcloud artifacts repositories describe cloud-run-source-deploy \
               --project "$P" --location "$R" >/dev/null 2>&1; then
            echo "Already there."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if gcloud artifacts repositories create cloud-run-source-deploy \
                 --project "$P" --location "$R" --repository-format=docker \
                 --description="Built by the Modern Drivers deploy" --quiet; then
              echo "Created."
              exit 0
            fi
            echo "Not yet — an IAM grant may still be propagating (attempt $i)."
            sleep 30
          done
          echo "::error::Could not create the Artifact Registry repository. The deploy account needs roles/artifactregistry.admin."
          exit 1

      - name: Deploy the API
        id: backend
        run: |
          P="${{ steps.cfg.outputs.project }}"
          R="${{ github.event.inputs.region || 'asia-south1' }}"
          S="${{ github.event.inputs.service || 'modern-drivers-api' }}"
          # The office dashboard is served from GitHub Pages, so that origin is
          # the one the browser will send. The Firebase Hosting origins stay in
          # the list in case the dashboard is ever served from there too.
          OWNER="${GITHUB_REPOSITORY%%/*}"
          ORIGINS="https://${OWNER,,}.github.io,https://${P}.web.app,https://${P}.firebaseapp.com"
          # ALLOWED_ORIGINS is itself a comma-separated list, and --set-env-vars
          # splits on commas — so the list has to be passed with gcloud's
          # alternate delimiter syntax, "^@^", which makes @ the separator
          # between variables and leaves the commas inside one value alone.
          gcloud run deploy "$S" --project "$P" --region "$R" --source backend \
            --allow-unauthenticated --port 8080 --quiet \
            --set-env-vars "^@^GCP_PROJECT_ID=${P}@NODE_ENV=production@ALLOWED_ORIGINS=${ORIGINS}"
          URL=$(gcloud run services describe "$S" --project "$P" --region "$R" --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "API live at $URL"

      - name: Check it is answering
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS "${{ steps.backend.outputs.url }}/healthz" >/dev/null && { echo "Healthy."; exit 0; }
            echo "Not ready (attempt $i)…"; sleep 10
          done
          echo "::error::Deployed but /healthz is not answering. Check the Cloud Run logs."
          exit 1

      - name: Deploy the database rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: npx --yes firebase-tools@13 deploy --project "${{ steps.cfg.outputs.project }}" --only firestore:rules,firestore:indexes --non-interactive

      # The dashboard ships with an empty API_BASE so no environment URL is ever
      # committed by hand. The deploy knows the real one, so it writes it in.
      - name: Point the dashboard at the API
        run: |
          node scripts/set-api-base.js "${{ steps.backend.outputs.url }}" dashboard/config.js
          if ! git diff --quiet -- dashboard/config.js; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dashboard/config.js
            git commit -m "Point the dashboard at ${{ steps.backend.outputs.url }} [skip ci]"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      # Republished here rather than left to the dashboard workflow: a push made
      # with the workflow's own token does not start another workflow, so
      # nothing else would pick the new address up.
      - name: Republish the dashboard with the address baked in
        run: |
          set -euo pipefail
          URL="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf site
          git clone -q --depth 1 --branch gh-pages "$URL" site 2>/dev/null \
            || { mkdir site && git -C site init -q -b gh-pages; }
          find site -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name 'modern-drivers.apk' -exec rm -rf {} +
          cp -R dashboard/. site/
          touch site/.nojekyll
          cd site
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The published dashboard already carries this address."
          else
            git commit -q -m "Point the published dashboard at the API"
            git push -q "$URL" gh-pages
          fi

      - name: What is left
        run: |
          P="${{ steps.cfg.outputs.project }}"
          {
            echo "# Live"
            echo
            echo "| | |"
            echo "|---|---|"
            OWNER="${GITHUB_REPOSITORY%%/*}"; NAME="${GITHUB_REPOSITORY##*/}"
            echo "| API | \`${{ steps.backend.outputs.url }}\` |"
            echo "| Office dashboard | https://${OWNER,,}.github.io/${NAME}/ |"
            echo
            echo "## Two things left"
            echo
            echo "**1. Create your office login.** Nobody can sign in to the dashboard yet. In Cloud Shell:"
            echo '```'
            echo "git clone https://github.com/${{ github.repository }} && cd modern-drivers/backend"
            echo "npm install && GCP_PROJECT_ID=$P npm run create-admin -- --user veer --name \"Veer\" --role admin"
            echo '```'
            echo
            echo "**2. Make the APK able to connect.** Add a repository secret \`DRIVERS_API_BASE\` = \`${{ steps.backend.outputs.url }}\`, then run **Build and publish the app**."
            echo
            echo "After that: add your Modern Dairy depots and restaurants under Locations, and drivers register themselves from the app."
          } >> "$GITHUB_STEP_SUMMARY"
