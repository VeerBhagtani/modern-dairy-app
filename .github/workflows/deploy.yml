name: Deploy

# One run puts the whole thing live: the API, the database rules, and the
# office dashboard. Safe to re-run; every step checks its prerequisites and
# fails with a plain message rather than half-deploying.
#
# ── ONE-TIME SETUP ──────────────────────────────────────────────────────
# Two repository secrets (Settings → Secrets and variables → Actions):
#
#   GCP_PROJECT_ID   the Google Cloud project for THIS product
#   GCP_SA_KEY       a service-account JSON key holding:
#                      Cloud Run Admin, Cloud Build Editor,
#                      Artifact Registry Admin (writer cannot create the
#                        container repository on a first deploy),
#                      Service Account User,
#                      Secret Manager Admin, Storage Admin,
#                      Firebase Rules Admin, Cloud Datastore Index Admin
#
# Billing must be on, or Cloud Run and Firestore refuse.
#
# IMPORTANT: use a project dedicated to Modern Drivers. Deploying the rules in
# this repo to a project that also serves another product would replace that
# product's rules with this one's deny-all.

on:
  workflow_dispatch:
    inputs:
      region:
        description: Cloud Run region
        default: asia-south1
        required: true
      service:
        description: Cloud Run service name
        default: modern-drivers
        required: true
  # GitHub only shows the "Run workflow" button for workflows on the default
  # branch, and this project lives on its own branch. Touching this marker file
  # is the way to ask for a deploy from here.
  push:
    branches: [modern-drivers-standalone]
    paths: ['.github/deploy-now']

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # The secrets arrive as environment variables, never interpolated into the
      # script text: the key is multi-line JSON, and pasting it into a bash
      # condition breaks the script's own syntax before it can test anything.
      - name: Check the prerequisites before touching anything
        id: cfg
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          miss=0
          if [ -z "$PROJECT_ID" ]; then echo "::error::GCP_PROJECT_ID is not set."; miss=1; fi
          if [ -z "$SA_KEY" ]; then echo "::error::GCP_SA_KEY is not set."; miss=1; fi
          if [ "$miss" = "1" ]; then exit 1; fi

          # A secret pasted into a web form picks up stray whitespace more often
          # than not, and gcloud rejects " my-project" as "a project name, not a
          # project ID" — a confusing message for an invisible character. Trim it
          # once here and use the trimmed value everywhere below.
          CLEAN=$(printf '%s' "$PROJECT_ID" | tr -d '[:space:]')
          echo "project=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Prerequisites present."

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      # Every driver and office token is signed with this. Created once, never
      # replaced — rotating it signs every driver out of their phone, so that is
      # a deliberate act, not a side effect of a deploy.
      - name: Ensure the signing key exists
        run: |
          P="${{ steps.cfg.outputs.project }}"
          if gcloud secrets describe jwt-signing-key --project "$P" >/dev/null 2>&1; then
            echo "jwt-signing-key already exists — untouched."
          else
            node -e "console.log(require('crypto').randomBytes(48).toString('hex'))" \
              | gcloud secrets create jwt-signing-key --project "$P" --data-file=- --replication-policy=automatic
            echo "Created jwt-signing-key."
          fi

      # Cloud Run's source deploy creates this repository implicitly on the very
      # first run, which is the one moment the deploy needs a permission it
      # never needs again — and a freshly granted IAM role can take a couple of
      # minutes to take effect. Creating it here, with a few retries, turns a
      # confusing PERMISSION_DENIED mid-deploy into a step that simply waits.
      - name: Ensure the container repository exists
        run: |
          P="${{ steps.cfg.outputs.project }}"
          R="${{ github.event.inputs.region || 'asia-south1' }}"
          if gcloud artifacts repositories describe cloud-run-source-deploy \
               --project "$P" --location "$R" >/dev/null 2>&1; then
            echo "Already there."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if gcloud artifacts repositories create cloud-run-source-deploy \
                 --project "$P" --location "$R" --repository-format=docker \
                 --description="Built by the Modern Drivers deploy" --quiet; then
              echo "Created."
              exit 0
            fi
            echo "Not yet — an IAM grant may still be propagating (attempt $i)."
            sleep 30
          done
          echo "::error::Could not create the Artifact Registry repository. The deploy account needs roles/artifactregistry.admin."
          exit 1

      - name: Deploy the database rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: npx --yes firebase-tools@13 deploy --project "${{ steps.cfg.outputs.project }}" --only firestore:rules,firestore:indexes --non-interactive

      # The service reads the signing key from Secret Manager at sign-in, and
      # the runtime account could not: roles/editor, which Cloud Run's default
      # account carries, does not include secretmanager.versions.access. The
      # read threw, the rejection killed the process, and every login came back
      # as a 503 — which looks from a browser exactly like the server being
      # down. Granted here rather than by hand so a fresh project cannot repeat
      # it, and scoped to this one secret rather than the project.
      - name: Let the service read its signing key
        run: |
          P="${{ steps.cfg.outputs.project }}"
          R="${{ github.event.inputs.region || 'asia-south1' }}"
          S="${{ github.event.inputs.service || 'modern-drivers' }}"
          SA=$(gcloud run services describe "$S" --project "$P" --region "$R" \
                 --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null)
          if [ -z "$SA" ]; then
            NUM=$(gcloud projects describe "$P" --format='value(projectNumber)')
            SA="${NUM}-compute@developer.gserviceaccount.com"
            echo "The service does not name a runtime account yet; using the default: $SA"
          fi
          # Per secret, not project-wide. Project-level IAM needs
          # resourcemanager.projects.setIamPolicy, which this deploy account
          # deliberately does not have — it can administer secrets and nothing
          # else. Granting per secret keeps it that way.
          #
          # The integration secrets are created here with no version so the
          # grant has something to attach to. A secret with no version reads
          # back as "not configured", which is exactly right until the office
          # saves a key from the dashboard.
          for SECRET in jwt-signing-key geocoding-api-key anthropic-api-key gofrugal-api-key gofrugal-outlet-id gofrugal-company-id; do
            gcloud secrets describe "$SECRET" --project "$P" >/dev/null 2>&1 \
              || gcloud secrets create "$SECRET" --project "$P" --replication-policy=automatic --quiet
            gcloud secrets add-iam-policy-binding "$SECRET" \
              --project "$P" --member="serviceAccount:${SA}" \
              --role=roles/secretmanager.secretAccessor --quiet >/dev/null
          done
          echo "$SA can read this product's secrets."

      - name: Deploy the API
        id: backend
        run: |
          P="${{ steps.cfg.outputs.project }}"
          R="${{ github.event.inputs.region || 'asia-south1' }}"
          S="${{ github.event.inputs.service || 'modern-drivers' }}"
          # The office dashboard is served from GitHub Pages, so that origin is
          # the one the browser will send. The Firebase Hosting origins stay in
          # the list in case the dashboard is ever served from there too.
          #
          # And the driver app, which is the one that is easy to forget. It is
          # not a website and has no domain: Capacitor serves it from inside the
          # APK, and with androidScheme "https" the WebView's origin is literally
          # "https://localhost" (iOS would be "capacitor://localhost"). Omitting
          # those makes nothing safer — it means every call from every phone is
          # refused by the browser before it reaches this service, and the driver
          # sees "Failed to fetch" with nothing to go on.
          #
          # CORS is not the security boundary here and must not be mistaken for
          # one. It decides which web pages a browser will let talk to this API;
          # the signed driver token decides who may actually do anything. A
          # hostile page on localhost gains nothing without a token it has no way
          # to obtain.
          OWNER="${GITHUB_REPOSITORY%%/*}"
          ORIGINS="https://${OWNER,,}.github.io,https://${P}.web.app,https://${P}.firebaseapp.com,https://localhost,capacitor://localhost"

          # The first office login, seeded by the service on startup because the
          # deploy account can manage Firestore indexes but not write documents,
          # and widening it for one row would hand CI read/write access to every
          # driver's location history.
          #
          # This is bcrypt over a 24-character random password — around 143 bits.
          # A hash of that is safe in the open: it cannot be reversed and there
          # is nothing to guess, which is what a password hash is for. The
          # plaintext went to the owner privately, and the dashboard requires it
          # to be changed at first sign-in. Seeding never overwrites, so the
          # changed password survives every later deploy.
          SEED_USER='Modern-dairy'
          SEED_NAME='Modern Dairy'
          SEED_HASH='$2a$12$G8CiQjZrP0X8SF.fD2.9zOBxlY8FJ3B2lBLGkhH6y7oOs7lrKXL9e'
          # ALLOWED_ORIGINS is itself a comma-separated list, and --set-env-vars
          # splits on commas — so the list has to be passed with gcloud's
          # alternate delimiter syntax, "^@^", which makes @ the separator
          # between variables and leaves the commas inside one value alone.
          # --ingress=all is explicit rather than assumed: a service restricted
          # to internal traffic answers an outside caller with a plain Google
          # 404, not a 403, which is indistinguishable from a broken app. The
          # office dashboard and forty phones all reach this over the internet.
          gcloud run deploy "$S" --project "$P" --region "$R" --source backend \
            --allow-unauthenticated --ingress=all --port 8080 --quiet \
            --set-env-vars "^@^GCP_PROJECT_ID=${P}@NODE_ENV=production@ALLOWED_ORIGINS=${ORIGINS}@SEED_ADMIN_USERNAME=${SEED_USER}@SEED_ADMIN_NAME=${SEED_NAME}@SEED_ADMIN_HASH=${SEED_HASH}"
          # Cloud Run can hold more than one address for a service, and
          # `status.url` has handed back a legacy one that 404s while the
          # service itself was serving fine on another. So rather than trusting
          # a single field, collect every address gcloud knows and keep the one
          # that actually answers /health. The URL is written into the
          # dashboard and the APK, so it has to be a working one.
          CANDIDATES=$(
            {
              gcloud run services describe "$S" --project "$P" --region "$R" --format='value(urls)' 2>/dev/null | tr ';,' '\n\n'
              gcloud run services describe "$S" --project "$P" --region "$R" --format='value(status.url)' 2>/dev/null
              gcloud run services describe "$S" --project "$P" --region "$R" --format='value(status.address.url)' 2>/dev/null
            } | tr -d ' ' | awk 'NF' | awk '!seen[$0]++'
          )
          echo "Addresses gcloud reports:"; echo "$CANDIDATES"

          # A brand-new Cloud Run service is Ready, and serving, several minutes
          # before its hostname is routable from outside: until Google's edge
          # learns the name, the request never reaches the service and comes
          # back as a plain Google 404. That looks exactly like a broken app, so
          # the wait here is generous on purpose — eight minutes, once, on the
          # first deploy of a project. Later deploys answer on the first try.
          URL=""
          for attempt in $(seq 1 32); do
            for c in $CANDIDATES; do
              if curl -fsS --max-time 15 "$c/health" >/dev/null 2>&1; then
                URL="$c"; break
              fi
            done
            [ -n "$URL" ] && break
            echo "Not routable yet (attempt $attempt of 32) — this is normal on a first deploy."
            sleep 15
          done

          if [ -z "$URL" ]; then
            echo "--- what each address actually returns ---"
            for c in $CANDIDATES; do
              echo "== $c/health"
              curl -sS -i --max-time 20 "$c/health" | head -25 || true
              echo
              # An identity token separates "the service refuses anonymous
              # callers" from "the app itself is not answering".
              echo "== same, with an identity token"
              curl -sS -i --max-time 20 \
                -H "Authorization: Bearer $(gcloud auth print-identity-token 2>/dev/null)" \
                "$c/health" | head -25 || true
              echo
            done
            echo "--- who may invoke it ---"
            gcloud run services get-iam-policy "$S" --project "$P" --region "$R" 2>&1 | head -30 || true
            echo "--- ingress and URL settings ---"
            gcloud run services describe "$S" --project "$P" --region "$R" \
              --format='yaml(metadata.annotations,spec.template.metadata.annotations,status.url)' 2>&1 | head -40 || true
            echo "--- revision state ---"
            gcloud run revisions list --service "$S" --project "$P" --region "$R" 2>&1 | head -20 || true
            gcloud run services describe "$S" --project "$P" --region "$R" \
              --format='yaml(status.conditions,status.latestReadyRevisionName,status.traffic)' 2>&1 | head -40 || true
            echo "--- the container's own log ---"
            gcloud logging read \
              "resource.type=cloud_run_revision AND resource.labels.service_name=$S" \
              --project "$P" --limit 40 --format='value(textPayload)' 2>&1 | head -40 || true

            echo "::error::The service deployed but no reported address answers /health. The diagnostics above say why."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "API live and answering at $URL"

      # The dashboard ships with an empty API_BASE so no environment URL is ever
      # committed by hand. The deploy knows the real one, so it writes it in.
      - name: Point the dashboard at the API
        run: |
          node scripts/set-api-base.js "${{ steps.backend.outputs.url }}" dashboard/config.js
          if ! git diff --quiet -- dashboard/config.js; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dashboard/config.js
            git commit -m "Point the dashboard at ${{ steps.backend.outputs.url }} [skip ci]"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      # Republished here rather than left to the dashboard workflow: a push made
      # with the workflow's own token does not start another workflow, so
      # nothing else would pick the new address up.
      - name: Republish the dashboard with the address baked in
        run: |
          set -euo pipefail
          URL="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf site
          git clone -q --depth 1 --branch gh-pages "$URL" site 2>/dev/null \
            || { mkdir site && git -C site init -q -b gh-pages; }
          find site -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name 'modern-drivers.apk' -exec rm -rf {} +
          cp -R dashboard/. site/
          touch site/.nojekyll
          # Same stamping as dashboard.yml. This step used to publish without
          # it, so every deploy put unversioned script URLs back and browsers
          # were free to keep serving the previous day's files.
          V="${GITHUB_SHA::7}"
          sed -i -E "s#src=\"([A-Za-z0-9_-]+)\.js\"#src=\"\\1.js?v=${V}\"#g" site/index.html
          sed -i -E "s#href=\"(theme\.css|vendor/maplibre/maplibre-gl\.css)\"#href=\"\\1?v=${V}\"#g" site/index.html
          cd site
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The published dashboard already carries this address."
          else
            git commit -q -m "Point the published dashboard at the API"
            git push -q "$URL" gh-pages
          fi

      - name: What is left
        run: |
          P="${{ steps.cfg.outputs.project }}"
          {
            echo "# Live"
            echo
            echo "| | |"
            echo "|---|---|"
            OWNER="${GITHUB_REPOSITORY%%/*}"; NAME="${GITHUB_REPOSITORY##*/}"
            echo "| API | \`${{ steps.backend.outputs.url }}\` |"
            echo "| Office dashboard | https://${OWNER,,}.github.io/${NAME}/ |"
            echo
            echo "## Two things left"
            echo
            echo "**1. Create your office login.** Nobody can sign in to the dashboard yet. In Cloud Shell:"
            echo '```'
            echo "git clone https://github.com/${{ github.repository }} && cd modern-drivers/backend"
            echo "npm install && GCP_PROJECT_ID=$P npm run create-admin -- --user veer --name \"Veer\" --role admin"
            echo '```'
            echo
            echo "**2. Make the APK able to connect.** Add a repository secret \`DRIVERS_API_BASE\` = \`${{ steps.backend.outputs.url }}\`, then run **Build and publish the app**."
            echo
            echo "After that: add your Modern Dairy depots and restaurants under Locations, and drivers register themselves from the app."
          } >> "$GITHUB_STEP_SUMMARY"
