name: Send Broadcast Push Notifications

on:
  schedule:
    # Every 3 minutes — cheap enough to run constantly at this scale, and
    # keeps the delay between "admin hits Send" and the phone buzzing small.
    - cron: '*/3 * * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Relay pending broadcasts to FCM
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: node backend/scripts/send-broadcast-push.js
