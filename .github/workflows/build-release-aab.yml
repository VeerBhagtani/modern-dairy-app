name: Build Signed Release AAB

# Manual trigger only — release builds should be deliberate, not fired on
# every push like the debug APK workflow. Needs these repo Secrets set
# (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    - base64-encoded modern-dairy-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS          - moderndairy
#   ANDROID_KEY_PASSWORD
# See "MD APP - KEYSTORE (BACK THIS UP)/READ ME - keystore details.txt" for
# the actual values (not committed to this repo).

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      # SECURITY: the OTP and GST credentials used to be hardcoded literals in
      # www/index.html, a file committed to a PUBLIC repo. They now live only
      # in GitHub Actions secrets and are written into www/secrets.js here, at
      # build time, right before the app bundle is assembled. The copy of
      # www/secrets.js committed to the repo stays empty. See the header of
      # scripts/inject-secrets.js for what this does and does not achieve.
      - name: Inject build-time secrets into www/secrets.js
        env:
          OTP_CUSTOMER_ID: ${{ secrets.OTP_CUSTOMER_ID }}
          OTP_AUTH_TOKEN: ${{ secrets.OTP_AUTH_TOKEN }}
          GST_API_KEY: ${{ secrets.GST_API_KEY }}
          GST_API_SECRET: ${{ secrets.GST_API_SECRET }}
        run: node scripts/inject-secrets.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: app/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release.jks

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: modern-dairy-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
