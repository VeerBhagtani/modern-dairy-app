name: Publish the office dashboard

# The office website is static — HTML, CSS and JavaScript that talk to the API
# over HTTPS — so GitHub Pages can host it for nothing. That gives the office a
# real address to bookmark instead of a zip file someone has to unpack, and it
# updates itself every time the dashboard changes.
#
# It publishes to a generated `gh-pages` branch rather than through the Pages
# deployment environment, because that environment only accepts deployments
# from the default branch and this project lives on its own branch.

on:
  push:
    branches: [modern-drivers-standalone]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: modern-drivers-dashboard
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # Nothing ships unless the whole test suite passes on this commit.
      - name: Run the test suite
        run: |
          (cd backend && npm ci --no-audit --no-fund)
          npm test

      - name: Point it at the API, if we know the address yet
        env:
          API_BASE: ${{ secrets.DRIVERS_API_BASE }}
        run: |
          if [ -n "$API_BASE" ]; then
            node scripts/set-api-base.js "$API_BASE" dashboard/config.js
          else
            echo "No DRIVERS_API_BASE secret. The dashboard will ask for the"
            echo "server address on its sign-in screen instead."
          fi

      # The APK is published to this same branch by the app build, so this
      # updates the site in place rather than replacing the branch.
      - name: Publish
        run: |
          set -euo pipefail
          URL="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf site
          git clone -q --depth 1 --branch gh-pages "$URL" site 2>/dev/null \
            || { mkdir site && git -C site init -q -b gh-pages; }

          find site -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name 'modern-drivers.apk' -exec rm -rf {} +
          cp -R dashboard/. site/
          touch site/.nojekyll        # keep Pages from running Jekyll over it

          # Stamp every local script and stylesheet with this commit, so a
          # browser cannot serve yesterday's JavaScript from cache. Without it
          # a published change is invisible until someone thinks to hard-refresh
          # — which is not something to ask of the office, and not something to
          # rely on when the change is a bug fix.
          # Every top-level script, not a list of names: a list silently skips
          # the next file somebody adds, and that file is then the one that
          # stays stale on a phone.
          V="${GITHUB_SHA::7}"
          sed -i -E "s#src=\"([A-Za-z0-9_-]+)\.js\"#src=\"\\1.js?v=${V}\"#g" site/index.html
          sed -i -E "s#href=\"(theme\.css|vendor/maplibre/maplibre-gl\.css)\"#href=\"\\1?v=${V}\"#g" site/index.html
          echo "Asset URLs stamped with $V:"
          grep -oE '(src|href)="[^"]*\?v=[^"]*"' site/index.html || true

          cd site
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The published site already matches this commit."
          else
            git commit -q -m "Publish the office dashboard from ${GITHUB_SHA::7}"
            git push -q "$URL" gh-pages
          fi

      # The office's own address, https://<project>.web.app: the same site,
      # served from the company's Google project instead of github.io. Never
      # fails the run — GitHub Pages above is already published — but says why
      # if it could not publish.
      - name: Is the Google project configured?
        id: gcp
        env:
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -n "$SA_KEY" ] && [ -n "$PROJECT_ID" ]; then
            echo "has=yes" >> "$GITHUB_OUTPUT"
            echo "project=$(printf '%s' "$PROJECT_ID" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          else
            echo "has=no" >> "$GITHUB_OUTPUT"
          fi
      - id: gauth
        if: steps.gcp.outputs.has == 'yes'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Publish to Firebase Hosting (https://<project>.web.app)
        if: steps.gcp.outputs.has == 'yes'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gauth.outputs.credentials_file_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! bash scripts/publish-hosting.sh "${{ steps.gcp.outputs.project }}"; then
            {
              echo "## Firebase Hosting was not published"
              echo
              echo "The deploy account needs the **Firebase Hosting Admin** role in project"
              echo "\`${{ steps.gcp.outputs.project }}\`, and Hosting must be switched on once"
              echo "(Firebase console → Hosting → Get started). GitHub Pages is still up to date."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Switching Pages on for the first time is the one thing the workflow's
      # own token is not allowed to do (GitHub refuses `POST /pages` with a
      # GITHUB_TOKEN). So it tries, and if it cannot, it says which switch to
      # flip rather than failing the run — the site is already pushed either way.
      - name: Switch GitHub Pages on, the first time only
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "state=on" >> "$GITHUB_OUTPUT"
          elif gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
                 -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1; then
            echo "state=turned-on" >> "$GITHUB_OUTPUT"
          else
            echo "state=needs-a-click" >> "$GITHUB_OUTPUT"
          fi

      - name: Where it is
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY##*/}"
          {
            if [ "${{ steps.pages.outputs.state }}" = "needs-a-click" ]; then
              echo "## One switch left"
              echo
              echo "The dashboard is pushed to the \`gh-pages\` branch, but GitHub will not let"
              echo "a workflow turn Pages on for the first time. Do it once, by hand:"
              echo
              echo "**Settings → Pages → Build and deployment → Source: _Deploy from a branch_ → Branch: \`gh-pages\` / \`(root)\` → Save**"
              echo
              echo "Then the site is at https://${OWNER,,}.github.io/${NAME}/ and every later"
              echo "run updates it by itself."
            else
              echo "## The office dashboard is live"
              echo
              echo "https://${OWNER,,}.github.io/${NAME}/"
              echo
              echo "It can take a couple of minutes to appear the very first time."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
